<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>พอร์ทัลลูกค้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5; --primary-dark: #4338CA;
      --success: #059669; --warning: #D97706; --danger: #DC2626;
      --gray-50:#F9FAFB; --gray-100:#F3F4F6; --gray-200:#E5E7EB; --gray-300:#D1D5DB;
      --gray-500:#6B7280; --gray-600:#4B5563; --gray-700:#374151; --gray-900:#111827;
      --bg: #F3F4F6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Noto Sans Thai','Sarabun','Tahoma','Sukhumvit Set','Helvetica Neue',Arial,sans-serif; background: var(--bg); color: var(--gray-900); }

    /* === Login screen === */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg,#4F46E5,#7C3AED); }
    .login-card { background: white; border-radius: 16px; padding: 40px; max-width: 420px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
    .login-card h1 { margin: 0 0 8px; font-size: 24px; color: var(--gray-900); }
    .login-card p.sub { color: var(--gray-500); font-size: 14px; margin: 0 0 24px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-700); margin-bottom: 4px; }
    .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: 8px; font-size: 14px; font-family: inherit; }
    .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: all .15s; font-family: inherit; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--gray-700); border: 1px solid var(--gray-300); }
    .btn-ghost:hover { background: var(--gray-50); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 6px; min-height: 18px; }

    /* === Dashboard === */
    .topbar { background: white; border-bottom: 1px solid var(--gray-200); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .topbar .biz { font-weight: 600; color: var(--gray-900); font-size: 16px; }
    .topbar .who { font-size: 13px; color: var(--gray-600); }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--gray-200); margin-bottom: 20px; flex-wrap: wrap; }
    .tab { padding: 12px 18px; border: none; background: transparent; cursor: pointer; font-weight: 500; color: var(--gray-600); border-bottom: 2px solid transparent; margin-bottom: -2px; font-family: inherit; font-size: 14px; }
    .tab:hover { color: var(--gray-900); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px; margin-bottom: 20px; }
    .kpi { background: white; border-radius: 12px; padding: 16px 20px; border: 1px solid var(--gray-200); }
    .kpi-label { font-size: 12px; color: var(--gray-500); }
    .kpi-value { font-size: 22px; font-weight: 700; margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
    thead { background: var(--gray-50); }
    th, td { padding: 12px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--gray-100); }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-500); font-weight: 600; }
    tr:hover td { background: var(--gray-50); }
    .right { text-align: right; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .pill-paid { background: #D1FAE5; color: var(--success); }
    .pill-due { background: #FEF3C7; color: var(--warning); }
    .pill-overdue { background: #FEE2E2; color: var(--danger); }
    .pill-void { background: #E5E7EB; color: #6B7280; text-decoration: line-through; }
    .empty { text-align: center; padding: 60px 20px; color: var(--gray-500); }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    select, input.search { padding: 8px 12px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 13px; font-family: inherit; }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 99; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-bg.open { display: flex; }
    .modal { background: white; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow: auto; }
    .modal-header { padding: 16px 22px; border-bottom: 1px solid var(--gray-200); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px 22px; }
    .modal-footer { padding: 14px 22px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; }
    .x { border: none; background: transparent; font-size: 24px; cursor: pointer; color: var(--gray-500); }
    .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tbl-wrap > table { min-width: 560px; }
    @media (max-width: 480px) { .modal-body [style*="grid-template-columns:1fr 1fr"] { grid-template-columns: minmax(0,1fr) !important; } }
    .toast { position: fixed; top: 20px; right: 20px; padding: 12px 18px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.15); z-index: 999; max-width: 360px; }
    .toast-ok { background: #ECFDF5; color: var(--success); border: 1px solid #A7F3D0; }
    .toast-err { background: #FEF2F2; color: var(--danger); border: 1px solid #FECACA; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
  /**
   * Customer Portal SPA — single-page customer self-service against the
   * existing PortalController endpoints (PortalAdminController + the
   * AllowAnonymous PortalPublicController). The site OWNER manages
   * portal access from /pages/customer-portal.html; this page is what
   * the CUSTOMER themselves opens.
   *
   * URL: /portal.html?company={companyId}
   *
   * The companyId scopes everything — login + every subsequent API
   * call. We never let the customer see another company's data.
   *
   * State flow:
   *   no token → showLogin()
   *   POST /api/portal/login (email + password + companyId)
   *   → save { accessToken, refreshToken, contactId, contactName,
   *           companyId, companyName } to localStorage
   *   → showDashboard()
   * dashboard tabs:
   *   📄 documents  GET /api/portal/{cid}/documents?type=...
   *   💳 payments   GET /api/portal/{cid}/payments
   *   📊 statement  GET /api/portal/{cid}/statement?fromDate&toDate
   * download:
   *   GET /api/portal/{cid}/documents/{id}/pdf (returns application/pdf)
   *
   * Token storage is keyed by companyId so a customer holding accounts
   * with multiple ERP tenants (rare but possible) doesn't have one
   * login clobber another.
   */
  const Portal = {
    companyId: new URLSearchParams(location.search).get('company') || '',
    auth: null,
    activeTab: 'documents',

    init() {
      if (!this.companyId) {
        document.getElementById('root').innerHTML = `
          <div class="login-wrap"><div class="login-card">
            <h1>ลิงค์ไม่สมบูรณ์</h1>
            <p class="sub">URL ต้องมี <code>?company={id}</code> — ติดต่อร้านค้าเพื่อขอลิงค์ที่ถูกต้อง</p>
          </div></div>`;
        return;
      }
      // รอบ 255 WP-12B ข้อ 8: ลิงก์วิเศษจากอีเมล (?magic=) — แลกเป็นเซสชันแล้วลบออกจาก URL ทันที (ไม่ค้างในประวัติ/แชร์ต่อ)
      const magic = new URLSearchParams(location.search).get('magic');
      if (magic) { this.redeemMagic(magic); return; }
      const stored = localStorage.getItem(this._key());
      if (stored) {
        try { this.auth = JSON.parse(stored); } catch (_) { localStorage.removeItem(this._key()); }
      }
      if (this.auth?.accessToken) this.showDashboard();
      else this.showLogin();
    },

    async redeemMagic(token) {
      const url = new URL(location.href); url.searchParams.delete('magic');
      history.replaceState(null, '', url.pathname + url.search);
      try {
        const r = await fetch('/api/portal/magic-link/redeem', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyId: this.companyId, token })
        });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j?.success) throw new Error(j?.message || 'ลิงก์เข้าสู่ระบบใช้ไม่ได้ — ขอลิงก์ใหม่');
        this.auth = j.data;
        localStorage.setItem(this._key(), JSON.stringify(this.auth));
        this.showDashboard();
      } catch (e) {
        this.showLogin();
        const err = document.getElementById('lgErr'); if (err) err.textContent = e.message || 'ลิงก์เข้าสู่ระบบใช้ไม่ได้';
      }
    },

    // รอบ 255 WP-12B ข้อ 8: ขอลิงก์เข้าสู่ระบบทางอีเมล — เซิร์ฟเวอร์ตอบข้อความเดียวเสมอ (ไม่บอกว่าอีเมลนี้มีสิทธิ์ไหม)
    async requestMagic() {
      const err = document.getElementById('lgErr');
      const email = document.getElementById('lgEmail').value.trim();
      if (!email) { err.textContent = 'กรอกอีเมลก่อน แล้วกด "ส่งลิงก์เข้าสู่ระบบ"'; return; }
      const btn = document.getElementById('lgMagicBtn'); btn.disabled = true;
      try {
        const r = await fetch('/api/portal/magic-link', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyId: this.companyId, email })
        });
        const j = await r.json().catch(() => null);
        err.textContent = (j && j.message) || (r.ok ? 'ส่งคำขอแล้ว' : 'ขอลิงก์ไม่สำเร็จ — ลองใหม่');
      } catch (_) { err.textContent = 'เชื่อมต่อไม่ได้ — ลองใหม่'; }
      finally { btn.disabled = false; }
    },

    _key() { return `portal_auth_${this.companyId}`; },

    logout() {
      localStorage.removeItem(this._key());
      this.auth = null;
      this.showLogin();
    },

    // ============================================================
    // LOGIN
    // ============================================================
    showLogin() {
      document.getElementById('root').innerHTML = `
        <div class="login-wrap">
          <div class="login-card">
            <h1>🔐 พอร์ทัลลูกค้า</h1>
            <p class="sub">เข้าระบบเพื่อดูใบแจ้งหนี้ · ใบกำกับภาษี · ดาวน์โหลดเอกสาร · ดูใบแจ้งยอด</p>
            <form onsubmit="Portal.doLogin(event)">
              <div class="field">
                <label for="lgEmail">อีเมล</label>
                <input id="lgEmail" type="email" required autocomplete="email">
              </div>
              <div class="field">
                <label for="lgPass">รหัสผ่าน</label>
                <input id="lgPass" type="password" required autocomplete="current-password">
              </div>
              <div class="err" id="lgErr"></div>
              <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;padding:12px" id="lgBtn">เข้าระบบ</button>
            </form>
            <button type="button" class="btn btn-ghost" style="width:100%;margin-top:8px" id="lgMagicBtn" onclick="Portal.requestMagic()">📧 ไม่มี/ลืมรหัสผ่าน — ส่งลิงก์เข้าสู่ระบบทางอีเมล</button>
            <p style="font-size:12px;color:var(--gray-500);text-align:center;margin-top:18px">
              ลิงก์ใช้ได้ 15 นาทีและครั้งเดียว · ใช้ได้กับอีเมลที่ร้านค้าเปิดสิทธิ์พอร์ทัลไว้เท่านั้น
            </p>
          </div>
        </div>`;
    },

    async doLogin(ev) {
      ev.preventDefault();
      const btn = document.getElementById('lgBtn');
      const err = document.getElementById('lgErr');
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
      try {
        const r = await fetch('/api/portal/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('lgEmail').value.trim(),
            password: document.getElementById('lgPass').value,
            companyId: this.companyId
          })
        });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j?.success) throw new Error(j?.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
        this.auth = j.data;
        localStorage.setItem(this._key(), JSON.stringify(this.auth));
        this.showDashboard();
      } catch (e) {
        err.textContent = e.message || 'เข้าระบบไม่สำเร็จ';
        btn.disabled = false; btn.textContent = 'เข้าระบบ';
      }
    },

    // ============================================================
    // DASHBOARD
    // ============================================================
    showDashboard() {
      document.getElementById('root').innerHTML = `
        <div class="topbar">
          <div>
            <div class="biz">${esc(this.auth.companyName || '')}</div>
            <div class="who">👤 ${esc(this.auth.contactName || '')}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="Portal.logout()">ออกจากระบบ</button>
        </div>
        <div class="container">
          ${localStorage.getItem('portalIntroSeen') ? '' : `
          <div id="portalIntro" style="background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #93c5fd;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:14px;line-height:1.6;position:relative">
            <button aria-label="ปิดคำแนะนำ" onclick="localStorage.setItem('portalIntroSeen','1');document.getElementById('portalIntro').remove()" style="position:absolute;top:8px;right:10px;background:transparent;border:none;font-size:20px;cursor:pointer;color:#64748b">&times;</button>
            <strong style="color:#1e40af">👋 ยินดีต้อนรับสู่พอร์ทัลลูกค้า</strong>
            <ul style="margin:6px 0 0;padding-left:20px;color:#1e3a8a">
              <li><strong>📄 เอกสาร</strong> — ดูใบเสนอราคา/ใบกำกับ/ใบเสร็จ กดดาวน์โหลด PDF</li>
              <li><strong>💳 การชำระเงิน</strong> — ดูรายการที่ค้างชำระ กด <em>"💳 ชำระ"</em> เพื่อโอนด้วย QR PromptPay หรือแนบสลิป</li>
              <li><strong>📊 ใบแจ้งยอด</strong> — สรุปยอดคงค้าง รายการเพิ่ม/ชำระ ส่งออก PDF</li>
            </ul>
          </div>`}
          <div class="tabs">
            <button class="tab ${this.activeTab==='documents'?'active':''}" onclick="Portal.setTab('documents')">📄 เอกสาร</button>
            <button class="tab ${this.activeTab==='payments'?'active':''}" onclick="Portal.setTab('payments')">💳 การชำระเงิน</button>
            <button class="tab ${this.activeTab==='statement'?'active':''}" onclick="Portal.setTab('statement')">📊 ใบแจ้งยอด</button>
          </div>
          <div id="tabContent"><div class="empty">กำลังโหลด...</div></div>
        </div>
        <div class="modal-bg" id="modalBg" onclick="if (event.target === this) Portal.closeModal()">
          <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
              <h3 id="modalTitle" style="margin:0;font-size:16px"></h3>
              <button class="x" aria-label="ปิด" onclick="Portal.closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter">
              <button class="btn btn-ghost" onclick="Portal.closeModal()">ปิด</button>
            </div>
          </div>
        </div>`;
      this.loadTab();
    },

    setTab(t) { this.activeTab = t; this.showDashboard(); },

    async api(path, opts = {}) {
      const r = await fetch(path, {
        ...opts,
        headers: {
          'Authorization': `Bearer ${this.auth.accessToken}`,
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        }
      });
      if (r.status === 401) {
        // Try refresh once
        if (this.auth.refreshToken && !opts._retried) {
          try {
            const rf = await fetch('/api/portal/refresh', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ refreshToken: this.auth.refreshToken })
            });
            const rj = await rf.json();
            if (rf.ok && rj?.success) {
              this.auth = rj.data;
              localStorage.setItem(this._key(), JSON.stringify(this.auth));
              return this.api(path, { ...opts, _retried: true });
            }
          } catch (_) {}
        }
        this.logout();
        throw new Error('หมดเวลาการเข้าสู่ระบบ — กรุณาเข้าสู่ระบบใหม่');
      }
      // รอบ 257 D-H3: ผู้ขายไม่ได้เปิดสิทธิ์ส่วนนี้ ⇒ ข้อความจากเซิร์ฟเวอร์ (ไม่แสดงเป็น "ไม่มีเอกสาร" เงียบ ๆ)
      if (r.status === 403) {
        let m = '';
        try { m = (await r.clone().json())?.message || ''; } catch (_) {}
        throw new Error(m || 'ผู้ขายไม่ได้เปิดสิทธิ์ส่วนนี้ให้บัญชีพอร์ทัลของท่าน');
      }
      return r;
    },

    async loadTab() {
      try {
        if (this.activeTab === 'documents') await this.loadDocuments();
        else if (this.activeTab === 'payments') await this.loadPayments();
        else if (this.activeTab === 'statement') await this.loadStatement();
      } catch (e) {
        toast(e.message || 'โหลดไม่สำเร็จ', 'err');
        const box = document.getElementById('tabContent');
        if (box) box.innerHTML = `<div class="empty" style="padding:32px;text-align:center;color:var(--gray-500)">${esc(e.message || 'โหลดไม่สำเร็จ')}</div>`;
      }
    },

    // ───────── Documents tab ─────────
    async loadDocuments() {
      const type = document.getElementById('docFilter')?.value || '';
      const r = await this.api(`/api/portal/${this.companyId}/documents${type?`?type=${type}`:''}`);
      const j = await r.json();
      const docs = j?.data || [];

      const outstanding = docs.reduce((s, d) => s + Math.max(0, d.balanceDue || 0), 0);
      // รอบ 259-3 (E 4.2): "เกินกำหนด" ตัดสินที่เซิร์ฟเวอร์ (PortalDocumentStatus — วันที่ไทย) — หน้าแค่นับธง
      const overdue = docs.filter(d => d.isOverdue === true).length;

      document.getElementById('tabContent').innerHTML = `
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-label">เอกสารทั้งหมด</div><div class="kpi-value">${docs.length}</div></div>
          <div class="kpi"><div class="kpi-label">ยอดค้างชำระ</div><div class="kpi-value" style="color:var(--warning)">฿${money(outstanding)}</div></div>
          <div class="kpi"><div class="kpi-label">เกินกำหนด</div><div class="kpi-value" style="color:var(--danger)">${Number(overdue)}</div></div>
        </div>
        <div class="toolbar">
          <select id="docFilter" onchange="Portal.loadDocuments()">
            <option value="">ทุกประเภท</option>
            <option value="Invoice">ใบแจ้งหนี้</option>
            <option value="TaxInvoice">ใบกำกับภาษี</option>
            <option value="Receipt">ใบเสร็จ</option>
            <option value="Quotation">ใบเสนอราคา</option>
            <option value="CreditNote">ใบลดหนี้</option>
            <option value="DebitNote">ใบเพิ่มหนี้</option>
          </select>
        </div>
        ${docs.length === 0
          ? '<div class="empty">ยังไม่มีเอกสาร</div>'
          : `<div class="tbl-wrap"><table>
              <thead><tr>
                <th>เลขที่</th><th>ประเภท</th><th>วันที่</th><th>ครบกำหนด</th>
                <th class="right">ยอดรวม</th><th class="right">ค้างชำระ</th><th>สถานะ</th><th></th>
              </tr></thead>
              <tbody>${docs.map(d => {
                // สถานะจากเซิร์ฟเวอร์เป็นตัวตั้ง — ใบยกเลิกห้ามขึ้น "ชำระแล้ว"/ปุ่มจ่าย (A-02)
                const voided = d.status === 'Voided';   // ป้ายสถานะ: docStatusText (ตัวเดียวกับหน้าต่างรายละเอียด)
                // รอบ 250 WP-03 (ฝ่ายค้าน H1): เซิร์ฟเวอร์ตัดสินว่าใบนี้ชำระที่นี่ได้ไหม (ฝั่งขาย · THB · ยอดค้าง > 0) — หน้าเว็บไม่ตัดสินชนิดเอง
                const payable = !voided && d.canPay === true;
                const overdue = payable && d.isOverdue === true;
                const cls = voided ? 'pill-void' : (d.balanceDue <= 0 ? 'pill-paid' : (overdue ? 'pill-overdue' : 'pill-due'));
                const lbl = docStatusText(d);
                return `<tr>
                  <td><strong>${esc(d.documentNumber)}</strong></td>
                  <td>${esc(docTypeLabel(d.documentType))}</td>
                  <td>${dateThai(d.documentDate)}</td>
                  <td>${d.dueDate ? dateThai(d.dueDate) : '-'}</td>
                  <td class="right">฿${money(d.totalAmount)}</td>
                  <td class="right" style="font-weight:600">${d.balanceDue > 0 ? `฿${money(d.balanceDue)}` : '-'}</td>
                  <td><span class="pill ${cls /* text — ชื่อคลาสคงที่ */}">${esc(lbl)}</span>${Number(d.slipPendingAmount || 0) > 0 ? `<div style="font-size:11.5px;color:#92400E;margin-top:2px" title="ผู้ขายจะตรวจสลิปแล้วยืนยัน — ยอดค้างลดเมื่อยืนยันแล้ว">⏳ สลิปรอตรวจ ฿${money(d.slipPendingAmount)}</div>` : ''}</td>
                  <td>
                    <button class="btn btn-ghost btn-sm" onclick="Portal.viewDocument('${jsArg(d.id)}')">ดู</button>
                    ${d.canDownloadPdf ? `<button class="btn btn-ghost btn-sm" onclick="Portal.downloadPdf('${jsArg(d.id)}','${jsArg(d.documentNumber)}')">PDF</button>` : ''}
                    ${payable ? `<button class="btn btn-sm" style="background:#059669;color:#fff" onclick="Portal.openPay('${jsArg(d.id)}', ${Number(d.balanceDue) || 0}, '${jsArg(d.documentNumber)}')">💳 ชำระ</button>` : ''}
                  </td>
                </tr>`;
              }).join('')}</tbody>
             </table></div>`}`;
    },

    async viewDocument(id) {
      try {
        const r = await this.api(`/api/portal/${this.companyId}/documents/${id}`);
        const j = await r.json();
        const d = j?.data;
        if (!d) return;
        document.getElementById('modalTitle').textContent = `${docTypeLabel(d.documentType)} ${d.documentNumber}`;
        const overdue = d.isOverdue === true;   // รอบ 259-3: เซิร์ฟเวอร์ตัดสิน
        document.getElementById('modalBody').innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px;margin-bottom:14px">
            <div><div style="font-size:11px;color:var(--gray-500)">ประเภท</div><div>${esc(docTypeLabel(d.documentType))}</div></div>
            <div><div style="font-size:11px;color:var(--gray-500)">สถานะ</div><div>${esc(docStatusText(d))}</div></div>
            <div><div style="font-size:11px;color:var(--gray-500)">วันที่เอกสาร</div><div>${dateThai(d.documentDate)}</div></div>
            <div><div style="font-size:11px;color:var(--gray-500)">วันครบกำหนด</div><div>${d.dueDate ? dateThai(d.dueDate) : '-'}</div></div>
          </div>
          <div style="background:var(--gray-50);padding:14px 16px;border-radius:8px">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>ยอดรวม</span><span>฿${money(d.totalAmount)}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>ชำระแล้ว</span><span style="color:var(--success)">฿${money(d.paidAmount)}</span></div>
            <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;border-top:1px solid var(--gray-300);margin-top:6px;padding-top:6px">
              <span>ค้างชำระ</span>
              <span style="color:${overdue?'var(--danger)':(d.balanceDue>0?'var(--warning)':'var(--success)')}">฿${money(d.balanceDue)}</span>
            </div>
          </div>`;
        document.getElementById('modalFooter').innerHTML = `
          <button class="btn btn-ghost" onclick="Portal.closeModal()">ปิด</button>
          ${d.canDownloadPdf ? `<button class="btn btn-primary" onclick="Portal.downloadPdf('${jsArg(d.id)}','${jsArg(d.documentNumber)}')">📥 ดาวน์โหลด PDF</button>` : ''}
        `;
        this._openModal();
      } catch (e) { toast(e.message, 'err'); }
    },

    async downloadPdf(id, docNumber) {
      try {
        const r = await this.api(`/api/portal/${this.companyId}/documents/${id}/pdf`);
        if (!r.ok) throw new Error('ดาวน์โหลดไม่สำเร็จ');
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${docNumber || id}.pdf`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
        toast('ดาวน์โหลดสำเร็จ', 'ok');
      } catch (e) { toast(e.message || 'ดาวน์โหลดไม่สำเร็จ', 'err'); }
    },

    // ───────── Payments tab ─────────
    async loadPayments() {
      const r = await this.api(`/api/portal/${this.companyId}/payments`);
      const j = await r.json();
      const pays = j?.data || [];
      const total = pays.reduce((s,p) => s + (p.amount||0), 0);
      document.getElementById('tabContent').innerHTML = `
        <div class="kpi-grid">
          <div class="kpi"><div class="kpi-label">รายการทั้งหมด</div><div class="kpi-value">${pays.length}</div></div>
          <div class="kpi"><div class="kpi-label">ยอดชำระรวม</div><div class="kpi-value" style="color:var(--success)">฿${money(total)}</div></div>
        </div>
        ${pays.length === 0
          ? '<div class="empty">ยังไม่มีการชำระเงิน</div>'
          : `<div class="tbl-wrap"><table>
              <thead><tr>
                <th>วันที่</th><th>เลขเอกสาร</th><th>ช่องทาง</th><th>อ้างอิง</th><th class="right">จำนวน</th>
              </tr></thead>
              <tbody>${pays.map(p => `<tr>
                <td>${dateThai(p.paymentDate)}</td>
                <td><strong>${esc(p.documentNumber || '-')}</strong></td>
                <td>${esc(p.paymentMethodLabel || p.paymentMethod || '-')}</td>
                <td>${esc(p.reference || '-')}</td>
                <td class="right" style="color:var(--success);font-weight:600">฿${money(p.amount)}</td>
              </tr>`).join('')}</tbody>
             </table></div>`}`;
    },

    // ───────── Statement tab ─────────
    async loadStatement() {
      const fromVal = document.getElementById('stFrom')?.value;
      const toVal = document.getElementById('stTo')?.value;
      // วันตามเวลาไทย (WP-13 · D §9 — เดิม toISOString() = UTC ⇒ ช่วง 00:00–07:00 น. ได้ "เมื่อวาน" / ต้นเดือนผิดเดือน)
      const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
      const firstOfMonth = todayStr.slice(0, 8) + '01';
      const from = fromVal || firstOfMonth;
      const to = toVal || todayStr;

      document.getElementById('tabContent').innerHTML = `
        <div class="toolbar">
          <label for="stFrom" style="font-size:13px;color:var(--gray-600)">ตั้งแต่</label>
          <input type="date" id="stFrom" value="${esc(from)}" class="search">
          <label for="stTo" style="font-size:13px;color:var(--gray-600)">ถึง</label>
          <input type="date" id="stTo" value="${esc(to)}" class="search">
          <button class="btn btn-primary btn-sm" onclick="Portal.loadStatement()">โหลด</button>
          <button class="btn btn-ghost btn-sm" onclick="Portal.exportAccountant()" title="รายการเอกสารจากผู้ขายในช่วงนี้ รูปแบบทั่วไป (Excel)">📥 ส่งออก Excel ให้นักบัญชี</button>
        </div>
        <div id="stmtBody"><div class="empty">กำลังโหลด...</div></div>`;

      try {
        const r = await this.api(`/api/portal/${this.companyId}/statement?fromDate=${from}&toDate=${to}`);
        const j = await r.json();
        const s = j?.data;
        if (!s) { document.getElementById('stmtBody').innerHTML = '<div class="empty">ไม่มีข้อมูล</div>'; return; }
        document.getElementById('stmtBody').innerHTML = `
          <div class="kpi-grid">
            <div class="kpi"><div class="kpi-label">ยอดยกมา</div><div class="kpi-value">฿${money(s.openingBalance)}</div></div>
            <div class="kpi"><div class="kpi-label">เพิ่ม (เดบิต)</div><div class="kpi-value" style="color:var(--warning)">฿${money(s.totalCharged)}</div></div>
            <div class="kpi"><div class="kpi-label">ชำระ (เครดิต)</div><div class="kpi-value" style="color:var(--success)">฿${money(s.totalPaid)}</div></div>
            <div class="kpi"><div class="kpi-label">ยอดคงเหลือ</div><div class="kpi-value" style="color:${s.closingBalance>0?'var(--danger)':'var(--success)'}">฿${money(s.closingBalance)}</div></div>
          </div>
          ${(s.lines||[]).length === 0
            ? '<div class="empty">ไม่มีรายการในช่วงนี้</div>'
            : `<div class="tbl-wrap"><table>
                <thead><tr><th>วันที่</th><th>เอกสาร</th><th>รายการ</th><th class="right">จำนวน</th><th class="right">คงเหลือ</th></tr></thead>
                <tbody>${(s.lines||[]).map(l => `<tr>
                  <td>${dateThai(l.date)}</td>
                  <td><strong>${esc(l.documentNumber || '-')}</strong></td>
                  <td>${esc(l.description || '')}</td>
                  <td class="right" style="color:${l.amount>=0?'var(--warning)':'var(--success)'}">${l.amount>=0?'+':''}฿${money(Math.abs(l.amount))}</td>
                  <td class="right" style="font-weight:600">฿${money(l.balance)}</td>
                </tr>`).join('')}</tbody>
               </table></div>`}`;
      } catch (e) {
        document.getElementById('stmtBody').innerHTML = `<div class="empty" style="color:var(--danger)">${esc(e.message||'โหลดไม่สำเร็จ')}</div>`;
      }
    },

    // รอบ 255 WP-12B ข้อ 8: Excel รูปแบบทั่วไปให้นักบัญชีของลูกค้า (เซิร์ฟเวอร์ประกอบแถว — หน้าไม่มีกติกาคอลัมน์เอง)
    async exportAccountant() {
      const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
      const from = document.getElementById('stFrom')?.value || (todayStr.slice(0, 8) + '01');
      const to = document.getElementById('stTo')?.value || todayStr;
      try {
        const r = await this.api(`/api/portal/${this.companyId}/export/accountant?fromDate=${encodeURIComponent(from)}&toDate=${encodeURIComponent(to)}`);
        if (!r.ok) { const j = await r.json().catch(() => null); throw new Error(j?.message || 'ส่งออกไม่สำเร็จ'); }
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `documents-${from}-${to}.xlsx`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
        toast('ส่งออกสำเร็จ', 'ok');
      } catch (e) { toast(e.message || 'ส่งออกไม่สำเร็จ', 'err'); }
    },

    closeModal() {
      document.getElementById('modalBg')?.classList.remove('open');
      const back = this._modalReturnFocus; this._modalReturnFocus = null;
      if (back && document.contains(back)) { try { back.focus(); } catch (_) { /* ปุ่มเดิมถูกวาดใหม่แล้ว */ } }
    },
    /** เปิด modal + ย้าย focus เข้า (WP-13 · D §9 — เดิมไม่มี Escape/คลิกนอก/focus) */
    _openModal() {
      this._modalReturnFocus = document.activeElement;
      document.getElementById('modalBg')?.classList.add('open');
      setTimeout(() => {
        const bg = document.getElementById('modalBg'); if (!bg) return;
        const el = bg.querySelector('.modal-body input, .modal-body select, .modal-body textarea, .modal-body button, .modal-footer button, button.x');
        if (el) el.focus();
      }, 30);
    },

    // ============================================================
    // PAY — customer-self-service payment against an open invoice
    // ============================================================

    /**
     * รอบ 259-3: เปิดหน้าชำระของเอกสาร (pay-document) ถ้าออกลิงก์ได้ · ไม่งั้น slip-upload modal (ยอดจากเซิร์ฟเวอร์).
     * Fetches the company's payment-options (PromptPay + bank) and
     * renders QR + transfer instructions + amount field + file picker
     * + confirm button. Form submit POSTs multipart to
     * /api/portal/{cid}/documents/{docId}/upload-slip.
     */
    async openPay(documentId, balanceDue, docNumber) {
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      const footerEl = document.getElementById('modalFooter');
      titleEl.textContent = `💳 ชำระ ${docNumber}`;
      bodyEl.innerHTML = '<div class="empty">กำลังโหลดวิธีรับเงิน...</div>';
      footerEl.innerHTML = '<button class="btn btn-ghost" onclick="Portal.closeModal()">ปิด</button>';
      this._openModal();

      // รอบ 259-3 (E-M1 · คำตัดสิน 259-3-2): บ้านเดียวของการชำระ = หน้าชำระของเอกสาร (ลิงก์เดียวกับอีเมล — ออนไลน์ + โอน/สลิป + "ไม่หัก ณ ที่จ่าย")
      // เซิร์ฟเวอร์ตัดสินว่าออกลิงก์ได้ไหม · ไม่มีช่องทางออนไลน์ ⇒ กล่องโอน/สลิปด้านล่าง (ยอดจากเซิร์ฟเวอร์ · ลูกค้าแก้ยอดไม่ได้)
      let link = null, linkErr = null;
      try {
        const r = await fetch(`/api/portal/${encodeURIComponent(this.companyId)}/documents/${encodeURIComponent(documentId)}/pay-link`,
          { method: 'POST', headers: { 'Authorization': `Bearer ${this.auth.accessToken}` }, cache: 'no-store' });
        const j = await r.json().catch(() => null);
        if (r.ok && j?.success) link = j.data; else linkErr = j?.message || `HTTP ${r.status}`;
      } catch (e) { linkErr = e.message || 'เชื่อมต่อไม่ได้'; }
      if (linkErr) {
        bodyEl.innerHTML = `<div class="empty" style="background:#FEF2F2;color:#991b1b;border-radius:8px">เปิดหน้าชำระเงินไม่สำเร็จ — ${esc(linkErr)}
          <div style="margin-top:8px"><button class="btn btn-ghost" onclick="Portal.openPay('${jsArg(documentId)}', ${Number(balanceDue) || 0}, '${jsArg(docNumber)}')">🔄 ลองใหม่</button></div></div>`;
        return;
      }
      if (link && link.url) {
        bodyEl.innerHTML = `
          <div style="font-size:14px;line-height:1.6;margin-bottom:14px">ชำระเอกสาร <strong>${esc(docNumber)}</strong> ที่หน้าชำระเงินของร้าน —
            เลือกได้ทั้งชำระออนไลน์ โอนเข้าบัญชี/สแกน QR แล้วแนบสลิป · ยอดที่ต้องชำระ (รวมภาษีหัก ณ ที่จ่าย ถ้ามี) คำนวณให้แล้ว</div>
          <a class="btn btn-primary" style="display:inline-block;text-decoration:none" href="${esc(link.url)}" target="_blank" rel="noopener">💳 ไปหน้าชำระเงิน</a>`;
        return;
      }
      if (link && !link.slipFallback) {
        bodyEl.innerHTML = `<div class="empty" style="background:#FEF2F2;color:#991b1b;border-radius:8px">${esc(link.refusal || 'เอกสารนี้ชำระผ่านพอร์ทัลไม่ได้ — กรุณาติดต่อร้าน')}</div>`;
        return;
      }

      // รอบ 250 WP-03 (A G-01 · D §9.1): QR พร้อมเพย์สร้างที่เซิร์ฟเวอร์ (PromptPayService ตัวเดียวกับ pay-document) ฝังยอดค้างของใบจากฐาน
      // — เดิมประกอบ payload ใน JS แล้วส่งเลขพร้อมเพย์+ยอดไปบริการสร้าง QR ภายนอก (บุคคลที่สาม) · โหลดล้ม = บอกตรง ๆ ไม่ใช่ "ร้านยังไม่ตั้งค่า"
      let pay = null, loadErr = null;
      try {
        const r = await fetch(`/api/portal/${encodeURIComponent(this.companyId)}/documents/${encodeURIComponent(documentId)}/payment-options`,
          { headers: { 'Authorization': `Bearer ${this.auth.accessToken}` }, cache: 'no-store' });
        const j = await r.json().catch(() => null);
        if (r.ok && j?.success) pay = j.data; else loadErr = j?.message || `HTTP ${r.status}`;
      } catch (e) { loadErr = e.message || 'เชื่อมต่อไม่ได้'; }
      if (loadErr) {
        bodyEl.innerHTML = `<div class="empty" style="background:#FEF2F2;color:#991b1b;border-radius:8px">โหลดวิธีชำระเงินไม่สำเร็จ — ${esc(loadErr)}
          <div style="margin-top:8px"><button class="btn btn-ghost" onclick="Portal.openPay('${jsArg(documentId)}', ${Number(balanceDue) || 0}, '${jsArg(docNumber)}')">🔄 ลองใหม่</button></div></div>`;
        return;
      }

      const ppId = pay?.promptPayId;
      // รับเฉพาะรูปที่เซิร์ฟเวอร์สร้าง (data:image/png;base64,) แบบ pay-document · ถ้าไม่มี = รูปที่ร้านอัปโหลด (เซิร์ฟเวอร์กรอง URL แล้ว)
      const dataQr = typeof pay?.promptPayQrDataUri === 'string' && pay.promptPayQrDataUri.startsWith('data:image/png;base64,') ? pay.promptPayQrDataUri : null;
      const ppQr = dataQr;   // ฝ่ายค้าน H1: กล่องโอนมาจากตัวเดียวกับหน้าชำระ (บัญชีของใบ/รูปที่อัปโหลด เป็น data URI แล้ว)
      const hasPay = pay?.hasPaymentMethod;
      if (pay?.payRefusal) {
        bodyEl.innerHTML = `<div class="empty" style="background:#FEF2F2;color:#991b1b;border-radius:8px">${esc(pay.payRefusal)}</div>`;
        return;
      }
      // ยอดจากเซิร์ฟเวอร์ (ตัวเดียวกับหน้าชำระ): ยอดค้าง − ภาษีหัก ณ ที่จ่ายที่ผู้ซื้อจะหัก = ยอดโอน
      const gross = pay?.amountGross ?? balanceDue;
      const wht = Number(pay?.amountWht || 0);
      const net = pay?.amountNet ?? balanceDue;

      bodyEl.innerHTML = `
        <div style="background:#FEF3C7;border-left:3px solid #D97706;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:14px">
          ยอดค้างชำระ: <strong>฿${money(gross)}</strong> · เอกสาร <strong>${esc(docNumber)}</strong>
          ${wht > 0.005 ? `<div style="margin-top:4px">หัก ณ ที่จ่าย ฿${money(wht)} · <strong>ยอดโอน ฿${money(net)}</strong></div>` : ''}
        </div>
        ${!hasPay ? `<div class="empty" style="background:#FEF2F2;color:#991b1b;border-radius:8px">ทางร้านยังไม่ได้ตั้งค่าวิธีรับเงิน — กรุณาติดต่อร้านโดยตรง</div>` : `
        ${ppQr ? `
          <div style="text-align:center;background:#F9FAFB;padding:18px;border-radius:8px;margin-bottom:14px">
            <div style="font-size:13px;color:var(--gray-500);margin-bottom:8px">สแกน QR PromptPay</div>
            <img src="${esc(ppQr)}" alt="PromptPay QR" style="width:220px;height:220px">
            <div style="font-size:12px;color:var(--gray-500);margin-top:8px">PromptPay: <strong>${esc(ppId||'')}</strong></div>
          </div>` : ''}
        ${pay?.bankAccountNumber ? `
          <div style="background:#F9FAFB;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px">
            <div style="font-weight:600;margin-bottom:4px">หรือโอนเข้าบัญชี</div>
            <div>ธนาคาร: <strong>${esc(pay.bankName||'-')}</strong></div>
            <div>เลขบัญชี: <strong style="font-family:monospace">${esc(pay.bankAccountNumber)}</strong></div>
            <div>ชื่อบัญชี: <strong>${esc(pay.bankAccountName||'-')}</strong></div>
          </div>` : ''}
        <form id="paySlipForm" onsubmit="Portal.uploadSlip(event, '${jsArg(documentId)}', '${jsArg(docNumber)}')" style="display:grid;gap:10px">
          <div class="field" style="margin-bottom:0">
            <label>ยอดที่ต้องโอน (บาท)</label>
            <div style="font-size:18px;font-weight:700">฿${money(net)}</div>
            <div style="font-size:12px;color:var(--gray-500)">ยอดคำนวณจากใบนี้ (หลังหัก ณ ที่จ่าย ถ้ามี) — ระบบบันทึกยอดนี้กับสลิป</div>
          </div>
          <div class="field" style="margin-bottom:0">
            <label>แนบสลิป (รูปภาพ/PDF)</label>
            <input type="file" name="file" accept="image/*,.pdf" required>
          </div>
          <div class="field" style="margin-bottom:0">
            <label for="paySlipRef">เลขอ้างอิงการโอน (ถ้ามี — ช่วยให้ร้านจับคู่เงินเข้าได้เร็วขึ้น)</label>
            <input type="text" id="paySlipRef" name="bankRef" maxlength="64" autocomplete="off" placeholder="เช่น เลขที่รายการบนสลิป">
          </div>
          <div class="err" id="paySlipErr"></div>
          <button type="submit" class="btn btn-primary" style="margin-top:6px" id="paySlipBtn">📎 ส่งสลิป</button>
        </form>`}
      `;
      footerEl.innerHTML = '<button class="btn btn-ghost" onclick="Portal.closeModal()">ปิด</button>';
    },

    async uploadSlip(ev, documentId, docNumber) {
      ev.preventDefault();
      const form = ev.target;
      const btn = document.getElementById('paySlipBtn');
      const err = document.getElementById('paySlipErr');
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'กำลังอัปโหลด...';

      const fd = new FormData(form);
      try {
        const r = await fetch(`/api/portal/${this.companyId}/documents/${documentId}/upload-slip`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${this.auth.accessToken}` },
          body: fd
        });
        const j = await r.json().catch(() => null);
        if (!r.ok) throw new Error(j?.message || 'อัปโหลดไม่สำเร็จ');
        toast(j?.message || `ส่งสลิปสำหรับ ${docNumber} แล้ว — ร้านจะตรวจสอบและยืนยัน`, 'ok');
        this.closeModal();
        if (this.activeTab === 'documents') await this.loadDocuments();
      } catch (e) {
        err.textContent = e.message || 'อัปโหลดไม่สำเร็จ';
        btn.disabled = false; btn.textContent = '📎 ส่งสลิป';
      }
    }
  };

  // ============================================================
  // Helpers
  // ============================================================
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // ค่าที่ฝังใน JS string ภายใน onclick="" — `esc` ใช้ไม่ได้เพราะมันแปลง ' เป็น &#39;
  // ซึ่งเบราว์เซอร์ decode กลับเป็น ' **ก่อน** JS parse ⇒ string ปิดกลางคัน หน้าตาย
  function jsArg(s) { return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r/g, '').replace(/\n/g, '\\n').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function money(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dateThai(d) {
    if (!d) return '-';
    const dt = new Date(d);
    if (isNaN(dt)) return '-';
    return dt.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
  }
  // ⚠️ หน้า portal ของลูกค้าไม่โหลด layout.js (หน้าสาธารณะ) จึงมีสำเนาชื่อไทย
  // ที่นี่ — **ต้องตรงกับ PdfGenerationService.GetDocumentTitle เป๊ะ** เพราะ
  // ลูกค้าเห็นชื่อนี้คู่กับกระดาษที่ดาวน์โหลดไป (เดิมเขียน 'ใบเสร็จ' และ
  // 'ใบรับรองแทนใบเสร็จ' ซึ่งไม่ตรงกับที่พิมพ์)
  const DOC_TYPE = {
    'Quotation':'ใบเสนอราคา','Invoice':'ใบแจ้งหนี้','Receipt':'ใบเสร็จรับเงิน','TaxInvoice':'ใบกำกับภาษี',
    'CreditNote':'ใบลดหนี้','DebitNote':'ใบเพิ่มหนี้','DeliveryNote':'ใบส่งของ','BillingNote':'ใบวางบิล',
    'PurchaseOrder':'ใบสั่งซื้อ','PurchaseInvoice':'ใบแจ้งหนี้ซื้อ','Expense':'ใบบันทึกค่าใช้จ่าย','PaymentVoucher':'ใบสำคัญจ่าย',
    'ReceiptVoucher':'ใบสำคัญรับ','CertificateInLieu':'ใบรับรองแทนใบเสร็จรับเงิน'
  };
  function docTypeLabel(t) { return DOC_TYPE[t] || t; }
  // รอบ 250 WP-03: ลบ buildPromptPayPayload (TLV builder สำเนาใน JS) — QR สร้างที่เซิร์ฟเวอร์ (PromptPayService) ตัวเดียว

  // Escape ปิด modal (ตัวเดียวทั้งหน้า)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('modalBg')?.classList.contains('open')) Portal.closeModal();
  });
  /** ป้ายสถานะเอกสาร — ตัวเดียวของหน้านี้ (ตาราง + หน้าต่างรายละเอียด · เดิมหน้าต่างแสดง enum ดิบ "Approved") ·
   *  ยอดค้าง/สถานะยกเลิกมาจากเซิร์ฟเวอร์ (หน้านี้แค่เลือกคำ) */
  function docStatusText(d) {
    // รอบ 259-3 (E 4.2): ป้ายจากเซิร์ฟเวอร์ (PortalDocumentStatus) — ไม่มีสำเนากติกาในหน้า
    return d.statusLabel || d.status || '';
  }

  function toast(msg, kind = 'ok') {
    const div = document.createElement('div');
    div.setAttribute('role', kind === 'err' || kind === 'error' ? 'alert' : 'status');
    div.className = `toast toast-${kind}`;
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3500);
  }

  Portal.init();
  </script>
</body>
</html>
