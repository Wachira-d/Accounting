<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>นโยบายของร้าน</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Noto Sans Thai',system-ui,sans-serif; background:#f8fafc; margin:0; color:#0f172a; padding:20px 16px; }
    .sp { max-width:820px; margin:0 auto; background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.06); padding:28px 24px 40px; line-height:1.85; font-size:15px }
    .sp h1 { font-size:1.6rem; margin:0 0 4px }
    .sp .meta { color:#64748b; font-size:13px; margin-bottom:18px }
    .sp h2 { font-size:1.05rem; margin:26px 0 8px; padding-top:12px; border-top:1px solid #e2e8f0 }
    .sp h3 { font-size:1rem; margin:14px 0 6px }
    .sp ul, .sp ol { margin:6px 0 6px 22px }
    .sp table { width:100%; border-collapse:collapse; margin:10px 0; font-size:14px }
    .sp .table-scroll { overflow-x:auto }
    .sp th, .sp td { border:1px solid #e2e8f0; padding:7px 9px; text-align:left; vertical-align:top }
    .sp th { background:#f8fafc }
    .sp .legal-note { background:#f8fafc; border-left:3px solid #0ea5e9; padding:10px 14px; margin:12px 0 }
    .sp .tabs { display:flex; gap:14px; font-size:14px; margin-bottom:12px }
    .sp .err { color:#991b1b; background:#fee2e2; border-radius:8px; padding:12px }
  </style>
</head>
<body>
  <!-- รอบ 214 (คำตัดสินข้อ 173 B): นโยบาย/ข้อกำหนดของร้านสำหรับหน้าจองโต๊ะ (booking.html · booking-manage.html — ไม่ผูกเว็บ CMS) ·
       เนื้อความ = แม่แบบของระบบ + ตัวตนร้าน แปลง/encode ที่เซิร์ฟเวอร์ (GET /api/public/reservations/legal/{companyId}/{kind}) — หน้านี้แค่วาง -->
  <div class="sp">
    <div class="tabs"><a id="tabPrivacy" href="#">นโยบายความเป็นส่วนตัว</a><a id="tabTerms" href="#">ข้อกำหนดการใช้บริการ</a></div>
    <h1 id="spTitle">กำลังโหลด...</h1>
    <div class="meta" id="spMeta"></div>
    <div id="spBody"></div>
  </div>
  <p style="text-align:center;color:#94a3b8;font-size:11px;margin-top:14px">Powered by Next Acc</p>
  <script>
    (async function () {
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const params = new URLSearchParams(location.search);
      const c = params.get('c') || '';
      const k = params.get('k') === 'terms' ? 'terms' : 'privacy';
      const href = kind => `?c=${encodeURIComponent(c)}&k=${kind}`;
      document.getElementById('tabPrivacy').href = href('privacy');
      document.getElementById('tabTerms').href = href('terms');
      const body = document.getElementById('spBody');
      try {
        const r = await fetch(`/api/public/reservations/legal/${encodeURIComponent(c)}/${k}`);
        const j = await r.json().catch(() => null);
        if (!r.ok || !j || !j.data) throw new Error((j && j.message) || 'ไม่พบเอกสารของร้านนี้');
        const d = j.data;
        document.title = `${d.title} | ${d.companyName}`;
        document.getElementById('spTitle').textContent = d.title;
        document.getElementById('spMeta').textContent = d.companyName;
        // เซิร์ฟเวอร์แปลง + encode แล้ว (Helpers/LegalMarkdown)
        body.innerHTML = d.html || '';
        // ลิงก์สัมพัทธ์ในแม่แบบ ("privacy"/"terms") → แท็บของหน้านี้
        body.querySelectorAll('a[href="privacy"],a[href="terms"]').forEach(a => { a.href = href(a.getAttribute('href')); });
      } catch (e) {
        document.getElementById('spTitle').textContent = 'นโยบายของร้าน';
        body.innerHTML = `<div class="err">${esc(e.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
