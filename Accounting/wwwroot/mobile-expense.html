<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>เบิกค่าใช้จ่าย — Mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:'Noto Sans Thai',-apple-system,sans-serif; margin:0; background:#f8fafc; color:#1e293b; padding-bottom:80px; }
    .head { background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; padding:20px 18px; }
    .head h1 { margin:0; font-size:18px; }
    .wrap { padding:14px; }
    .card { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .card h3 { margin:0 0 10px; font-size:14px; color:#1e293b; }
    label { display:block; font-size:12px; color:#64748b; margin-bottom:6px; margin-top:10px; }
    input, select, textarea { width:100%; padding:11px 14px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; font-size:15px; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:#16a34a; box-shadow:0 0 0 3px rgba(22,163,74,.15); }
    .photo-area { background:#f0fdf4; border:2px dashed #86efac; border-radius:12px; padding:32px 16px; text-align:center; margin-bottom:10px; }
    .photo-area svg { width:48px; height:48px; color:#16a34a; }
    .photo-area p { margin:8px 0 4px; color:#16a34a; font-weight:600; }
    .photo-area .sub { font-size:12px; color:#64748b; }
    .photo-preview { display:none; }
    .photo-preview.show { display:block; }
    .photo-preview img { max-width:100%; border-radius:10px; }
    .fab { position:fixed; bottom:18px; left:14px; right:14px; padding:16px; background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; border:none; border-radius:14px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(22,163,74,.4); }
    .fab:disabled { opacity:.6; }
    .ok { background:#dcfce7; color:#15803d; padding:10px 14px; border-radius:8px; font-size:13px; }
    .err { background:#fee2e2; color:#dc2626; padding:10px 14px; border-radius:8px; font-size:13px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  </style>
</head>
<body>
  <div class="head"><h1>เบิกค่าใช้จ่าย</h1></div>

  <div class="wrap">
    <div class="card">
      <h3>📸 ถ่ายใบเสร็จ</h3>
      <div id="photoArea" class="photo-area" onclick="document.getElementById('photoInput').click()">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <p>แตะเพื่อถ่ายรูป</p>
        <div class="sub">หรือเลือกจากแกลเลอรี (จะใช้ OCR ดึงยอดเงินอัตโนมัติ)</div>
      </div>
      <div id="photoPreview" class="photo-preview"><img id="photoImg"></div>
      <input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="App.onPhoto(event)">
    </div>

    <div class="card">
      <h3>รายละเอียด</h3>
      <label>ประเภทค่าใช้จ่าย</label>
      <select id="category">
        <option value="travel">เดินทาง / ค่าแท็กซี่</option>
        <option value="meals">อาหาร / รับรอง</option>
        <option value="office">วัสดุสำนักงาน</option>
        <option value="fuel">น้ำมัน</option>
        <option value="utilities">ค่าสาธารณูปโภค</option>
        <option value="other">อื่นๆ</option>
      </select>

      <label>ร้านค้า / ผู้ขาย</label>
      <input id="vendor" placeholder="เช่น 7-Eleven, Grab">

      <div class="row">
        <div>
          <label>ยอดเงิน (THB)</label>
          <input id="amount" type="number" step="0.01" min="0" placeholder="0.00">
        </div>
        <div>
          <label>วันที่</label>
          <input id="expDate" type="date">
        </div>
      </div>

      <label>หมายเหตุ</label>
      <textarea id="notes" rows="3" placeholder="คำอธิบายเพิ่มเติม (เช่น เดินทางไปพบลูกค้า)"></textarea>
    </div>

    <div id="result"></div>
  </div>

  <button class="fab" id="submitBtn" onclick="App.submit()">✅ ส่งเบิกค่าใช้จ่าย</button>

  <script>
    const App = {
      photo: null,
      photoFile: null,
      scanId: null,   // ผลสแกน OCR ของรูปที่เพิ่งถ่าย — ใช้เป็นเส้นทางสร้างเอกสาร

      init() {
        document.getElementById('expDate').value = Layout.toDateInput(new Date()) /* วันที่ปฏิทิน — ห้าม toISOString (เลื่อน 1 วันใน ICT) */;
      },

      /** บริษัทปัจจุบัน — หน้านี้เป็นหน้าเดี่ยว (ไม่โหลด layout.js) จึงอ่านคีย์เอง
       *  แต่ต้องอ่าน **คีย์เดียวกับที่แอปหลักเขียนจริง** คือ `currentCompany`
       *  (JSON) เหมือนที่ Layout.getCompanyId() ทำ — เดิมอ่าน `companyId` ซึ่ง
       *  มีแต่ portal /connect เท่านั้นที่เขียน (และ portal ก็ไม่ได้ลิงก์มาหน้านี้)
       *  ⇒ ผู้ใช้แอปหลักเจอ "ต้อง login + เลือกบริษัทก่อน" ตลอด ส่งเบิกไม่ได้เลย */
      companyId() {
        try {
          const c = JSON.parse(localStorage.getItem('currentCompany') || 'null');
          if (c && c.id) return c.id;
        } catch (e) { /* ค่าเสีย = ถือว่ายังไม่ได้เลือกบริษัท */ }
        return '';
      },

      onPhoto(e) {
        const f = e.target.files[0];
        if (!f) return;
        this.photoFile = f;
        const r = new FileReader();
        r.onload = ev => {
          this.photo = ev.target.result;
          document.getElementById('photoImg').src = ev.target.result;
          document.getElementById('photoPreview').classList.add('show');
          document.getElementById('photoArea').style.display = 'none';
        };
        r.readAsDataURL(f);
        // ยิง OCR ทันทีที่ถ่าย — หน้านี้โฆษณาไว้ว่า "จะใช้ OCR ดึงยอดเงิน
        // อัตโนมัติ" แต่เดิม**ไม่เคยเรียก OCR เลย** รูปถูกแนบเป็น base64
        // เฉย ๆ แล้วให้ผู้ใช้พิมพ์ร้านค้า+ยอดเงินเอง = ฟอร์มว่างรอกรอก
        // ซึ่งเป็น anti-pattern ที่กฎเหล็ก #3 ห้ามไว้ตรง ๆ
        this.scanPhoto(f);
      },

      /** ส่งรูปเข้า OCR แล้วเติมช่องให้ — ผู้ใช้แค่ยืนยัน (กฎเหล็ก #3) */
      async scanPhoto(file) {
        const res = document.getElementById('result');
        const token = localStorage.getItem('token');
        const companyId = this.companyId();
        if (!token || !companyId) return;      // ยังไม่ล็อกอิน — ปล่อยให้กรอกมือ
        res.innerHTML = '<div class="ok">🔎 กำลังอ่านข้อมูลจากรูป…</div>';
        try {
          const fd = new FormData();
          fd.append('file', file);
          const r = await fetch(`/api/companies/${companyId}/ocr/upload`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            body: fd,
          });
          const j = await r.json();
          const d = j?.data;
          if (!r.ok || !j.success || !d) {
            res.innerHTML = '<div class="err">อ่านรูปอัตโนมัติไม่สำเร็จ — กรอกเองได้เลย</div>';
            return;
          }
          this.scanId = d.id || null;
          const set = (id, val) => {
            const el = document.getElementById(id);
            if (el && val != null && val !== '' && !el.value) el.value = val;
          };
          set('vendor', d.extractedVendorName);
          if (d.extractedTotalAmount != null) set('amount', d.extractedTotalAmount);
          if (d.extractedDate) set('expDate', String(d.extractedDate).slice(0, 10));
          const pct = Math.round((Number(d.confidence) || 0) * 100);
          res.innerHTML = `<div class="ok">✅ อ่านข้อมูลให้แล้ว (ความมั่นใจ ${pct}%) — ตรวจแล้วกดส่งได้เลย</div>`;
        } catch (e) {
          res.innerHTML = '<div class="err">อ่านรูปอัตโนมัติไม่สำเร็จ — กรอกเองได้เลย</div>';
        }
      },

      async submit() {
        const btn = document.getElementById('submitBtn');
        const res = document.getElementById('result');
        const amount = +document.getElementById('amount').value;
        const vendor = document.getElementById('vendor').value.trim();
        const date = document.getElementById('expDate').value;
        const category = document.getElementById('category').value;
        const notes = document.getElementById('notes').value;
        if (!amount || !vendor) {
          res.innerHTML = '<div class="err">กรอกร้านค้า + ยอดเงิน</div>'; return;
        }
        btn.disabled = true; btn.textContent = 'กำลังส่ง...';
        try {
          const token = localStorage.getItem('token');
          const companyId = this.companyId();
          if (!token || !companyId) {
            res.innerHTML = '<div class="err">ต้อง login + เลือกบริษัทก่อน</div>';
            btn.disabled = false; btn.textContent = '✅ ส่งเบิกค่าใช้จ่าย'; return;
          }
          // ── ส่งผ่านเส้นทาง OCR ที่มีอยู่แล้ว ──
          //
          // ⚠️ เดิม POST ไป `/api/companies/{id}/documents` (พหูพจน์) แต่
          // DocumentController ใช้ route `[controller]` = **/document (เอกพจน์)**
          // ⇒ ไม่มี route นี้อยู่จริง กดส่งได้ 404 ทุกครั้งตั้งแต่เขียนมา
          // และ body ที่ส่ง (contactName/totalAmount/attachmentBase64) ก็ไม่ตรง
          // กับ CreateDocumentRequest ด้วย
          //
          // แทนที่จะซ่อม payload ให้ตรง (แล้วต้องดูแลอีกเส้นทางหนึ่งตลอดไป)
          // ใช้เส้นทางเดียวกับหน้าสแกนบนเดสก์ท็อป: อัปโหลด → OCR → แก้ค่าที่
          // ผู้ใช้พิมพ์ → สร้างเอกสาร ทุกด่าน (ภาษี/บัญชีคู่/แนบไฟล์) ทำงานครบ
          if (!this.scanId) {
            res.innerHTML = '<div class="err">ต้องถ่ายรูปใบเสร็จก่อน — ระบบใช้รูปเป็นหลักฐานการจ่าย</div>';
            btn.disabled = false; btn.textContent = '✅ ส่งเบิกค่าใช้จ่าย'; return;
          }
          const H = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
          // ส่งค่าที่ผู้ใช้ยืนยัน/แก้ กลับไปให้ระบบเรียนรู้ด้วย (กฎเหล็ก #1)
          await fetch(`/api/companies/${companyId}/ocr/${this.scanId}/correct`, {
            method: 'POST', headers: H,
            body: JSON.stringify({
              vendorName: vendor, totalAmount: amount,
              documentDate: date || null, expenseCategory: category || null,
              // ⚠️ เดิมอ่านค่าช่องนี้ใส่ตัวแปรแล้ว**ไม่ส่งไปไหน** ⇒ เหตุผลที่
              // ผู้เบิกพิมพ์หายเงียบ. §65 ตรี(3)/(14) รายจ่ายที่พิสูจน์ไม่ได้ว่า
              // เกี่ยวกับกิจการ = รายจ่ายต้องห้าม — ข้อความนี้คือหลักฐานชิ้นแรก
              notes: notes || null,
            }),
          }).catch(() => { /* best-effort — ไม่ให้ขวางการส่งเบิก */ });

          const r = await fetch(
            `/api/companies/${companyId}/ocr/${this.scanId}/create-document?targetType=Expense`,
            { method: 'POST', headers: H });
          const j = await r.json();
          if (!r.ok || !j.success) {
            res.innerHTML = `<div class="err">${j.message || 'ส่งไม่สำเร็จ'}</div>`;
            btn.disabled = false; btn.textContent = '✅ ส่งเบิกค่าใช้จ่าย'; return;
          }
          res.innerHTML = '<div class="ok">✅ ส่งเบิกแล้ว — เปิดดูใบได้ในระบบหลัก (เมนู เอกสาร)</div>';
          setTimeout(() => {
            document.getElementById('amount').value = '';
            document.getElementById('vendor').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('photoArea').style.display = 'block';
            document.getElementById('photoPreview').classList.remove('show');
            // ล้างสถานะสแกน — ไม่งั้นรูปใบถัดไปจะใช้ scanId เดิมแล้วเซิร์ฟเวอร์
            // ตอบ "สแกนนี้สร้างเอกสารไปแล้ว"
            this.photo = null; this.photoFile = null; this.scanId = null;
            this.photo = null;
            btn.disabled = false; btn.textContent = '✅ ส่งเบิกค่าใช้จ่าย';
          }, 1500);
        } catch (e) {
          res.innerHTML = `<div class="err">${e.message}</div>`;
          btn.disabled = false; btn.textContent = '✅ ส่งเบิกค่าใช้จ่าย';
        }
      },
    };
    App.init();
  </script>
</body>
</html>
