<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - Nexaacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div>
        <a href="/" style="font-size:24px;font-weight:800;margin-bottom:48px;display:block">Nexaacc</a>
        <h2>เริ่มต้นใช้งานฟรี!</h2>
        <p>ทดลองใช้งานเต็มรูปแบบ 14 วัน ไม่ต้องใช้บัตรเครดิต</p>
        <ul class="features-list">
          <li>✓ ทดลองใช้ฟรี 14 วัน</li>
          <li>✓ ไม่ต้องผูกบัตรเครดิต</li>
          <li>✓ เข้าถึงทุกฟีเจอร์</li>
          <li>✓ ข้อมูลตัวอย่างพร้อมใช้</li>
          <li>✓ ยกเลิกได้ทุกเมื่อ</li>
        </ul>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-form">
        <h1>สมัครสมาชิก</h1>
        <p class="subtitle">กรอกข้อมูลเพื่อเริ่มต้นใช้งาน</p>

        <div id="errorMsg" class="hidden" style="padding:12px 16px;background:#FEF2F2;color:#DC2626;border-radius:var(--radius);font-size:14px;margin-bottom:16px"></div>

        <form onsubmit="handleRegister(event)">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group">
              <label class="form-label">ชื่อ</label>
              <input type="text" id="firstName" class="form-input" placeholder="ชื่อ" required>
            </div>
            <div class="form-group">
              <label class="form-label">นามสกุล</label>
              <input type="text" id="lastName" class="form-input" placeholder="นามสกุล" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">อีเมล</label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">ชื่อบริษัท</label>
            <input type="text" id="companyName" class="form-input" placeholder="ชื่อบริษัทหรือกิจการ" required>
          </div>
          <div class="form-group">
            <label class="form-label">รหัสผ่าน</label>
            <input type="password" id="password" class="form-input" placeholder="อย่างน้อย 8 ตัวอักษร" required minlength="8">
          </div>
          <div class="form-group">
            <label class="form-label">ยืนยันรหัสผ่าน</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="กรอกรหัสผ่านอีกครั้ง" required minlength="8">
          </div>
          <div style="margin-bottom:24px">
            <label class="form-checkbox">
              <input type="checkbox" id="agreeTerms" required>
              <span style="font-size:14px;color:var(--gray-600)">ยอมรับ <a href="#" style="color:var(--primary)">ข้อกำหนดการใช้งาน</a> และ <a href="#" style="color:var(--primary)">นโยบายความเป็นส่วนตัว</a></span>
            </label>
          </div>
          <button type="submit" class="btn btn-primary w-full btn-lg" id="registerBtn">
            สมัครสมาชิกฟรี
          </button>
        </form>

        <div class="auth-divider">หรือสมัครด้วย</div>

        <div style="display:flex;gap:12px;margin-bottom:24px">
          <button type="button" onclick="handleGoogleRegister()" class="btn btn-secondary w-full" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
            Google
          </button>
          <button type="button" onclick="handleFacebookRegister()" class="btn btn-secondary w-full" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#1877F2" d="M18 9a9 9 0 1 0-10.406 8.89v-6.29H5.309V9h2.285V7.017c0-2.255 1.343-3.501 3.4-3.501.984 0 2.014.176 2.014.176v2.215h-1.135c-1.118 0-1.467.694-1.467 1.406V9h2.496l-.399 2.6h-2.097v6.29A9.002 9.002 0 0 0 18 9z"/></svg>
            Facebook
          </button>
        </div>

        <p style="text-align:center;font-size:14px;color:var(--gray-600)">
          มีบัญชีอยู่แล้ว? <a href="/login.html" style="color:var(--primary);font-weight:600">เข้าสู่ระบบ</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Facebook SDK -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/th_TH/sdk.js"></script>

  <script src="/js/api.js"></script>
  <script>
    let ssoConfig = { google: '', facebook: '' };
    fetch('/api/auth/sso-config').then(r=>r.json()).then(d => {
      ssoConfig = d.data || d;
      if (ssoConfig.facebook && window.FB) {
        FB.init({ appId: ssoConfig.facebook, cookie: true, xfbml: false, version: 'v19.0' });
      }
    }).catch(()=>{});

    async function handleSsoResponse(provider, idToken) {
      const errEl = document.getElementById('errorMsg');
      errEl.classList.add('hidden');
      const companyName = document.getElementById('companyName')?.value || '';
      try {
        const res = await API.ssoLogin(provider, idToken, companyName || null);
        if (res.success && res.data) {
          const token = res.data.accessToken || res.data.token;
          localStorage.setItem('token', token);
          localStorage.setItem('user', JSON.stringify(res.data.user || res.data));
          API.token = token;
          window.location.href = '/app.html';
        } else {
          throw new Error(res.message || 'สมัครสมาชิกไม่สำเร็จ');
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    }

    function handleGoogleRegister() {
      if (!ssoConfig.google) {
        document.getElementById('errorMsg').textContent = 'ยังไม่ได้ตั้งค่า Google OAuth';
        document.getElementById('errorMsg').classList.remove('hidden');
        return;
      }
      google.accounts.id.initialize({
        client_id: ssoConfig.google,
        callback: (response) => handleSsoResponse('Google', response.credential)
      });
      google.accounts.id.prompt();
    }

    function handleFacebookRegister() {
      if (!ssoConfig.facebook) {
        document.getElementById('errorMsg').textContent = 'ยังไม่ได้ตั้งค่า Facebook OAuth';
        document.getElementById('errorMsg').classList.remove('hidden');
        return;
      }
      if (!window.FB) {
        FB.init({ appId: ssoConfig.facebook, cookie: true, xfbml: false, version: 'v19.0' });
      }
      FB.login(function(response) {
        if (response.authResponse) {
          handleSsoResponse('Facebook', response.authResponse.accessToken);
        }
      }, { scope: 'email,public_profile' });
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errEl.textContent = 'รหัสผ่านไม่ตรงกัน';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'กำลังสมัครสมาชิก...';

      try {
        const res = await API.register({
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          email: document.getElementById('email').value,
          password: password,
          companyName: document.getElementById('companyName').value
        });

        if (res.success && res.data) {
          const token = res.data.accessToken || res.data.token;
          localStorage.setItem('token', token);
          localStorage.setItem('user', JSON.stringify(res.data.user || res.data));
          API.token = token;
          window.location.href = '/app.html';
        } else {
          throw new Error(res.message || 'สมัครสมาชิกไม่สำเร็จ');
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'สมัครสมาชิกฟรี';
      }
    }

    if (localStorage.getItem('token')) {
      window.location.href = '/app.html';
    }
  </script>
</body>
</html>
