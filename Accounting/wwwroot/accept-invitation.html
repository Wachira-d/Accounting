<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตอบรับคำเชิญ - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .ai-card { max-width: 480px; margin: 60px auto; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .ai-card h1 { margin: 0 0 8px; font-size: 22px; color: #0f172a; }
    .ai-sub { color: #6b7280; margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
    .ai-meta { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; font-size: 13px; line-height: 1.8; color: #1e293b; }
    .ai-meta b { color: #4F46E5; }
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; line-height: 1.5; }
    .alert-err { background: #FEF2F2; color: #DC2626; }
    .alert-ok { background: #ecfdf5; color: #059669; }
    .alert-warn { background: #fffbeb; color: #b45309; border:1px solid #fde68a; }
    .ai-actions { display:flex; flex-direction:column; gap:10px }
  </style>
</head>
<body>
  <div class="ai-card">
    <a href="/" style="font-size:20px;font-weight:800;color:#4F46E5;text-decoration:none;display:block;margin-bottom:20px">Next Acc</a>
    <h1>ตอบรับคำเชิญเข้าร่วมทีม</h1>
    <p class="ai-sub">ตรวจรายละเอียดคำเชิญด้านล่าง แล้วเข้าสู่ระบบหรือสมัครสมาชิกใหม่เพื่อตอบรับ</p>

    <div id="loading" class="alert">กำลังตรวจคำเชิญ...</div>

    <div id="meta" class="ai-meta hidden"></div>

    <div id="errMsg" class="alert alert-err hidden"></div>
    <div id="okMsg" class="alert alert-ok hidden"></div>

    <div id="actions" class="ai-actions hidden"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const loading = document.getElementById('loading');
    const metaEl = document.getElementById('meta');
    const errEl = document.getElementById('errMsg');
    const okEl = document.getElementById('okMsg');
    const actionsEl = document.getElementById('actions');

    if (!token) {
      loading.classList.add('hidden');
      errEl.textContent = 'ลิงก์คำเชิญไม่ถูกต้อง — ไม่พบ token ใน URL';
      errEl.classList.remove('hidden');
    } else {
      loadPreview();
    }

    async function loadPreview() {
      try {
        const res = await fetch('/api/invitations/by-token/' + encodeURIComponent(token));
        const j = await res.json();
        loading.classList.add('hidden');
        if (!res.ok || !j.success || !j.data) {
          errEl.textContent = (j && j.message) || 'ไม่พบคำเชิญหรือลิงก์ไม่ถูกต้อง';
          errEl.classList.remove('hidden');
          return;
        }
        renderInvitation(j.data);
      } catch (e) {
        loading.classList.add('hidden');
        errEl.textContent = 'โหลดข้อมูลคำเชิญไม่สำเร็จ — โปรดเช็คการเชื่อมต่อแล้วลองอีกครั้ง';
        errEl.classList.remove('hidden');
      }
    }

    function roleLabel(r) {
      // Server sends UserRole as a string when JSON converter is configured;
      // fall back to a numeric map if it ever switches to integer.
      const map = { Owner:'เจ้าของ', Accountant:'นักบัญชี', Staff:'พนักงาน',
        Auditor:'ผู้ตรวจสอบ', Viewer:'ผู้ดู', ExternalAccountant:'นักบัญชีภายนอก' };
      const numMap = { 1:'เจ้าของ', 2:'นักบัญชี', 3:'พนักงาน', 4:'ผู้ตรวจสอบ', 5:'ผู้ดู', 6:'นักบัญชีภายนอก' };
      return map[r] || numMap[r] || r;
    }

    function renderInvitation(d) {
      const expiresAt = d.expiresAt ? new Date(d.expiresAt).toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' }) : '-';
      metaEl.innerHTML = `
        <div><b>${escapeHtml(d.inviterName)}</b> เชิญคุณเข้าร่วมบริษัท</div>
        <div><b>${escapeHtml(d.companyName)}</b></div>
        <div>ในตำแหน่ง <b>${escapeHtml(roleLabel(d.role))}</b></div>
        <div>ส่งถึง: <b>${escapeHtml(d.email)}</b></div>
        <div style="color:#64748b">หมดอายุ ${expiresAt}</div>`;
      metaEl.classList.remove('hidden');

      // The server marks status as Expired in the preview when ExpiresAt < now,
      // even if the row hasn't been flipped in the DB yet.
      if (d.status === 'Expired' || d.status === 2) {
        errEl.textContent = 'คำเชิญหมดอายุแล้ว — โปรดติดต่อผู้เชิญให้ส่งคำเชิญใหม่';
        errEl.classList.remove('hidden');
        return;
      }
      if (d.status === 'Cancelled' || d.status === 3) {
        errEl.textContent = 'คำเชิญนี้ถูกยกเลิกแล้ว';
        errEl.classList.remove('hidden');
        return;
      }
      if (d.status === 'Accepted' || d.status === 1) {
        okEl.innerHTML = 'คำเชิญนี้ถูกตอบรับไปแล้ว — <a href="/login.html" style="color:#059669;font-weight:600">เข้าสู่ระบบเพื่อใช้งาน →</a>';
        okEl.classList.remove('hidden');
        return;
      }

      // Pending — decide flow based on whether the user is already signed in.
      const hasToken = !!localStorage.getItem('token');
      // For an already-signed-in user we offer "Accept now". For a new user
      // we route them through the signup form (with email pre-filled +
      // invitation token preserved through register → server-side accept).
      const registerHref = `/register.html?invite=${encodeURIComponent(token)}&email=${encodeURIComponent(d.email)}`;
      const loginHref = `/login.html?invite=${encodeURIComponent(token)}`;
      if (hasToken) {
        actionsEl.innerHTML = `
          <button id="acceptBtn" class="btn btn-primary btn-lg">✓ ตอบรับคำเชิญ</button>
          <a href="${loginHref}" class="btn btn-secondary" style="text-align:center;text-decoration:none">เข้าสู่ระบบในนามอื่น</a>`;
        document.getElementById('acceptBtn').addEventListener('click', acceptNow);
      } else {
        actionsEl.innerHTML = `
          <a href="${registerHref}" class="btn btn-primary btn-lg" style="text-align:center;text-decoration:none">สมัครสมาชิกใหม่และตอบรับ</a>
          <a href="${loginHref}" class="btn btn-secondary" style="text-align:center;text-decoration:none">เข้าสู่ระบบ (มีบัญชีแล้ว)</a>`;
      }
      actionsEl.classList.remove('hidden');
    }

    async function acceptNow() {
      const btn = document.getElementById('acceptBtn');
      btn.disabled = true; btn.textContent = 'กำลังตอบรับ...';
      try {
        const t = localStorage.getItem('token');
        const res = await fetch('/api/invitations/accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
          body: JSON.stringify({ token })
        });
        const j = await res.json();
        if (!res.ok || !j.success) throw new Error((j && j.message) || 'ตอบรับไม่สำเร็จ');
        okEl.textContent = (j.message || 'ตอบรับสำเร็จ') + ' — กำลังพาไปยังบริษัท...';
        okEl.classList.remove('hidden');
        if (j.data && j.data.companyId) {
          localStorage.setItem('currentCompany', JSON.stringify({ id: j.data.companyId }));
        }
        setTimeout(() => { location.href = '/pages/dashboard.html'; }, 1200);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = '✓ ตอบรับคำเชิญ';
      }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
