<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตอบรับคำเชิญ - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .invite-card { max-width: 480px; margin: 80px auto; background: #fff; border-radius: 16px; padding: 40px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .invite-card h1 { margin: 0 0 8px; font-size: 24px; }
    .invite-card .subtitle { color: #6b7280; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;
      font-family: inherit; box-sizing: border-box;
    }
    .form-group input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
    .btn-submit {
      width: 100%; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none;
      padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all .2s;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.3); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .alert-error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>
  <div class="invite-card">
    <h1>ตอบรับคำเชิญ</h1>
    <p class="subtitle">กรุณาตั้งรหัสผ่านเพื่อสร้างบัญชีของคุณ</p>

    <div id="errorBox" class="alert alert-error" style="display:none"></div>
    <div id="successBox" class="alert alert-success" style="display:none"></div>
    <div id="infoBox" class="alert alert-info" style="display:none"></div>

    <form id="acceptForm" onsubmit="acceptInvitation(event)">
      <div class="form-group">
        <label>รหัสผ่าน (อย่างน้อย 8 ตัวอักษร)</label>
        <input type="password" id="password" minlength="8" required>
      </div>
      <div class="form-group">
        <label>ยืนยันรหัสผ่าน</label>
        <input type="password" id="confirmPassword" minlength="8" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">ตอบรับคำเชิญ</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('acceptForm').style.display = 'none';
      const err = document.getElementById('errorBox');
      err.textContent = 'ไม่พบ token ของคำเชิญ — ลิงก์อาจไม่ถูกต้อง';
      err.style.display = 'block';
    }

    async function acceptInvitation(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      const errBox = document.getElementById('errorBox');
      const okBox = document.getElementById('successBox');
      errBox.style.display = 'none';
      okBox.style.display = 'none';

      if (password !== confirm) {
        errBox.textContent = 'รหัสผ่านไม่ตรงกัน';
        errBox.style.display = 'block';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังดำเนินการ...';

      try {
        const res = await fetch('/api/freelance/accept-invitation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'ตอบรับคำเชิญไม่สำเร็จ');

        okBox.textContent = 'ตอบรับคำเชิญสำเร็จ! กำลังนำคุณไปยังหน้าเข้าสู่ระบบ...';
        okBox.style.display = 'block';
        document.getElementById('acceptForm').style.display = 'none';
        setTimeout(() => location.href = '/login.html', 2000);
      } catch (e) {
        errBox.textContent = e.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'ตอบรับคำเชิญ';
      }
    }
  </script>
</body>
</html>
