<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบการชำระเงิน - Admin Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="pageContent">
    <!-- Pending payments summary -->
    <div class="admin-kpi-grid" id="paymentKpi">
      <div class="admin-kpi"><div class="admin-kpi-label">กำลังโหลด...</div></div>
    </div>

    <!-- Tabs -->
    <div class="admin-card">
      <div class="admin-toolbar">
        <button class="admin-btn admin-btn-primary" id="tabPending" onclick="switchTab('pending')">รอตรวจสอบ</button>
        <button class="admin-btn admin-btn-outline" id="tabAll" onclick="switchTab('all')">ทั้งหมด</button>
        <button class="admin-btn admin-btn-success" onclick="openRecord()">+ บันทึกรับเงิน (manual)</button>
        <div style="flex:1"></div>
        <input type="month" id="filterMonth" class="admin-select" style="display:none" onchange="loadAllPayments()">
        <select id="filterPlan" class="admin-select" style="display:none" onchange="loadAllPayments()">
          <option value="">ทุกแพ็กเกจ</option>
          <option value="FreeTrial">FreeTrial</option>
          <option value="Basic">Basic</option>
          <option value="Pro">Pro</option>
          <option value="Enterprise">Enterprise</option>
        </select>
        <select id="filterStatus" class="admin-select" onchange="loadAllPayments()">
          <option value="">ทุกสถานะ</option>
          <option value="Pending">Pending</option>
          <option value="UnderReview">UnderReview</option>
          <option value="Approved">Approved</option>
          <option value="Rejected">Rejected</option>
          <option value="Cancelled">Cancelled</option>
        </select>
        <button id="exportBtn" class="admin-btn admin-btn-outline" style="display:none" onclick="exportPayments()">⬇ Excel</button>
      </div>

      <div id="pendingSection">
        <div class="admin-toolbar" style="margin-bottom:8px">
          <button class="admin-btn admin-btn-success admin-btn-sm" onclick="bulkApprove()">✓ อนุมัติที่เลือก</button>
          <span id="bulkCount" style="color:#64748b;font-size:13px">เลือก 0 รายการ</span>
        </div>
        <div id="pendingList">กำลังโหลด...</div>
      </div>
      <div id="allSection" style="display:none">
        <div id="allTotals" class="admin-kpi-grid" style="margin-bottom:12px"></div>
        <div id="allList">กำลังโหลด...</div>
        <div id="pagination" class="admin-pagination"></div>
      </div>
    </div>

    <div id="reviewModal" style="display:none"></div>
    <div id="recordModal" style="display:none"></div>
  </div>

  <script src="/admin/admin-api.js"></script>
  <script src="/admin/admin-layout.js"></script>
  <script>
    AdminLayout.init('payments');
    let currentTab = 'pending';

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabPending').className = `admin-btn ${tab === 'pending' ? 'admin-btn-primary' : 'admin-btn-outline'}`;
      document.getElementById('tabAll').className = `admin-btn ${tab === 'all' ? 'admin-btn-primary' : 'admin-btn-outline'}`;
      document.getElementById('pendingSection').style.display = tab === 'pending' ? '' : 'none';
      document.getElementById('allSection').style.display = tab === 'all' ? '' : 'none';
      const showAll = tab === 'all' ? '' : 'none';
      ['filterStatus','filterMonth','filterPlan','exportBtn'].forEach(id => document.getElementById(id).style.display = showAll);
      if (tab === 'all') loadAllPayments();
    }

    function allParams() {
      const status = document.getElementById('filterStatus').value;
      const month = document.getElementById('filterMonth').value;
      const plan = document.getElementById('filterPlan').value;
      let p = [];
      if (status) p.push('status=' + status);
      if (month) p.push('month=' + month);
      if (plan) p.push('plan=' + plan);
      return p.length ? '?' + p.join('&') : '';
    }

    async function exportPayments() {
      try { await AdminAPI.exportPayments(allParams()); }
      catch (err) { AdminLayout.toast(err.message, 'error'); }
    }

    function updateBulkCount() {
      const n = document.querySelectorAll('.bulkChk:checked').length;
      document.getElementById('bulkCount').textContent = `เลือก ${n} รายการ`;
    }

    async function bulkApprove() {
      const ids = [...document.querySelectorAll('.bulkChk:checked')].map(c => c.value);
      if (ids.length === 0) { AdminLayout.toast('ยังไม่ได้เลือกรายการ', 'warning'); return; }
      if (!confirm(`อนุมัติ ${ids.length} รายการที่เลือก?`)) return;
      try {
        const res = await AdminAPI.bulkApprovePayments(ids);
        AdminLayout.toast(res.message || 'อนุมัติแล้ว');
        loadPending();
      } catch (err) { AdminLayout.toast(err.message, 'error'); }
    }

    async function loadPending() {
      try {
        const res = await AdminAPI.pendingPayments();
        const payments = res.data?.payments || res.data?.items || [];

        document.getElementById('paymentKpi').innerHTML = `
          <div class="admin-kpi">
            <div class="admin-kpi-label">รอตรวจสอบ</div>
            <div class="admin-kpi-value" style="color:var(--admin-warning)">${payments.length}</div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">มูลค่ารอตรวจ</div>
            <div class="admin-kpi-value">${AdminLayout.money(payments.reduce((sum, p) => sum + (p.amount || 0), 0))}</div>
          </div>
        `;

        if (payments.length === 0) {
          document.getElementById('pendingList').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:40px">ไม่มีรายการรอตรวจสอบ</div>';
          return;
        }

        document.getElementById('pendingList').innerHTML = `
          <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th><input type="checkbox" onchange="document.querySelectorAll('.bulkChk').forEach(c=>c.checked=this.checked);updateBulkCount()"></th><th>เลขที่</th><th>บริษัท</th><th>แพ็กเกจที่ขอ</th><th>จำนวน</th><th>วิธีชำระ</th><th>สถานะ</th><th>วันที่</th><th></th></tr></thead>
            <tbody>
              ${payments.map(p => `
                <tr>
                  <td><input type="checkbox" class="bulkChk" value="${p.id}" onchange="updateBulkCount()"></td>
                  <td><strong>${p.paymentNumber || '-'}</strong></td>
                  <td>${p.companyName || '-'}</td>
                  <td>${AdminLayout.planBadge(p.requestedPlan)}</td>
                  <td class="admin-text-right"><strong>${AdminLayout.money(p.amount)}</strong></td>
                  <td>${p.paymentMethod || '-'}</td>
                  <td>${AdminLayout.statusBadge(p.status)}</td>
                  <td>${AdminLayout.datetime(p.createdAt)}</td>
                  <td>
                    <button class="admin-btn admin-btn-primary admin-btn-sm" onclick="showReview('${p.id}')">ตรวจสอบ</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          </div>
        `;
        updateBulkCount();
      } catch (err) {
        document.getElementById('pendingList').innerHTML = `<div style="color:var(--admin-danger);padding:20px">${err.message}</div>`;
      }
    }

    async function loadAllPayments(page = 1) {
      const base = allParams();
      const params = (base ? base + '&' : '?') + `page=${page}&pageSize=20`;

      try {
        const res = await AdminAPI.allPayments(params);
        const d = res.data;

        document.getElementById('allTotals').innerHTML = `
          <div class="admin-kpi"><div class="admin-kpi-label">เงินเข้าจริง (อนุมัติ)</div><div class="admin-kpi-value" style="color:var(--admin-success)">${AdminLayout.money(d.approvedSum || 0)}</div></div>
          <div class="admin-kpi"><div class="admin-kpi-label">รวมทุกสถานะ</div><div class="admin-kpi-value">${AdminLayout.money(d.allSum || 0)}</div></div>
          <div class="admin-kpi"><div class="admin-kpi-label">จำนวนรายการ</div><div class="admin-kpi-value">${d.total || 0}</div></div>
        `;

        if (d.items.length === 0) {
          document.getElementById('allList').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:40px">ไม่พบข้อมูล</div>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        document.getElementById('allList').innerHTML = `
          <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>เลขที่</th><th>บริษัท</th><th>แพ็กเกจ</th><th>จำนวน</th><th>สถานะ</th><th>วันที่ส่ง</th><th>วันที่ตรวจ</th><th>ต่ออายุถึง</th><th></th></tr></thead>
            <tbody>
              ${d.items.map(p => `
                <tr>
                  <td>${p.paymentNumber || '-'}</td>
                  <td>${p.company ? p.company.name : '-'}</td>
                  <td>${AdminLayout.planBadge(p.requestedPlan)}</td>
                  <td class="admin-text-right"><strong>${AdminLayout.money(p.amount)}</strong></td>
                  <td>${AdminLayout.statusBadge(p.status)}</td>
                  <td>${AdminLayout.date(p.createdAt)}</td>
                  <td>${AdminLayout.datetime(p.reviewedAt)}</td>
                  <td>${AdminLayout.date(p.subscriptionExtendedTo)}</td>
                  <td>
                    ${p.status === 'Pending' || p.status === 'UnderReview'
                      ? `<button class="admin-btn admin-btn-primary admin-btn-sm" onclick="showReview('${p.id}')">ตรวจสอบ</button>`
                      : (p.receiptNumber
                          ? `<button class="admin-btn admin-btn-outline admin-btn-sm" onclick="dlReceipt('${p.id}')" title="${p.receiptNumber}">🧾 ${p.receiptIsTaxInvoice ? 'ใบกำกับ' : 'ใบเสร็จ'}</button>`
                          : '')}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          </div>
        `;

        let pagHtml = '';
        if (d.totalPages > 1) {
          pagHtml += `<button ${page <= 1 ? 'disabled' : ''} onclick="loadAllPayments(${page - 1})">ก่อนหน้า</button>`;
          for (let i = 1; i <= Math.min(d.totalPages, 10); i++) {
            pagHtml += `<button class="${i === page ? 'active' : ''}" onclick="loadAllPayments(${i})">${i}</button>`;
          }
          pagHtml += `<button ${page >= d.totalPages ? 'disabled' : ''} onclick="loadAllPayments(${page + 1})">ถัดไป</button>`;
        }
        document.getElementById('pagination').innerHTML = pagHtml;
      } catch (err) {
        document.getElementById('allList').innerHTML = `<div style="color:var(--admin-danger);padding:20px">${err.message}</div>`;
      }
    }

    async function showReview(paymentId) {
      try {
        const res = await AdminAPI.paymentDetail(paymentId);
        const p = res.data;

        document.getElementById('reviewModal').style.display = '';
        document.getElementById('reviewModal').innerHTML = `
          <div class="admin-modal-overlay" onclick="if(event.target===this)closeReview()">
            <div class="admin-modal">
              <h3>ตรวจสอบการชำระเงิน</h3>
              <div class="admin-grid-2" style="margin-bottom:16px">
                <div><div class="admin-label">เลขที่</div><strong>${p.paymentNumber || '-'}</strong></div>
                <div><div class="admin-label">จำนวนเงิน</div><strong style="font-size:20px">${AdminLayout.money(p.amount)}</strong></div>
                <div><div class="admin-label">แพ็กเกจที่ขอ</div>${AdminLayout.planBadge(p.requestedPlan)}</div>
                <div><div class="admin-label">วิธีชำระ</div>${p.paymentMethod || '-'}</div>
                <div><div class="admin-label">สถานะ</div>${AdminLayout.statusBadge(p.status)}</div>
                <div><div class="admin-label">วันที่ส่ง</div>${AdminLayout.datetime(p.createdAt)}</div>
              </div>

              ${p.slipFileName ? `<div class="admin-mb"><div class="admin-label">สลิปการโอน</div><div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;text-align:center">${p.slipFileName}</div></div>` : ''}

              ${p.slipOcrAmount != null || p.slipOcrAmountMatches != null ? `
                <div style="border:1px solid ${p.slipOcrAmountMatches ? '#86efac' : '#fde68a'};background:${p.slipOcrAmountMatches ? '#f0fdf4' : '#fffbeb'};border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px">
                  🔍 <strong>OCR อ่านสลิป</strong> (ช่วยตรวจ — โปรดยืนยันกับสลิปจริง):
                  ยอด <strong>${p.slipOcrAmount != null ? AdminLayout.money(p.slipOcrAmount) : '—'}</strong>
                  ${p.slipOcrAmountMatches === true ? '<span style="color:#16a34a">✓ ตรงกับที่แจ้ง</span>' : (p.slipOcrAmountMatches === false ? '<span style="color:#b45309">⚠ ไม่ตรงกับที่แจ้ง</span>' : '')}
                  ${p.slipOcrDate ? ` · วันที่ ${AdminLayout.date(p.slipOcrDate)}` : ''}
                  ${p.slipOcrReference ? ` · อ้างอิง ${p.slipOcrReference}` : ''}
                </div>` : ''}

              ${p.referenceNumber ? `<div class="admin-mb"><div class="admin-label">เลขอ้างอิง</div>${p.referenceNumber}</div>` : ''}
              ${p.notes ? `<div class="admin-mb"><div class="admin-label">หมายเหตุลูกค้า</div>${p.notes}</div>` : ''}

              <div style="background:#ecfeff;border:1px solid #67e8f9;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#0c4a6e;line-height:1.6">
                💡 <strong>การอนุมัติจะ sync 2 ชั้นอัตโนมัติ:</strong><br>
                1. ยืด <code>Subscription.EndDate</code> ของบริษัท ${p.companyName ? '<strong>' + p.companyName + '</strong>' : ''} ตามรอบที่ลูกค้าสมัคร<br>
                2. ถ้าบริษัทนี้อยู่ใต้ <strong>Account Plan</strong> ของ User → ยืด <code>AccountSubscription.EndDate</code> + flip status เป็น Active ให้ด้วย (กัน License แม่หมดอายุก่อนลูก) — quota บน Account Plan ไม่ถูก overwrite
              </div>

              <div class="admin-form-group">
                <label class="admin-label">หมายเหตุ Admin</label>
                <textarea class="admin-input" id="reviewNotes" rows="3" placeholder="บันทึกเพิ่มเติม (ถ้ามี)"></textarea>
              </div>

              <div class="admin-modal-actions">
                <button class="admin-btn admin-btn-success" onclick="reviewPayment('${p.id}', true)">อนุมัติ</button>
                <button class="admin-btn admin-btn-danger" onclick="reviewPayment('${p.id}', false)">ปฏิเสธ</button>
                <button class="admin-btn admin-btn-outline" onclick="closeReview()">ปิด</button>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
      }
    }

    async function reviewPayment(paymentId, approve) {
      const action = approve ? 'อนุมัติ' : 'ปฏิเสธ';
      if (!confirm(`ต้องการ${action}การชำระเงินนี้?`)) return;

      const notes = document.getElementById('reviewNotes')?.value || '';
      try {
        await AdminAPI.reviewPayment(paymentId, approve, notes);
        AdminLayout.toast(`${action}การชำระเงินสำเร็จ`);
        closeReview();
        loadPending();
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
      }
    }

    function closeReview() {
      document.getElementById('reviewModal').style.display = 'none';
      document.getElementById('reviewModal').innerHTML = '';
    }

    // ===== WP-C1: บันทึกรับเงินเอง / ยกเว้นค่าบริการ =====
    let recPlans = [];
    const CYCLE_MONTHS = { Monthly: 1, Quarterly: 3, SemiAnnual: 6, Annual: 12 };

    async function openRecord() {
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById('recordModal').style.display = '';
      document.getElementById('recordModal').innerHTML = `
        <div class="admin-modal-overlay" onclick="if(event.target===this)closeRecord()">
          <div class="admin-modal">
            <h3>บันทึกรับเงิน / ยกเว้นค่าบริการ</h3>
            <div style="background:#ecfeff;border:1px solid #67e8f9;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#0c4a6e;line-height:1.6">
              💡 สร้าง payment record แล้วต่ออายุทันที (ต่อ EndDate + cascade License + ประวัติ + ใบเสร็จ) — ทุกบาทมีร่องรอย ไม่ต่ออายุแบบไร้เอกสาร
            </div>

            <div class="admin-form-group">
              <label class="admin-label">บริษัท *</label>
              <div style="display:flex;gap:8px">
                <input class="admin-input" id="recSearch" placeholder="ค้นหาชื่อ/เลขภาษี" oninput="reloadRecCompanies()" style="flex:1">
              </div>
              <select class="admin-input" id="recCompany" style="margin-top:6px"><option value="">— เลือกบริษัท —</option></select>
            </div>

            <div class="admin-grid-2">
              <div class="admin-form-group">
                <label class="admin-label">แพ็กเกจ *</label>
                <select class="admin-input" id="recPlan" onchange="recAutoAmount()"></select>
              </div>
              <div class="admin-form-group">
                <label class="admin-label">รอบบิล *</label>
                <select class="admin-input" id="recCycle" onchange="recAutoAmount()">
                  <option value="Monthly">รายเดือน (1)</option>
                  <option value="Quarterly">ราย 3 เดือน</option>
                  <option value="SemiAnnual">ราย 6 เดือน</option>
                  <option value="Annual" selected>รายปี (12)</option>
                </select>
              </div>
              <div class="admin-form-group">
                <label class="admin-label">จำนวนเดือนที่ต่อ *</label>
                <input class="admin-input" id="recMonths" type="number" min="1" value="12">
              </div>
              <div class="admin-form-group">
                <label class="admin-label">วันที่รับเงิน *</label>
                <input class="admin-input" id="recDate" type="date" value="${today}">
              </div>
              <div class="admin-form-group">
                <label class="admin-label">ยอดเงิน (บาท) *</label>
                <input class="admin-input" id="recAmount" type="number" min="0" step="0.01" value="0">
              </div>
              <div class="admin-form-group">
                <label class="admin-label">วิธีรับเงิน</label>
                <select class="admin-input" id="recMethod">
                  <option value="BankTransfer">โอนธนาคาร</option>
                  <option value="Cash">เงินสด</option>
                  <option value="PromptPay">พร้อมเพย์</option>
                  <option value="CreditCard">บัตรเครดิต</option>
                  <option value="Other">อื่น ๆ</option>
                </select>
              </div>
            </div>

            <div class="admin-form-group">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" id="recWaive" onchange="toggleWaive()"> ยกเว้นค่าบริการ (ต่ออายุให้ฟรี ยอด 0)
              </label>
            </div>
            <div class="admin-form-group" id="recWaiveReasonWrap" style="display:none">
              <label class="admin-label">เหตุผลการยกเว้น *</label>
              <select class="admin-input" id="recWaiveReason">
                <option value="Goodwill">Goodwill — ไมตรีจิต</option>
                <option value="Compensation">Compensation — ชดเชยเหตุขัดข้อง</option>
                <option value="Correction">Correction — แก้ไขข้อผิดพลาด</option>
              </select>
            </div>

            <div class="admin-form-group">
              <label class="admin-label">เลขอ้างอิงการโอน</label>
              <input class="admin-input" id="recRef" placeholder="(ถ้ามี)">
            </div>
            <div class="admin-form-group">
              <label class="admin-label">หมายเหตุ</label>
              <textarea class="admin-input" id="recNotes" rows="2"></textarea>
            </div>

            <div class="admin-modal-actions">
              <button class="admin-btn admin-btn-success" id="recSubmitBtn" onclick="submitRecord()">บันทึก + ต่ออายุ</button>
              <button class="admin-btn admin-btn-outline" onclick="closeRecord()">ยกเลิก</button>
            </div>
          </div>
        </div>
      `;
      await Promise.all([reloadRecCompanies(), loadRecPlans()]);
    }

    async function loadRecPlans() {
      try {
        const res = await AdminAPI.plans(false);
        recPlans = res.data || [];
        const sel = document.getElementById('recPlan');
        if (!sel) return;
        sel.innerHTML = recPlans.map(p => `<option value="${p.plan}">${p.name}</option>`).join('')
          || '<option value="">— ไม่มีแพ็กเกจ —</option>';
        recAutoAmount();
      } catch (err) { AdminLayout.toast(err.message, 'error'); }
    }

    let recSearchTimer = null;
    function reloadRecCompanies() {
      clearTimeout(recSearchTimer);
      return new Promise(resolve => {
        recSearchTimer = setTimeout(async () => {
          const q = (document.getElementById('recSearch')?.value || '').trim();
          try {
            const res = await AdminAPI.customers(`?pageSize=50${q ? '&search=' + encodeURIComponent(q) : ''}`);
            const items = res.data?.items || res.data?.companies || [];
            const sel = document.getElementById('recCompany');
            if (sel) sel.innerHTML = '<option value="">— เลือกบริษัท —</option>'
              + items.map(c => `<option value="${c.id}">${c.name}${c.taxId ? ' (' + c.taxId + ')' : ''}</option>`).join('');
          } catch (err) { AdminLayout.toast(err.message, 'error'); }
          resolve();
        }, 250);
      });
    }

    function recAutoAmount() {
      if (document.getElementById('recWaive')?.checked) return;
      const plan = recPlans.find(p => p.plan === document.getElementById('recPlan')?.value);
      const cycle = document.getElementById('recCycle')?.value || 'Annual';
      if (document.getElementById('recMonths')) document.getElementById('recMonths').value = CYCLE_MONTHS[cycle] || 1;
      if (!plan) return;
      const price = { Monthly: plan.monthlyPrice, Quarterly: plan.quarterlyPrice, SemiAnnual: plan.semiAnnualPrice, Annual: plan.annualPrice }[cycle] ?? plan.monthlyPrice;
      const amt = document.getElementById('recAmount');
      if (amt) amt.value = price ?? 0;
    }

    function toggleWaive() {
      const waived = document.getElementById('recWaive').checked;
      document.getElementById('recWaiveReasonWrap').style.display = waived ? '' : 'none';
      const amt = document.getElementById('recAmount');
      if (waived) { amt.value = '0'; amt.setAttribute('disabled', 'disabled'); }
      else { amt.removeAttribute('disabled'); recAutoAmount(); }
    }

    async function submitRecord() {
      const companyId = document.getElementById('recCompany').value;
      if (!companyId) { AdminLayout.toast('กรุณาเลือกบริษัท', 'error'); return; }
      const waived = document.getElementById('recWaive').checked;
      const months = parseInt(document.getElementById('recMonths').value || '0', 10);
      if (months <= 0) { AdminLayout.toast('จำนวนเดือนต้องมากกว่า 0', 'error'); return; }
      const body = {
        amount: waived ? 0 : parseFloat(document.getElementById('recAmount').value || '0'),
        paymentDate: new Date(document.getElementById('recDate').value).toISOString(),
        paymentMethod: document.getElementById('recMethod').value,
        requestedPlan: document.getElementById('recPlan').value,
        requestedBillingCycle: document.getElementById('recCycle').value,
        requestedPeriodMonths: months,
        isWaived: waived,
        waiveReason: waived ? document.getElementById('recWaiveReason').value : null,
        transferReference: document.getElementById('recRef').value || null,
        notes: document.getElementById('recNotes').value || null
      };
      const btn = document.getElementById('recSubmitBtn');
      btn.setAttribute('disabled', 'disabled'); btn.textContent = 'กำลังบันทึก...';
      try {
        const res = await AdminAPI.recordManualPayment(companyId, body);
        closeRecord();
        // บันทึก manual = อนุมัติอัตโนมัติทันที (วิ่งเข้าเส้น approve เดิม) จึง
        // **ไม่มีวันโผล่ในแท็บ "รอตรวจสอบ"** — เดิมบันทึกเสร็จแล้วหน้ายังค้าง
        // แท็บ pending ที่ว่างเปล่า ผู้ใช้เข้าใจว่า "กดแล้วไม่ขึ้นอะไรเลย"
        // → สลับไปแท็บ "ทั้งหมด" ให้เห็นแถวที่เพิ่งบันทึกทันที
        const rec = res.data || {};
        AdminLayout.toast((res.message || 'บันทึกสำเร็จ')
          + ` — อนุมัติ+ต่ออายุให้แล้ว${rec.paymentNumber ? ' (' + rec.paymentNumber + ')' : ''} ดูได้ในแท็บ "ทั้งหมด"`);
        loadPending();          // KPI รอตรวจสอบ refresh
        switchTab('all');       // พาไปดูแถวที่เพิ่งเกิด ไม่ปล่อยให้จอว่าง
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
        btn.removeAttribute('disabled'); btn.textContent = 'บันทึก + ต่ออายุ';
      }
    }

    function closeRecord() {
      document.getElementById('recordModal').style.display = 'none';
      document.getElementById('recordModal').innerHTML = '';
    }

    async function dlReceipt(paymentId) {
      try { await AdminAPI.downloadPaymentReceipt(paymentId); }
      catch (err) { AdminLayout.toast(err.message, 'error'); }
    }

    loadPending();
  </script>
</body>
</html>
