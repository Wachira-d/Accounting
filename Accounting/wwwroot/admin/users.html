<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผู้ใช้งาน - Admin Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="pageContent">
    <div class="admin-card">
      <div class="admin-toolbar">
        <input type="text" id="searchInput" class="admin-input admin-search" placeholder="ค้นหาชื่อหรืออีเมล..." onkeyup="if(event.key==='Enter')loadUsers()">
        <button class="admin-btn admin-btn-primary" onclick="loadUsers()">ค้นหา</button>
        <div style="flex:1"></div>
        <button class="admin-btn admin-btn-success" onclick="openCreateUser()">+ สร้างผู้ใช้</button>
      </div>
      <div id="userList">กำลังโหลด...</div>
      <div id="pagination" class="admin-pagination"></div>
    </div>
    <div id="userModal" style="display:none"></div>
  </div>

  <script src="/admin/admin-api.js"></script>
  <script src="/admin/admin-layout.js"></script>
  <script>
    AdminLayout.init('users');
    let currentPage = 1;
    // เก็บ user ทั้งหน้าไว้เป็น map — ปุ่มต่าง ๆ ส่งแค่ userId แล้วมาเปิดจากนี่
    // (ห้ามยัด JSON ผ่าน onclick attribute: browser decode &quot; กลับเป็น "
    // ทำให้ argument กลายเป็น object ไม่ใช่ string → โค้ดที่รอ string พังเงียบ)
    let _userCache = {};

    async function loadUsers(page = 1) {
      currentPage = page;
      const search = document.getElementById('searchInput').value;
      let params = `?page=${page}&pageSize=20`;
      if (search) params += `&search=${encodeURIComponent(search)}`;

      try {
        const res = await AdminAPI.users(params);
        const d = res.data;
        _userCache = Object.fromEntries((d.items || []).map(u => [u.id, u]));

        if (d.items.length === 0) {
          document.getElementById('userList').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:40px">ไม่พบข้อมูล</div>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        document.getElementById('userList').innerHTML = `
          <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th>ชื่อ</th><th>อีเมล</th><th>โทรศัพท์</th><th>บริษัท</th><th>🎫 License</th><th>สถานะ</th><th>Admin</th><th>เข้าใช้ล่าสุด</th><th>สมัครเมื่อ</th><th></th>
            </tr></thead>
            <tbody>
              ${d.items.map(u => {
                // License pill — populated from accountPlan field the API
                // attaches (or "-" when the user has no plan of their own).
                const ap = u.accountPlan;
                // Defensive — accountPlan may be null, or missing fields if the
                // user's License row is partially migrated. Skip the chip
                // unless planName + companiesUsed are both present.
                const licenseChip = (ap && ap.planName && ap.companiesUsed != null)
                  ? `<span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600" title="License: ${ap.planName} · หมดอายุ ${ap.endDate ? new Date(ap.endDate).toLocaleDateString('th-TH') : '-'}">🎫 ${ap.planName} <span style="opacity:.7">${ap.companiesUsed}/${ap.maxCompanies||'?'}</span></span>`
                  : '<span style="color:#94a3b8">—</span>';
                return `
                <tr>
                  <td><strong>${u.fullName}</strong></td>
                  <td>${u.email}</td>
                  <td>${u.phone || '-'}</td>
                  <td>${u.companies.length > 0 ? u.companies.map(c => `<div style="font-size:12px">${c.name} <span style="color:#94a3b8">(${c.role})</span></div>`).join('') : '<span style="color:#94a3b8">-</span>'}</td>
                  <td>${licenseChip}</td>
                  <td>${AdminLayout.statusBadge(u.status)}</td>
                  <td>
                    ${u.isSystemAdmin
                      ? '<span class="admin-badge-sm bg-purple">Admin</span>'
                      : '<span style="color:#94a3b8">-</span>'}
                  </td>
                  <td>${AdminLayout.datetime(u.lastLoginAt)}</td>
                  <td>${AdminLayout.date(u.createdAt)}</td>
                  <td>
                    <div class="admin-flex" style="flex-wrap:wrap;gap:4px">
                      <select class="admin-select" style="font-size:12px;padding:4px 6px" onchange="changeUserStatus('${u.id}',this.value)">
                        <option value="Active" ${u.status==='Active'?'selected':''}>Active</option>
                        <option value="Inactive" ${u.status==='Inactive'?'selected':''}>Inactive</option>
                        <option value="Suspended" ${u.status==='Suspended'?'selected':''}>Suspended</option>
                      </select>
                      <button class="admin-btn admin-btn-sm admin-btn-primary"
                              style="background:#0ea5e9;border-color:#0ea5e9"
                              onclick="openLicense('${u.id}')">
                        🎫 จัดการ License
                      </button>
                      <button class="admin-btn admin-btn-sm ${u.isSystemAdmin ? 'admin-btn-danger' : 'admin-btn-outline'}"
                        onclick="toggleAdmin('${u.id}', ${!u.isSystemAdmin}, '${u.email}')">
                        ${u.isSystemAdmin ? 'ยกเลิก Admin' : 'ตั้งเป็น Admin'}
                      </button>
                      <button class="admin-btn admin-btn-sm admin-btn-outline"
                        onclick="showUserDetail('${u.id}')">👁 รายละเอียด</button>
                      <button class="admin-btn admin-btn-sm admin-btn-outline"
                        onclick="resetUserPassword('${u.id}','${u.email}')">🔑 รีเซ็ตรหัส</button>
                      <button class="admin-btn admin-btn-sm" style="background:#dc2626;color:#fff"
                        onclick="anonymizeUser('${u.id}','${u.email}')">🗑 ลบ (PDPA)</button>
                    </div>
                  </td>
                </tr>
              `; }).join('')}
            </tbody>
          </table>
          </div>
        `;

        let pagHtml = '';
        if (d.totalPages > 1) {
          pagHtml += `<button ${page <= 1 ? 'disabled' : ''} onclick="loadUsers(${page - 1})">ก่อนหน้า</button>`;
          for (let i = 1; i <= Math.min(d.totalPages, 10); i++) {
            pagHtml += `<button class="${i === page ? 'active' : ''}" onclick="loadUsers(${i})">${i}</button>`;
          }
          pagHtml += `<button ${page >= d.totalPages ? 'disabled' : ''} onclick="loadUsers(${page + 1})">ถัดไป</button>`;
        }
        document.getElementById('pagination').innerHTML = pagHtml;

      } catch (err) {
        document.getElementById('userList').innerHTML = `<div style="color:var(--admin-danger);padding:20px">${err.message}</div>`;
      }
    }

    async function changeUserStatus(userId, status) {
      try {
        await AdminAPI.updateUserStatus(userId, status);
        AdminLayout.toast('อัพเดทสถานะสำเร็จ');
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
        loadUsers(currentPage);
      }
    }

    async function toggleAdmin(userId, isAdmin, email) {
      const action = isAdmin ? 'ตั้งเป็น System Admin' : 'ยกเลิกสิทธิ์ Admin';
      if (!confirm(`ต้องการ${action} สำหรับ ${email}?`)) {
        loadUsers(currentPage);
        return;
      }
      try {
        await AdminAPI.toggleAdmin(userId, isAdmin);
        AdminLayout.toast(`${action} สำเร็จ`);
        loadUsers(currentPage);
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
      }
    }

    // ===== WP-D2: reset password (admin) =====
    async function resetUserPassword(userId, email) {
      if (!confirm(`ออกลิงก์รีเซ็ตรหัสผ่านสำหรับ ${email}?`)) return;
      try {
        const res = await AdminAPI.resetUserPassword(userId);
        showLinkResult('ลิงก์รีเซ็ตรหัสผ่าน', res.data, res.message);
      } catch (err) { AdminLayout.toast(err.message, 'error'); }
    }

    // ===== WP-D4: user detail 360° =====
    async function showUserDetail(userId) {
      try {
        const res = await AdminAPI.userDetail(userId);
        const d = res.data;
        const u = d.user;
        const fmt = t => t ? new Date(t).toLocaleString('th-TH') : '-';
        const companies = (d.companies||[]).length
          ? d.companies.map(c => `<div style="font-size:13px;padding:3px 0">${c.company} <span style="color:#94a3b8">(${c.role})</span>${c.isDefault?' ⭐':''}</div>`).join('')
          : '<span style="color:#94a3b8">ไม่มี</span>';
        const licenses = (d.licenses||[]).length
          ? d.licenses.map(l => `<div style="font-size:13px;padding:3px 0">🎫 ${l.planName} · ${l.status} · หมดอายุ ${AdminLayout.date(l.endDate)} · ${l.maxCompanies} บริษัท</div>`).join('')
          : '<span style="color:#94a3b8">ไม่ถือ License</span>';
        const invites = (d.pendingInvites||[]).length
          ? d.pendingInvites.map(i => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0">
               <span>${i.company} (${i.role}) · หมดอายุ ${AdminLayout.date(i.expiresAt)}</span>
               <button class="admin-btn admin-btn-sm admin-btn-outline" onclick="resendInvite('${i.id}')">ส่งซ้ำ</button></div>`).join('')
          : '<span style="color:#94a3b8">ไม่มีคำเชิญค้าง</span>';
        const sess = d.session || {};
        document.getElementById('userModal').style.display = '';
        document.getElementById('userModal').innerHTML = `
          <div class="admin-modal-overlay" onclick="if(event.target===this)closeUserModal()">
            <div class="admin-modal" style="max-width:640px">
              <h3>${u.fullName} <span style="font-size:13px;color:#94a3b8">${u.email}</span></h3>
              <div class="admin-grid-2" style="margin-bottom:12px">
                <div><div class="admin-label">สถานะ</div>${AdminLayout.statusBadge(u.status)}${u.isSystemAdmin?' <span class="admin-badge-sm bg-purple">Admin</span>':''}</div>
                <div><div class="admin-label">อีเมลยืนยัน</div>${u.emailVerified?'✓ ยืนยันแล้ว':'✗ ยังไม่ยืนยัน'}</div>
                <div><div class="admin-label">เข้าใช้ล่าสุด</div>${fmt(u.lastLoginAt)}</div>
                <div><div class="admin-label">สมัครเมื่อ</div>${fmt(u.createdAt)}</div>
              </div>
              <div class="admin-form-group"><div class="admin-label">Session</div>
                <div style="display:flex;align-items:center;gap:10px">
                  <span>${sess.hasActiveSession ? '🟢 มี session ใช้งาน (หมดอายุ '+AdminLayout.date(sess.refreshTokenExpiry)+')' : '⚪ ไม่มี session'}</span>
                  ${sess.hasActiveSession ? `<button class="admin-btn admin-btn-sm admin-btn-danger" onclick="revokeSessions('${u.id}')">เพิกถอน</button>` : ''}
                </div>
              </div>
              <div class="admin-form-group"><div class="admin-label">บริษัท + บทบาท</div>${companies}</div>
              <div class="admin-form-group"><div class="admin-label">License ที่ถือ</div>${licenses}</div>
              <div class="admin-form-group"><div class="admin-label">คำเชิญค้าง</div>${invites}</div>
              <div class="admin-modal-actions"><button class="admin-btn admin-btn-outline" onclick="closeUserModal()">ปิด</button></div>
            </div>
          </div>`;
      } catch (err) { AdminLayout.toast(err.message, 'error'); }
    }
    async function revokeSessions(userId) {
      if (!confirm('เพิกถอน session ของผู้ใช้นี้? เขาจะต้องเข้าสู่ระบบใหม่')) return;
      try { const r = await AdminAPI.revokeUserSessions(userId); AdminLayout.toast(r.message||'เพิกถอนแล้ว'); showUserDetail(userId); }
      catch (err) { AdminLayout.toast(err.message, 'error'); }
    }
    async function resendInvite(invId) {
      try {
        const r = await AdminAPI.resendInvitation(invId);
        if (r.data && r.data.inviteLink) showLinkResult('ลิงก์คำเชิญ', { resetLink: r.data.inviteLink, emailSent: r.data.emailSent }, r.message);
        else AdminLayout.toast(r.message||'ส่งซ้ำแล้ว');
      } catch (err) { AdminLayout.toast(err.message, 'error'); }
    }

    // ===== WP-D3: anonymize user (PDPA) =====
    async function anonymizeUser(userId, email) {
      if (!confirm(`ลบข้อมูลส่วนบุคคลของ ${email}?\n\nชื่อ/อีเมล/เบอร์จะถูกลบถาวร (คงประวัติ/เอกสารตามกฎหมาย 5 ปี). ผู้ใช้จะเข้าระบบไม่ได้อีก.`)) return;
      try {
        const res = await AdminAPI.anonymizeUser(userId);
        AdminLayout.toast(res.message || 'ลบข้อมูลส่วนบุคคลแล้ว');
        loadUsers(currentPage);
      } catch (err) { AdminLayout.toast(err.message, 'error'); }
    }

    // ===== WP-D1: create user (admin) =====
    async function openCreateUser() {
      let companyOpts = '<option value="">— ไม่ผูกบริษัท —</option>';
      try {
        const r = await AdminAPI.customers('?pageSize=100');
        const items = r.data?.items || [];
        companyOpts += items.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch {}
      document.getElementById('userModal').style.display = '';
      document.getElementById('userModal').innerHTML = `
        <div class="admin-modal-overlay" onclick="if(event.target===this)closeUserModal()">
          <div class="admin-modal">
            <h3>สร้างผู้ใช้ใหม่</h3>
            <div class="admin-form-group"><label class="admin-label">อีเมล *</label><input class="admin-input" id="cuEmail" type="email"></div>
            <div class="admin-form-group"><label class="admin-label">ชื่อ-นามสกุล *</label><input class="admin-input" id="cuName"></div>
            <div class="admin-form-group"><label class="admin-label">โทรศัพท์</label><input class="admin-input" id="cuPhone"></div>
            <div class="admin-form-group"><label class="admin-label">ผูกกับบริษัท</label><select class="admin-input" id="cuCompany" onchange="cuToggleRole()">${companyOpts}</select></div>
            <div class="admin-form-group" id="cuRoleWrap" style="display:none"><label class="admin-label">บทบาทในบริษัท</label>
              <select class="admin-input" id="cuRole">
                <option value="Owner">Owner</option>
                <option value="Accountant">Accountant</option>
                <option value="Staff" selected>Staff</option>
                <option value="Auditor">Auditor</option>
                <option value="Viewer">Viewer</option>
                <option value="ExternalAccountant">ExternalAccountant</option>
              </select>
            </div>
            <div class="admin-form-group">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" id="cuAdmin"> ให้สิทธิ์ System Admin
              </label>
            </div>
            <div class="admin-modal-actions">
              <button class="admin-btn admin-btn-success" id="cuBtn" onclick="submitCreateUser()">สร้างผู้ใช้</button>
              <button class="admin-btn admin-btn-outline" onclick="closeUserModal()">ยกเลิก</button>
            </div>
          </div>
        </div>`;
    }

    function cuToggleRole() {
      document.getElementById('cuRoleWrap').style.display =
        document.getElementById('cuCompany').value ? '' : 'none';
    }

    async function submitCreateUser() {
      const email = document.getElementById('cuEmail').value.trim();
      const fullName = document.getElementById('cuName').value.trim();
      if (!email || !fullName) { AdminLayout.toast('กรอกอีเมลและชื่อ', 'error'); return; }
      const companyId = document.getElementById('cuCompany').value || null;
      const body = {
        email, fullName,
        phone: document.getElementById('cuPhone').value || null,
        companyId,
        role: companyId ? document.getElementById('cuRole').value : null,
        makeSystemAdmin: document.getElementById('cuAdmin').checked
      };
      const btn = document.getElementById('cuBtn');
      btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
      try {
        const res = await AdminAPI.createUser(body);
        closeUserModal();
        showLinkResult('ลิงก์ตั้งรหัสผ่าน', { resetLink: res.data.setPasswordLink, expiresAt: res.data.expiresAt, emailSent: res.data.emailSent }, res.message);
        loadUsers(currentPage);
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'สร้างผู้ใช้';
      }
    }

    function showLinkResult(title, data, message) {
      const link = data.resetLink || '';
      document.getElementById('userModal').style.display = '';
      document.getElementById('userModal').innerHTML = `
        <div class="admin-modal-overlay" onclick="if(event.target===this)closeUserModal()">
          <div class="admin-modal">
            <h3>${title}</h3>
            <p style="color:#475569;font-size:13px">${message || ''}${data.emailSent ? ' (ส่งอีเมลแล้ว)' : ' — ยังไม่ได้ตั้งค่า SMTP: คัดลอกลิงก์ส่งให้ผู้ใช้'}</p>
            <div class="admin-form-group">
              <input class="admin-input" id="linkBox" value="${link}" readonly onclick="this.select()">
            </div>
            <p style="color:#94a3b8;font-size:12px">หมดอายุ ${data.expiresAt ? new Date(data.expiresAt).toLocaleString('th-TH') : '-'}</p>
            <div class="admin-modal-actions">
              <button class="admin-btn admin-btn-primary" onclick="navigator.clipboard.writeText(document.getElementById('linkBox').value).then(()=>AdminLayout.toast('คัดลอกแล้ว'))">คัดลอกลิงก์</button>
              <button class="admin-btn admin-btn-outline" onclick="closeUserModal()">ปิด</button>
            </div>
          </div>
        </div>`;
    }

    function closeUserModal() {
      document.getElementById('userModal').style.display = 'none';
      document.getElementById('userModal').innerHTML = '';
    }

    // ===== License management modal =====
    // Opens an inline modal showing the user's Account Plan (or "no plan")
    // with controls to extend, change status, adjust limits, switch plan,
    // and create a new plan. Mirrors the actions on the dedicated
    // /admin/account-subscriptions.html page so admin doesn't have to leave
    // the user list.
    let _planTemplates = null;
    async function _ensurePlanTemplates() {
      if (_planTemplates) return _planTemplates;
      try {
        // Endpoint lives at /api/admin/plans (the AdminAPI.plans() helper).
        // Earlier draft hit /plan-templates which 404'd silently and left
        // the create-License dropdown empty.
        const r = await AdminAPI.plans(false);
        _planTemplates = (r.data || []).filter(p => p.isActive);
      } catch (e) {
        console.warn('Plan template load failed', e);
        _planTemplates = [];
      }
      return _planTemplates;
    }
    async function openLicense(userId) {
      // อ่านจาก cache ของหน้า — เดิมส่ง accountPlan เป็น JSON ผ่าน onclick
      // attribute: JSON.stringify แล้ว escape เป็น &quot; พอ browser parse
      // attribute มัน decode กลับเป็น " ⇒ argument ตัวที่ 4 กลายเป็น **object**
      // แล้ว `apStr.replace(...)` โยน TypeError → ตัว catch ตีความว่า "ไม่มี
      // License" ⇒ user ที่มี Enterprise อยู่เต็ม ๆ เห็นแต่ฟอร์มสร้างใหม่
      // (แก้วันหมดอายุ/ต่ออายุของเดิมไม่ได้เลย ทั้งที่ปุ่มมีอยู่แล้วในโหมด hasPlan)
      const u = _userCache[userId];
      if (!u) { AdminLayout.toast('โหลดข้อมูลผู้ใช้ใหม่อีกครั้ง', 'error'); return; }
      const fullName = u.fullName || '', email = u.email || '';
      const ap = u.accountPlan || null;
      const tpls = await _ensurePlanTemplates();

      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9500;display:flex;align-items:center;justify-content:center;padding:20px';
      ov.onclick = (e) => { if (e.target === ov) ov.remove(); };

      const fmtBytes = (b) => { if(!b)return '0';const u=['B','KB','MB','GB'];let i=0,v=b;while(v>=1024&&i<3){v/=1024;i++;}return v.toFixed(v<10?1:0)+' '+u[i]; };
      // Build the template dropdown. Empty list = no PlanTemplate rows or the
      // endpoint failed — render a clear empty state + link to the plans page
      // instead of an invisible-but-empty <select>.
      const tplOptions = tpls.length
        ? '<option value="">— เลือก plan —</option>' +
          tpls.map(t => `<option value="${t.id}">${t.name} — ${t.maxCompanies} companies × ${t.maxUsers} users / company · ฿${(t.monthlyPrice||0).toLocaleString()}/เดือน</option>`).join('')
        : '';

      const hasPlan = !!ap;
      // Build the no-plan block content separately so we can show an empty
      // state when the PlanTemplate list is empty (typical on a fresh DB or
      // after admin deleted all active templates).
      const noPlanForm = tpls.length ? `
        <div class="admin-form-group">
          <label class="admin-label">เลือก Plan Template</label>
          <select id="luNewPlan">${tplOptions}</select>
        </div>
        <div class="admin-form-group">
          <label class="admin-label">MaxCompanies override (ว่าง = ใช้ตาม template)</label>
          <input type="number" min="1" id="luNewMax" class="admin-input" placeholder="เช่น 5 สำหรับ enterprise deal">
        </div>
        <div class="admin-form-group">
          <label class="admin-label">วันสิ้นสุด custom (ว่าง = +1 เดือนจากวันนี้)</label>
          <input type="date" id="luNewEnd" class="admin-input">
        </div>
        <button class="admin-btn admin-btn-primary" onclick="luCreate('${userId}')">+ สร้าง License ให้ผู้ใช้</button>` : `
        <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:14px 16px;font-size:13px;color:#991b1b;line-height:1.6">
          ⚠️ <strong>ไม่มี Plan Template ที่ active</strong> — สร้าง License ไม่ได้ตอนนี้<br>
          ไปที่หน้า <a href="/admin/plans.html" style="color:#0ea5e9;font-weight:600">💎 จัดการแพ็กเกจ</a> เพื่อสร้าง PlanTemplate ก่อน (หรือ activate ที่มีอยู่)
        </div>`;

      const summary = hasPlan ? `
        <div style="background:#ecfeff;border:1px solid #67e8f9;border-radius:8px;padding:12px 14px;margin-bottom:14px">
          <div style="font-size:14px;font-weight:700;color:#0c4a6e">🎫 ${ap.planName} <span style="background:#0ea5e9;color:#fff;padding:2px 10px;border-radius:10px;font-size:11px;margin-left:6px">${ap.status||'Active'}</span></div>
          <div style="font-size:12px;color:#475569;margin-top:4px">
            บริษัทใต้ License: <strong>${ap.companiesUsed||0}/${ap.maxCompanies||'?'}</strong> ·
            หมดอายุ <strong>${ap.endDate ? new Date(ap.endDate).toLocaleDateString('th-TH') : '-'}</strong>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px">
          <button class="admin-btn admin-btn-sm admin-btn-primary" onclick="luExtend('${ap.planId}','${ap.endDate}')">⏰ ขยายอายุ</button>
          <button class="admin-btn admin-btn-sm admin-btn-warning" onclick="luStatus('${ap.planId}','${ap.status||'Active'}')">🔄 เปลี่ยนสถานะ</button>
          <button class="admin-btn admin-btn-sm admin-btn-outline" onclick="luLimits('${ap.planId}')">⚙️ ปรับ Limits</button>
          <button class="admin-btn admin-btn-sm admin-btn-outline" onclick="luSwitchPlan('${ap.planId}')">🔁 เปลี่ยน Plan template</button>
        </div>
        <details style="background:#fafafa;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px">
          <summary style="cursor:pointer;font-weight:600;color:#475569">ดูบริษัทที่ผูก / Aggregate usage</summary>
          <div id="luDetailArea" style="margin-top:8px;color:#94a3b8">กำลังโหลด...</div>
        </details>
        <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px;margin-top:14px">
          <button class="admin-btn admin-btn-sm admin-btn-danger" onclick="luCancel('${ap.planId}')">🚫 ยกเลิก License</button>
          <span style="font-size:11px;color:#991b1b;margin-left:10px">บริษัทใต้ License จะกลับไปใช้ Subscription ของตัวเอง · Cancelled = slot ว่าง user สมัครใหม่ได้</span>
        </div>` : `
        <div style="background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:#78350f">
          ⚠️ ผู้ใช้นี้ยังไม่มี License (Account Plan) · บริษัทที่ user เป็นเจ้าของใช้ subscription ของตัวเองแยก
        </div>
        ${noPlanForm}`;

      ov.innerHTML = `
        <div style="background:#fff;border-radius:12px;max-width:680px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)">
          <div style="padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center">
            <h3 style="margin:0;font-size:16px">🎫 จัดการ License ของ ${fullName} <span style="color:#94a3b8;font-size:12px;font-weight:400">${email}</span></h3>
            <button onclick="this.closest('div').parentElement.parentElement.remove()" style="background:transparent;border:none;font-size:22px;cursor:pointer;color:#64748b">&times;</button>
          </div>
          <div style="padding:16px 20px;overflow-y:auto">
            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:11.5px;color:#475569;line-height:1.6">
              🗺️ <b>โครงสร้าง 3 ชั้น:</b> 💎 แพ็กเกจ (template ราคา/โควตา — หน้า <a href="/admin/plans.html">จัดการแพ็กเกจ</a>)
              → 🎫 <b>License ของ "ผู้ใช้"</b> (หน้านี้ — ครอบได้หลายบริษัท)
              → 🏢 Subscription ของ "แต่ละบริษัท" (หน้า <a href="/admin/customers.html">ลูกค้า/บริษัท</a>)<br>
              💰 การรับเงิน/ต่ออายุ บันทึกที่หน้า <a href="/admin/payments.html">ตรวจสอบการชำระ</a>
              — ผูกกับ "บริษัท" แล้วระบบ cascade มายืดอายุ License ให้อัตโนมัติ
            </div>
            ${summary}</div>
        </div>`;
      document.body.appendChild(ov);
      window._licenseOverlay = ov;
      window._licenseUserId = userId;

      // Lazy-load companies-under-plan + aggregate when expanded.
      if (hasPlan) {
        setTimeout(async () => {
          try {
            const r = await AdminAPI.get('/account-subscriptions/' + ap.planId);
            const d = r.data; const u = d.usage || {};
            const cos = (d.attachedCompanies||[]).map(c => `<div style="padding:4px 0;border-bottom:1px solid #f1f5f9">📌 ${c.companyName} · ${c.status} · 📄${c.currentMonthDocuments||0} 📒${c.currentMonthJournalEntries||0} 📸${c.currentMonthOcrPages||0}</div>`).join('') || '<div style="color:#94a3b8">ไม่มีบริษัทผูก</div>';
            document.getElementById('luDetailArea').innerHTML = `
              <div style="margin-bottom:8px;color:#475569">
                <strong>Aggregate (รวมทุกบริษัท):</strong>
                📄 ${u.documents||0}/${u.maxDocuments||0} ·
                📒 ${u.journalEntries||0}/${u.maxJournalEntries||0} ·
                📸 ${u.ocrPages||0}/${u.maxOcrPages||0} ·
                💾 ${fmtBytes(u.storageBytes||0)}/${fmtBytes(u.maxStorageBytes||0)}
              </div>
              ${cos}`;
          } catch(e) {
            document.getElementById('luDetailArea').innerHTML = '<div style="color:#dc2626">⚠ ' + e.message + '</div>';
          }
        }, 0);
      }
    }

    function _luRefresh() { if (window._licenseOverlay) window._licenseOverlay.remove(); loadUsers(); }

    async function luExtend(apId, currentEnd) {
      // endDate อาจว่าง/เพี้ยน (License เก่าที่ไม่เคยตั้ง) — ตกไปตั้งต้นจากวันนี้
      // แทนที่จะเสนอ 1970 จาก new Date(null)
      let cur = new Date(currentEnd);
      if (isNaN(cur.getTime()) || cur.getFullYear() < 2000) cur = new Date();
      cur.setDate(cur.getDate()+30);
      const v = prompt('⏰ ขยายอายุ License — วันสิ้นสุดใหม่ (YYYY-MM-DD)', cur.toISOString().slice(0,10));
      if (!v) return;
      try {
        await AdminAPI.put('/account-subscriptions/' + apId + '/extend', { endDate: v + 'T00:00:00Z' });
        alert('✓ ขยายอายุสำเร็จ'); _luRefresh();
      } catch(e) { alert(e.message); }
    }
    async function luStatus(apId, current) {
      const next = prompt('🔄 สถานะใหม่ (Trial / Active / PastDue / Suspended / Cancelled / Expired)', current);
      if (!next) return;
      try {
        await AdminAPI.put('/account-subscriptions/' + apId + '/status', { status: next, reason: '' });
        alert('✓ เปลี่ยนสถานะสำเร็จ'); _luRefresh();
      } catch(e) { alert(e.message); }
    }
    async function luLimits(apId) {
      try {
        const r = await AdminAPI.get('/account-subscriptions/' + apId);
        const d = r.data;
        const mc = parseInt(prompt('MaxCompanies', d.maxCompanies));
        if (isNaN(mc)) return;
        const mu = parseInt(prompt('MaxUsersPerCompany', d.maxUsersPerCompany));
        if (isNaN(mu)) return;
        const md = parseInt(prompt('MaxDocumentsPerMonth (aggregate)', d.maxDocumentsPerMonth));
        if (isNaN(md)) return;
        const mj = parseInt(prompt('MaxJournalEntriesPerMonth (aggregate)', d.maxJournalEntriesPerMonth));
        if (isNaN(mj)) return;
        const mo = parseInt(prompt('MaxOcrPagesPerMonth (aggregate)', d.maxOcrPagesPerMonth));
        if (isNaN(mo)) return;
        await AdminAPI.put('/account-subscriptions/' + apId + '/limits', {
          maxCompanies: mc, maxUsersPerCompany: mu,
          maxDocumentsPerMonth: md, maxJournalEntriesPerMonth: mj,
          maxOcrPagesPerMonth: mo,
        });
        alert('✓ บันทึก limits ใหม่แล้ว'); _luRefresh();
      } catch(e) { alert(e.message); }
    }
    async function luSwitchPlan(apId) {
      // Future: backend endpoint to swap PlanTemplateId. For now point admin
      // to cancel + create new pattern via the alert.
      alert('การเปลี่ยน Plan template ทำได้ 2 วิธี:\n1. ปรับ Limits ทีละค่า (ปุ่ม ⚙️ ปรับ Limits)\n2. ยกเลิก License เดิม แล้วสร้างใหม่จาก template ที่ต้องการ');
    }
    async function luCancel(apId) {
      if (!confirm('🚫 ยกเลิก License นี้?\n\nบริษัทใต้ License จะกลับไปใช้ Subscription ของตัวเอง (อาจเป็น FreeTrial) · slot ว่าง user สมัครใหม่ได้')) return;
      try {
        await AdminAPI.put('/account-subscriptions/' + apId + '/status', { status: 'Cancelled', reason: 'Admin cancelled' });
        alert('✓ ยกเลิก License แล้ว'); _luRefresh();
      } catch(e) { alert(e.message); }
    }
    async function luCreate(userId) {
      const planEl = document.getElementById('luNewPlan');
      if (!planEl) { alert('ไม่มี PlanTemplate ที่ active'); return; }
      const planId = planEl.value;
      if (!planId) { alert('เลือก Plan'); return; }
      const max = document.getElementById('luNewMax').value;
      const end = document.getElementById('luNewEnd').value;
      const body = { ownerUserId: userId, planTemplateId: planId };
      if (max) body.overrideMaxCompanies = parseInt(max);
      if (end) body.customEndDate = end + 'T00:00:00Z';
      try {
        await AdminAPI.post('/account-subscriptions', body);
        alert('✓ สร้าง License สำเร็จ'); _luRefresh();
      } catch(e) { alert(e.message); }
    }

    loadUsers();
  </script>
</body>
</html>
