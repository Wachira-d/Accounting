<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการผู้ใช้งาน - Admin Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="pageContent">
    <div class="admin-card">
      <div class="admin-toolbar">
        <input type="text" id="searchInput" class="admin-input admin-search" placeholder="ค้นหาชื่อหรืออีเมล..." onkeyup="if(event.key==='Enter')loadUsers()">
        <button class="admin-btn admin-btn-primary" onclick="loadUsers()">ค้นหา</button>
      </div>
      <div id="userList">กำลังโหลด...</div>
      <div id="pagination" class="admin-pagination"></div>
    </div>
  </div>

  <script src="/admin/admin-api.js"></script>
  <script src="/admin/admin-layout.js"></script>
  <script>
    AdminLayout.init('users');
    let currentPage = 1;

    async function loadUsers(page = 1) {
      currentPage = page;
      const search = document.getElementById('searchInput').value;
      let params = `?page=${page}&pageSize=20`;
      if (search) params += `&search=${encodeURIComponent(search)}`;

      try {
        const res = await AdminAPI.users(params);
        const d = res.data;

        if (d.items.length === 0) {
          document.getElementById('userList').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:40px">ไม่พบข้อมูล</div>';
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        document.getElementById('userList').innerHTML = `
          <table class="admin-table">
            <thead><tr>
              <th>ชื่อ</th><th>อีเมล</th><th>โทรศัพท์</th><th>บริษัท</th><th>สถานะ</th><th>Admin</th><th>เข้าใช้ล่าสุด</th><th>สมัครเมื่อ</th><th></th>
            </tr></thead>
            <tbody>
              ${d.items.map(u => `
                <tr>
                  <td><strong>${u.fullName}</strong></td>
                  <td>${u.email}</td>
                  <td>${u.phone || '-'}</td>
                  <td>${u.companies.length > 0 ? u.companies.map(c => `<div style="font-size:12px">${c.name} <span style="color:#94a3b8">(${c.role})</span></div>`).join('') : '<span style="color:#94a3b8">-</span>'}</td>
                  <td>${AdminLayout.statusBadge(u.status)}</td>
                  <td>
                    ${u.isSystemAdmin
                      ? '<span class="admin-badge-sm bg-purple">Admin</span>'
                      : '<span style="color:#94a3b8">-</span>'}
                  </td>
                  <td>${AdminLayout.datetime(u.lastLoginAt)}</td>
                  <td>${AdminLayout.date(u.createdAt)}</td>
                  <td>
                    <div class="admin-flex">
                      <select class="admin-select" style="font-size:12px;padding:4px 6px" onchange="changeUserStatus('${u.id}',this.value)">
                        <option value="Active" ${u.status==='Active'?'selected':''}>Active</option>
                        <option value="Inactive" ${u.status==='Inactive'?'selected':''}>Inactive</option>
                        <option value="Suspended" ${u.status==='Suspended'?'selected':''}>Suspended</option>
                      </select>
                      <button class="admin-btn admin-btn-sm ${u.isSystemAdmin ? 'admin-btn-danger' : 'admin-btn-outline'}"
                        onclick="toggleAdmin('${u.id}', ${!u.isSystemAdmin}, '${u.email}')">
                        ${u.isSystemAdmin ? 'ยกเลิก Admin' : 'ตั้งเป็น Admin'}
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

        let pagHtml = '';
        if (d.totalPages > 1) {
          pagHtml += `<button ${page <= 1 ? 'disabled' : ''} onclick="loadUsers(${page - 1})">ก่อนหน้า</button>`;
          for (let i = 1; i <= Math.min(d.totalPages, 10); i++) {
            pagHtml += `<button class="${i === page ? 'active' : ''}" onclick="loadUsers(${i})">${i}</button>`;
          }
          pagHtml += `<button ${page >= d.totalPages ? 'disabled' : ''} onclick="loadUsers(${page + 1})">ถัดไป</button>`;
        }
        document.getElementById('pagination').innerHTML = pagHtml;

      } catch (err) {
        document.getElementById('userList').innerHTML = `<div style="color:var(--admin-danger);padding:20px">${err.message}</div>`;
      }
    }

    async function changeUserStatus(userId, status) {
      try {
        await AdminAPI.updateUserStatus(userId, status);
        AdminLayout.toast('อัพเดทสถานะสำเร็จ');
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
        loadUsers(currentPage);
      }
    }

    async function toggleAdmin(userId, isAdmin, email) {
      const action = isAdmin ? 'ตั้งเป็น System Admin' : 'ยกเลิกสิทธิ์ Admin';
      if (!confirm(`ต้องการ${action} สำหรับ ${email}?`)) {
        loadUsers(currentPage);
        return;
      }
      try {
        await AdminAPI.toggleAdmin(userId, isAdmin);
        AdminLayout.toast(`${action} สำเร็จ`);
        loadUsers(currentPage);
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
      }
    }

    loadUsers();
  </script>
</body>
</html>
