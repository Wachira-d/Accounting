<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าเว็บไซต์ - Admin Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;
      font-family: inherit; transition: border-color .2s;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .svc-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;
      position: relative; transition: box-shadow .2s;
    }
    .svc-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
    .svc-card .svc-remove {
      position: absolute; top: 8px; right: 8px; background: #fee2e2; color: #dc2626;
      border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer;
      font-size: 14px; display: flex; align-items: center; justify-content: center;
    }
    .svc-card .svc-remove:hover { background: #dc2626; color: #fff; }

    .svc-features-list { display: flex; flex-direction: column; gap: 6px; }
    .svc-features-list .feat-row { display: flex; gap: 8px; align-items: center; }
    .svc-features-list .feat-row input { flex: 1; }
    .svc-features-list .feat-row button {
      background: #fee2e2; color: #dc2626; border: none; border-radius: 6px;
      width: 28px; height: 28px; cursor: pointer; font-size: 12px; flex-shrink: 0;
    }

    .btn-add-svc {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 16px; border: 2px dashed #d1d5db; border-radius: 12px;
      background: transparent; color: #6b7280; font-size: 14px; cursor: pointer;
      transition: all .2s; font-family: inherit;
    }
    .btn-add-svc:hover { border-color: #6366f1; color: #6366f1; background: #f5f3ff; }

    .btn-save {
      background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff; border: none;
      padding: 12px 32px; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all .2s; font-family: inherit;
    }
    .btn-save:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.3); }
    .btn-save:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .preview-btn {
      background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; padding: 10px 24px;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all .2s;
    }
    .preview-btn:hover { background: #16a34a; color: #fff; }

    .icon-picker { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .icon-picker button {
      width: 36px; height: 36px; border: 1px solid #e2e8f0; border-radius: 8px;
      background: #fff; font-size: 18px; cursor: pointer; transition: all .15s;
    }
    .icon-picker button:hover, .icon-picker button.selected { border-color: #6366f1; background: #f5f3ff; }

    @media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="pageContent">
    <!-- General Site Settings -->
    <div class="settings-grid">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">ข้อมูลเว็บไซต์</div>
        </div>
        <div class="form-group">
          <label>ชื่อเว็บไซต์</label>
          <input type="text" id="siteName" placeholder="Next Acc">
        </div>
        <div class="form-group">
          <label>คำอธิบาย</label>
          <textarea id="siteDescription" rows="2" placeholder="ระบบบัญชีออนไลน์ครบวงจร"></textarea>
        </div>
        <div class="form-group">
          <label>URL โลโก้</label>
          <input type="text" id="siteLogoUrl" placeholder="/assets/logo.png">
        </div>
        <div class="form-group">
          <label>Facebook URL</label>
          <input type="text" id="facebookUrl" placeholder="https://facebook.com/nextacc">
        </div>
        <div class="form-group">
          <label>LINE Official</label>
          <input type="text" id="lineOfficialUrl" placeholder="https://line.me/R/ti/p/@nextacc">
        </div>
        <div class="form-group">
          <label>Website URL</label>
          <input type="text" id="websiteUrl" placeholder="https://nextacc.com">
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">ข้อมูลติดต่อ (แสดงหน้าบริการบัญชี)</div>
        </div>
        <div class="form-group">
          <label>เบอร์โทรศัพท์</label>
          <input type="text" id="contactPhone" placeholder="02-xxx-xxxx">
        </div>
        <div class="form-group">
          <label>LINE ID</label>
          <input type="text" id="contactLine" placeholder="@nextacc">
        </div>
        <div class="form-group">
          <label>อีเมล</label>
          <input type="email" id="contactEmail" placeholder="contact@nextacc.com">
        </div>
        <hr style="margin:20px 0;border-color:#f1f5f9">
        <div class="admin-card-header" style="margin-bottom:12px">
          <div class="admin-card-title">หัวข้อหน้าราคา</div>
        </div>
        <div class="form-group">
          <label>หัวข้อ</label>
          <input type="text" id="pricingTitle" placeholder="แพ็กเกจที่เหมาะกับทุกธุรกิจ">
        </div>
        <div class="form-group">
          <label>คำอธิบายย่อย</label>
          <textarea id="pricingSubtitle" rows="2" placeholder="เริ่มต้นทดลองใช้ฟรี 14 วัน"></textarea>
        </div>
      </div>
    </div>

    <!-- Service Packages -->
    <div class="admin-card" style="margin-top:24px">
      <div class="admin-card-header" style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="admin-card-title">แพ็กเกจบริการจัดทำบัญชี</div>
          <div style="font-size:13px;color:#94a3b8;margin-top:4px">ตั้งค่าบริการที่แสดงในหน้าแรก (Section "บริการบัญชี")</div>
        </div>
        <div style="display:flex;gap:12px">
          <button class="preview-btn" onclick="previewServices()">ดูตัวอย่าง</button>
        </div>
      </div>

      <div id="servicesList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:16px">
        <!-- Dynamic service cards -->
      </div>

      <button class="btn-add-svc" onclick="addService()" style="margin-top:16px">
        + เพิ่มแพ็กเกจบริการ
      </button>
    </div>

    <!-- Save -->
    <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:24px;padding-bottom:24px">
      <button class="btn-save" id="saveBtn" onclick="saveSettings()">บันทึกการตั้งค่า</button>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;overflow:auto;padding:24px">
      <div style="max-width:1000px;margin:40px auto;background:#fff;border-radius:16px;overflow:hidden">
        <div style="padding:16px 24px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center">
          <strong>ตัวอย่างหน้าแรก — บริการบัญชี</strong>
          <button onclick="document.getElementById('previewModal').style.display='none'" style="background:none;border:none;font-size:20px;cursor:pointer">&times;</button>
        </div>
        <div id="previewContent" style="padding:32px"></div>
      </div>
    </div>
  </div>

  <script src="/admin/admin-api.js"></script>
  <script src="/admin/admin-layout.js"></script>
  <script>
    AdminLayout.init('site-settings');

    const ICONS = ['📋','📊','🏢','📈','💼','🧾','📑','💰','🏦','🔒','📦','🛡️','⚙️','🎯','📝','✅'];
    let services = [];

    // ===== Load Settings =====
    async function loadSettings() {
      try {
        const res = await AdminAPI.get('/site-settings');
        const d = res.data;
        if (!d) return;

        document.getElementById('siteName').value = d.siteName || '';
        document.getElementById('siteDescription').value = d.siteDescription || '';
        document.getElementById('siteLogoUrl').value = d.siteLogoUrl || '';
        document.getElementById('contactPhone').value = d.contactPhone || '';
        document.getElementById('contactLine').value = d.contactLine || '';
        document.getElementById('contactEmail').value = d.contactEmail || '';
        document.getElementById('pricingTitle').value = d.pricingSectionTitle || '';
        document.getElementById('pricingSubtitle').value = d.pricingSectionSubtitle || '';
        document.getElementById('facebookUrl').value = d.facebookUrl || '';
        document.getElementById('lineOfficialUrl').value = d.lineOfficialUrl || '';
        document.getElementById('websiteUrl').value = d.websiteUrl || '';

        services = d.services || [];
        if (!services.length) {
          // Default services template
          services = [
            { name: 'ทำบัญชีรายเดือน', description: 'บันทึกบัญชี ปิดงบรายเดือน จัดทำรายงานภาษี', icon: '📋', price: 3000, priceLabel: 'เดือน', features: ['บันทึกรายรับ-รายจ่าย', 'จัดทำ ภพ.30 / ภงด.3 / ภงด.53', 'ปิดงบทดลองรายเดือน'] },
            { name: 'บัญชี + ภาษี + ประกันสังคม', description: 'ครบทุกงานบัญชีรายเดือน พร้อมจัดทำเงินเดือน', icon: '📊', price: 5500, priceLabel: 'เดือน', features: ['ทุกอย่างในแพ็กเกจรายเดือน', 'จัดทำเงินเดือน + สลิป', 'ยื่นประกันสังคม + ภงด.1', 'ปรึกษาภาษีรายเดือน'] },
            { name: 'ปิดงบการเงินประจำปี', description: 'จัดทำงบการเงิน ยื่นภาษีเงินได้ ตรวจสอบบัญชี', icon: '🏢', price: 15000, priceLabel: 'ปี', features: ['จัดทำงบการเงินประจำปี', 'ยื่น ภงด.50 / ภงด.51', 'ประสานงานผู้สอบบัญชี', 'ยื่น DBD e-Filing'] },
          ];
        }
        renderServices();
      } catch (e) {
        AdminLayout.toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error');
      }
    }

    // ===== Render Service Cards =====
    function renderServices() {
      const container = document.getElementById('servicesList');
      if (!services.length) {
        container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:40px;grid-column:1/-1">ยังไม่มีแพ็กเกจบริการ กดปุ่มด้านล่างเพื่อเพิ่ม</div>';
        return;
      }
      container.innerHTML = services.map((s, i) => `
        <div class="svc-card" data-index="${i}">
          <button class="svc-remove" onclick="removeService(${i})" title="ลบ">&times;</button>

          <div style="display:flex;gap:12px;margin-bottom:12px;align-items:flex-start">
            <div style="font-size:32px;cursor:pointer" onclick="toggleIconPicker(${i})" id="iconDisplay${i}" title="คลิกเปลี่ยนไอคอน">${s.icon || '📋'}</div>
            <div style="flex:1">
              <div class="form-group" style="margin-bottom:8px">
                <input type="text" value="${esc(s.name)}" onchange="services[${i}].name=this.value" placeholder="ชื่อแพ็กเกจ" style="font-weight:600;font-size:15px">
              </div>
            </div>
          </div>

          <div id="iconPicker${i}" style="display:none;margin-bottom:12px">
            <div class="icon-picker">
              ${ICONS.map(ic => `<button type="button" onclick="setIcon(${i},'${ic}')" class="${s.icon===ic?'selected':''}">${ic}</button>`).join('')}
            </div>
          </div>

          <div class="form-group">
            <label>คำอธิบาย</label>
            <input type="text" value="${esc(s.description||'')}" onchange="services[${i}].description=this.value" placeholder="คำอธิบายสั้น">
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group">
              <label>ราคา (บาท)</label>
              <input type="number" value="${s.price||''}" onchange="services[${i}].price=this.value?Number(this.value):null" placeholder="0">
            </div>
            <div class="form-group">
              <label>หน่วย</label>
              <select onchange="services[${i}].priceLabel=this.value">
                <option value="เดือน" ${s.priceLabel==='เดือน'?'selected':''}>ต่อเดือน</option>
                <option value="ปี" ${s.priceLabel==='ปี'?'selected':''}>ต่อปี</option>
                <option value="ครั้ง" ${s.priceLabel==='ครั้ง'?'selected':''}>ต่อครั้ง</option>
                <option value="" ${!s.priceLabel?'selected':''}>ไม่ระบุ</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>รายละเอียดบริการ</label>
            <div class="svc-features-list" id="features${i}">
              ${(s.features||[]).map((f, fi) => `
                <div class="feat-row">
                  <input type="text" value="${esc(f)}" onchange="services[${i}].features[${fi}]=this.value" placeholder="รายละเอียด">
                  <button type="button" onclick="removeFeature(${i},${fi})">&times;</button>
                </div>
              `).join('')}
            </div>
            <button type="button" onclick="addFeature(${i})" style="margin-top:8px;background:#f0f9ff;color:#0284c7;border:1px solid #bae6fd;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit">+ เพิ่มรายละเอียด</button>
          </div>
        </div>
      `).join('');
    }

    function esc(s) { return s ? s.replace(/"/g, '&quot;').replace(/</g, '&lt;') : ''; }

    function addService() {
      services.push({ name: '', description: '', icon: '📋', price: null, priceLabel: 'เดือน', features: [] });
      renderServices();
      // Scroll to bottom
      setTimeout(() => document.querySelector('.btn-add-svc').scrollIntoView({ behavior: 'smooth' }), 100);
    }

    function removeService(index) {
      if (!confirm('ลบแพ็กเกจ "' + (services[index].name || 'ไม่มีชื่อ') + '"?')) return;
      services.splice(index, 1);
      renderServices();
    }

    function toggleIconPicker(index) {
      const el = document.getElementById('iconPicker' + index);
      el.style.display = el.style.display === 'none' ? '' : 'none';
    }

    function setIcon(index, icon) {
      services[index].icon = icon;
      document.getElementById('iconDisplay' + index).textContent = icon;
      document.getElementById('iconPicker' + index).style.display = 'none';
      renderServices();
    }

    function addFeature(svcIndex) {
      if (!services[svcIndex].features) services[svcIndex].features = [];
      services[svcIndex].features.push('');
      renderServices();
      // Focus new input
      setTimeout(() => {
        const rows = document.querySelectorAll(`#features${svcIndex} .feat-row input`);
        if (rows.length) rows[rows.length-1].focus();
      }, 50);
    }

    function removeFeature(svcIndex, featIndex) {
      services[svcIndex].features.splice(featIndex, 1);
      renderServices();
    }

    // ===== Save =====
    async function saveSettings() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      try {
        // Validate services
        const validServices = services.filter(s => s.name && s.name.trim());
        for (const s of validServices) {
          s.features = (s.features || []).filter(f => f && f.trim());
        }

        const payload = {
          siteName: document.getElementById('siteName').value || null,
          siteDescription: document.getElementById('siteDescription').value || null,
          siteLogoUrl: document.getElementById('siteLogoUrl').value || null,
          contactPhone: document.getElementById('contactPhone').value || null,
          contactLine: document.getElementById('contactLine').value || null,
          contactEmail: document.getElementById('contactEmail').value || null,
          pricingSectionTitle: document.getElementById('pricingTitle').value || null,
          pricingSectionSubtitle: document.getElementById('pricingSubtitle').value || null,
          facebookUrl: document.getElementById('facebookUrl').value || null,
          lineOfficialUrl: document.getElementById('lineOfficialUrl').value || null,
          websiteUrl: document.getElementById('websiteUrl').value || null,
          services: validServices,
        };

        await AdminAPI.put('/site-settings', payload);
        services = validServices;
        renderServices();
        AdminLayout.toast('บันทึกการตั้งค่าสำเร็จ');
      } catch (e) {
        AdminLayout.toast('บันทึกไม่สำเร็จ: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'บันทึกการตั้งค่า';
      }
    }

    // ===== Preview =====
    function previewServices() {
      const validServices = services.filter(s => s.name && s.name.trim());
      if (!validServices.length) {
        AdminLayout.toast('ยังไม่มีแพ็กเกจบริการ', 'warning');
        return;
      }

      const phone = document.getElementById('contactPhone').value;
      const line = document.getElementById('contactLine').value;
      const email = document.getElementById('contactEmail').value;

      let contactHtml = '';
      if (phone || line || email) {
        contactHtml = `<div style="text-align:center;margin-bottom:32px">
          <div style="display:inline-flex;flex-wrap:wrap;gap:24px;align-items:center;background:#f8fafc;padding:16px 32px;border-radius:12px">
            ${phone ? `<span>📞 <strong>${phone}</strong></span>` : ''}
            ${line ? `<span>💬 LINE: <strong>${line}</strong></span>` : ''}
            ${email ? `<span>📧 <strong>${email}</strong></span>` : ''}
          </div>
        </div>`;
      }

      const cols = validServices.length <= 2 ? 2 : 3;
      const cardsHtml = validServices.map((s, i) => {
        const isFeatured = validServices.length === 3 ? i === 1 : i === 0;
        return `<div style="background:#fff;border:2px solid ${isFeatured ? '#6366f1' : '#e2e8f0'};border-radius:16px;padding:32px;text-align:center;${isFeatured ? 'box-shadow:0 8px 24px rgba(99,102,241,.15)' : ''}">
          <div style="font-size:36px;margin-bottom:12px">${s.icon || '📋'}</div>
          <h3 style="margin:0 0 8px;font-size:18px">${s.name}</h3>
          ${s.description ? `<p style="font-size:14px;color:#6b7280;margin:0 0 16px">${s.description}</p>` : ''}
          ${s.price != null ? `<div style="font-size:28px;font-weight:800;color:#6366f1;margin-bottom:8px">฿${Number(s.price).toLocaleString()}<span style="font-size:14px;font-weight:400;color:#9ca3af">${s.priceLabel ? '/' + s.priceLabel : ''}</span></div>` : ''}
          ${s.features && s.features.length ? `<ul style="text-align:left;font-size:13px;color:#4b5563;list-style:none;padding:0;margin:0">${s.features.filter(f=>f).map(f => `<li style="padding:4px 0">✓ ${f}</li>`).join('')}</ul>` : ''}
        </div>`;
      }).join('');

      document.getElementById('previewContent').innerHTML = `
        <div style="text-align:center;margin-bottom:24px">
          <div style="display:inline-block;background:#dcfce7;color:#16a34a;padding:4px 16px;border-radius:9999px;font-size:13px;font-weight:600;margin-bottom:12px">บริการทางบัญชี</div>
          <h2 style="margin:0 0 8px;font-size:28px;font-weight:800">บริการจัดทำบัญชีครบวงจร</h2>
          <p style="color:#6b7280;margin:0">ทีมนักบัญชีผู้เชี่ยวชาญพร้อมดูแลงานบัญชีและภาษีให้คุณ ด้วยระบบ Next Acc</p>
        </div>
        ${contactHtml}
        <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:24px">
          ${cardsHtml}
        </div>
      `;
      document.getElementById('previewModal').style.display = '';
    }

    // ===== Init =====
    loadSettings();
  </script>
</body>
</html>
