<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แชทลูกค้า - NextAcc Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    .ch-grid{display:grid;grid-template-columns:360px 1fr;gap:16px;height:calc(100vh - 180px);min-height:480px}
    .ch-list{overflow-y:auto;border:1px solid #e2e8f0;border-radius:12px;background:#fff}
    .ch-item{padding:12px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}
    .ch-item:hover{background:#f8fafc}
    .ch-item.sel{background:#eff6ff;border-left:3px solid #1e40af}
    .ch-item .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ch-item .m{font-size:11px;color:#94a3b8;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
    .ch-badge{font-size:10px;padding:1px 8px;border-radius:10px;font-weight:700}
    .ch-badge.wait{background:#fee2e2;color:#b91c1c}
    .ch-badge.agent{background:#dcfce7;color:#15803d}
    .ch-badge.ai{background:#e0e7ff;color:#4338ca}
    .ch-badge.closed{background:#f1f5f9;color:#64748b}
    .ch-thread{display:flex;flex-direction:column;border:1px solid #e2e8f0;border-radius:12px;background:#fff;overflow:hidden}
    .ch-msgs{flex:1;overflow-y:auto;padding:16px;background:#f8fafc}
    .ch-msg{margin-bottom:12px;max-width:75%}
    .ch-msg .b{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    .ch-msg.User{margin-left:auto}
    .ch-msg.User .b{background:#1e40af;color:#fff}
    .ch-msg.Assistant .b{background:#fff;border:1px solid #e2e8f0}
    .ch-msg.Agent .b{background:#ecfdf5;border:1px solid #86efac}
    .ch-msg.System .b{background:#fef9c3;border:1px solid #fde68a;font-size:12px}
    .ch-msg .who{font-size:10px;color:#94a3b8;margin-bottom:2px}
    .ch-reply{display:flex;gap:8px;padding:12px;border-top:1px solid #e2e8f0}
    .ch-reply textarea{flex:1;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit;resize:none}
  </style>
</head>
<body>
  <div id="pageContent">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <h2 style="margin:0">💬 แชทลูกค้า</h2>
      <select id="fStatus" onchange="loadList()" style="padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1">
        <option value="">ทุกสถานะ</option>
        <option value="WaitingAgent">⏳ รอเจ้าหน้าที่</option>
        <option value="AgentHandling">🟢 เจ้าหน้าที่ดูแลอยู่</option>
        <option value="AiHandling">🤖 บอทดูแล</option>
        <option value="Closed">ปิดแล้ว</option>
      </select>
      <select id="fChannel" onchange="loadList()" style="padding:6px 10px;border-radius:8px;border:1px solid #cbd5e1">
        <option value="">ทุกช่องทาง</option>
        <option value="Public">หน้าเว็บ (public)</option>
        <option value="Tenant">ในระบบ (tenant)</option>
      </select>
      <button class="admin-btn admin-btn-outline admin-btn-sm" onclick="loadList()">↻ รีเฟรช</button>
      <span style="flex:1"></span>
      <button class="admin-btn admin-btn-outline admin-btn-sm" onclick="refreshKb()"
        title="อ่านไฟล์คู่มือ .md + seed FAQ ใหม่ (เฉพาะชิ้นที่เปลี่ยน)">📚 อัปเดตคลังความรู้</button>
    </div>

    <div class="ch-grid">
      <div class="ch-list" id="chList"><div style="padding:24px;text-align:center;color:#94a3b8">กำลังโหลด…</div></div>
      <div class="ch-thread">
        <div style="padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px">
          <div id="chTitle" style="font-weight:700;flex:1">เลือกห้องสนทนาจากด้านซ้าย</div>
          <button class="admin-btn admin-btn-sm" id="chCloseBtn" style="display:none;background:#64748b;color:#fff"
            onclick="closeConv()">ปิดห้อง</button>
        </div>
        <div class="ch-msgs" id="chMsgs"></div>
        <div class="ch-reply" id="chReply" style="display:none">
          <textarea id="chInput" rows="2" placeholder="พิมพ์คำตอบถึงลูกค้า… (Enter เพื่อส่ง)"></textarea>
          <button class="admin-btn admin-btn-primary" onclick="sendReply()" style="align-self:flex-end">ส่ง</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/admin/admin-api.js"></script>
  <script src="/admin/admin-layout.js"></script>
  <script>
    AdminLayout.init('chats');
    let selId = null, convs = [], pollTimer = null;

    const badge = s => s === 'WaitingAgent' ? '<span class="ch-badge wait">รอเจ้าหน้าที่</span>'
      : s === 'AgentHandling' ? '<span class="ch-badge agent">เจ้าหน้าที่ดูแล</span>'
      : s === 'Closed' ? '<span class="ch-badge closed">ปิดแล้ว</span>'
      : '<span class="ch-badge ai">บอทดูแล</span>';
    const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
    const dt = s => new Date(s).toLocaleString('th-TH', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

    async function loadList() {
      const st = document.getElementById('fStatus').value;
      const ch = document.getElementById('fChannel').value;
      try {
        const res = await AdminAPI.get(`/chats?status=${st}&channel=${ch}&pageSize=50`);
        convs = res.data || [];
        const host = document.getElementById('chList');
        host.innerHTML = convs.length ? convs.map(c => `
          <div class="ch-item ${c.id === selId ? 'sel' : ''}" onclick="openConv('${c.id}')">
            <div class="t">${c.channel === 'Tenant' ? '🏢' : '🌐'} ${esc(c.title || '(ไม่มีหัวข้อ)')}</div>
            <div class="m">
              ${badge(c.status)}
              <span>${c.messageCount} ข้อความ</span>
              <span>${dt(c.lastMessageAt)}</span>
              ${c.visitorName ? `<span>👤 ${esc(c.visitorName)}</span>` : ''}
              ${c.visitorEmail ? `<span>✉️ ${esc(c.visitorEmail)}</span>` : ''}
            </div>
          </div>`).join('')
          : '<div style="padding:24px;text-align:center;color:#94a3b8">ไม่มีห้องสนทนา</div>';
      } catch (e) { AdminLayout.toast(e.message, 'error'); }
    }

    async function openConv(id) {
      selId = id;
      loadList();
      const c = convs.find(x => x.id === id);
      document.getElementById('chTitle').textContent = (c && c.title) || 'ห้องสนทนา';
      document.getElementById('chReply').style.display = (c && c.status !== 'Closed') ? 'flex' : 'none';
      document.getElementById('chCloseBtn').style.display = (c && c.status !== 'Closed') ? '' : 'none';
      await loadMsgs();
      // ห้องที่ยังไม่ปิด → poll เบา ๆ เห็นข้อความลูกค้าใหม่โดยไม่กดรีเฟรช
      if (pollTimer) clearInterval(pollTimer);
      if (c && c.status !== 'Closed') pollTimer = setInterval(loadMsgs, 7000);
    }

    async function loadMsgs() {
      if (!selId) return;
      try {
        const res = await AdminAPI.get(`/chats/${selId}/messages`);
        const host = document.getElementById('chMsgs');
        host.innerHTML = (res.data || []).map(m => `
          <div class="ch-msg ${m.role}">
            <div class="who">${m.role === 'User' ? '👤 ลูกค้า' : m.role === 'Agent' ? '🎧 เจ้าหน้าที่'
              : m.role === 'System' ? 'ℹ️ ระบบ' : (m.usedAi ? '🤖 AI' : '⚙️ บอท (local)')}
              · ${dt(m.createdAt)}
              ${m.helpfulVote === 1 ? '👍' : m.helpfulVote === -1 ? '👎' : ''}</div>
            <div class="b">${esc(m.content)}</div>
          </div>`).join('');
        host.scrollTop = host.scrollHeight;
      } catch (e) { /* poll เงียบ */ }
    }

    async function sendReply() {
      const input = document.getElementById('chInput');
      const text = (input.value || '').trim();
      if (!text || !selId) return;
      try {
        await AdminAPI.post(`/chats/${selId}/reply`, { content: text });
        input.value = '';
        await loadMsgs();
        loadList();
      } catch (e) { AdminLayout.toast(e.message, 'error'); }
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && document.activeElement?.id === 'chInput') {
        e.preventDefault(); sendReply();
      }
    });

    async function closeConv() {
      if (!selId || !confirm('ปิดห้องสนทนานี้?')) return;
      try {
        await AdminAPI.post(`/chats/${selId}/close`, {});
        AdminLayout.toast('ปิดห้องแล้ว');
        if (pollTimer) clearInterval(pollTimer);
        loadList(); openConv(selId);
      } catch (e) { AdminLayout.toast(e.message, 'error'); }
    }

    async function refreshKb() {
      try {
        const res = await AdminAPI.post('/chats/kb/refresh', {});
        AdminLayout.toast(res.message || 'อัปเดตคลังความรู้แล้ว');
      } catch (e) { AdminLayout.toast(e.message, 'error'); }
    }

    loadList();
    setInterval(loadList, 30000);   // list รีเฟรชเบา ๆ — เห็นห้องรอเจ้าหน้าที่ใหม่
  </script>
</body>
</html>
