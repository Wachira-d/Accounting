<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แดชบอร์ด - Admin Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="pageContent">
    <!-- KPI Cards -->
    <div class="admin-kpi-grid" id="kpiGrid">
      <div class="admin-kpi"><div class="admin-kpi-label">กำลังโหลด...</div></div>
    </div>

    <!-- รอบ 250 (WP-02 · คำตัดสิน Y7/Y8/N11): รายการตรวจ go-live — แต่ละข้อตรวจจากข้อมูลจริง (เซิร์ฟเวอร์ตัดสิน · หน้าแสดงอย่างเดียว) -->
    <div class="admin-card" id="goLiveCard">
      <div class="admin-card-header">
        <!-- รอบ 257 ชุด 4 (E-H1): ชื่อการ์ดจากเซิร์ฟเวอร์ (PlatformGoLiveChecklist.CardTitle) — รายการ go-live ตัวเดียว (Omise + LINE OA กลาง) -->
        <div class="admin-card-title" id="goLiveTitle">รายการตรวจ go-live ของแพลตฟอร์ม</div>
        <button class="admin-btn admin-btn-outline admin-btn-sm" id="outboundBtn" onclick="runOutboundCheck()">ทดสอบการเชื่อมต่อขาออก</button>
      </div>
      <div id="goLiveList">กำลังโหลด...</div>
    </div>

    <!-- Charts row -->
    <div class="admin-grid-2">
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">สถานะ Subscription</div>
        </div>
        <div id="subChart" style="min-height:200px"></div>
      </div>
      <div class="admin-card">
        <div class="admin-card-header">
          <div class="admin-card-title">การกระจายแพ็กเกจ</div>
        </div>
        <div id="planChart" style="min-height:200px"></div>
      </div>
    </div>

    <!-- Pending payments -->
    <div class="admin-card">
      <div class="admin-card-header">
        <div class="admin-card-title">การชำระเงินรอตรวจสอบ</div>
        <a href="/admin/payments.html" class="admin-btn admin-btn-outline admin-btn-sm">ดูทั้งหมด</a>
      </div>
      <div id="pendingPayments">กำลังโหลด...</div>
    </div>

    <!-- Recent users -->
    <div class="admin-card">
      <div class="admin-card-header">
        <div class="admin-card-title">ผู้ใช้ลงทะเบียนล่าสุด</div>
        <a href="/admin/users.html" class="admin-btn admin-btn-outline admin-btn-sm">ดูทั้งหมด</a>
      </div>
      <div id="recentUsers">กำลังโหลด...</div>
    </div>

    <!-- System actions -->
    <div class="admin-card">
      <div class="admin-card-header">
        <div class="admin-card-title">System Actions</div>
      </div>
      <div class="admin-flex" style="flex-wrap:wrap;gap:12px">
        <button class="admin-btn admin-btn-outline" onclick="runAction('processExpiredTrials','ประมวลผล Expired Trials')">ประมวลผล Expired Trials</button>
        <button class="admin-btn admin-btn-outline" onclick="runAction('processExpiredSubs','ประมวลผล Expired Subscriptions')">ประมวลผล Expired Subs</button>
        <button class="admin-btn admin-btn-outline" onclick="runAction('processNotifications','ส่งแจ้งเตือน Subscriptions')">ส่งแจ้งเตือน</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin-api.js"></script>
  <script src="/admin/admin-layout.js"></script>
  <script>
    AdminLayout.init('dashboard');

    async function loadDashboard() {
      try {
        const res = await AdminAPI.dashboard();
        const d = res.data;

        // KPI
        const o = d.overview;
        const r = d.revenue;
        const s = d.subscriptions;
        const p = d.payments;
        const ap = d.accountPlans || {};

        document.getElementById('kpiGrid').innerHTML = `
          <div class="admin-kpi">
            <div class="admin-kpi-label">MRR (รายได้รายเดือน)</div>
            <div class="admin-kpi-value">${AdminLayout.money(r.mrr)}</div>
            <div class="admin-kpi-sub">ARR: ${AdminLayout.money(r.arr)}</div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">รายได้เดือนนี้</div>
            <div class="admin-kpi-value">${AdminLayout.money(r.revenueThisMonth)}</div>
            <div class="admin-kpi-sub">เดือนที่แล้ว: ${AdminLayout.money(r.revenueLastMonth)}
              <span class="${r.revenueGrowthPercent >= 0 ? 'up' : 'down'}">${r.revenueGrowthPercent >= 0 ? '+' : ''}${r.revenueGrowthPercent}%</span>
            </div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">ผู้ใช้ทั้งหมด</div>
            <div class="admin-kpi-value">${o.totalUsers.toLocaleString()}</div>
            <div class="admin-kpi-sub">ใหม่เดือนนี้: +${o.newUsersThisMonth}
              <span class="${o.userGrowthPercent >= 0 ? 'up' : 'down'}">${o.userGrowthPercent >= 0 ? '+' : ''}${o.userGrowthPercent}%</span>
            </div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">บริษัททั้งหมด</div>
            <div class="admin-kpi-value">${o.totalCompanies.toLocaleString()}</div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">Subscription Active</div>
            <div class="admin-kpi-value" style="color:var(--admin-success)">${s.active}</div>
            <div class="admin-kpi-sub">จากทั้งหมด ${s.total} รายการ</div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">ทดลองใช้ (Trial)</div>
            <div class="admin-kpi-value" style="color:var(--admin-primary)">${s.trial}</div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">Expired / Cancelled</div>
            <div class="admin-kpi-value" style="color:var(--admin-danger)">${s.expired + s.cancelled}</div>
          </div>
          <div class="admin-kpi">
            <div class="admin-kpi-label">ชำระเงินรอตรวจ</div>
            <div class="admin-kpi-value" style="color:var(--admin-warning)">${p.pendingReview}</div>
            <div class="admin-kpi-sub">อนุมัติเดือนนี้: ${p.approvedThisMonth}</div>
          </div>
          <div class="admin-kpi" onclick="location.href='/admin/account-subscriptions.html'" style="cursor:pointer;border:2px solid #67e8f9">
            <div class="admin-kpi-label">🎫 Account Plans (User License)</div>
            <div class="admin-kpi-value" style="color:#0c4a6e">${(ap.active||0)+(ap.trial||0)}</div>
            <div class="admin-kpi-sub">Active ${ap.active||0} · Trial ${ap.trial||0} · ${ap.companiesUnderAccount||0} บริษัทใต้ Plan · MRR ${AdminLayout.money(ap.mrr||0)}</div>
          </div>
          ${(ap.expiringIn7d||0) > 0 ? `
          <div class="admin-kpi" onclick="location.href='/admin/account-subscriptions.html'" style="cursor:pointer;background:#fef3c7;border:2px solid #fbbf24">
            <div class="admin-kpi-label" style="color:#92400e">⏰ Account Plan ใกล้หมดอายุ</div>
            <div class="admin-kpi-value" style="color:#dc2626">${ap.expiringIn7d}</div>
            <div class="admin-kpi-sub" style="color:#78350f">ภายใน 7 วัน — แจ้งลูกค้าให้ต่อ</div>
          </div>` : ''}
        `;

        // Subscription chart (simple bar)
        document.getElementById('subChart').innerHTML = renderBarChart([
          { label: 'Active', value: s.active, color: '#22c55e' },
          { label: 'Trial', value: s.trial, color: '#6366f1' },
          { label: 'Expired', value: s.expired, color: '#ef4444' },
          { label: 'Cancelled', value: s.cancelled, color: '#94a3b8' },
        ]);

        // Plan distribution
        document.getElementById('planChart').innerHTML = d.planDistribution.length > 0
          ? renderBarChart(d.planDistribution.map(p => ({
              label: p.plan, value: p.count,
              color: { FreeTrial: '#94a3b8', Basic: '#3b82f6', Pro: '#7c3aed', Enterprise: '#f59e0b' }[p.plan] || '#6366f1'
            })))
          : '<div style="text-align:center;color:#94a3b8;padding:40px">ยังไม่มีข้อมูล</div>';

        // Recent users
        if (d.recentUsers && d.recentUsers.length > 0) {
          document.getElementById('recentUsers').innerHTML = `
            <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>ชื่อ</th><th>อีเมล</th><th>สถานะ</th><th>สมัครเมื่อ</th><th>เข้าใช้ล่าสุด</th></tr></thead>
              <tbody>
                ${d.recentUsers.map(u => `
                  <tr>
                    <td><strong>${AdminLayout.esc(u.fullName)}</strong>${u.isSystemAdmin ? ' <span class="admin-badge-sm bg-purple">Admin</span>' : ''}</td>
                    <td>${AdminLayout.esc(u.email)}</td>
                    <td>${AdminLayout.statusBadge(u.status)}</td>
                    <td>${AdminLayout.date(u.createdAt)}</td>
                    <td>${AdminLayout.datetime(u.lastLoginAt)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            </div>
          `;
        } else {
          document.getElementById('recentUsers').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px">ยังไม่มีผู้ใช้</div>';
        }

        // Pending payments placeholder
        document.getElementById('pendingPayments').innerHTML = p.pendingReview > 0
          ? `<div style="text-align:center;padding:20px"><a href="/admin/payments.html" class="admin-btn admin-btn-primary">ตรวจสอบ ${p.pendingReview} รายการ</a></div>`
          : '<div style="text-align:center;color:#94a3b8;padding:20px">ไม่มีรายการรอตรวจสอบ</div>';

      } catch (err) {
        document.getElementById('kpiGrid').innerHTML = `<div class="admin-kpi"><div style="color:var(--admin-danger)">${AdminLayout.esc(err.message)}</div></div>`;
      }
    }

    function renderBarChart(items) {
      const max = Math.max(...items.map(i => i.value), 1);
      return `<div style="display:flex;align-items:flex-end;gap:16px;height:180px;padding:10px 0">
        ${items.map(i => `
          <div style="flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%">
            <div style="font-weight:700;font-size:18px;margin-bottom:4px">${AdminLayout.esc(i.value)}</div>
            <div style="background:${i.color};border-radius:6px 6px 0 0;height:${AdminLayout.esc(Math.max(i.value / max * 120, 4))}px;transition:height .5s"></div>
            <div style="font-size:12px;color:#64748b;margin-top:6px">${AdminLayout.esc(i.label)}</div>
          </div>
        `).join('')}
      </div>`;
    }

    // รอบ 250: การ์ด go-live — ป้าย/ลิงก์/ข้อความทั้งหมดมาจากเซิร์ฟเวอร์ (PlatformGoLiveChecklist)
    function renderGoLive(r) {
      const icon = { Ok: '✅', Fail: '❌', Manual: '📝', Unknown: '❔' };
      const color = { Ok: '#166534', Fail: '#b91c1c', Manual: '#475569', Unknown: '#92400e' };
      const rows = (r.items || []).map(i => `
        <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f1f5f9">
          <div style="width:22px">${icon[i.status] || '•'}</div>
          <div style="flex:1">
            <div style="font-weight:600;color:${color[i.status] || '#0f172a'}">${AdminLayout.esc(i.no)}. ${AdminLayout.esc(i.title)}</div>
            ${i.why ? `<div style="font-size:12px;color:#64748b;margin-top:2px">${AdminLayout.esc(i.why)}</div>` : ''}
          </div>
          ${i.fixUrl && i.status !== 'Ok' ? `<a class="admin-btn admin-btn-outline admin-btn-sm" href="${AdminLayout.esc(i.fixUrl)}">${AdminLayout.esc(i.fixLabel || 'ไปแก้')}</a>` : ''}
        </div>`).join('');
      document.getElementById('goLiveList').innerHTML = `
        <div style="font-size:13px;margin-bottom:6px">ผ่าน ${AdminLayout.esc(r.doneCount)} ข้อ · ยังไม่ผ่าน <b style="color:#b91c1c">${AdminLayout.esc(r.failCount)}</b> ข้อ</div>
        ${rows}
        <div style="font-size:12px;color:#475569;margin-top:8px">ℹ️ ${AdminLayout.esc(r.bankFeedNote || '')}</div>`;
      const ttl = document.getElementById('goLiveTitle');
      if (ttl && r.title) ttl.textContent = r.title;
      const card = document.getElementById('goLiveCard');
      if (card) card.style.borderLeft = (r.failCount || 0) > 0 ? '4px solid #ef4444' : '4px solid #22c55e';
    }

    async function loadGoLive() {
      try {
        const res = await AdminAPI.goLiveChecklist();
        renderGoLive(res.data || {});
      } catch (err) {
        document.getElementById('goLiveList').innerHTML = `<div style="color:var(--admin-danger)">โหลดรายการตรวจไม่สำเร็จ: ${AdminLayout.esc(err.message)}</div>`;
      }
    }

    async function runOutboundCheck() {
      const btn = document.getElementById('outboundBtn');
      if (btn) btn.disabled = true;
      try {
        const res = await AdminAPI.goLiveOutboundCheck();
        renderGoLive(res.data || {});
        const ob = ((res.data && res.data.items) || []).find(i => i.code === 'OUTBOUND');
        AdminLayout.toast(res.message || 'ทดสอบแล้ว', ob && ob.status === 'Fail' ? 'error' : undefined);
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function runAction(method, label) {
      if (!confirm(`ต้องการ ${AdminLayout.esc(label)}?`)) return;
      try {
        await AdminAPI[method]();
        AdminLayout.toast(`${AdminLayout.esc(label)} สำเร็จ`);
        loadDashboard();
      } catch (err) {
        AdminLayout.toast(err.message, 'error');
      }
    }

    loadDashboard();
    loadGoLive();
  </script>
</body>
</html>
