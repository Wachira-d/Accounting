<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการเช็ค — Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
    .b-Issued { background:#fef3c7; color:#92400e; }
    .b-Cleared { background:#dcfce7; color:#15803d; }
    .b-Bounced { background:#fee2e2; color:#dc2626; }
    .b-Voided { background:#f1f5f9; color:#64748b; }
    .b-DepositedPending { background:#dbeafe; color:#1e40af; }
  </style>
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div>
        <h2 class="page-title">จัดการเช็ค</h2>
        <p class="page-subtitle">เปิดเล่มเช็ค · ออกเช็คจ่าย · บันทึกเช็ครับ · ติดตามเช็คคงค้าง</p>
      </div>
    </div>

    <div class="tabs" style="margin-bottom:20px">
      <button class="tab-btn active" onclick="Page.switchTab('outstanding')">เช็คคงค้าง</button>
      <button class="tab-btn" onclick="Page.switchTab('books')">เล่มเช็ค</button>
      <button class="tab-btn" onclick="Page.switchTab('issue')">ออกเช็คใหม่</button>
    </div>

    <div id="tabOutstanding" class="card">
      <div class="card-header" style="display:flex;align-items:center;gap:12px">
        <h3 class="card-title" style="margin:0;flex:1">เช็คคงค้าง</h3>
        <button class="btn btn-primary" onclick="Page.loadOutstanding()">รีเฟรช</button>
        <span id="chequeExportSlot"></span>
      </div>
      <div class="table-container">
        <table class="data-table">
          <thead><tr>
            <th>เลขที่</th><th>วันที่</th><th style="text-align:right">จำนวน</th>
            <th>ผู้รับ/ผู้ออก</th><th>ทิศทาง</th><th>สถานะ</th><th>การจัดการ</th>
          </tr></thead>
          <tbody id="outstandingBody">
            <tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8">กด รีเฟรช เพื่อโหลด</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="tabBooks" class="card hidden">
      <div class="card-header" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h3 class="card-title" style="margin:0;flex:1">เปิดเล่มเช็คใหม่</h3>
      </div>
      <div style="padding:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px">
        <div><label>บัญชีธนาคาร</label><select id="bookBank" class="form-input"></select></div>
        <div><label>เลขเล่ม</label><input id="bookNumber" class="form-input"></div>
        <div><label>เลขเริ่มต้น</label><input id="bookStart" type="number" class="form-input"></div>
        <div><label>เลขสุดท้าย</label><input id="bookEnd" type="number" class="form-input"></div>
      </div>
      <div style="padding:0 18px 18px">
        <button class="btn btn-primary" onclick="Page.openBook()">เปิดเล่ม</button>
      </div>
    </div>

    <div id="tabIssue" class="card hidden">
      <div class="card-header"><h3 class="card-title">ออกเช็คใหม่ (Outbound)</h3></div>
      <div style="padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:760px">
        <div><label>เล่มเช็ค</label><select id="issueBook" class="form-input"></select></div>
        <div><label>ผู้รับ (Contact)</label><input type="hidden" id="issueContactId"><input type="text" id="issueContact" class="form-input"></div>
        <div><label>วันที่</label><input id="issueDate" type="date" class="form-input"></div>
        <div><label>จำนวนเงิน</label><input id="issueAmount" type="number" step="0.01" min="0" class="form-input"></div>
        <div><label>โครงการ (optional)</label><select id="issueProject" class="form-input"><option value="">— ไม่ระบุ —</option></select></div>
        <div style="grid-column:1/-1"><label>หมายเหตุ</label><textarea id="issueNotes" rows="2" class="form-input"></textarea></div>
      </div>
      <div style="padding:0 18px 18px">
        <button class="btn btn-primary" onclick="Page.issueOutbound()">ออกเช็ค</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/export.js"></script>
  <script>
    const Page = {
      async init() {
        if (!Layout.init('cheques')) return;
        Layout.setTitle('จัดการเช็ค');
        document.getElementById('issueDate').value = Layout.toDateInput(new Date());
        await this.loadBanks();
        await this.loadBooks();
        await this.loadProjects();
        await this.loadContacts();
        const slot = document.getElementById('chequeExportSlot');
        if (slot) slot.innerHTML = ExportUtil.renderButtons('(f)=>Page.exportOutstanding(f)');
        await this.loadOutstanding();
      },

      // ชื่อผู้รับในตารางเช็คค้าง (แสดงผลอย่างเดียว — ช่องเลือกผู้รับใช้ตัวเลือกกลาง Layout.contactPicker)
      _contacts: [],
      async loadContacts() {
        if (!this._issuePicker)
          this._issuePicker = Layout.contactPicker('issueContact', 'issueContactId', {
            side: 'supplier', placeholder: 'พิมพ์ชื่อหรือเลขผู้เสียภาษีของผู้รับเช็ค...',
            // ผู้รับที่เพิ่งเลือก/สร้าง → ใส่ในตารางชื่อด้วย (ตารางเช็คค้างโชว์ชื่อได้ทันทีหลังออกเช็ค)
            onSelect: (c) => { if (c && !this._contacts.some(x => x.id === c.id)) this._contacts.push(c); },
          });
        try {
          const cid = Layout.getCompanyId(); if (!cid) return;
          const r = await API.get(`/api/companies/${cid}/document/contacts?pageSize=200`);
          this._contacts = r.data?.items || r.data || [];
        } catch (e) {
          Layout.toast('โหลดชื่อผู้รับสำหรับตารางเช็คไม่สำเร็จ: ' + (e.message || '') + ' — ตารางจะแสดงรหัสแทนชื่อ', 'warning', 7000);
        }
      },
      _statusLabel(st) { return ({ Issued: 'ออกแล้ว', DepositedPending: 'รอเรียกเก็บ', Cleared: 'ขึ้นเงินแล้ว', Bounced: 'เช็คคืน', Voided: 'ยกเลิกแล้ว' })[st] || st; },
      _contactName(id) { const c = this._contacts.find(x => x.id === id); return c ? c.name : (id ? id.toString().slice(0,8)+'…' : '-'); },

      async loadProjects() {
        try {
          const cid = Layout.getCompanyId();
          if (!cid) return;
          const r = await API.get(`/api/companies/${cid}/projects?active=true&pageSize=200`);
          const items = r.data?.items || r.data || [];
          const sel = document.getElementById('issueProject');
          const opts = items.map(p =>
            `<option value="${p.id}">${(p.code || p.projectNumber || '') + ' ' + (p.name || '')}</option>`).join('');
          sel.innerHTML = '<option value="">— ไม่ระบุ —</option>' + opts;
        } catch (e) { /* ignore */ }
      },

      switchTab(t) {
        const tabs = ['outstanding','books','issue'];
        document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', tabs[i]===t));
        ['Outstanding','Books','Issue'].forEach(n =>
          document.getElementById('tab'+n).classList.toggle('hidden', n.toLowerCase()!==t));
      },

      _fmt(n) { return (n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },

      // 2026-10-14 (ทีม F1 · PAYMENT_CHANNEL_AUDIT ส่วนที่ 1 ข้อ 2): เดิมเรียก `api.get(...)` ซึ่งไม่มีบน Layout.api() แล้วกลืน error ⇒
      // รายการบัญชีว่างตลอด → ส่ง bankAccountId "" → 400 เปิดเล่มเช็คไม่ได้เลย · ตอนนี้ใช้ getBankAccounts() + แจ้งดังเมื่อโหลดไม่ได้
      async loadBanks() {
        const sel = document.getElementById('bookBank');
        try {
          const api = Layout.api(); if (!api) return;
          const r = await api.getBankAccounts();
          const banks = (r.data || []).filter(b => b.isActive !== false);
          // เช็คออกได้เฉพาะบัญชีกระแสรายวัน — เรียงขึ้นก่อนและติดป้ายประเภทให้เห็นชัด
          const typeLabel = t => t === 'Current' ? 'กระแสรายวัน' : t === 'Savings' ? 'ออมทรัพย์' : t === 'Fixed' ? 'ฝากประจำ' : (t || '');
          banks.sort((a, b) => (a.accountType === 'Current' ? 0 : 1) - (b.accountType === 'Current' ? 0 : 1));
          const opt = banks.map(b => `<option value="${Layout.esc(b.id)}">${Layout.esc(b.accountName)} (${Layout.esc(b.bankName)}${b.accountType ? ' · ' + Layout.esc(typeLabel(b.accountType)) : ''})</option>`).join('');
          sel.innerHTML = opt
            ? '<option value="">— เลือกบัญชีธนาคาร —</option>' + opt
            : '<option value="">ยังไม่มีบัญชีธนาคาร — เพิ่มที่หน้า “บัญชีธนาคาร” ก่อน</option>';
        } catch (e) {
          sel.innerHTML = '<option value="">โหลดบัญชีธนาคารไม่สำเร็จ — รีเฟรชหน้า</option>';
          Layout.toast('โหลดรายการบัญชีธนาคารไม่สำเร็จ: ' + e.message, 'error');
        }
      },

      // เล่มเช็คที่ยังมีใบเหลือ — เดิมไม่มี endpoint ⇒ รีเฟรชหน้าแล้วเล่มที่เปิดไว้หายจากตัวเลือก “เล่มเช็ค”
      async loadBooks() {
        const sel = document.getElementById('issueBook');
        try {
          const cid = Layout.getCompanyId(); if (!cid) return;
          const r = await API.get(`/api/companies/${cid}/cheques/books`);
          const books = r.data || [];
          sel.innerHTML = books.length
            ? '<option value="">— เลือกเล่มเช็ค —</option>' + books.map(b =>
                `<option value="${Layout.esc(b.id)}">${Layout.esc(b.bookNumber)} (${b.nextNumber}-${b.endChequeNumber}) · ${Layout.esc(b.bankLabel)}</option>`).join('')
            : '<option value="">ยังไม่มีเล่มเช็คที่ใช้ได้ — เปิดเล่มที่แท็บ “เล่มเช็ค”</option>';
        } catch (e) {
          sel.innerHTML = '<option value="">โหลดเล่มเช็คไม่สำเร็จ — รีเฟรชหน้า</option>';
          Layout.toast('โหลดเล่มเช็คไม่สำเร็จ: ' + e.message, 'error');
        }
      },

      async openBook() {
        const api = Layout.api(); if (!api) return;
        const bankAccountId = document.getElementById('bookBank').value;
        if (!bankAccountId) { Layout.toast('เลือก “บัญชีธนาคาร” ของเล่มเช็ค', 'error'); return; }
        const body = {
          bankAccountId,
          bookNumber: document.getElementById('bookNumber').value,
          startNumber: +document.getElementById('bookStart').value,
          endNumber: +document.getElementById('bookEnd').value,
        };
        try {
          const cid = Layout.getCompanyId();
          const r = await API.post(`/api/companies/${cid}/cheques/books`, body);
          Layout.toast(r.message || 'เปิดเล่มเช็คแล้ว');
          await this.loadBooks();
          document.getElementById('issueBook').value = r.data.id;
        } catch (e) { Layout.toast(e.message, 'error'); }
      },

      async issueOutbound() {
        const cid = Layout.getCompanyId();
        const chequeBookId = document.getElementById('issueBook').value;
        if (!chequeBookId) { Layout.toast('เลือก “เล่มเช็ค” (หรือเปิดเล่มที่แท็บ “เล่มเช็ค”)', 'error'); return; }
        const body = {
          chequeBookId,
          contactId: document.getElementById('issueContactId').value || null,
          chequeDate: document.getElementById('issueDate').value,
          amount: +document.getElementById('issueAmount').value,
          paymentId: null,
          notes: document.getElementById('issueNotes').value,
          projectId: document.getElementById('issueProject').value || null,
        };
        try {
          const r = await API.post(`/api/companies/${cid}/cheques/outbound`, body);
          Layout.toast(r.message);
          await this.loadBooks();
          await this.loadOutstanding();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },

      // ส่งออกเช็คคงค้าง (2026-10-14 ทีม X3 — เดิมไม่มีปุ่มส่งออก) · ยอดเป็นตัวเลขจริง · วันที่ ISO (ค.ศ.) เรียงได้ใน Excel
      exportOutstanding(format) {
        ExportUtil.exportData(format, {
          rows: this._outRows || [],
          columns: [
            { key: 'chequeNumber', label: 'เลขที่เช็ค' },
            { key: 'chequeDate', label: 'วันที่เช็ค', format: v => v ? Layout.toDateInput(new Date(v)) : '' },
            { key: 'amount', label: 'จำนวนเงิน', align: 'right', format: v => Number(v || 0) },
            { key: 'contactId', label: 'ผู้ติดต่อ', format: v => this._contactName(v) },
            { key: 'isInbound', label: 'ทิศทาง', format: v => v ? 'รับ' : 'จ่าย' },
            { key: 'status', label: 'สถานะ', format: v => this._statusLabel(v) },
          ],
          filename: 'เช็คคงค้าง', title: 'เช็คคงค้าง', landscape: false,
        });
      },
      async loadOutstanding() {
        const tbody = document.getElementById('outstandingBody');
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px">กำลังโหลด...</td></tr>';
        try {
          const cid = Layout.getCompanyId();
          const r = await API.get(`/api/companies/${cid}/cheques/outstanding`);
          const rows = r.data || [];
          this._outRows = rows;   // ทั้งรายการจาก /cheques/outstanding (ไม่แบ่งหน้า) — ไฟล์ส่งออกใช้ชุดเดียวกับที่ตารางแสดง
          if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#94a3b8">ไม่มีเช็คคงค้าง</td></tr>';
            return;
          }
          tbody.innerHTML = rows.map(c => `<tr>
            <td><b>${c.chequeNumber}</b></td>
            <td>${new Date(c.chequeDate).toLocaleDateString('th-TH')}</td>
            <td style="text-align:right">${this._fmt(c.amount)}</td>
            <td>${Layout.esc(this._contactName(c.contactId))}</td>
            <td>${c.isInbound ? '⬇️ รับ' : '⬆️ จ่าย'}</td>
            <td><span class="badge b-${Layout.esc(c.status)}">${Layout.esc(this._statusLabel(c.status))}</span></td>
            <td>
              <button class="btn btn-sm btn-success" onclick="Page.clearCheque('${c.id}')">ผ่านแล้ว</button>
              <button class="btn btn-sm btn-danger" onclick="Page.bounceCheque('${c.id}')">คืน</button>
            </td>
          </tr>`).join('');
        } catch (e) {
          tbody.innerHTML = `<tr><td colspan="7" style="color:#dc2626;text-align:center;padding:30px">${Layout.esc(e.message)}</td></tr>`;
        }
      },

      async clearCheque(id) {
        const cid = Layout.getCompanyId();
        try {
          await API.post(`/api/companies/${cid}/cheques/${id}/clear`, { clearedAt: new Date().toISOString() });
          Layout.toast('อัปเดตเช็คผ่านแล้ว');
          await this.loadOutstanding();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },

      async bounceCheque(id) {
        const reason = prompt('เหตุผลที่เช็คคืน');
        if (!reason) return;
        const cid = Layout.getCompanyId();
        try {
          await API.post(`/api/companies/${cid}/cheques/${id}/bounce`, { reason });
          Layout.toast('บันทึกเช็คคืนแล้ว');
          await this.loadOutstanding();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
    };
    Page.init();
  </script>
</body>
</html>
