<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เบิกค่าใช้จ่าย - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">เบิกค่าใช้จ่าย</h2><p class="page-subtitle">จัดการใบเบิกค่าใช้จ่ายพนักงาน</p></div>
      <button class="btn btn-primary" onclick="Page.openCreate()">+ สร้างใบเบิก</button>
    </div>
    <div class="toolbar">
      <input type="text" class="search-input" placeholder="ค้นหา..." id="searchInput" oninput="Page.load()">
      <select class="filter-select" id="statusFilter" onchange="Page.load()">
        <option value="">ทุกสถานะ</option>
        <option value="Draft">ร่าง</option>
        <option value="Submitted">ส่งแล้ว</option>
        <option value="Approved">อนุมัติ</option>
        <option value="Rejected">ปฏิเสธ</option>
        <option value="Paid">จ่ายแล้ว</option>
      </select>
    </div>
    <div class="table-container">
      <table class="table">
        <thead><tr><th>เลขที่</th><th>หัวข้อ</th><th data-i18n="common.date">วันที่</th><th>ผู้เบิก</th><th class="text-right">ยอดรวม</th><th data-i18n="common.status">สถานะ</th><th data-i18n="common.manage">จัดการ</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="7" class="text-center text-gray-400" style="padding:40px" data-i18n="common.loading">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
    <div id="pagination"></div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="formModal">
      <div class="modal" style="max-width:750px">
        <div class="modal-header"><h3 class="modal-title" id="formTitle">สร้างใบเบิกค่าใช้จ่าย</h3><button class="modal-close" onclick="Layout.closeModal('formModal')">&times;</button></div>
        <div class="modal-body">
          <input type="hidden" id="fId">
          <div class="form-group"><label class="form-label">หัวข้อ *</label><input type="text" class="form-input" id="fTitle"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">วันที่ *</label><input type="date" class="form-input" id="fDate"></div>
            <div class="form-group"><label class="form-label" data-i18n="common.description">คำอธิบาย</label><input type="text" class="form-input" id="fDesc"></div>
          </div>
          <div style="margin-top:16px">
            <div class="flex items-center justify-between" style="margin-bottom:8px">
              <label class="form-label" style="margin:0" data-i18n="common.items">รายการ</label>
              <button class="btn btn-sm btn-secondary" onclick="Page.addLine()">+ เพิ่ม</button>
            </div>
            <div class="table-container"><table class="table">
              <thead><tr><th data-i18n="common.detail">รายละเอียด</th><th data-i18n="common.amount">จำนวนเงิน</th><th>VAT%</th><th>WHT%</th><th></th></tr></thead>
              <tbody id="linesBody"></tbody>
            </table></div>
            <div class="text-right font-semibold" style="margin-top:8px">รวม: <span id="fTotal">0.00</span> บาท</div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="Layout.closeModal('formModal')" data-i18n="common.cancel">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.save()" data-i18n="common.save">บันทึก</button>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal" style="max-width:750px">
        <div class="modal-header"><h3 class="modal-title">รายละเอียดใบเบิก</h3><button class="modal-close" onclick="Layout.closeModal('detailModal')">&times;</button></div>
        <div class="modal-body" id="detailContent"></div>
        <div class="modal-footer" id="detailFooter"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      page: 1,
      async init() {
        if (!Layout.init('expense')) return;
        Layout.setTitle('เบิกค่าใช้จ่าย');
        await this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        const status = document.getElementById('statusFilter').value;
        const search = document.getElementById('searchInput').value;
        let q = `?page=${this.page}&pageSize=20`;
        if (status) q += `&status=${status}`;
        if (search) q += `&search=${encodeURIComponent(search)}`;
        try {
          const res = await api.getExpenseClaims(q);
          const data = res.data; const items = data?.items || data || [];
          const tbody = document.getElementById('tableBody');
          if (!items.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-gray-400" style="padding:40px" data-i18n="common.noItems">ไม่มีรายการ</td></tr>'; return; }
          tbody.innerHTML = items.map(e => `<tr>
            <td class="font-medium">${Layout.esc(e.claimNumber)}</td>
            <td>${Layout.esc(e.title)}</td>
            <td>${Layout.date(e.expenseDate)}</td>
            <td>${Layout.esc(e.submittedByName || '-')}</td>
            <td class="text-right font-semibold">${Layout.money(e.totalAmount)}</td>
            <td>${Layout.statusBadge(e.status)}</td>
            <td>
              <button class="btn btn-sm btn-ghost" onclick="Page.viewDetail('${e.id}')" data-i18n="common.view">ดู</button>
              ${e.status === 'Draft' ? `<button class="btn btn-sm btn-ghost" onclick="Page.openEdit('${e.id}')" data-i18n="common.edit">แก้ไข</button>` : ''}
            </td>
          </tr>`).join('');
          const totalPages = data?.totalPages || 1;
          document.getElementById('pagination').innerHTML = Layout.renderPagination(this.page, totalPages, 'Page.goPage');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      goPage(p) { Page.page = p; Page.load(); },
      addLine() {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><input type="text" class="form-input" data-f="desc" style="font-size:13px"></td>
          <td><input type="number" class="form-input text-right" data-f="amt" step="0.01" oninput="Page.calcTotal()"></td>
          <td><select class="form-select" data-f="vat" style="font-size:13px" onchange="Page.calcTotal()"><option value="7">7%</option><option value="0">0%</option></select></td>
          <td><input type="number" class="form-input text-right" data-f="wht" value="0" step="0.01" oninput="Page.calcTotal()"></td>
          <td><button class="btn btn-sm btn-ghost text-danger" onclick="this.closest('tr').remove();Page.calcTotal()">✕</button></td>`;
        document.getElementById('linesBody').appendChild(row);
      },
      calcTotal() {
        let total = 0;
        document.querySelectorAll('#linesBody tr').forEach(row => {
          const amt = parseFloat(row.querySelector('[data-f="amt"]')?.value) || 0;
          const vat = parseFloat(row.querySelector('[data-f="vat"]')?.value) || 0;
          const wht = parseFloat(row.querySelector('[data-f="wht"]')?.value) || 0;
          total += amt + (amt * vat / 100) - (amt * wht / 100);
        });
        document.getElementById('fTotal').textContent = Layout.money(total);
      },
      openCreate() {
        document.getElementById('formTitle').textContent = 'สร้างใบเบิกค่าใช้จ่าย';
        document.getElementById('fId').value = '';
        document.getElementById('fTitle').value = '';
        document.getElementById('fDate').value = Layout.toDateInput(new Date());
        document.getElementById('fDesc').value = '';
        document.getElementById('linesBody').innerHTML = '';
        document.getElementById('fTotal').textContent = '0.00';
        this.addLine();
        Layout.openModal('formModal');
      },
      async openEdit(id) {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getExpenseClaim(id);
          const e = res.data;
          document.getElementById('formTitle').textContent = 'แก้ไขใบเบิก';
          document.getElementById('fId').value = e.id;
          document.getElementById('fTitle').value = e.title;
          document.getElementById('fDate').value = Layout.dateInput(e.expenseDate);
          document.getElementById('fDesc').value = e.description || '';
          document.getElementById('linesBody').innerHTML = '';
          (e.lines || []).forEach(l => {
            this.addLine();
            const row = document.getElementById('linesBody').lastElementChild;
            row.querySelector('[data-f="desc"]').value = l.description || '';
            row.querySelector('[data-f="amt"]').value = l.amount || 0;
            row.querySelector('[data-f="vat"]').value = l.vatRate || 0;
            row.querySelector('[data-f="wht"]').value = l.withholdingTaxRate || 0;
          });
          if (!e.lines?.length) this.addLine();
          this.calcTotal();
          Layout.openModal('formModal');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      getLines() {
        const lines = [];
        document.querySelectorAll('#linesBody tr').forEach(row => {
          const amt = parseFloat(row.querySelector('[data-f="amt"]').value) || 0;
          const vatR = parseFloat(row.querySelector('[data-f="vat"]').value) || 0;
          const whtR = parseFloat(row.querySelector('[data-f="wht"]').value) || 0;
          lines.push({
            description: row.querySelector('[data-f="desc"]').value,
            amount: amt, vatRate: vatR, vatAmount: amt * vatR / 100,
            withholdingTaxRate: whtR, withholdingTaxAmount: amt * whtR / 100,
            netAmount: amt + amt * vatR / 100 - amt * whtR / 100,
          });
        });
        return lines;
      },
      async save() {
        const api = Layout.api(); if (!api) return;
        const id = document.getElementById('fId').value;
        const data = {
          title: document.getElementById('fTitle').value,
          description: document.getElementById('fDesc').value || null,
          expenseDate: document.getElementById('fDate').value,
          lines: this.getLines()
        };
        try {
          if (id) { await api.updateExpenseClaim(id, data); }
          else { await api.createExpenseClaim(data); }
          Layout.closeModal('formModal'); Layout.toast(id ? 'แก้ไขสำเร็จ' : 'สร้างใบเบิกสำเร็จ'); await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      async viewDetail(id) {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getExpenseClaim(id);
          const e = res.data;
          document.getElementById('detailContent').innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
              <div><div class="text-xs text-gray-500">เลขที่</div><div class="font-medium">${Layout.esc(e.claimNumber)}</div></div>
              <div><div class="text-xs text-gray-500" data-i18n="common.status">สถานะ</div><div>${Layout.statusBadge(e.status)}</div></div>
              <div><div class="text-xs text-gray-500">หัวข้อ</div><div>${Layout.esc(e.title)}</div></div>
              <div><div class="text-xs text-gray-500" data-i18n="common.date">วันที่</div><div>${Layout.date(e.expenseDate)}</div></div>
              <div><div class="text-xs text-gray-500">ผู้เบิก</div><div>${Layout.esc(e.submittedByName || '-')}</div></div>
              <div><div class="text-xs text-gray-500">ยอดรวม</div><div class="font-semibold text-lg">${Layout.money(e.totalAmount)}</div></div>
            </div>
            ${e.description ? `<div style="padding:12px;background:var(--gray-50);border-radius:8px;margin-bottom:16px"><div class="text-xs text-gray-500" data-i18n="common.description">คำอธิบาย</div><div>${Layout.esc(e.description)}</div></div>` : ''}
            <div class="table-container"><table class="table">
              <thead><tr><th data-i18n="common.detail">รายละเอียด</th><th class="text-right" data-i18n="common.amount">จำนวนเงิน</th><th class="text-right">VAT</th><th class="text-right">WHT</th><th class="text-right">สุทธิ</th></tr></thead>
              <tbody>${(e.lines || []).map(l => `<tr>
                <td>${Layout.esc(l.description)}</td>
                <td class="text-right">${Layout.money(l.amount)}</td>
                <td class="text-right">${Layout.money(l.vatAmount)}</td>
                <td class="text-right">${Layout.money(l.withholdingTaxAmount)}</td>
                <td class="text-right font-semibold">${Layout.money(l.netAmount)}</td>
              </tr>`).join('')}</tbody>
            </table></div>
            ${e.rejectionReason ? `<div style="margin-top:12px;padding:12px;background:#FEF2F2;border-radius:8px"><div class="text-xs text-danger">เหตุผลที่ปฏิเสธ</div><div>${Layout.esc(e.rejectionReason)}</div></div>` : ''}
            ${e.paymentVoucherDocumentId ? `<div style="margin-top:12px;padding:12px;background:#EFF6FF;border-radius:8px;display:flex;align-items:center;justify-content:space-between"><div><div class="text-xs" style="color:#1e40af">📄 ใบสำคัญจ่ายที่สร้างอัตโนมัติ</div><div style="font-size:11px;color:#64748b;margin-top:2px">${e.paidAt ? 'จ่ายเมื่อ ' + Layout.date(e.paidAt) : ''} ${e.paidReference ? '· อ้างอิง ' + Layout.esc(e.paidReference) : ''}</div></div><a href="/pages/documents.html#doc=${e.paymentVoucherDocumentId}" class="btn btn-sm btn-secondary">ดูใบสำคัญจ่าย</a></div>` : ''}`;

          // Actions based on status
          let actions = '<button class="btn btn-secondary" onclick="Layout.closeModal(\'detailModal\')" data-i18n="common.close">ปิด</button>';
          if (e.status === 'Draft') {
            actions += ` <button class="btn btn-primary" onclick="Page.submitClaim('${e.id}')">ส่งอนุมัติ</button>`;
          }
          if (e.status === 'Submitted') {
            actions += ` <button class="btn btn-danger" onclick="Page.rejectClaim('${e.id}')">ปฏิเสธ</button>`;
            actions += ` <button class="btn btn-success" onclick="Page.approveClaim('${e.id}')">อนุมัติ</button>`;
          }
          if (e.status === 'Approved') {
            actions += ` <button class="btn btn-success" onclick="Page.payClaim('${e.id}')">จ่ายเงิน</button>`;
          }
          document.getElementById('detailFooter').innerHTML = actions;
          Layout.openModal('detailModal');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      async submitClaim(id) {
        const api = Layout.api(); if (!api) return;
        try { await api.submitExpenseClaim(id); Layout.toast('ส่งอนุมัติสำเร็จ'); Layout.closeModal('detailModal'); this.load(); }
        catch (e) { Layout.toast(e.message, 'error'); }
      },
      async approveClaim(id) {
        const api = Layout.api(); if (!api) return;
        try { await api.approveExpenseClaim(id, {}); Layout.toast('อนุมัติสำเร็จ'); Layout.closeModal('detailModal'); this.load(); }
        catch (e) { Layout.toast(e.message, 'error'); }
      },
      async rejectClaim(id) {
        const reason = prompt('กรุณาระบุเหตุผลที่ปฏิเสธ:');
        if (reason === null) return;
        const api = Layout.api(); if (!api) return;
        try { await api.rejectExpenseClaim(id, { reason }); Layout.toast('ปฏิเสธสำเร็จ'); Layout.closeModal('detailModal'); this.load(); }
        catch (e) { Layout.toast(e.message, 'error'); }
      },
      async payClaim(id) {
        if (!confirm('ยืนยันจ่ายเงิน?')) return;
        const api = Layout.api(); if (!api) return;
        try { await api.payExpenseClaim(id); Layout.toast('จ่ายเงินสำเร็จ'); Layout.closeModal('detailModal'); this.load(); }
        catch (e) { Layout.toast(e.message, 'error'); }
      }
    };
    Page.init();
  </script>
</body>
</html>
