<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สินค้าฝากขาย — Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div>
        <h2 class="page-title">สินค้าฝากขาย / รับฝาก</h2>
        <p class="page-subtitle">Inbound (vendor goods at our place — pay on consumption) / Outbound (our goods at customer — recognise on consumption)</p>
      </div>
    </div>

    <div class="tabs" style="margin-bottom:14px">
      <button class="tab-btn active" onclick="Page.switchTab('all')">ทั้งหมด</button>
      <button class="tab-btn" onclick="Page.switchTab('Inbound')">รับฝาก (Inbound)</button>
      <button class="tab-btn" onclick="Page.switchTab('Outbound')">ฝากขาย (Outbound)</button>
    </div>

    <div class="card">
      <div class="table-container">
        <table class="data-table">
          <thead><tr><th>ProductId</th><th>คู่ค้า</th><th>ทิศทาง</th><th style="text-align:right">คงเหลือ</th><th style="text-align:right">ราคา/หน่วย</th><th>รับเมื่อ</th><th>การจัดการ</th></tr></thead>
          <tbody id="rowsBody"><tr><td colspan="7" style="text-align:center;padding:30px;color:#94a3b8">โหลด...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script><script src="/js/translations.js"></script><script src="/js/i18n.js"></script><script src="/js/layout.js"></script>
  <script>
    const Page = {
      direction: null,
      async init() {
        if (!Layout.init('consignment')) return;
        Layout.setTitle('สินค้าฝากขาย');
        await this.load();
      },
      _fmt(n) { return (n||0).toLocaleString('th-TH', { maximumFractionDigits: 4 }); },
      switchTab(d) {
        document.querySelectorAll('.tab-btn').forEach((b, i) =>
          b.classList.toggle('active', ['all','Inbound','Outbound'][i] === d));
        this.direction = d === 'all' ? null : d;
        this.load();
      },
      async load() {
        const tbody = document.getElementById('rowsBody');
        try {
          const cid = Layout.getCompanyId();
          const url = `/api/companies/${cid}/mfg/consignment` + (this.direction ? `?direction=${this.direction}` : '');
          const r = await API.get(url);
          const rows = r.data || [];
          if (rows.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#94a3b8">ไม่มีข้อมูล</td></tr>'; return; }
          tbody.innerHTML = rows.map(x => `<tr>
            <td style="font-family:monospace;font-size:11px">${x.productId.toString().slice(0,8)}…</td>
            <td style="font-family:monospace;font-size:11px">${x.contactId.toString().slice(0,8)}…</td>
            <td><span style="background:${x.direction === 'Inbound' ? '#dbeafe' : '#dcfce7'};color:${x.direction === 'Inbound' ? '#1e40af' : '#15803d'};padding:2px 9px;border-radius:999px;font-size:11px">${x.direction}</span></td>
            <td style="text-align:right">${this._fmt(x.quantityOnHand)}</td>
            <td style="text-align:right">${x.agreedUnitPrice ? this._fmt(x.agreedUnitPrice) : '-'}</td>
            <td>${new Date(x.receivedAt).toLocaleDateString('th-TH')}</td>
            <td>${x.returnedOrSettledAt ? 'ปิดแล้ว' : `<button class="btn btn-sm btn-warning" onclick="Page.consume('${x.id}')">บันทึกใช้</button>`}</td>
          </tr>`).join('');
        } catch (e) { tbody.innerHTML = `<tr><td colspan="7" style="color:#dc2626;text-align:center">${e.message}</td></tr>`; }
      },
      async consume(id) {
        const qty = +(prompt('จำนวนใช้') || 0);
        if (!qty) return;
        const cid = Layout.getCompanyId();
        try {
          const r = await API.post(`/api/companies/${cid}/mfg/consignment/consume`,
            { consignmentRecordId: id, consumedQuantity: qty, consumedAt: new Date().toISOString() });
          Layout.toast(r.message);
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
    };
    Page.init();
  </script>
</body>
</html>
