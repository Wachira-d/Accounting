<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDPA — Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div>
        <h2 class="page-title">PDPA — สิทธิ์เจ้าของข้อมูล</h2>
        <p class="page-subtitle">พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล §32 — ต้องตอบกลับใน 30 วัน</p>
      </div>
      <button class="btn btn-primary" onclick="Page.openCreate()">+ รับคำขอใหม่</button>
    </div>

    <div class="card">
      <h3>⚠️ คำขอที่เลยกำหนด</h3>
      <div id="overdueList" style="margin-top:10px">กำลังโหลด...</div>
    </div>

    <div id="createModal" class="modal-overlay" style="display:none">
      <div class="modal" style="max-width:560px;width:90%">
        <h3 style="margin-top:0">รับคำขอ PDPA</h3>
        <label>อีเมล/เบอร์โทร ผู้ขอ</label>
        <input id="reqContact" class="form-input" placeholder="email หรือ phone">
        <label>ชื่อ</label>
        <input id="reqName" class="form-input">
        <label>ประเภทคำขอ</label>
        <select id="reqType" class="form-input">
          <option value="Access">Access — ขอดูข้อมูล</option>
          <option value="Erasure">Erasure — ขอลบข้อมูล</option>
          <option value="Rectification">Rectification — ขอแก้ไข</option>
          <option value="Portability">Portability — ขอข้อมูลเป็นไฟล์</option>
          <option value="Restriction">Restriction — ขอหยุดประมวลผล</option>
          <option value="Objection">Objection — ขอคัดค้าน</option>
        </select>
        <label>รายละเอียด</label>
        <textarea id="reqDesc" class="form-input" rows="3"></textarea>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
          <button class="btn btn-secondary" onclick="Page.closeCreate()">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.submit()">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script><script src="/js/translations.js"></script><script src="/js/i18n.js"></script><script src="/js/layout.js"></script>
  <script>
    const Page = {
      async init() {
        if (!Layout.init('pdpa')) return;
        Layout.setTitle('PDPA');
        await this.loadOverdue();
      },
      _esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); },
      async loadOverdue() {
        const el = document.getElementById('overdueList');
        try {
          const cid = Layout.getCompanyId();
          const r = await API.get(`/api/companies/${cid}/pdpa/overdue`);
          const rows = r.data || [];
          if (rows.length === 0) {
            el.innerHTML = '<div style="color:#15803d;padding:14px">✅ ไม่มีคำขอเลยกำหนด</div>';
            return;
          }
          el.innerHTML = `<table class="data-table"><thead><tr><th>เลขที่</th><th>ประเภท</th><th>ผู้ขอ</th><th>รับเมื่อ</th><th>ครบกำหนด</th><th>สถานะ</th><th>การจัดการ</th></tr></thead><tbody>${rows.map(r => `
            <tr>
              <td>${r.requestNumber}</td>
              <td>${r.requestType}</td>
              <td>${this._esc(r.requesterName || r.requesterContact)}</td>
              <td>${new Date(r.requestedAt).toLocaleDateString('th-TH')}</td>
              <td style="color:#dc2626"><b>${new Date(r.dueBy).toLocaleDateString('th-TH')}</b></td>
              <td>${r.status}</td>
              <td><button class="btn btn-sm btn-success" onclick="Page.complete('${r.id}')">ปิดงาน</button></td>
            </tr>`).join('')}</tbody></table>`;
        } catch (e) { el.innerHTML = `<div style="color:#dc2626">${e.message}</div>`; }
      },
      openCreate() { document.getElementById('createModal').style.display = 'flex'; },
      closeCreate() { document.getElementById('createModal').style.display = 'none'; },
      async submit() {
        const cid = Layout.getCompanyId();
        try {
          await API.post(`/api/companies/${cid}/pdpa/requests`, {
            requesterContact: document.getElementById('reqContact').value,
            requesterName: document.getElementById('reqName').value,
            requestType: document.getElementById('reqType').value,
            description: document.getElementById('reqDesc').value,
            linkedUserId: null, linkedContactId: null,
          });
          this.closeCreate();
          await this.loadOverdue();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      async complete(id) {
        const note = prompt('บันทึกการดำเนินการ');
        if (!note) return;
        const cid = Layout.getCompanyId();
        try {
          await API.post(`/api/companies/${cid}/pdpa/requests/${id}/complete`, { completionNote: note });
          await this.loadOverdue();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
    };
    Page.init();
  </script>
</body>
</html>
