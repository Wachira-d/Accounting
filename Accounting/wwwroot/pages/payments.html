<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การชำระเงิน - AcctPlatform</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">การชำระเงิน</h2><p class="page-subtitle">รายการชำระเงินทั้งหมด</p></div>
      <button class="btn btn-primary" onclick="Page.openCreate()">+ บันทึกการชำระเงิน</button>
    </div>
    <div class="toolbar">
      <input type="text" class="search-input" placeholder="ค้นหาเลขที่..." id="searchInput">
      <select class="filter-select" id="methodFilter" onchange="Page.load()">
        <option value="">ทุกช่องทาง</option>
        <option value="Cash">เงินสด</option>
        <option value="BankTransfer">โอนเงิน</option>
        <option value="CreditCard">บัตรเครดิต</option>
        <option value="Cheque">เช็ค</option>
        <option value="PromptPay">พร้อมเพย์</option>
      </select>
    </div>
    <div class="table-container">
      <table class="table">
        <thead><tr><th>เลขที่</th><th>เอกสารอ้างอิง</th><th>วันที่</th><th>ช่องทาง</th><th class="text-right">จำนวนเงิน</th><th>อ้างอิง</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6" class="text-center text-gray-400" style="padding:40px">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>

    <div class="modal-overlay" id="formModal">
      <div class="modal">
        <div class="modal-header"><h3 class="modal-title">บันทึกการชำระเงิน</h3><button class="modal-close" onclick="Layout.closeModal('formModal')">&times;</button></div>
        <div class="modal-body">
          <div class="form-group"><label class="form-label">เอกสาร (Document ID) *</label><input type="text" class="form-input" id="fDocId" placeholder="กรอก Document ID"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">วันที่ชำระ *</label><input type="date" class="form-input" id="fDate"></div>
            <div class="form-group"><label class="form-label">จำนวนเงิน *</label><input type="number" class="form-input" id="fAmount" step="0.01"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">ช่องทาง *</label>
              <select class="form-select" id="fMethod"><option value="BankTransfer">โอนเงิน</option><option value="Cash">เงินสด</option><option value="CreditCard">บัตรเครดิต</option><option value="Cheque">เช็ค</option><option value="PromptPay">พร้อมเพย์</option></select>
            </div>
            <div class="form-group"><label class="form-label">อ้างอิง</label><input type="text" class="form-input" id="fRef"></div>
          </div>
          <div class="form-group"><label class="form-label">บัญชีธนาคาร</label><input type="text" class="form-input" id="fBankAcc"></div>
          <div class="form-group"><label class="form-label">หมายเหตุ</label><input type="text" class="form-input" id="fNotes"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="Layout.closeModal('formModal')">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.save()">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      async init() {
        if (!Layout.init('payments')) return;
        Layout.setTitle('การชำระเงิน');
        await this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getPayments('?page=1&pageSize=30');
          const items = res.data?.items || res.data || [];
          const tbody = document.getElementById('tableBody');
          const methodMap = { Cash:'เงินสด', BankTransfer:'โอนเงิน', CreditCard:'บัตรเครดิต', Cheque:'เช็ค', PromptPay:'พร้อมเพย์', DirectDebit:'หักบัญชี', EWallet:'E-Wallet' };
          if (!items.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-gray-400" style="padding:40px">ไม่มีรายการ</td></tr>'; return; }
          tbody.innerHTML = items.map(p => `<tr>
            <td class="font-medium">${p.paymentNumber}</td>
            <td class="text-xs text-gray-500">${p.documentId ? p.documentId.substring(0,8)+'...' : '-'}</td>
            <td>${Layout.date(p.paymentDate)}</td>
            <td><span class="badge badge-info">${methodMap[p.paymentMethod] || p.paymentMethod}</span></td>
            <td class="text-right font-semibold">${Layout.money(p.amount)}</td>
            <td class="text-gray-500">${p.reference || '-'}</td>
          </tr>`).join('');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      openCreate() {
        document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
        Layout.openModal('formModal');
      },
      async save() {
        const api = Layout.api(); if (!api) return;
        try {
          await api.createPayment({
            documentId: document.getElementById('fDocId').value,
            paymentDate: document.getElementById('fDate').value,
            amount: parseFloat(document.getElementById('fAmount').value),
            paymentMethod: document.getElementById('fMethod').value,
            reference: document.getElementById('fRef').value || null,
            bankAccount: document.getElementById('fBankAcc').value || null,
            notes: document.getElementById('fNotes').value || null,
          });
          Layout.closeModal('formModal'); Layout.toast('บันทึกการชำระเงินสำเร็จ'); await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      }
    };
    Page.init();
  </script>
</body>
</html>
