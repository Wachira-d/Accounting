<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คอมมิชชัน - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="tabs" style="margin-bottom:20px">
      <button class="tab active" onclick="Page.switchTab('plans')">แผนคอมมิชชัน</button>
      <button class="tab" onclick="Page.switchTab('calculate')">คำนวณคอมมิชชัน</button>
    </div>

    <div id="tab-plans">
      <div class="page-header">
        <div><h2 class="page-title">แผนคอมมิชชัน</h2><p class="page-subtitle">กำหนดเงื่อนไขการจ่ายคอมมิชชันพนักงานขาย</p></div>
        <button class="btn btn-primary" onclick="Page.openCreatePlan()">+ สร้างแผน</button>
      </div>
      <div class="table-container">
        <table class="table">
          <thead><tr><th>ชื่อแผน</th><th data-i18n="common.type">ประเภท</th><th>อัตรา</th><th>พนักงานที่ใช้</th><th data-i18n="common.status">สถานะ</th><th data-i18n="common.manage">จัดการ</th></tr></thead>
          <tbody id="planBody"><tr><td colspan="6" class="text-center text-gray-400" style="padding:40px" data-i18n="common.loading">กำลังโหลด...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="tab-calculate" style="display:none">
      <div class="page-header">
        <div><h2 class="page-title">คำนวณคอมมิชชัน</h2><p class="page-subtitle">คำนวณและอนุมัติคอมมิชชันรายเดือน</p></div>
      </div>
      <div class="toolbar">
        <select class="filter-select" id="calcYear"></select>
        <select class="filter-select" id="calcMonth">
          <option value="1">ม.ค.</option><option value="2">ก.พ.</option><option value="3">มี.ค.</option><option value="4">เม.ย.</option><option value="5">พ.ค.</option><option value="6">มิ.ย.</option>
          <option value="7">ก.ค.</option><option value="8">ส.ค.</option><option value="9">ก.ย.</option><option value="10">ต.ค.</option><option value="11">พ.ย.</option><option value="12">ธ.ค.</option>
        </select>
        <button class="btn btn-primary" onclick="Page.calculate()">คำนวณ</button>
        <button class="btn btn-success" onclick="Page.approve()">อนุมัติ</button>
      </div>
      <div id="calcContent" class="card" style="padding:24px"><p class="text-gray-400 text-center">เลือกเดือนแล้วกดคำนวณ</p></div>
    </div>

    <div class="modal-overlay" id="planModal">
      <div class="modal" style="max-width:600px">
        <div class="modal-header"><h3 class="modal-title" id="planTitle">สร้างแผนคอมมิชชัน</h3><button class="modal-close" onclick="Layout.closeModal('planModal')">&times;</button></div>
        <div class="modal-body">
          <input type="hidden" id="planId">
          <!-- รอบ 193 · A04: ฟอร์มเดิมส่ง {commissionType, rate, minimumSales, cap} ซึ่งเซิร์ฟเวอร์ไม่รู้จักเลย
               (สัญญาจริง = ฐานคำนวณ + วิธีคำนวณ + flatRate/ขั้น) ⇒ สร้างแผนไม่ได้ · "ยอดขายขั้นต่ำ"/"เพดาน"
               ถูกถอดออกเพราะเส้นคำนวณไม่มีที่ใช้ (ห้ามมีช่องที่เซิร์ฟเวอร์ไม่รู้จัก) · ตัวเลือกมาจาก GET commissions/options -->
          <div class="form-group"><label class="form-label" for="planName">ชื่อแผน *</label><input type="text" class="form-input" id="planName" name="name" placeholder="เช่น คอมมิชชันทีมขาย"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label" for="planBasis">ฐานคำนวณ *</label><select class="form-select" id="planBasis" name="calculationBasis"></select></div>
            <div class="form-group"><label class="form-label" for="planMethod">วิธีคำนวณ *</label><select class="form-select" id="planMethod" name="calculationMethod" onchange="Page.onMethodChange()"></select></div>
          </div>
          <div class="form-group" id="planRateGroup"><label class="form-label" for="planRate" id="planRateLabel">อัตรา (%) *</label><input type="number" class="form-input" id="planRate" name="flatRate" step="0.01" min="0"></div>
          <div class="form-group" id="planTierGroup" style="display:none">
            <label class="form-label">ขั้นบันได * <span class="text-xs text-gray-500">(ยอดส่วนที่อยู่ในช่วงคิดอัตราของขั้นนั้น · เว้น "ถึง" ว่างได้เฉพาะขั้นสุดท้าย)</span></label>
            <table class="table"><thead><tr><th>ยอดตั้งแต่ (บาท)</th><th>ถึง (บาท)</th><th>อัตรา (%)</th><th></th></tr></thead><tbody id="planTierBody"></tbody></table>
            <button type="button" class="btn btn-sm btn-secondary" onclick="Page.addTierRow()">+ เพิ่มขั้น</button>
          </div>
          <div class="form-group"><label class="form-label" for="planDesc" data-i18n="common.description">คำอธิบาย</label><textarea class="form-input" id="planDesc" name="description" rows="2"></textarea></div>
          <div class="form-group" id="planActiveGroup" style="display:none"><label><input type="checkbox" id="planActive" name="isActive"> ใช้งานแผนนี้ (ปิด = ไม่ถูกนำไปคำนวณคอมมิชชัน)</label></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" onclick="Layout.closeModal('planModal')" data-i18n="common.cancel">ยกเลิก</button><button class="btn btn-primary" onclick="Page.savePlan()" data-i18n="common.save">บันทึก</button></div>
      </div>
    </div>

    <div class="modal-overlay" id="assignModal">
      <div class="modal" style="max-width:500px">
        <div class="modal-header"><h3 class="modal-title">กำหนดแผนให้พนักงาน</h3><button class="modal-close" onclick="Layout.closeModal('assignModal')">&times;</button></div>
        <div class="modal-body">
          <input type="hidden" id="assignPlanId">
          <div class="form-group"><label class="form-label">พนักงาน *</label><select class="form-select" id="assignEmployee"></select></div>
          <div class="form-group"><label class="form-label">วันที่เริ่ม *</label><input type="date" class="form-input" id="assignStart"></div>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" onclick="Layout.closeModal('assignModal')" data-i18n="common.cancel">ยกเลิก</button><button class="btn btn-primary" onclick="Page.doAssign()">กำหนด</button></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
const Page = {
  init() {
    if (!Layout.init('commission')) return;
    Layout.setTitle('คอมมิชชัน');
    const y = new Date().getFullYear();
    const sel = document.getElementById('calcYear');
    for (let i = y; i >= y-2; i--) sel.innerHTML += `<option value="${i}">${i+543}</option>`;
    document.getElementById('calcMonth').value = new Date().getMonth() + 1;
    this.loadPlans();
  },

  switchTab(tab) {
    ['plans','calculate'].forEach(t => { document.getElementById('tab-'+t).style.display = t === tab ? '' : 'none'; });
    document.querySelectorAll('.tabs .tab').forEach((t, i) => t.classList.toggle('active', ['plans','calculate'][i] === tab));
  },

  _opts: null,
  /** ตัวเลือก + ป้ายไทยจากเซิร์ฟเวอร์ (ตัวตั้ง = Helpers/CommissionPlanRules) */
  async loadOptions() {
    if (this._opts) return this._opts;
    const api = Layout.api(); if (!api) return null;
    const res = await api.getCommissionOptions();
    this._opts = res.data;
    const fill = (id, list) => {
      document.getElementById(id).innerHTML = (list || [])
        .map(o => `<option value="${Layout.esc(o.value)}">${Layout.esc(o.label)}</option>`).join('');
    };
    fill('planBasis', this._opts.bases);
    fill('planMethod', this._opts.methods);
    return this._opts;
  },
  label(kind, v) {
    const hit = (this._opts?.[kind] || []).find(o => o.value === v);
    return hit ? hit.label : (v || '-');
  },

  async loadPlans() {
    const api = Layout.api(); if (!api) return;
    try {
      try { await this.loadOptions(); } catch (_) { /* ป้ายไม่มา = แสดงค่าดิบ */ }
      const res = await api.getCommissionPlans();
      const items = res.data?.items || res.data || [];
      const tbody = document.getElementById('planBody');
      if (!items.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-gray-400" style="padding:40px">ยังไม่มีแผนคอมมิชชัน</td></tr>'; return; }
      // อ่านฟิลด์ของ CommissionPlanResponse จริง — เดิมอ่าน type/rate/assignedCount ที่ไม่มีใครส่ง ⇒ "-"/"0 คน" ทุกแถว
      const rateText = p => p.calculationMethod === 'Tiered'
        ? `${(p.tiers || []).length} ขั้น`
        : p.flatRate == null ? 'ไม่มีข้อมูล'
        : p.calculationMethod === 'Percentage' ? `${p.flatRate}%` : Layout.money(p.flatRate);
      tbody.innerHTML = items.map(p => `<tr>
        <td><span class="font-medium">${Layout.esc(p.name || '-')}</span></td>
        <td>${Layout.esc(this.label('methods', p.calculationMethod))}<div class="text-xs text-gray-500">${Layout.esc(this.label('bases', p.calculationBasis))}</div></td>
        <td>${Layout.esc(rateText(p))}</td>
        <td>${p.assignedCount ?? 0} คน</td>
        <td>${Layout.statusBadge(p.isActive !== false ? 'Active' : 'Inactive')}</td>
        <td>
          <button class="btn btn-sm btn-secondary" onclick="Page.editPlan('${p.id}')" data-i18n="common.edit">แก้ไข</button>
          <button class="btn btn-sm btn-primary" onclick="Page.openAssign('${p.id}')">กำหนด</button>
        </td>
      </tr>`).join('');
    } catch (err) { Layout.toast(err.message, 'error'); }
  },

  /** ค่าเดิมที่ไม่อยู่ในชุด (ข้อมูลเก่า) แสดงตามจริง — ไม่ปล่อยให้ select ว่างเงียบ ๆ */
  setSelect(id, value) {
    const sel = document.getElementById(id);
    sel.querySelectorAll('option[data-legacy]').forEach(o => o.remove());
    if (value && ![...sel.options].some(o => o.value === value)) {
      const o = document.createElement('option');
      o.value = value; o.textContent = `(ค่าเดิม: ${value})`; o.dataset.legacy = '1';
      sel.appendChild(o);
    }
    if (value) sel.value = value;
  },

  onMethodChange() {
    const m = document.getElementById('planMethod').value;
    const tiered = m === 'Tiered';
    document.getElementById('planTierGroup').style.display = tiered ? '' : 'none';
    document.getElementById('planRateGroup').style.display = tiered ? 'none' : '';
    document.getElementById('planRateLabel').textContent = m === 'Fixed' ? 'จำนวนเงินต่อเดือน (บาท) *' : 'อัตรา (%) *';
    if (tiered && !document.querySelector('#planTierBody tr')) this.addTierRow();
  },

  addTierRow(t) {
    const tr = document.createElement('tr');
    const v = x => (x === null || x === undefined) ? '' : Layout.esc(String(x));
    tr.innerHTML = `<td><input type="number" class="form-input" data-k="from" step="0.01" min="0" value="${v(t?.fromAmount)}"></td>
      <td><input type="number" class="form-input" data-k="to" step="0.01" min="0" value="${v(t?.toAmount)}" placeholder="ไม่จำกัด"></td>
      <td><input type="number" class="form-input" data-k="rate" step="0.01" min="0" value="${v(t?.rate)}"></td>
      <td><button type="button" class="btn btn-sm btn-ghost" onclick="this.closest('tr').remove()">ลบ</button></td>`;
    document.getElementById('planTierBody').appendChild(tr);
  },

  resetPlanForm() {
    ['planName','planRate','planDesc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('planTierBody').innerHTML = '';
    document.getElementById('planActive').checked = true;
  },

  async openCreatePlan() {
    try { await this.loadOptions(); }
    catch (e) { Layout.toast('โหลดตัวเลือกแผนคอมมิชชันไม่สำเร็จ: ' + e.message, 'error'); return; }
    document.getElementById('planTitle').textContent = 'สร้างแผนคอมมิชชัน';
    document.getElementById('planId').value = '';
    this.resetPlanForm();
    this.setSelect('planBasis', this._opts.defaultBasis);
    this.setSelect('planMethod', this._opts.defaultMethod);
    document.getElementById('planActiveGroup').style.display = 'none';
    this.onMethodChange();
    Layout.openModal('planModal');
  },

  /** รอบ 193 · A17: เดิมตั้งแค่ id + หัวข้อ ⇒ เห็นฟอร์มว่าง/ค่าของแผนก่อนหน้า แล้วบันทึกทับ */
  async editPlan(id) {
    const api = Layout.api(); if (!api) return;
    try {
      await this.loadOptions();
      const p = (await api.getCommissionPlan(id)).data;
      document.getElementById('planTitle').textContent = 'แก้ไขแผน';
      document.getElementById('planId').value = p.id;
      this.resetPlanForm();
      document.getElementById('planName').value = p.name || '';
      document.getElementById('planDesc').value = p.description || '';
      this.setSelect('planBasis', p.calculationBasis);
      this.setSelect('planMethod', p.calculationMethod);
      document.getElementById('planRate').value = p.flatRate ?? '';
      (p.tiers || []).forEach(t => this.addTierRow(t));
      document.getElementById('planActive').checked = p.isActive !== false;
      document.getElementById('planActiveGroup').style.display = '';
      this.onMethodChange();
      // รอบ 193 (M2): จำหน้าตาฟอร์มหลังเติม — ถ้าผู้ใช้แค่ติ๊ก "ใช้งาน" ออก ให้ส่งเฉพาะการปิดใช้งาน
      // (แผนเก่าที่อัตราว่าง/ฐานนอกชุดต้องปิดได้โดยไม่ถูกบังคับให้แต่งอัตรา)
      this._editWasActive = p.isActive !== false;
      this._editSnapshot = this._planFormState();
      Layout.openModal('planModal');
    } catch (err) { Layout.toast(err.message, 'error'); }
  },

  /** สถานะช่องที่กำหนดแผน (ไม่รวมช่อง "ใช้งาน") — ใช้ตัดสินว่าผู้ใช้แก้อะไรนอกจากปิดใช้งานไหม */
  _planFormState() {
    const v = id => (document.getElementById(id)?.value ?? '').trim();
    const tiers = [...document.querySelectorAll('#planTierBody tr')].map(tr =>
      ['from', 'to', 'rate'].map(k => (tr.querySelector(`[data-k="${k}"]`)?.value ?? '').trim()).join('|'));
    return JSON.stringify([v('planName'), v('planDesc'), v('planBasis'), v('planMethod'), v('planRate'), tiers]);
  },

  async savePlan() {
    const api = Layout.api(); if (!api) return;
    const id = document.getElementById('planId').value;
    // ปิดใช้งานอย่างเดียว → ส่งแค่ isActive:false (เซิร์ฟเวอร์ข้ามด่านอัตรา — CommissionPlanRules.IsDeactivateOnly)
    if (id && this._editWasActive && !document.getElementById('planActive').checked
        && this._planFormState() === this._editSnapshot) {
      try {
        await api.updateCommissionPlan(id, { isActive: false });
        Layout.toast('ปิดใช้งานแผนแล้ว'); Layout.closeModal('planModal'); this.loadPlans();
      } catch (err) { Layout.toast(err.message, 'error'); }
      return;
    }
    const method = document.getElementById('planMethod').value;
    const data = {
      name: document.getElementById('planName').value.trim(),
      description: document.getElementById('planDesc').value,
      calculationBasis: document.getElementById('planBasis').value,
      calculationMethod: method,
    };
    if (!data.name) { Layout.toast('กรุณาระบุชื่อแผน', 'error'); return; }
    if (method === 'Tiered') {
      const tiers = [];
      for (const [i, tr] of [...document.querySelectorAll('#planTierBody tr')].entries()) {
        const val = k => tr.querySelector(`[data-k="${k}"]`).value.trim();
        if (val('from') === '' || val('rate') === '') { Layout.toast(`ขั้นที่ ${i + 1}: กรุณากรอกยอดตั้งแต่และอัตรา`, 'error'); return; }
        const tier = { fromAmount: parseFloat(val('from')), rate: parseFloat(val('rate')) };
        if (val('to') !== '') tier.toAmount = parseFloat(val('to'));   // ว่าง = ไม่จำกัด (ตัดคีย์ทิ้ง)
        tiers.push(tier);
      }
      if (!tiers.length) { Layout.toast('แผนแบบขั้นบันไดต้องมีอย่างน้อย 1 ขั้น', 'error'); return; }
      data.tiers = tiers;
    } else {
      const raw = document.getElementById('planRate').value.trim();
      if (raw === '' || !(parseFloat(raw) > 0)) {
        Layout.toast(method === 'Fixed' ? 'กรุณากรอกจำนวนเงิน (มากกว่า 0)' : 'กรุณากรอกอัตรา % (มากกว่า 0)', 'error'); return;
      }
      data.flatRate = parseFloat(raw);
      data.tiers = [];   // เปลี่ยนจากขั้นบันไดมาเป็นแบบอื่น = ล้างขั้นเดิม
    }
    if (id) data.isActive = document.getElementById('planActive').checked;
    try {
      if (id) await api.updateCommissionPlan(id, data); else await api.createCommissionPlan(data);
      Layout.toast(id ? 'แก้ไขสำเร็จ' : 'สร้างสำเร็จ'); Layout.closeModal('planModal'); this.loadPlans();
    } catch (err) { Layout.toast(err.message, 'error'); }
  },

  async openAssign(planId) {
    document.getElementById('assignPlanId').value = planId;
    const api = Layout.api(); if (!api) return;
    try {
      const res = await api.getEmployees('?pageSize=200');
      const items = res.data?.items || res.data || [];
      // EmployeeResponse ส่ง firstNameTh/lastNameTh — เดิมอ่าน firstName/lastName ⇒ "undefined undefined"
      document.getElementById('assignEmployee').innerHTML = items.map(e => `<option value="${e.id}">${Layout.esc([e.employeeCode, e.firstNameTh, e.lastNameTh].filter(Boolean).join(' '))}</option>`).join('');
    } catch (err) { Layout.toast('โหลดรายชื่อพนักงานไม่สำเร็จ: ' + err.message, 'error'); return; }
    document.getElementById('assignStart').value = Layout.dateInput(new Date());
    Layout.openModal('assignModal');
  },

  async doAssign() {
    const api = Layout.api(); if (!api) return;
    const planId = document.getElementById('assignPlanId').value;
    const data = { employeeId: document.getElementById('assignEmployee').value, startDate: document.getElementById('assignStart').value };
    try { await api.assignCommissionPlan(planId, data); Layout.toast('กำหนดแผนสำเร็จ'); Layout.closeModal('assignModal'); this.loadPlans(); } catch (err) { Layout.toast(err.message, 'error'); }
  },

  async calculate() {
    const api = Layout.api(); if (!api) return;
    const y = document.getElementById('calcYear').value;
    const m = document.getElementById('calcMonth').value;
    const content = document.getElementById('calcContent');
    content.innerHTML = '<div style="text-align:center;padding:20px"><div class="spinner" style="margin:0 auto"></div></div>';
    try {
      await api.calculateCommissions(y, m);
      const res = await api.getCommissionCalcs(y, m);
      const items = res.data?.items || res.data || [];
      content.innerHTML = items.length ? `<div class="table-container"><table class="table"><thead><tr><th>พนักงาน</th><th class="text-right">ยอดขาย</th><th class="text-right">อัตรา</th><th class="text-right">คอมมิชชัน</th><th data-i18n="common.status">สถานะ</th></tr></thead>
      <tbody>${items.map(c => `<tr><td class="font-medium">${c.employeeName||'-'}</td><td class="text-right">${Layout.money(c.basisAmount)}</td><td class="text-right">${c.basisAmount > 0 ? ((c.commissionAmount / c.basisAmount) * 100).toFixed(2) : '-'}%</td><td class="text-right text-primary font-medium">${Layout.money(c.commissionAmount)}</td><td>${Layout.statusBadge(c.status||'Pending')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="text-gray-400 text-center">ไม่มีข้อมูลคอมมิชชัน</p>';
    } catch (err) { content.innerHTML = `<p class="text-danger text-center">${Layout.esc(err.message)}</p>`; }
  },

  async approve() {
    const api = Layout.api(); if (!api) return;
    const y = document.getElementById('calcYear').value;
    const m = document.getElementById('calcMonth').value;
    if (!confirm('อนุมัติคอมมิชชันเดือนนี้?')) return;
    try { await api.approveCommissions(y, m); Layout.toast('อนุมัติสำเร็จ'); this.calculate(); } catch (err) { Layout.toast(err.message, 'error'); }
  },
};
Page.init();
  </script>
</body>
</html>
