<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>งวดบัญชี - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">งวดบัญชี</h2><p class="page-subtitle">จัดการงวดบัญชี เปิด/ปิดรอบบัญชี</p></div>
      <button class="btn btn-primary" onclick="Page.openCreate()">+ สร้างงวดบัญชี</button>
    </div>
    <div class="table-container">
      <table class="table">
        <thead><tr><th>ชื่องวด</th><th>ปี</th><th>เดือน</th><th>วันเริ่มต้น</th><th>วันสิ้นสุด</th><th data-i18n="common.status">สถานะ</th><th data-i18n="common.manage">จัดการ</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="7" class="text-center text-gray-400" style="padding:40px" data-i18n="common.loading">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>

    <!-- Create Modal -->
    <div class="modal-overlay" id="formModal">
      <div class="modal">
        <div class="modal-header"><h3 class="modal-title">สร้างงวดบัญชี</h3><button class="modal-close" onclick="Layout.closeModal('formModal')">&times;</button></div>
        <div class="modal-body">
          <div class="form-group"><label class="form-label">ชื่องวด *</label><input type="text" class="form-input" id="fName" placeholder="เช่น มกราคม 2026"></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">ปี *</label><input type="number" class="form-input" id="fYear" value="2026"></div>
            <div class="form-group"><label class="form-label">เดือน *</label>
              <select class="form-select" id="fMonth">
                <option value="1">1 - มกราคม</option><option value="2">2 - กุมภาพันธ์</option><option value="3">3 - มีนาคม</option>
                <option value="4">4 - เมษายน</option><option value="5">5 - พฤษภาคม</option><option value="6">6 - มิถุนายน</option>
                <option value="7">7 - กรกฎาคม</option><option value="8">8 - สิงหาคม</option><option value="9">9 - กันยายน</option>
                <option value="10">10 - ตุลาคม</option><option value="11">11 - พฤศจิกายน</option><option value="12">12 - ธันวาคม</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">วันเริ่มต้น *</label><input type="date" class="form-input" id="fStart"></div>
            <div class="form-group"><label class="form-label">วันสิ้นสุด *</label><input type="date" class="form-input" id="fEnd"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="Layout.closeModal('formModal')" data-i18n="common.cancel">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.save()">สร้างงวด</button>
        </div>
      </div>
    </div>

    <!-- Pre-Closing Checklist Modal -->
    <div class="modal-overlay" id="checklistModal">
      <div class="modal" style="max-width:560px">
        <div class="modal-header"><h3 class="modal-title">ตรวจสอบก่อนปิดงวด</h3><button class="modal-close" onclick="Layout.closeModal('checklistModal')">&times;</button></div>
        <div class="modal-body" id="checklistContent" style="padding:20px">
          <p class="text-center text-gray-400">กำลังตรวจสอบ...</p>
        </div>
        <div class="modal-footer" id="checklistFooter">
          <button class="btn btn-secondary" onclick="Layout.closeModal('checklistModal')">ยกเลิก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      async init() {
        if (!Layout.init('fiscal')) return;
        Layout.setTitle('งวดบัญชี');
        await this.load();
      },
      _periods: [],
      async load() {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getFiscalPeriods();
          const items = res.data?.items || res.data || [];
          this._periods = items;
          const tbody = document.getElementById('tableBody');
          if (!items.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-gray-400" style="padding:40px">ไม่มีงวดบัญชี — กดปุ่ม "สร้างงวดบัญชี" เพื่อเริ่มต้น</td></tr>'; return; }
          tbody.innerHTML = items.map(p => `<tr>
            <td class="font-medium">${Layout.esc(p.name || `${p.year}/${p.month}`)}</td>
            <td>${p.year}</td><td>${p.month}</td>
            <td>${Layout.date(p.startDate)}</td><td>${Layout.date(p.endDate)}</td>
            <td>${Layout.statusBadge(p.status)}</td>
            <td>
              ${p.status === 'Open' ? `<button class="btn btn-sm btn-warning" onclick="Page.closePeriod('${p.id}')">ปิดงวด</button>` : ''}
              ${p.status === 'Closed' ? '<span class="text-xs text-gray-400">ปิดแล้ว</span>' : ''}
            </td>
          </tr>`).join('');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      openCreate() {
        const now = new Date();
        document.getElementById('fYear').value = now.getFullYear();
        document.getElementById('fMonth').value = now.getMonth() + 1;
        this.updateDates();
        document.getElementById('fMonth').addEventListener('change', () => this.updateDates());
        document.getElementById('fYear').addEventListener('change', () => this.updateDates());
        Layout.openModal('formModal');
      },
      updateDates() {
        const y = parseInt(document.getElementById('fYear').value);
        const m = parseInt(document.getElementById('fMonth').value);
        const start = new Date(y, m - 1, 1);
        const end = new Date(y, m, 0);
        document.getElementById('fStart').value = Layout.toDateInput(start);
        document.getElementById('fEnd').value = Layout.toDateInput(end);
        const months = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        document.getElementById('fName').value = `${months[m]} ${y}`;
      },
      async save() {
        const api = Layout.api(); if (!api) return;
        try {
          await api.createFiscalPeriod({
            name: document.getElementById('fName').value,
            year: parseInt(document.getElementById('fYear').value),
            month: parseInt(document.getElementById('fMonth').value),
            startDate: document.getElementById('fStart').value,
            endDate: document.getElementById('fEnd').value,
          });
          Layout.closeModal('formModal'); Layout.toast('สร้างงวดบัญชีสำเร็จ'); await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      _closeId: null,
      async closePeriod(id) {
        this._closeId = id;
        const api = Layout.api(); if (!api) return;
        const content = document.getElementById('checklistContent');
        const footer = document.getElementById('checklistFooter');
        content.innerHTML = '<p class="text-center text-gray-400">กำลังตรวจสอบ...</p>';
        footer.innerHTML = '<button class="btn btn-secondary" onclick="Layout.closeModal(\'checklistModal\')">ยกเลิก</button>';
        Layout.openModal('checklistModal');

        try {
          const period = this._periods.find(p => p.id === id);
          const pStart = period?.startDate?.split('T')[0] || '';
          const pEnd = period?.endDate?.split('T')[0] || '';
          const pName = period?.name || id;

          const [jRes, dRes, tbRes] = await Promise.all([
            api.getJournals(`?status=Draft&fromDate=${pStart}&toDate=${pEnd}&pageSize=1`),
            api.getDocuments(`?status=Draft&fromDate=${pStart}&toDate=${pEnd}&pageSize=1`),
            api.trialBalance(`?asOfDate=${pEnd}`)
          ]);

          const draftJEs = jRes.data?.totalCount ?? jRes.data?.items?.length ?? 0;
          const draftDocs = dRes.data?.totalCount ?? dRes.data?.items?.length ?? 0;
          const tb = tbRes.data;
          const tbBalanced = Math.abs((tb?.totalDebit || 0) - (tb?.totalCredit || 0)) < 0.02;

          const checks = [
            { label: 'รายการ Draft (สมุดรายวัน)', value: draftJEs === 0, detail: draftJEs === 0 ? 'ไม่มี' : `${draftJEs} รายการ — ต้อง Post หรือ Void ก่อน` },
            { label: 'เอกสาร Draft', value: draftDocs === 0, detail: draftDocs === 0 ? 'ไม่มี' : `${draftDocs} รายการ — ต้องอนุมัติหรือยกเลิก` },
            { label: 'งบทดลองสมดุล', value: tbBalanced, detail: tbBalanced ? `Dr ${Layout.money(tb?.totalDebit)} = Cr ${Layout.money(tb?.totalCredit)}` : `Dr ${Layout.money(tb?.totalDebit)} ≠ Cr ${Layout.money(tb?.totalCredit)}` },
          ];

          const allPassed = checks.every(c => c.value);

          content.innerHTML = `
            <p class="text-sm text-gray-500" style="margin-bottom:16px">งวด: <strong>${Layout.esc(pName)}</strong> (${pStart} — ${pEnd})</p>
            <div style="display:flex;flex-direction:column;gap:12px">
              ${checks.map(c => `
                <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:${c.value ? '#f0fdf4' : '#fef2f2'}">
                  <span style="font-size:18px">${c.value ? '✅' : '❌'}</span>
                  <div>
                    <div class="font-medium" style="font-size:13px">${c.label}</div>
                    <div class="text-xs" style="color:${c.value ? 'var(--success)' : 'var(--danger)'}">${c.detail}</div>
                  </div>
                </div>`).join('')}
            </div>
            ${allPassed ? '<p class="text-success text-sm" style="margin-top:16px;text-align:center">✓ ผ่านการตรวจสอบทุกรายการ — พร้อมปิดงวด</p>'
              : '<p class="text-danger text-sm" style="margin-top:16px;text-align:center">⚠ มีรายการที่ต้องแก้ไข (ระบบจะตรวจสอบอีกครั้งเมื่อปิดจริง)</p>'}
            <div style="margin-top:16px;padding:12px;background:var(--gray-50);border-radius:8px;font-size:12px;color:var(--gray-600)">
              <strong>สิ่งที่ระบบจะทำเมื่อปิดงวด:</strong>
              <ul style="margin:4px 0 0 16px;padding:0">
                <li>สร้างใบปิดสมุด (Closing Entries) — ปิดบัญชีรายได้/ค่าใช้จ่ายเข้ากำไรสะสม</li>
                <li>ตั้งสถานะงวดเป็น "ปิด" — ไม่สามารถบันทึกรายการเพิ่มในงวดนี้ได้</li>
              </ul>
            </div>`;

          footer.innerHTML = `
            <button class="btn btn-secondary" onclick="Layout.closeModal('checklistModal')">ยกเลิก</button>
            <button class="btn btn-warning" onclick="Page.confirmClose()">ยืนยันปิดงวด</button>`;
        } catch (e) {
          content.innerHTML = `<div class="text-danger text-center" style="padding:20px">${Layout.esc(e.message)}</div>`;
        }
      },
      async confirmClose() {
        const api = Layout.api(); if (!api) return;
        const btn = document.querySelector('#checklistFooter .btn-warning');
        if (btn) { btn.disabled = true; btn.textContent = 'กำลังปิดงวด...'; }
        try {
          await api.closeFiscalPeriod(this._closeId);
          Layout.closeModal('checklistModal');
          Layout.toast('ปิดงวดบัญชีสำเร็จ — สร้างใบปิดสมุดเรียบร้อยแล้ว');
          await this.load();
        } catch (e) {
          Layout.toast(e.message, 'error');
          if (btn) { btn.disabled = false; btn.textContent = 'ยืนยันปิดงวด'; }
        }
      }
    };
    Page.init();
  </script>
</body>
</html>
