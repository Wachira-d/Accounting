<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>งวดบัญชี - AcctPlatform</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">งวดบัญชี</h2><p class="page-subtitle">จัดการงวดบัญชี เปิด/ปิดรอบบัญชี</p></div>
    </div>
    <div class="table-container">
      <table class="table">
        <thead><tr><th>ชื่องวด</th><th>ปี</th><th>เดือน</th><th>วันเริ่มต้น</th><th>วันสิ้นสุด</th><th>สถานะ</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6" class="text-center text-gray-400" style="padding:40px">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      async init() {
        if (!Layout.init('fiscal')) return;
        Layout.setTitle('งวดบัญชี');
        await this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getFiscalPeriods();
          const items = res.data?.items || res.data || [];
          const tbody = document.getElementById('tableBody');
          if (!items.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-gray-400" style="padding:40px">ไม่มีงวดบัญชี</td></tr>'; return; }
          tbody.innerHTML = items.map(p => `<tr>
            <td class="font-medium">${p.name || `${p.year}/${p.month}`}</td>
            <td>${p.year}</td><td>${p.month}</td>
            <td>${Layout.date(p.startDate)}</td><td>${Layout.date(p.endDate)}</td>
            <td>${Layout.statusBadge(p.status)}</td>
          </tr>`).join('');
        } catch (e) { Layout.toast(e.message, 'error'); }
      }
    };
    Page.init();
  </script>
</body>
</html>
