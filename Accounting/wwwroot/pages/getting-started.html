<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เริ่มต้นใช้งาน - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .gs-shell { max-width:880px; margin:0 auto; padding:24px 16px 60px; }
    .gs-header h1 { margin:0 0 6px; font-size:24px; }
    .gs-header p { margin:0 0 22px; color:var(--gray-600); font-size:14px; }

    .gs-progress { background:var(--gray-100); border-radius:8px; height:10px; overflow:hidden; margin-bottom:24px; }
    .gs-progress > div { height:100%; background:var(--success); transition:width .4s ease; }
    .gs-progress-label { display:flex; justify-content:space-between; font-size:13px; margin-top:-18px; padding:0 12px; color:#fff; font-weight:600; line-height:10px; pointer-events:none; }

    .gs-step { background:#fff; border:1px solid var(--gray-200); border-radius:10px;
               margin-bottom:12px; padding:16px; display:flex; gap:14px; align-items:flex-start; }
    .gs-step.done { background:#f0fdf4; border-color:#bbf7d0; }
    .gs-step.error { background:#fef2f2; border-color:#fecaca; }
    .gs-step .check { font-size:28px; flex-shrink:0; line-height:1; padding-top:2px; }
    .gs-step.done .check { color:#16a34a; }
    .gs-step.error .check { color:#dc2626; }
    .gs-step:not(.done):not(.error) .check { color:var(--gray-300); }
    .gs-spinner { display:inline-block; width:20px; height:20px; border:2.5px solid #e2e8f0;
                  border-top-color:#3b82f6; border-radius:50%; animation:gs-spin .8s linear infinite;
                  vertical-align:middle; }
    @keyframes gs-spin { to { transform:rotate(360deg); } }
    .gs-step .body { flex:1; min-width:0; }
    .gs-step h3 { margin:0 0 4px; font-size:16px; }
    .gs-step .desc { font-size:13px; color:var(--gray-600); margin-bottom:8px; }
    .gs-step .meta { font-size:12px; color:var(--gray-500); }
    .gs-step .actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }

    .gs-summary { background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px;
                  padding:14px 16px; margin-top:20px; font-size:13px; color:#1e40af; }
    .gs-summary strong { color:#1e3a8a; }
  </style>
</head>
<body>
  <div id="pageContent">
    <div class="gs-shell">
      <div class="gs-header">
        <h1>🚀 เริ่มต้นใช้งาน Next Acc</h1>
        <p>ตรวจสอบและตั้งค่าระบบบัญชีให้พร้อมใช้งานใน 8 ขั้นตอน — ระบบจะเช็คความคืบหน้าให้อัตโนมัติ</p>
      </div>

      <div class="gs-progress" id="gsProgress">
        <div style="width:0%;"></div>
      </div>
      <div class="gs-progress-label">
        <span id="gsProgressText">กำลังโหลด...</span>
      </div>

      <div id="gsSteps">
        <p class="text-center text-gray-400" style="padding:40px;">กำลังตรวจสอบสถานะ...</p>
      </div>

      <div class="gs-summary" id="gsSummary" style="display:none;"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    // Each step:
    //   key:    stable identifier
    //   icon:   emoji
    //   title:  Thai short
    //   desc:   what & why
    //   page:   where to go to do it
    //   check:  async () => boolean | { done, hint? } — done==true means complete
    const Steps = [
      {
        key: 'company',
        icon: '🏢',
        title: 'ข้อมูลบริษัท',
        desc: 'ชื่อ, เลขผู้เสียภาษี, ที่อยู่, โลโก้ — แสดงบนใบกำกับภาษี/ใบเสร็จทุกใบ',
        page: '/pages/settings.html',
        check: async (api, companyId) => {
          try {
            const co = await api.getCompany(companyId);
            const c = co.data || co;
            return !!(c?.taxId && c?.name && c?.address);
          } catch { return false; }
        }
      },
      {
        key: 'fiscal',
        icon: '📅',
        title: 'งวดบัญชี (ปีและเดือน)',
        desc: 'สร้างงวดบัญชีของปีปัจจุบัน — จำเป็นสำหรับการบันทึก JE และปิดงวด',
        page: '/pages/fiscal.html',
        check: async (api, companyId) => {
          try {
            const periods = await api.getFiscalPeriods?.() ?? { data: [] };
            return (periods.data || []).length > 0;
          } catch { return false; }
        }
      },
      {
        key: 'coa',
        icon: '📚',
        title: 'ผังบัญชี (Chart of Accounts)',
        desc: 'ผังบัญชีถูก seed อัตโนมัติเมื่อสร้างบริษัท — ตรวจสอบและปรับแต่งให้เหมาะกับธุรกิจ',
        page: '/pages/accounts.html',
        check: async (api, companyId) => {
          try {
            const r = await api.getAccounts();
            return (r.data || []).length >= 20;
          } catch { return false; }
        }
      },
      {
        key: 'vat',
        icon: '💸',
        title: 'การจดทะเบียน VAT',
        desc: 'ระบุว่าบริษัทจด VAT แล้วหรือยัง + อัตรา VAT มาตรฐาน (default 7%)',
        page: '/pages/settings.html',
        check: async (api, companyId) => {
          try {
            const s = await api.getSettings();
            const d = s.data || s;
            return d?.vatRegistered !== undefined;
          } catch { return false; }
        }
      },
      {
        key: 'bank',
        icon: '🏦',
        title: 'บัญชีธนาคาร',
        desc: 'เพิ่มบัญชีธนาคารที่ใช้รับ-จ่าย — สำหรับเชื่อมกระแสเงินสดและกระทบยอด',
        page: '/pages/bank.html',
        check: async (api, companyId) => {
          try {
            const r = await api.getBankAccounts?.() ?? { data: [] };
            return (r.data || []).length > 0;
          } catch { return false; }
        }
      },
      {
        key: 'contact',
        icon: '👥',
        title: 'ลูกค้า / ผู้ขาย (อย่างน้อย 1 รายการ)',
        desc: 'เพิ่มผู้ติดต่อแรกของคุณ — จำเป็นสำหรับสร้างใบเสนอราคา / ใบกำกับภาษี',
        page: '/pages/contacts.html',
        check: async (api, companyId) => {
          try {
            const r = await api.getContacts?.('?page=1&pageSize=1') ?? { data: { items: [] } };
            return ((r.data?.items || r.data || [])).length > 0;
          } catch { return false; }
        }
      },
      {
        key: 'product',
        icon: '📦',
        title: 'สินค้า / บริการ',
        desc: 'เพิ่มรายการที่จะขายหรือบริการที่ให้ — ไม่บังคับ แต่จะช่วยให้สร้างเอกสารได้เร็วขึ้น',
        page: '/pages/products.html',
        check: async (api, companyId) => {
          try {
            const r = await api.getProducts?.('?page=1&pageSize=1') ?? { data: { items: [] } };
            return ((r.data?.items || r.data || [])).length > 0;
          } catch { return false; }
        },
        optional: true
      },
      {
        key: 'firstDoc',
        icon: '🧾',
        title: 'สร้างเอกสารใบแรก',
        desc: 'ลองสร้างใบเสนอราคาหรือใบกำกับภาษีใบแรกเพื่อทดสอบ flow ทั้งหมด',
        page: '/pages/documents.html?side=revenue&create=Quotation',
        check: async (api, companyId) => {
          try {
            const r = await api.getDocuments?.('?page=1&pageSize=1') ?? { data: { items: [] } };
            return ((r.data?.items || r.data || [])).length > 0;
          } catch { return false; }
        }
      },
    ];

    const Page = {
      // Race a promise against a timeout so a slow / hung endpoint can't
      // freeze the whole page. 5s per check is plenty for any healthy
      // API; on timeout the step shows "ตรวจสอบไม่ได้" with a retry.
      _withTimeout(promise, ms, label) {
        return Promise.race([
          promise.then(v => ({ ok: true, value: v })),
          new Promise(resolve => setTimeout(
            () => resolve({ ok: false, error: 'timeout', label }), ms))
        ]);
      },

      _renderStepRow(idx, r, status) {
        // status: 'pending' | 'done' | 'todo' | 'error'
        const icon = status === 'done' ? '✅'
                   : status === 'error' ? '⚠️'
                   : status === 'pending' ? '<span class="gs-spinner"></span>'
                   : '⬜';
        const cls = status === 'done' ? 'done'
                  : status === 'error' ? 'error'
                  : '';
        const btnText = status === 'done' ? 'ไปดู / แก้ไข'
                     : status === 'error' ? '🔁 ลองใหม่'
                     : status === 'pending' ? 'กำลังตรวจสอบ...'
                     : 'ตั้งค่าเลย →';
        const btnClass = status === 'done' ? 'btn-secondary' : 'btn-primary';
        const btnAttr = status === 'error'
          ? `href="#" onclick="Page.recheck(${idx});return false"`
          : status === 'pending' ? 'href="#" onclick="return false" style="opacity:.6;pointer-events:none"'
          : `href="${r.step.page}"`;
        return `
          <div class="gs-step ${cls}" id="gsStep${idx}">
            <div class="check">${icon}</div>
            <div class="body">
              <h3>${r.step.icon} ${r.step.title}${r.step.optional ? ' <span class="meta">(ไม่บังคับ)</span>' : ''}</h3>
              <div class="desc">${r.step.desc}</div>
              ${status === 'error' ? `<div class="meta" style="color:#dc2626">ตรวจสอบไม่สำเร็จ (timeout หรือ API error) — คลิก "ลองใหม่" หรือเปิดหน้านั้นดูตรงๆ</div>` : ''}
              <div class="actions">
                <a class="btn btn-sm ${btnClass}" ${btnAttr}>${btnText}</a>
                ${status !== 'done' && status !== 'pending' ? `<a class="btn btn-sm btn-ghost" href="${r.step.page}">เปิดหน้าทันที</a>` : ''}
              </div>
            </div>
          </div>`;
      },

      _updateSummary() {
        const required = this._results.filter(r => r && !r.step.optional);
        const settled = required.filter(r => r.status !== 'pending').length;
        const doneCount = required.filter(r => r.status === 'done').length;
        const total = required.length;
        const pct = total > 0 ? Math.round(doneCount / total * 100) : 0;

        document.querySelector('#gsProgress > div').style.width = pct + '%';
        document.getElementById('gsProgressText').textContent =
          settled < total
            ? `กำลังตรวจสอบ ${settled} / ${total} ขั้นตอน...`
            : `${doneCount} / ${total} (${pct}%)`;

        if (settled < total) return;  // hold summary until all settled

        const summary = document.getElementById('gsSummary');
        summary.style.display = '';
        if (pct === 100) {
          summary.innerHTML = `🎉 <strong>ระบบพร้อมใช้งานครบทุกขั้นตอน</strong> — เปิดใช้ฟีเจอร์ขั้นสูงเช่น POS, OCR สแกนใบเสร็จ, e-Tax Invoice ได้เลย`;
        } else if (pct >= 60) {
          summary.innerHTML = `⚙️ <strong>ใกล้พร้อมแล้ว</strong> — เหลืออีก ${total - doneCount} ขั้นตอน. หลังจากนี้คุณจะสามารถออกรายงานการเงินและยื่นภาษีได้`;
        } else {
          summary.innerHTML = `📋 <strong>ทำตามลำดับด้านบน</strong> — แต่ละขั้นกินเวลาประมาณ 1-3 นาที. ขั้นแรก ๆ ที่สำคัญสุดคือข้อมูลบริษัทและงวดบัญชี`;
        }
      },

      async _runCheck(idx) {
        const r = this._results[idx];
        r.status = 'pending';
        const rowEl = document.getElementById('gsStep' + idx);
        if (rowEl) rowEl.outerHTML = this._renderStepRow(idx, r, 'pending');
        this._updateSummary();

        const result = await this._withTimeout(
          r.step.check(this._api, this._companyId),
          5000, r.step.title);

        if (!result.ok) {
          r.status = 'error';
        } else {
          r.done = result.value === true;
          r.status = r.done ? 'done' : 'todo';
        }
        const newEl = document.getElementById('gsStep' + idx);
        if (newEl) newEl.outerHTML = this._renderStepRow(idx, r, r.status);
        this._updateSummary();
      },

      async recheck(idx) {
        await this._runCheck(idx);
      },

      async init() {
        const api = Layout.api(); if (!api) return;
        const co = JSON.parse(localStorage.getItem('currentCompany') || '{}');
        if (!co.id) {
          document.getElementById('gsSteps').innerHTML =
            '<p class="text-danger" style="padding:20px;">ยังไม่ได้เลือกบริษัท — กรุณาเลือกบริษัทก่อน</p>';
          return;
        }

        this._api = api;
        this._companyId = co.id;
        this._results = Steps.map(s => ({ step: s, done: false, status: 'pending' }));

        // Render skeleton IMMEDIATELY — every row shows a spinner so the
        // user sees the page in <100ms instead of staring at the
        // top-level "กำลังตรวจสอบ..." until all 8 checks return.
        document.getElementById('gsSteps').innerHTML = this._results
          .map((r, i) => this._renderStepRow(i, r, 'pending'))
          .join('');
        this._updateSummary();

        // Fire all checks in parallel but update each independently as
        // it resolves. Per-check 5s timeout ensures one slow endpoint
        // can't hold the others — its row just flips to "error" and
        // lets the user retry or open the page directly.
        this._results.forEach((_, i) => { this._runCheck(i); });
      }
    };

    document.addEventListener('DOMContentLoaded', () => Page.init());
  </script>
</body>
</html>
