<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เริ่มต้นใช้งาน - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .gs-shell { max-width:880px; margin:0 auto; padding:24px 16px 60px; }
    .gs-header h1 { margin:0 0 6px; font-size:24px; }
    .gs-header p { margin:0 0 22px; color:var(--gray-600); font-size:14px; }

    .gs-progress { background:var(--gray-100); border-radius:8px; height:10px; overflow:hidden; margin-bottom:24px; }
    .gs-progress > div { height:100%; background:var(--success); transition:width .4s ease; }
    .gs-progress-label { display:flex; justify-content:space-between; font-size:13px; margin-top:-18px; padding:0 12px; color:#fff; font-weight:600; line-height:10px; pointer-events:none; }

    .gs-step { background:#fff; border:1px solid var(--gray-200); border-radius:10px;
               margin-bottom:12px; padding:16px; display:flex; gap:14px; align-items:flex-start; }
    .gs-step.done { background:#f0fdf4; border-color:#bbf7d0; }
    .gs-step.error { background:#fef2f2; border-color:#fecaca; }
    .gs-step .check { font-size:28px; flex-shrink:0; line-height:1; padding-top:2px; }
    .gs-step.done .check { color:#16a34a; }
    .gs-step.error .check { color:#dc2626; }
    .gs-step:not(.done):not(.error) .check { color:var(--gray-300); }
    .gs-spinner { display:inline-block; width:20px; height:20px; border:2.5px solid #e2e8f0;
                  border-top-color:#3b82f6; border-radius:50%; animation:gs-spin .8s linear infinite;
                  vertical-align:middle; }
    @keyframes gs-spin { to { transform:rotate(360deg); } }
    .gs-step .body { flex:1; min-width:0; }
    .gs-step h3 { margin:0 0 4px; font-size:16px; }
    .gs-step .desc { font-size:13px; color:var(--gray-600); margin-bottom:8px; }
    .gs-step .meta { font-size:12px; color:var(--gray-500); }
    .gs-step .actions { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }

    .gs-summary { background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px;
                  padding:14px 16px; margin-top:20px; font-size:13px; color:#1e40af; }
    .gs-summary strong { color:#1e3a8a; }
  </style>
</head>
<body>
  <div id="pageContent">
    <div class="gs-shell">
      <div class="gs-header">
        <h1>🚀 เริ่มต้นใช้งาน Next Acc</h1>
        <p>ตรวจสอบและตั้งค่าระบบบัญชีให้พร้อมใช้งานทีละขั้น — ระบบจะเช็คความคืบหน้าให้อัตโนมัติ</p>
      </div>

      <div class="gs-progress" id="gsProgress">
        <div style="width:0%;"></div>
      </div>
      <div class="gs-progress-label">
        <span id="gsProgressText">กำลังโหลด...</span>
      </div>

      <div id="gsSteps">
        <p class="text-center text-gray-400" style="padding:40px;">กำลังตรวจสอบสถานะ...</p>
      </div>

      <div class="gs-summary" id="gsSummary" style="display:none;"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    // รอบ 259-3 (ทีม E 3ก-1 · 4.2 · คำตัดสิน 259-3-7): ขั้นตอน + ตัวตัดสิน "เสร็จ/ยัง" + ข้อความ + ลิงก์ มาจากเซิร์ฟเวอร์ (Helpers/GettingStartedChecklist)
    // — เดิมหน้านี้ถือกติกาทั้งชุดเอง (ผังบัญชี >= 20 · VAT · นับจากหน้าแรกของรายการ) · หน้านี้แสดงอย่างเดียว
    const Page = {
      async init() {
        if (!Layout.init('getting-started')) return;
        const cid = Layout.getCompanyId();
        const box = document.getElementById('gsSteps');
        if (!cid) { box.innerHTML = '<p class="text-danger" style="padding:20px;">ยังไม่ได้เลือกบริษัท — กรุณาเลือกบริษัทก่อน</p>'; return; }
        box.innerHTML = '<p class="text-center text-gray-400" style="padding:40px;">กำลังตรวจสอบสถานะ...</p>';
        let d;
        try {
          const res = await API.get(`/api/companies/${encodeURIComponent(cid)}/getting-started`);
          d = (res && res.data) || null;
        } catch (e) {
          box.innerHTML = `<div class="gs-step error"><div class="check">⚠️</div><div class="body"><h3>ตรวจสอบไม่สำเร็จ</h3>
            <div class="desc">${Layout.esc(e.message || '')}</div><div class="actions"><a class="btn btn-sm btn-primary" href="#" onclick="Page.init();return false">🔁 ลองใหม่</a></div></div></div>`;
          document.getElementById('gsProgressText').textContent = '-';
          return;
        }
        if (!d) return;
        const esc = Layout.esc;
        box.innerHTML = (d.steps || []).map(st => `
          <div class="gs-step ${st.done ? 'done' : ''}">
            <div class="check">${st.done ? '✅' : '⬜'}</div>
            <div class="body">
              <h3>${esc(st.icon)} ${esc(st.title)}${st.optional ? ' <span class="meta">(ไม่บังคับ)</span>' : ''}</h3>
              <div class="desc">${esc(st.description)}</div>
              ${st.hint ? `<div class="meta" style="color:#92400e">${esc(st.hint)}</div>` : ''}
              <div class="actions"><a class="btn btn-sm ${st.done ? 'btn-secondary' : 'btn-primary'}" href="${esc(st.href)}">${st.done ? 'ไปดู / แก้ไข' : 'ตั้งค่าเลย →'}</a></div>
            </div>
          </div>`).join('');
        const pct = Number(d.percent) || 0;
        document.querySelector('#gsProgress > div').style.width = pct + '%';
        document.getElementById('gsProgressText').textContent = `${Number(d.requiredDone)} / ${Number(d.requiredTotal)} (${pct}%)`;
        const summary = document.getElementById('gsSummary');
        summary.style.display = '';
        summary.innerHTML = pct === 100
          ? '🎉 <strong>ระบบพร้อมใช้งานครบทุกขั้นตอน</strong> — เปิดใช้ฟีเจอร์ขั้นสูงเช่น POS, สแกนใบเสร็จ, e-Tax Invoice ได้เลย'
          : `📋 <strong>เหลืออีก ${Number(d.requiredTotal) - Number(d.requiredDone)} ขั้นตอน</strong> — ทำตามลำดับด้านบน ขั้นแรก ๆ ที่สำคัญสุดคือข้อมูลบริษัทและงวดบัญชี`;
      },
    };

    document.addEventListener('DOMContentLoaded', () => Page.init());
  </script>
</body>
</html>
