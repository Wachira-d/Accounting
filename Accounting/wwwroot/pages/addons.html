<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ส่วนเสริมของฉัน - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin-bottom:16px }
    .card h3 { margin:0 0 12px; font-size:15px; font-weight:700; color:#0f172a }
    .addon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px }
    .addon { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:8px }
    .addon.on { border-color:#16a34a; box-shadow:0 0 0 1px #16a34a22 }
    .addon .top { display:flex; align-items:flex-start; gap:10px }
    .addon .ico { font-size:22px; line-height:1 }
    .addon .nm { font-weight:700; color:#0f172a; font-size:14px }
    .addon .ds { font-size:12px; color:#64748b; line-height:1.6 }
    .price { font-size:13px; font-weight:700; color:#0f172a }
    .price small { font-weight:500; color:#64748b }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700 }
    .pill.on { background:#dcfce7; color:#166534 }
    .pill.off { background:#f1f5f9; color:#64748b }
    .pill.trial { background:#fef3c7; color:#92400e }
    .quota-bar { height:10px; border-radius:999px; background:#e2e8f0; overflow:hidden }
    .quota-bar > i { display:block; height:100%; background:#16a34a; transition:width .3s }
    .quota-bar.w1 > i { background:#f59e0b }
    .quota-bar.w2 > i { background:#dc2626 }
    .muted { color:#94a3b8 }
    .consent { display:flex; gap:8px; align-items:flex-start; font-size:12px; color:#334155; background:#f8fafc;
               border:1px dashed #cbd5e1; border-radius:8px; padding:8px 10px }
    .mission { display:flex; gap:12px; align-items:center; border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px }
    .mission .g { flex:1 }
  </style>
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="container" style="max-width:1200px;margin:0 auto;padding:20px">

      <div style="margin-bottom:16px">
        <h1 style="margin:0;font-size:24px;font-weight:700">🧩 ส่วนเสริมของฉัน</h1>
        <p style="margin:4px 0 0;color:#64748b;font-size:14px">
          เปิด/ปิดได้เองตลอดเวลา — ปิดแล้วหยุดคิดค่าใช้จ่ายทันที ไม่มีสัญญาผูกมัด
        </p>
      </div>

      <div class="card" id="quotaCard">
        <h3>📄 โควตาเอกสารเดือนนี้</h3>
        <div id="quotaBody" class="muted">กำลังโหลด…</div>
      </div>

      <div class="card" id="missionCard" style="display:none">
        <h3>🎁 แลกโควตาเพิ่มโดยไม่เสียเงิน</h3>
        <div id="missionBody"></div>
      </div>

      <h3 style="margin:20px 0 10px;font-size:16px">ส่วนเสริมที่เปิดขาย</h3>
      <div class="addon-grid" id="addonGrid">
        <div class="muted">กำลังโหลด…</div>
      </div>
    </div>
  </div>

  <div class="modal" id="missionModal">
    <div class="modal-content" style="max-width:620px">
      <div class="modal-header">
        <h3 id="missionModalTitle">ภารกิจ</h3>
        <button class="modal-close" onclick="Page.closeMission()">&times;</button>
      </div>
      <div class="modal-body" id="missionModalBody"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      features: [],
      quota: null,

      async init() {
        if (!Layout.init('addons')) return;
        Layout.setTitle('ส่วนเสริมของฉัน');
        await this.loadAll();
      },

      cid() { return Layout.getCompanyId(); },

      async loadAll() {
        await Promise.all([this.loadFeatures(), this.loadQuota(), this.loadMissions()]);
      },

      // ───────── โควตาเอกสาร ─────────
      async loadQuota() {
        try {
          const res = await API.get(`/api/companies/${this.cid()}/metering/quota`);
          this.quota = res?.data || null;
        } catch { this.quota = null; }
        this.renderQuota();
      },

      renderQuota() {
        const el = document.getElementById('quotaBody');
        const q = this.quota;
        if (!q) { el.innerHTML = '<span class="muted">ดูโควตาไม่สำเร็จ — ลองรีเฟรชหน้านี้</span>'; return; }
        // limit ≤ 0 = แพ็กเกจไม่จำกัด (ไม่ใช่ "ศูนย์ใบ") — ห้ามวาดหลอดที่เต็มตลอด
        const unlimited = !q.effectiveLimit || q.effectiveLimit <= 0;
        const pct = unlimited ? 0 : Math.min(100, Math.round(q.used * 100 / q.effectiveLimit));
        el.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">
            <div>
              <div style="font-size:22px;font-weight:800;color:#0f172a">
                ${q.used.toLocaleString('th-TH')} ${unlimited ? '' : '/ ' + q.effectiveLimit.toLocaleString('th-TH')} ฉบับ
              </div>
              <div class="muted" style="font-size:12px">
                ${unlimited ? 'แพ็กเกจนี้ไม่จำกัดจำนวนเอกสาร'
                  : `โควตาแพ็กเกจ ${q.planLimit.toLocaleString('th-TH')} ฉบับ`
                    + (q.bonusQuota > 0
                        ? ` + โควตาเพิ่ม ${q.bonusQuota.toLocaleString('th-TH')} ฉบับ`
                          + (q.bonusExpiresAt ? ` (ถึง ${new Date(q.bonusExpiresAt).toLocaleDateString('th-TH')})` : '')
                        : '')}
              </div>
            </div>
            <div style="text-align:right">
              <button class="btn btn-secondary" onclick="Page.topUp()">➕ ซื้อโควตาเพิ่ม 100 ฉบับ</button>
              <div class="muted" style="font-size:11px;margin-top:2px">ใช้ได้ 60 วัน</div>
            </div>
          </div>
          ${unlimited ? '' : `<div class="quota-bar w${q.warnLevel}" style="margin:10px 0"><i style="width:${pct}%"></i></div>`}
          ${q.message ? `<div style="font-size:13px;color:${q.warnLevel === 2 ? '#b91c1c' : '#92400e'};font-weight:600">${Layout.esc(q.message)}</div>` : ''}
          <div class="muted" style="font-size:12px;margin-top:8px;line-height:1.7">
            เอกสารที่กฎหมายบังคับให้ออก (ใบกำกับภาษี · ใบเสร็จ · ใบลดหนี้/เพิ่มหนี้) <b>ออกได้เสมอ</b>
            แม้โควตาเต็ม — ระบบจะบันทึกเป็นค่าส่วนเกินแทนการปฏิเสธ
            ${q.overageEnabled ? `(ฉบับละ ${q.overageUnitPrice.toLocaleString('th-TH', { minimumFractionDigits: 2 })} บาท)` : ''}
            ${q.overageThisMonth > 0
              ? `<br>เดือนนี้มีส่วนเกินแล้ว ${q.overageThisMonth.toLocaleString('th-TH')} ฉบับ
                 เป็นเงิน ${q.overageChargedThisMonth.toLocaleString('th-TH', { minimumFractionDigits: 2 })} บาท` : ''}
          </div>`;
      },

      async topUp() {
        if (!confirm('ซื้อโควตาเพิ่ม 100 ฉบับ? ค่าใช้จ่ายจะเข้าบิลรอบถัดไป')) return;
        try {
          const res = await API.post(`/api/companies/${this.cid()}/metering/quota/topup`, { packs: 1 });
          this.quota = res?.data || this.quota;
          this.renderQuota();
          Layout.toast(res?.message || 'เพิ่มโควตาแล้ว', 'success');
        } catch (e) { Layout.toast(e.message || 'ซื้อโควตาไม่สำเร็จ', 'error'); }
      },

      // ───────── ภารกิจแลกโควตา ─────────
      async loadMissions() {
        let list = [];
        try {
          const res = await API.get(`/api/companies/${this.cid()}/metering/quota/rewards`);
          list = res?.data || [];
        } catch { list = []; }
        const card = document.getElementById('missionCard');
        // ไม่มีภารกิจ = เจ้าของระบบปิดไว้/แพ็กเกจไม่รองรับ → ซ่อนทั้งการ์ด
        // (สถานะปกติ ไม่ใช่ error — ห้ามขึ้นกล่องว่างให้ผู้ใช้สงสัย)
        if (!list.length) { card.style.display = 'none'; return; }
        card.style.display = '';
        document.getElementById('missionBody').innerHTML = list.map(m => `
          <div class="mission">
            <div style="font-size:22px">${m.kind === 'PartnerOffer' ? '🤝' : m.kind === 'Survey' ? '📝' : m.kind === 'Referral' ? '👥' : '🎬'}</div>
            <div class="g">
              <div style="font-weight:700;font-size:14px">${Layout.esc(m.title)}</div>
              ${m.description ? `<div class="muted" style="font-size:12px">${Layout.esc(m.description)}</div>` : ''}
              <div class="muted" style="font-size:11px;margin-top:2px">
                ใช้เวลา ${m.durationSeconds} วินาที · ได้ ${m.rewardDocuments} ฉบับ ·
                วันนี้ ${m.usedToday}/${m.maxPerDay} · เดือนนี้ ${m.usedThisMonth}/${m.maxPerMonth}
              </div>
              ${m.canClaim ? '' : `<div style="font-size:12px;color:#b45309;margin-top:2px">${Layout.esc(m.blockedReason || '')}</div>`}
            </div>
            <button class="btn ${m.canClaim ? 'btn-primary' : 'btn-secondary'}" ${m.canClaim ? '' : 'disabled'}
              onclick="Page.startMission('${m.id}')">เริ่ม</button>
          </div>`).join('');
        this._missions = list;
      },

      startMission(id) {
        const m = (this._missions || []).find(x => x.id === id);
        if (!m || !m.canClaim) return;
        const started = Date.now();
        const body = `
          <div>
            ${m.mediaUrl
              ? `<div style="border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:10px">
                   <iframe src="${Layout.esc(m.mediaUrl)}" style="width:100%;height:300px;border:0"
                           title="${Layout.esc(m.title)}"></iframe>
                 </div>`
              : (m.imageUrl ? `<img src="${Layout.esc(m.imageUrl)}" alt="" style="width:100%;border-radius:10px;margin-bottom:10px">` : '')}
            ${m.description ? `<div style="font-size:13px;color:#475569;line-height:1.7">${Layout.esc(m.description)}</div>` : ''}
            ${m.partnerUrl
              ? `<div style="margin-top:10px"><a class="btn btn-secondary" target="_blank" rel="noopener"
                   href="${Layout.esc(m.partnerUrl)}" onclick="Page._clicked=true">🔗 ดูข้อเสนอนี้</a></div>` : ''}
            <div id="missionTimer" style="margin-top:12px;font-size:13px;color:#64748b"></div>
            <div style="margin-top:12px;text-align:right">
              <button class="btn btn-primary" id="btnClaim" disabled
                onclick="Page.claim('${m.id}', ${started})">รับโควตา ${m.rewardDocuments} ฉบับ</button>
            </div>
          </div>`;
        document.getElementById('missionModalTitle').textContent = m.title;
        document.getElementById('missionModalBody').innerHTML = body;
        Layout.openModal('missionModal');
        this._clicked = false;
        const tick = () => {
          const left = m.durationSeconds - Math.floor((Date.now() - started) / 1000);
          const t = document.getElementById('missionTimer');
          const b = document.getElementById('btnClaim');
          if (!t || !b) { clearInterval(this._timer); return; }   // ผู้ใช้ปิดหน้าต่างแล้ว
          if (left > 0) { t.textContent = `อีก ${left} วินาที…`; }
          else { t.textContent = 'ครบเวลาแล้ว — กดรับโควตาได้เลย'; b.disabled = false; clearInterval(this._timer); }
        };
        clearInterval(this._timer);
        this._timer = setInterval(tick, 500);
        tick();
      },

      async claim(id, startedAt) {
        clearInterval(this._timer);
        const watched = Math.floor((Date.now() - startedAt) / 1000);
        try {
          const res = await API.post(
            `/api/companies/${this.cid()}/metering/quota/rewards/${id}/claim`,
            { watchedSeconds: watched, clickedThrough: !!this._clicked });
          Layout.toast(res?.message || 'รับโควตาแล้ว', 'success');
          this.closeMission();
          await Promise.all([this.loadQuota(), this.loadMissions()]);
        } catch (e) { Layout.toast(e.message || 'รับโควตาไม่สำเร็จ', 'error'); }
      },

      closeMission() {
        clearInterval(this._timer);
        Layout.closeModal('missionModal');
        document.getElementById('missionModalBody').innerHTML = '';   // หยุด iframe ที่ยังเล่นอยู่
      },

      // ───────── ส่วนเสริม ─────────
      async loadFeatures() {
        try {
          const res = await API.get(`/api/companies/${this.cid()}/metering/features`);
          this.features = res?.data || [];
        } catch { this.features = []; }
        this.renderFeatures();
      },

      priceText(f) {
        if (!f.pricing) return f.priceNote || 'ยังไม่ได้กำหนดราคา';
        const p = f.pricing;
        const amt = (p.unitPrice ?? 0).toLocaleString('th-TH', { minimumFractionDigits: 2 });
        if (p.method === 'FlatMonthly') return `${amt} บาท <small>/ เดือน</small>`;
        if (p.method === 'PerUnit' || p.method === 'PerCall')
          return `${amt} บาท <small>/ ${Layout.esc(f.unitLabel || 'หน่วย')}</small>`
            + (p.freeQuotaPerMonth > 0 ? ` <small>(ฟรี ${p.freeQuotaPerMonth}/เดือน)</small>` : '');
        return `${amt} บาท`;
      },

      renderFeatures() {
        const grid = document.getElementById('addonGrid');
        // มิเตอร์ของระบบไม่ใช่สวิตช์ — ห้ามโผล่ให้ลูกค้า "ปิด" แล้วเข้าใจว่าไม่ต้องจ่าย
        const items = this.features.filter(f => (f.featureCode || '').indexOf('.') > 0
          && !['documents.overage', 'documents.topup', 'lodging.stay',
               'lodging.email.overage', 'lodging.notify.sms'].includes(f.featureCode));
        if (!items.length) { grid.innerHTML = '<div class="muted">ยังไม่มีส่วนเสริมที่เปิดขาย</div>'; return; }
        grid.innerHTML = items.map(f => `
          <div class="addon ${f.isEnabled ? 'on' : ''}">
            <div class="top">
              <div class="ico">${Layout.esc(f.icon || '🧩')}</div>
              <div style="flex:1">
                <div class="nm">${Layout.esc(f.name)}</div>
                <div class="ds">${Layout.esc(f.description || '')}</div>
              </div>
              <span class="pill ${f.isEnabled ? 'on' : 'off'}">${f.isEnabled ? 'เปิดอยู่' : 'ปิดอยู่'}</span>
            </div>
            <div class="price">${this.priceText(f)}</div>
            ${f.isEnabled
              ? `<button class="btn btn-secondary" onclick="Page.toggle('${Layout.esc(f.featureCode)}', false, '${Layout.esc(f.name)}')">ปิดใช้งาน</button>`
              : `<div class="consent">
                   <input type="checkbox" id="ck_${Layout.esc(f.featureCode)}">
                   <label for="ck_${Layout.esc(f.featureCode)}">ยอมรับค่าใช้จ่ายตามราคาข้างบน</label>
                 </div>
                 <button class="btn btn-primary" onclick="Page.toggle('${Layout.esc(f.featureCode)}', true, '${Layout.esc(f.name)}')">เปิดใช้งาน</button>`}
          </div>`).join('');
      },

      async toggle(code, enable, name) {
        // ยินยอมค่าใช้จ่ายเป็นการกดแยกจากปุ่มเปิด — การเปิดคือการก่อหนี้
        // ห้ามให้ปุ่มเดียวทำสองความหมาย
        if (enable) {
          const ck = document.getElementById('ck_' + code);
          if (!ck || !ck.checked) { Layout.toast('กรุณาติ๊กยอมรับค่าใช้จ่ายก่อนเปิดใช้งาน', 'error'); return; }
        } else if (!confirm(`ปิด "${name}" ใช่ไหม? ระบบจะหยุดคิดค่าใช้จ่ายทันที`)) return;

        try {
          const res = await API.post(
            `/api/companies/${this.cid()}/metering/features/${encodeURIComponent(code)}`, { enabled: enable });
          Layout.toast(res?.message || 'บันทึกแล้ว', 'success');
          await this.loadFeatures();
          // สิทธิ์เปลี่ยน → เมนู/หน้าอื่นต้องเห็นทันที ไม่ต้องให้ผู้ใช้ล็อกอินใหม่
          if (Layout.loadSubscription) await Layout.loadSubscription();
        } catch (e) { Layout.toast(e.message || 'บันทึกไม่สำเร็จ', 'error'); }
      },
    };
    Page.init();
  </script>
</body>
</html>
