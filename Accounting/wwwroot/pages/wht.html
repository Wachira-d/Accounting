<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หนังสือรับรองหัก ณ ที่จ่าย - Nexaacc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">หนังสือรับรองหัก ณ ที่จ่าย</h2><p class="page-subtitle">ออกหนังสือรับรองการหักภาษี ณ ที่จ่าย</p></div>
      <button class="btn btn-primary" onclick="Page.openCreate()">+ ออกหนังสือรับรอง</button>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-4 gap-4" style="margin-bottom:16px">
      <div class="card"><div class="text-gray-500 text-xs">ทั้งหมด</div><div class="text-2xl font-bold" id="statTotal">0</div></div>
      <div class="card"><div class="text-gray-500 text-xs">ร่าง</div><div class="text-2xl font-bold text-warning" id="statDraft">0</div></div>
      <div class="card"><div class="text-gray-500 text-xs">ออกแล้ว</div><div class="text-2xl font-bold text-success" id="statIssued">0</div></div>
      <div class="card"><div class="text-gray-500 text-xs">ยกเลิก</div><div class="text-2xl font-bold text-danger" id="statVoid">0</div></div>
    </div>

    <!-- Filters -->
    <div class="toolbar" style="margin-bottom:16px">
      <input type="text" class="search-input" placeholder="ค้นหาเลขที่, ผู้ถูกหัก..." id="searchInput" oninput="Page.filter()">
      <select class="filter-select" id="formFilter" onchange="Page.load()">
        <option value="">ทุกแบบ</option>
        <option value="PND3">ภ.ง.ด.3</option>
        <option value="PND53">ภ.ง.ด.53</option>
        <option value="PND1">ภ.ง.ด.1</option>
      </select>
      <select class="filter-select" id="statusFilter" onchange="Page.filter()">
        <option value="">ทุกสถานะ</option>
        <option value="Draft">ร่าง</option>
        <option value="Issued">ออกแล้ว</option>
        <option value="Voided">ยกเลิก</option>
      </select>
      <input type="number" class="form-input" id="yearFilter" placeholder="ปี" style="width:80px" onchange="Page.load()">
      <input type="number" class="form-input" id="monthFilter" placeholder="เดือน" min="1" max="12" style="width:80px" onchange="Page.load()">
    </div>

    <div class="table-container">
      <table class="table">
        <thead><tr><th>เลขที่</th><th>ผู้ถูกหัก</th><th>แบบ</th><th>ปี/เดือน</th><th class="text-right">เงินได้</th><th class="text-right">ภาษี</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="8" class="text-center text-gray-400" style="padding:40px">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
    <div id="pagination"></div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="formModal">
      <div class="modal" style="max-width:700px">
        <div class="modal-header"><h3 class="modal-title" id="formTitle">ออกหนังสือรับรองหัก ณ ที่จ่าย</h3><button class="modal-close" onclick="Layout.closeModal('formModal')">&times;</button></div>
        <div class="modal-body">
          <div class="form-group"><label class="form-label">ผู้ถูกหักภาษี (ผู้ติดต่อ) *</label>
            <select class="form-select" id="fContact"><option value="">เลือกผู้ติดต่อ</option></select>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">แบบ *</label>
              <select class="form-select" id="fFormType"><option value="PND3">ภ.ง.ด.3</option><option value="PND53">ภ.ง.ด.53</option><option value="PND1">ภ.ง.ด.1</option></select>
            </div>
            <div class="form-group"><label class="form-label">ประเภท *</label>
              <select class="form-select" id="fCertType"><option value="Withhold">หัก ณ ที่จ่าย</option><option value="PayAlways">ออกให้ตลอดไป</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">ปีภาษี *</label><input type="number" class="form-input" id="fYear" value="2026"></div>
            <div class="form-group"><label class="form-label">เดือนภาษี *</label><input type="number" class="form-input" id="fMonth" min="1" max="12"></div>
          </div>
          <h4 class="text-sm font-semibold" style="margin:16px 0 8px">รายการเงินได้</h4>
          <div class="table-container"><table class="table">
            <thead><tr><th>ประเภทเงินได้</th><th>วันจ่าย</th><th class="text-right">เงินได้</th><th class="text-right">อัตรา%</th><th class="text-right">ภาษี</th><th></th></tr></thead>
            <tbody id="linesBody"></tbody>
          </table></div>
          <button class="btn btn-sm btn-secondary" style="margin-top:8px" onclick="Page.addLine()">+ เพิ่มรายการ</button>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="Layout.closeModal('formModal')">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.save()">บันทึก</button>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
      <div class="modal" style="max-width:700px">
        <div class="modal-header"><h3 class="modal-title">รายละเอียดหนังสือรับรอง</h3><button class="modal-close" onclick="Layout.closeModal('detailModal')">&times;</button></div>
        <div class="modal-body" id="detailContent"></div>
        <div class="modal-footer" id="detailFooter"></div>
      </div>
    </div>

    <!-- PDF Preview Modal -->
    <div class="modal-overlay" id="pdfModal">
      <div class="modal" style="max-width:900px;height:90vh">
        <div class="modal-header"><h3 class="modal-title">พิมพ์หนังสือรับรอง</h3><button class="modal-close" onclick="Layout.closeModal('pdfModal')">&times;</button></div>
        <div class="modal-body" id="pdfContent" style="overflow:auto;flex:1"></div>
        <div class="modal-footer"><button class="btn btn-primary" onclick="window.print()">พิมพ์</button></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      page: 1,
      allCerts: [],
      contacts: [],
      async init() {
        if (!Layout.init('wht')) return;
        Layout.setTitle('หนังสือรับรองหัก ณ ที่จ่าย');
        const api = Layout.api(); if (!api) return;
        try {
          const r = await api.getContacts('?pageSize=500');
          this.contacts = r.data?.items || r.data || [];
          const sel = document.getElementById('fContact');
          this.contacts.forEach(c => { sel.innerHTML += `<option value="${c.id}">${c.name} ${c.taxId ? '('+c.taxId+')' : ''}</option>`; });
        } catch(e){}
        await this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        let q = `?page=${this.page}&pageSize=20`;
        const form = document.getElementById('formFilter').value;
        const year = document.getElementById('yearFilter').value;
        const month = document.getElementById('monthFilter').value;
        if (form) q += `&taxFormType=${form}`;
        if (year) q += `&year=${year}`;
        if (month) q += `&month=${month}`;
        try {
          const res = await api.getWhtCerts(q);
          const data = res.data;
          this.allCerts = data?.items || data || [];
          this.updateStats();
          this.filter();
          const totalPages = data?.totalPages || 1;
          document.getElementById('pagination').innerHTML = Layout.renderPagination(this.page, totalPages, 'Page.goPage');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      updateStats() {
        const items = this.allCerts;
        document.getElementById('statTotal').textContent = items.length;
        document.getElementById('statDraft').textContent = items.filter(i => i.status === 'Draft').length;
        document.getElementById('statIssued').textContent = items.filter(i => i.status === 'Issued').length;
        document.getElementById('statVoid').textContent = items.filter(i => i.status === 'Voided').length;
      },
      filter() {
        const search = (document.getElementById('searchInput').value || '').toLowerCase();
        const statusF = document.getElementById('statusFilter').value;
        let items = this.allCerts;
        if (search) items = items.filter(w => (w.certificateNumber || '').toLowerCase().includes(search) || (w.payeeName || '').toLowerCase().includes(search));
        if (statusF) items = items.filter(w => w.status === statusF);
        const tbody = document.getElementById('tableBody');
        if (!items.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-400" style="padding:40px">ไม่มีรายการ</td></tr>'; return; }
        const formMap = { PND3: 'ภ.ง.ด.3', PND53: 'ภ.ง.ด.53', PND1: 'ภ.ง.ด.1' };
        tbody.innerHTML = items.map(w => `<tr>
          <td class="font-medium">${w.certificateNumber || '-'}</td>
          <td>${w.payeeName}</td>
          <td>${formMap[w.taxFormType] || w.taxFormName || w.taxFormType}</td>
          <td>${w.taxYear}/${String(w.taxMonth).padStart(2,'0')}</td>
          <td class="text-right">${Layout.money(w.totalIncomeAmount)}</td>
          <td class="text-right font-semibold">${Layout.money(w.totalTaxAmount)}</td>
          <td>${Layout.statusBadge(w.status)}</td>
          <td class="flex gap-1">
            <button class="btn btn-sm btn-ghost" onclick="Page.viewDetail('${w.id}')">ดู</button>
            ${w.status === 'Issued' ? `<button class="btn btn-sm btn-secondary" onclick="Page.printCert('${w.id}')">พิมพ์</button>` : ''}
          </td>
        </tr>`).join('');
      },
      goPage(p) { Page.page = p; Page.load(); },
      async viewDetail(id) {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getWhtCert(id);
          const d = res.data || {};
          const formMap = { PND3: 'ภ.ง.ด.3', PND53: 'ภ.ง.ด.53', PND1: 'ภ.ง.ด.1' };
          const certTypeMap = { Withhold: 'หัก ณ ที่จ่าย', PayAlways: 'ออกให้ตลอดไป' };
          let html = `
            <div class="grid grid-2 gap-4" style="margin-bottom:16px">
              <div><span class="text-gray-500 text-xs">เลขที่</span><div class="font-semibold">${d.certificateNumber || '-'}</div></div>
              <div><span class="text-gray-500 text-xs">สถานะ</span><div>${Layout.statusBadge(d.status)}</div></div>
              <div><span class="text-gray-500 text-xs">ผู้ถูกหักภาษี</span><div>${d.payeeName || '-'}</div></div>
              <div><span class="text-gray-500 text-xs">เลขประจำตัวผู้เสียภาษี</span><div>${d.payeeTaxId || '-'}</div></div>
              <div><span class="text-gray-500 text-xs">แบบ</span><div>${formMap[d.taxFormType] || d.taxFormType}</div></div>
              <div><span class="text-gray-500 text-xs">ประเภท</span><div>${certTypeMap[d.certificateType] || d.certificateType || '-'}</div></div>
              <div><span class="text-gray-500 text-xs">ปี/เดือน</span><div>${d.taxYear}/${String(d.taxMonth).padStart(2,'0')}</div></div>
              <div><span class="text-gray-500 text-xs">วันที่ออก</span><div>${d.issuedDate ? Layout.date(d.issuedDate) : '-'}</div></div>
            </div>`;
          if (d.lines && d.lines.length) {
            const incMap = {'1':'40(1) เงินเดือน','2':'40(2) รับจ้าง','3':'40(3) ค่าลิขสิทธิ์','5':'40(5) ค่าเช่า','6':'40(6) วิชาชีพ','8':'40(8) อื่นๆ'};
            html += '<h4 class="text-sm font-semibold" style="margin:12px 0 8px">รายการเงินได้</h4><div class="table-container"><table class="table"><thead><tr><th>ประเภท</th><th>วันจ่าย</th><th class="text-right">เงินได้</th><th class="text-right">อัตรา%</th><th class="text-right">ภาษี</th></tr></thead><tbody>';
            html += d.lines.map(l => `<tr>
              <td>${incMap[l.incomeTypeCode] || l.incomeTypeCode}</td>
              <td>${Layout.date(l.paymentDate)}</td>
              <td class="text-right">${Layout.money(l.incomeAmount)}</td>
              <td class="text-right">${l.taxRate}%</td>
              <td class="text-right font-semibold">${Layout.money(l.taxAmount)}</td>
            </tr>`).join('');
            html += '</tbody></table></div>';
          }
          html += `<div class="grid grid-2 gap-4" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
            <div><span class="text-gray-500 text-xs">รวมเงินได้</span><div class="text-lg font-bold">${Layout.money(d.totalIncomeAmount)}</div></div>
            <div><span class="text-gray-500 text-xs">รวมภาษี</span><div class="text-lg font-bold text-danger">${Layout.money(d.totalTaxAmount)}</div></div>
          </div>`;
          document.getElementById('detailContent').innerHTML = html;
          let footer = '<button class="btn btn-secondary" onclick="Layout.closeModal(\'detailModal\')">ปิด</button>';
          if (d.status === 'Draft') {
            footer = `<button class="btn btn-danger" onclick="Page.voidCert('${d.id}')">ยกเลิก</button>
              <button class="btn btn-success" onclick="Page.issueCert('${d.id}')">ออกหนังสือรับรอง</button>` + footer;
          } else if (d.status === 'Issued') {
            footer = `<button class="btn btn-secondary" onclick="Page.printCert('${d.id}')">พิมพ์</button>
              <button class="btn btn-danger" onclick="Page.voidCert('${d.id}')">ยกเลิก</button>` + footer;
          }
          document.getElementById('detailFooter').innerHTML = footer;
          Layout.openModal('detailModal');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      async issueCert(id) {
        const api = Layout.api(); if (!api) return;
        try {
          await api.issueWhtCert(id);
          Layout.closeModal('detailModal');
          Layout.toast('ออกหนังสือรับรองสำเร็จ');
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      async voidCert(id) {
        if (!confirm('ต้องการยกเลิกหนังสือรับรองนี้?')) return;
        const api = Layout.api(); if (!api) return;
        try {
          await api.voidWhtCert(id);
          Layout.closeModal('detailModal');
          Layout.toast('ยกเลิกสำเร็จ');
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      printCert(id) {
        const cert = this.allCerts.find(c => c.id === id);
        if (!cert) return;
        const formMap = { PND3: 'ภ.ง.ด.3', PND53: 'ภ.ง.ด.53', PND1: 'ภ.ง.ด.1' };
        const html = `
          <div style="font-family:'Noto Sans Thai',sans-serif;padding:40px;max-width:800px;margin:auto">
            <div style="text-align:center;margin-bottom:24px">
              <h2 style="margin:0">หนังสือรับรองการหักภาษี ณ ที่จ่าย</h2>
              <p style="margin:4px 0">ตามมาตรา 50 ทวิ แห่งประมวลรัษฎากร</p>
              <p style="margin:4px 0">แบบ ${formMap[cert.taxFormType] || cert.taxFormType}</p>
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:16px">
              <div><strong>เลขที่:</strong> ${cert.certificateNumber || '-'}</div>
              <div><strong>ปี/เดือน:</strong> ${cert.taxYear}/${String(cert.taxMonth).padStart(2,'0')}</div>
            </div>
            <div style="border:1px solid #ccc;padding:16px;margin-bottom:16px;border-radius:4px">
              <div><strong>ผู้ถูกหักภาษี:</strong> ${cert.payeeName || '-'}</div>
              <div><strong>เลขประจำตัวผู้เสียภาษี:</strong> ${cert.payeeTaxId || '-'}</div>
            </div>
            <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
              <thead><tr style="background:#f5f5f5"><th style="border:1px solid #ccc;padding:8px;text-align:left">ประเภทเงินได้</th><th style="border:1px solid #ccc;padding:8px;text-align:right">เงินได้</th><th style="border:1px solid #ccc;padding:8px;text-align:right">ภาษีที่หัก</th></tr></thead>
              <tbody><tr><td style="border:1px solid #ccc;padding:8px">รวม</td><td style="border:1px solid #ccc;padding:8px;text-align:right">${Layout.money(cert.totalIncomeAmount)}</td><td style="border:1px solid #ccc;padding:8px;text-align:right">${Layout.money(cert.totalTaxAmount)}</td></tr></tbody>
            </table>
            <div style="display:flex;justify-content:space-between;margin-top:48px">
              <div style="text-align:center;width:45%"><div style="border-top:1px solid #333;padding-top:8px">ผู้จ่ายเงิน</div></div>
              <div style="text-align:center;width:45%"><div style="border-top:1px solid #333;padding-top:8px">ผู้รับเงิน</div></div>
            </div>
          </div>`;
        document.getElementById('pdfContent').innerHTML = html;
        Layout.openModal('pdfModal');
      },
      addLine() {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><select class="form-select" data-f="code" style="font-size:12px"><option value="1">40(1) เงินเดือน</option><option value="2">40(2) รับจ้าง</option><option value="3">40(3) ค่าลิขสิทธิ์</option><option value="5">40(5) ค่าเช่า</option><option value="6">40(6) วิชาชีพ</option><option value="8">40(8) อื่นๆ</option></select></td>
          <td><input type="date" class="form-input" data-f="date" style="font-size:12px"></td>
          <td><input type="number" class="form-input text-right" data-f="income" step="0.01" style="font-size:12px"></td>
          <td><input type="number" class="form-input text-right" data-f="rate" value="3" step="0.01" style="font-size:12px;width:60px"></td>
          <td><input type="number" class="form-input text-right" data-f="tax" step="0.01" style="font-size:12px" readonly></td>
          <td><button class="btn btn-sm btn-ghost text-danger" onclick="this.closest('tr').remove()">&#10005;</button></td>`;
        const calc = () => {
          const inc = parseFloat(row.querySelector('[data-f="income"]').value) || 0;
          const rate = parseFloat(row.querySelector('[data-f="rate"]').value) || 0;
          row.querySelector('[data-f="tax"]').value = (inc * rate / 100).toFixed(2);
        };
        row.querySelector('[data-f="income"]').addEventListener('input', calc);
        row.querySelector('[data-f="rate"]').addEventListener('input', calc);
        document.getElementById('linesBody').appendChild(row);
      },
      openCreate() {
        document.getElementById('formTitle').textContent = 'ออกหนังสือรับรองหัก ณ ที่จ่าย';
        document.getElementById('fContact').value = '';
        document.getElementById('fFormType').value = 'PND3';
        document.getElementById('fCertType').value = 'Withhold';
        document.getElementById('fYear').value = new Date().getFullYear();
        document.getElementById('fMonth').value = new Date().getMonth() + 1;
        document.getElementById('linesBody').innerHTML = '';
        this.addLine();
        Layout.openModal('formModal');
      },
      async save() {
        const api = Layout.api(); if (!api) return;
        const contactId = document.getElementById('fContact').value;
        if (!contactId) { Layout.toast('กรุณาเลือกผู้ติดต่อ', 'error'); return; }
        const lines = [];
        document.querySelectorAll('#linesBody tr').forEach(row => {
          lines.push({
            incomeTypeCode: row.querySelector('[data-f="code"]').value,
            incomeDescription: '',
            paymentDate: row.querySelector('[data-f="date"]').value,
            incomeAmount: parseFloat(row.querySelector('[data-f="income"]').value) || 0,
            taxRate: parseFloat(row.querySelector('[data-f="rate"]').value) || 0,
            taxAmount: parseFloat(row.querySelector('[data-f="tax"]').value) || 0,
          });
        });
        try {
          await api.createWhtCert({
            payeeContactId: contactId,
            taxFormType: document.getElementById('fFormType').value,
            taxYear: parseInt(document.getElementById('fYear').value),
            taxMonth: parseInt(document.getElementById('fMonth').value),
            certificateType: document.getElementById('fCertType').value,
            lines
          });
          Layout.closeModal('formModal');
          Layout.toast('ออกหนังสือรับรองสำเร็จ');
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      }
    };
    Page.init();
  </script>
</body>
</html>
