<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานภาษี - AcctPlatform</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">รายงานภาษี</h2><p class="page-subtitle">ภาษีมูลค่าเพิ่ม ภาษีหัก ณ ที่จ่าย</p></div>
      <button class="btn btn-primary" onclick="Page.openGenerate()">+ สร้างรายงาน</button>
    </div>

    <div class="tabs">
      <div class="tab active" data-type="" onclick="Page.setType(this)">ทั้งหมด</div>
      <div class="tab" data-type="VAT" onclick="Page.setType(this)">ภาษีมูลค่าเพิ่ม</div>
      <div class="tab" data-type="WithholdingTax3" onclick="Page.setType(this)">หัก ณ ที่จ่าย (ภ.ง.ด.3)</div>
      <div class="tab" data-type="WithholdingTax53" onclick="Page.setType(this)">หัก ณ ที่จ่าย (ภ.ง.ด.53)</div>
    </div>

    <div class="table-container">
      <table class="table">
        <thead><tr><th>ประเภท</th><th>ปี</th><th>เดือน</th><th class="text-right">ภาษีขาย</th><th class="text-right">ภาษีซื้อ</th><th class="text-right">ภาษีสุทธิ</th><th>สถานะ</th><th>วันที่ยื่น</th><th>จัดการ</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="9" class="text-center text-gray-400" style="padding:40px">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
    <div id="pagination"></div>

    <div class="modal-overlay" id="genModal">
      <div class="modal" style="max-width:400px">
        <div class="modal-header"><h3 class="modal-title">สร้างรายงานภาษี</h3><button class="modal-close" onclick="Layout.closeModal('genModal')">&times;</button></div>
        <div class="modal-body">
          <div class="form-group"><label class="form-label">ประเภทภาษี *</label>
            <select class="form-select" id="gType">
              <option value="VAT">ภาษีมูลค่าเพิ่ม (ภ.พ.30)</option>
              <option value="WithholdingTax3">หัก ณ ที่จ่าย (ภ.ง.ด.3)</option>
              <option value="WithholdingTax53">หัก ณ ที่จ่าย (ภ.ง.ด.53)</option>
              <option value="WithholdingTax1">หัก ณ ที่จ่าย (ภ.ง.ด.1)</option>
              <option value="SocialSecurity">ประกันสังคม</option>
              <option value="CorporateIncomeTax">ภาษีนิติบุคคล</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">ปี *</label><input type="number" class="form-input" id="gYear" value="2026"></div>
            <div class="form-group"><label class="form-label">เดือน *</label>
              <select class="form-select" id="gMonth">
                <option value="1">มกราคม</option><option value="2">กุมภาพันธ์</option><option value="3">มีนาคม</option>
                <option value="4">เมษายน</option><option value="5">พฤษภาคม</option><option value="6">มิถุนายน</option>
                <option value="7">กรกฎาคม</option><option value="8">สิงหาคม</option><option value="9">กันยายน</option>
                <option value="10">ตุลาคม</option><option value="11">พฤศจิกายน</option><option value="12">ธันวาคม</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="Layout.closeModal('genModal')">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.generate()">สร้างรายงาน</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      page: 1, taxType: '',
      async init() {
        if (!Layout.init('tax')) return;
        Layout.setTitle('รายงานภาษี');
        await this.load();
      },
      setType(el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        this.taxType = el.dataset.type;
        this.page = 1;
        this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        let q = `?page=${this.page}&pageSize=20`;
        if (this.taxType) q += `&taxType=${this.taxType}`;
        try {
          const res = await api.getTaxReports(q);
          const data = res.data; const items = data?.items || data || [];
          const tbody = document.getElementById('tableBody');
          const typeMap = { VAT: 'ภ.พ.30', WithholdingTax3: 'ภ.ง.ด.3', WithholdingTax53: 'ภ.ง.ด.53', WithholdingTax1: 'ภ.ง.ด.1', SocialSecurity: 'ประกันสังคม', CorporateIncomeTax: 'ภาษีนิติบุคคล' };
          const monthNames = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
          if (!items.length) { tbody.innerHTML = '<tr><td colspan="9" class="text-center text-gray-400" style="padding:40px">ไม่มีรายงาน</td></tr>'; return; }
          tbody.innerHTML = items.map(r => `<tr>
            <td class="font-medium">${typeMap[r.taxType] || r.taxType}</td>
            <td>${r.year}</td>
            <td>${monthNames[r.month]}</td>
            <td class="text-right">${Layout.money(r.outputVat)}</td>
            <td class="text-right">${Layout.money(r.inputVat)}</td>
            <td class="text-right font-semibold ${r.netVat > 0 ? 'text-danger' : 'text-success'}">${Layout.money(r.netVat)}</td>
            <td>${Layout.statusBadge(r.status)}</td>
            <td>${Layout.date(r.filedDate)}</td>
            <td><button class="btn btn-sm btn-ghost">ดู</button></td>
          </tr>`).join('');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      openGenerate() {
        const now = new Date();
        document.getElementById('gYear').value = now.getFullYear();
        document.getElementById('gMonth').value = now.getMonth() + 1;
        Layout.openModal('genModal');
      },
      async generate() {
        const api = Layout.api(); if (!api) return;
        try {
          await api.generateTaxReport({
            taxType: document.getElementById('gType').value,
            year: parseInt(document.getElementById('gYear').value),
            month: parseInt(document.getElementById('gMonth').value)
          });
          Layout.closeModal('genModal');
          Layout.toast('สร้างรายงานภาษีสำเร็จ');
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      }
    };
    Page.init();
  </script>
</body>
</html>
