<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แพ็คเกจบริการ - AcctPlatform</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">แพ็คเกจบริการ</h2><p class="page-subtitle">จัดการแพ็คเกจบริการ POS</p></div>
      <button class="btn btn-primary" onclick="Page.openCreate()">+ เพิ่มแพ็คเกจ</button>
    </div>
    <div class="toolbar">
      <input type="text" class="search-input" placeholder="ค้นหาแพ็คเกจ..." id="searchInput" oninput="Page.load()">
      <select class="filter-select" id="categoryFilter" onchange="Page.load()">
        <option value="">ทุกหมวดหมู่</option>
      </select>
    </div>
    <div class="table-container">
      <table class="table">
        <thead><tr><th>ชื่อ</th><th>หมวดหมู่</th><th class="text-right">ราคา</th><th class="text-right">ระยะเวลา (นาที)</th><th class="text-right">จำนวนขั้นตอน</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="7" class="text-center text-gray-400" style="padding:40px">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
    <div id="pagination"></div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="formModal">
      <div class="modal" style="max-width:780px">
        <div class="modal-header"><h3 class="modal-title" id="formTitle">เพิ่มแพ็คเกจ</h3><button class="modal-close" onclick="Layout.closeModal('formModal')">&times;</button></div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="form-row">
            <div class="form-group"><label class="form-label">ชื่อแพ็คเกจ (ไทย) *</label><input type="text" class="form-input" id="fName"></div>
            <div class="form-group"><label class="form-label">ชื่อ (อังกฤษ)</label><input type="text" class="form-input" id="fNameEn"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">SKU</label><input type="text" class="form-input" id="fSku"></div>
            <div class="form-group"><label class="form-label">หมวดหมู่</label><input type="text" class="form-input" id="fCategory"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">ราคา *</label><input type="number" class="form-input" id="fPrice" step="0.01"></div>
            <div class="form-group"><label class="form-label">ต้นทุน</label><input type="number" class="form-input" id="fCostPrice" step="0.01" value="0"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">ระยะเวลา (นาที) *</label><input type="number" class="form-input" id="fDuration" min="1"></div>
            <div class="form-group"><label class="form-label">ลำดับการแสดง</label><input type="number" class="form-input" id="fSortOrder" value="0"></div>
          </div>
          <div class="form-row">
            <div class="form-group form-checkbox" style="margin-top:8px"><input type="checkbox" id="fVatIncl" checked><label for="fVatIncl">ราคารวม VAT แล้ว</label></div>
            <div class="form-group"><label class="form-label">URL รูปภาพ</label><input type="text" class="form-input" id="fImageUrl"></div>
          </div>
          <div class="form-group"><label class="form-label">คำอธิบาย</label><textarea class="form-textarea" id="fDesc" rows="2"></textarea></div>

          <!-- Components Section (edit mode only) -->
          <div id="componentsSection" style="display:none; margin-top:16px; border-top:1px solid var(--gray-200); padding-top:16px">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
              <h4 style="margin:0; font-weight:600">ขั้นตอนบริการ (Components)</h4>
              <button class="btn btn-sm btn-primary" onclick="Page.showAddComponent()">+ เพิ่มขั้นตอน</button>
            </div>
            <div id="componentsList"></div>

            <!-- Add/Edit Component Inline Form -->
            <div id="componentForm" style="display:none; background:var(--gray-50); border:1px solid var(--gray-200); border-radius:8px; padding:16px; margin-top:12px">
              <input type="hidden" id="cEditId">
              <div class="form-row">
                <div class="form-group" style="flex:0 0 80px"><label class="form-label">ลำดับ *</label><input type="number" class="form-input" id="cStepOrder" min="1" value="1"></div>
                <div class="form-group"><label class="form-label">ชื่อขั้นตอน (ไทย) *</label><input type="text" class="form-input" id="cName"></div>
                <div class="form-group"><label class="form-label">ชื่อ (อังกฤษ)</label><input type="text" class="form-input" id="cNameEn"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label class="form-label">ระยะเวลา (นาที) *</label><input type="number" class="form-input" id="cDuration" min="1"></div>
                <div class="form-group"><label class="form-label">ประเภทค่าคอม</label>
                  <select class="form-select" id="cCommType"><option value="0">คงที่ (Fixed)</option><option value="1">เปอร์เซ็นต์ (Percentage)</option></select>
                </div>
                <div class="form-group"><label class="form-label">ค่าคอมมิชชั่น</label><input type="number" class="form-input" id="cCommValue" step="0.01" value="0"></div>
              </div>
              <div class="form-row">
                <div class="form-group form-checkbox" style="margin-top:8px"><input type="checkbox" id="cRequiresStaff"><label for="cRequiresStaff">ต้องมีพนักงาน</label></div>
                <div class="form-group"><label class="form-label">คำอธิบาย</label><input type="text" class="form-input" id="cDesc"></div>
              </div>
              <div style="display:flex; gap:8px; margin-top:8px">
                <button class="btn btn-primary btn-sm" onclick="Page.saveComponent()">บันทึกขั้นตอน</button>
                <button class="btn btn-secondary btn-sm" onclick="Page.hideComponentForm()">ยกเลิก</button>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="Layout.closeModal('formModal')">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.save()">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      page: 1, _cache: {}, _categories: new Set(),
      async init() {
        if (!Layout.init('pos-packages')) return;
        Layout.setTitle('แพ็คเกจบริการ');
        await this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        const search = document.getElementById('searchInput').value;
        const category = document.getElementById('categoryFilter').value;
        let q = `?page=${this.page}&pageSize=20`;
        if (category) q += `&category=${encodeURIComponent(category)}`;
        if (search) q += `&search=${encodeURIComponent(search)}`;
        try {
          const res = await api.getPosPackages(q);
          const data = res.data; const items = data?.items || data || [];
          const tbody = document.getElementById('tableBody');
          if (!items.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-center text-gray-400" style="padding:40px">ไม่มีรายการ</td></tr>'; return; }
          items.forEach(p => {
            Page._cache[p.id] = p;
            if (p.category) Page._categories.add(p.category);
          });
          this._buildCategoryFilter();
          tbody.innerHTML = items.map(p => `<tr>
            <td class="font-medium">${p.name}</td>
            <td>${p.category || '-'}</td>
            <td class="text-right">${Layout.money(p.price)}</td>
            <td class="text-right">${p.durationMinutes || '-'}</td>
            <td class="text-right">${p.components?.length ?? p.componentsCount ?? 0}</td>
            <td>${p.isActive !== false ? '<span class="badge badge-success">ใช้งาน</span>' : '<span class="badge badge-gray">ปิด</span>'}</td>
            <td>
              <button class="btn btn-sm btn-ghost" onclick="Page.openEdit('${p.id}')">แก้ไข</button>
              <button class="btn btn-sm btn-ghost text-danger" onclick="Page.remove('${p.id}')">ลบ</button>
            </td>
          </tr>`).join('');
          document.getElementById('pagination').innerHTML = Layout.renderPagination(this.page, data.totalPages || 1, 'Page.goPage');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      _buildCategoryFilter() {
        const sel = document.getElementById('categoryFilter');
        const cur = sel.value;
        const opts = ['<option value="">ทุกหมวดหมู่</option>'];
        this._categories.forEach(c => opts.push(`<option value="${c}"${c === cur ? ' selected' : ''}>${c}</option>`));
        sel.innerHTML = opts.join('');
      },
      goPage(p) { Page.page = p; Page.load(); },
      openCreate() {
        document.getElementById('formTitle').textContent = 'เพิ่มแพ็คเกจ';
        document.getElementById('editId').value = '';
        ['fName','fNameEn','fSku','fCategory','fDesc','fImageUrl'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('fPrice').value = '';
        document.getElementById('fCostPrice').value = '0';
        document.getElementById('fDuration').value = '';
        document.getElementById('fSortOrder').value = '0';
        document.getElementById('fVatIncl').checked = true;
        document.getElementById('componentsSection').style.display = 'none';
        this.hideComponentForm();
        Layout.openModal('formModal');
      },
      async openEdit(id) {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getPosPackage(id);
          const p = res.data || res;
          this._cache[id] = p;
          document.getElementById('formTitle').textContent = 'แก้ไขแพ็คเกจ';
          document.getElementById('editId').value = p.id;
          document.getElementById('fName').value = p.name || '';
          document.getElementById('fNameEn').value = p.nameEn || '';
          document.getElementById('fSku').value = p.sku || '';
          document.getElementById('fCategory').value = p.category || '';
          document.getElementById('fPrice').value = p.price;
          document.getElementById('fCostPrice').value = p.costPrice || 0;
          document.getElementById('fDuration').value = p.durationMinutes || '';
          document.getElementById('fSortOrder').value = p.sortOrder || 0;
          document.getElementById('fVatIncl').checked = p.isVatIncluded !== false;
          document.getElementById('fImageUrl').value = p.imageUrl || '';
          document.getElementById('fDesc').value = p.description || '';
          document.getElementById('componentsSection').style.display = '';
          this.hideComponentForm();
          this._renderComponents(p);
          Layout.openModal('formModal');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      _renderComponents(pkg) {
        const list = document.getElementById('componentsList');
        const components = pkg.components || [];
        if (!components.length) {
          list.innerHTML = '<p style="color:var(--gray-400); text-align:center; padding:12px">ยังไม่มีขั้นตอน</p>';
          return;
        }
        list.innerHTML = `<table class="table" style="margin-bottom:0">
          <thead><tr><th>ลำดับ</th><th>ชื่อ</th><th class="text-right">ระยะเวลา</th><th>ค่าคอม</th><th>ต้องมีพนักงาน</th><th>จัดการ</th></tr></thead>
          <tbody>${components.map(c => `<tr>
            <td>${c.stepOrder}</td>
            <td class="font-medium">${c.name}</td>
            <td class="text-right">${c.durationMinutes || '-'} นาที</td>
            <td>${c.commissionType === 1 ? c.commissionValue + '%' : Layout.money(c.commissionValue || 0)}</td>
            <td>${c.requiresStaff ? '<span class="badge badge-success">ใช่</span>' : '<span class="badge badge-gray">ไม่</span>'}</td>
            <td>
              <button class="btn btn-sm btn-ghost" onclick="Page.editComponent('${c.id}')">แก้ไข</button>
              <button class="btn btn-sm btn-ghost text-danger" onclick="Page.removeComponent('${c.id}')">ลบ</button>
            </td>
          </tr>`).join('')}</tbody>
        </table>`;
      },
      async save() {
        const api = Layout.api(); if (!api) return;
        const id = document.getElementById('editId').value;
        const name = document.getElementById('fName').value.trim();
        const price = document.getElementById('fPrice').value;
        const duration = document.getElementById('fDuration').value;
        if (!name) { Layout.toast('กรุณาระบุชื่อแพ็คเกจ', 'error'); return; }
        if (!price) { Layout.toast('กรุณาระบุราคา', 'error'); return; }
        if (!duration) { Layout.toast('กรุณาระบุระยะเวลา', 'error'); return; }
        const payload = {
          name: name,
          nameEn: document.getElementById('fNameEn').value || null,
          description: document.getElementById('fDesc').value || null,
          sku: document.getElementById('fSku').value || null,
          category: document.getElementById('fCategory').value || null,
          price: parseFloat(price),
          costPrice: parseFloat(document.getElementById('fCostPrice').value) || 0,
          durationMinutes: parseInt(duration),
          isVatIncluded: document.getElementById('fVatIncl').checked,
          imageUrl: document.getElementById('fImageUrl').value || null,
          sortOrder: parseInt(document.getElementById('fSortOrder').value) || 0,
        };
        try {
          if (id) {
            payload.isActive = this._cache[id]?.isActive !== false;
            await api.updatePosPackage(id, payload);
          } else {
            await api.createPosPackage(payload);
          }
          Layout.closeModal('formModal');
          Layout.toast(id ? 'แก้ไขแพ็คเกจสำเร็จ' : 'เพิ่มแพ็คเกจสำเร็จ');
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      async remove(id) {
        if (!confirm('ต้องการลบแพ็คเกจนี้?')) return;
        const api = Layout.api(); if (!api) return;
        try {
          await api.deletePosPackage(id);
          Layout.toast('ลบแพ็คเกจสำเร็จ');
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      // Component management
      showAddComponent() {
        document.getElementById('cEditId').value = '';
        ['cName','cNameEn','cDesc'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('cStepOrder').value = '1';
        document.getElementById('cDuration').value = '';
        document.getElementById('cCommType').value = '0';
        document.getElementById('cCommValue').value = '0';
        document.getElementById('cRequiresStaff').checked = false;
        document.getElementById('componentForm').style.display = '';
      },
      editComponent(compId) {
        const pkgId = document.getElementById('editId').value;
        const pkg = this._cache[pkgId]; if (!pkg) return;
        const c = (pkg.components || []).find(x => x.id === compId); if (!c) return;
        document.getElementById('cEditId').value = c.id;
        document.getElementById('cStepOrder').value = c.stepOrder || 1;
        document.getElementById('cName').value = c.name || '';
        document.getElementById('cNameEn').value = c.nameEn || '';
        document.getElementById('cDesc').value = c.description || '';
        document.getElementById('cDuration').value = c.durationMinutes || '';
        document.getElementById('cCommType').value = c.commissionType ?? 0;
        document.getElementById('cCommValue').value = c.commissionValue || 0;
        document.getElementById('cRequiresStaff').checked = !!c.requiresStaff;
        document.getElementById('componentForm').style.display = '';
      },
      hideComponentForm() {
        document.getElementById('componentForm').style.display = 'none';
      },
      async saveComponent() {
        const api = Layout.api(); if (!api) return;
        const pkgId = document.getElementById('editId').value;
        const compId = document.getElementById('cEditId').value;
        const name = document.getElementById('cName').value.trim();
        const duration = document.getElementById('cDuration').value;
        if (!name) { Layout.toast('กรุณาระบุชื่อขั้นตอน', 'error'); return; }
        if (!duration) { Layout.toast('กรุณาระบุระยะเวลา', 'error'); return; }
        const payload = {
          stepOrder: parseInt(document.getElementById('cStepOrder').value) || 1,
          name: name,
          nameEn: document.getElementById('cNameEn').value || null,
          description: document.getElementById('cDesc').value || null,
          durationMinutes: parseInt(duration),
          commissionType: parseInt(document.getElementById('cCommType').value),
          commissionValue: parseFloat(document.getElementById('cCommValue').value) || 0,
          requiresStaff: document.getElementById('cRequiresStaff').checked,
        };
        try {
          if (compId) {
            await api.updatePosComponent(pkgId, compId, payload);
          } else {
            await api.addPosComponent(pkgId, payload);
          }
          Layout.toast(compId ? 'แก้ไขขั้นตอนสำเร็จ' : 'เพิ่มขั้นตอนสำเร็จ');
          this.hideComponentForm();
          const res = await api.getPosPackage(pkgId);
          const pkg = res.data || res;
          this._cache[pkgId] = pkg;
          this._renderComponents(pkg);
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      async removeComponent(compId) {
        if (!confirm('ต้องการลบขั้นตอนนี้?')) return;
        const api = Layout.api(); if (!api) return;
        const pkgId = document.getElementById('editId').value;
        try {
          await api.removePosComponent(pkgId, compId);
          Layout.toast('ลบขั้นตอนสำเร็จ');
          const res = await api.getPosPackage(pkgId);
          const pkg = res.data || res;
          this._cache[pkgId] = pkg;
          this._renderComponents(pkg);
        } catch (e) { Layout.toast(e.message, 'error'); }
      }
    };
    Page.init();
  </script>
</body>
</html>
