<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผังบัญชี - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .coa-tree { margin: 0; padding: 0; list-style: none; }
    .coa-row { display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--gray-100); transition: background 0.15s; cursor: default; }
    .coa-row:hover { background: var(--gray-50); }
    .coa-row.level-1 { background: var(--gray-50); font-weight: 700; font-size: 15px; }
    .coa-row.level-2 { padding-left: 28px; font-weight: 600; font-size: 14px; color: var(--gray-700); }
    .coa-row.level-3 { padding-left: 48px; font-weight: 500; font-size: 13px; color: var(--gray-600); }
    .coa-row.level-4 { padding-left: 68px; font-size: 13px; color: var(--gray-700); }
    .coa-toggle { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; margin-right: 6px; font-size: 11px; color: var(--gray-400); transition: all 0.15s; flex-shrink: 0; }
    .coa-toggle:hover { background: var(--gray-200); color: var(--gray-600); }
    .coa-toggle.open { transform: rotate(90deg); }
    .coa-toggle.empty { visibility: hidden; }
    .coa-code { width: 90px; font-family: 'Inter', monospace; font-size: 13px; color: var(--gray-500); flex-shrink: 0; }
    .coa-name { flex: 1; min-width: 0; }
    .coa-name-en { font-size: 12px; color: var(--gray-400); margin-left: 8px; }
    .coa-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .coa-children { display: none; }
    .coa-children.open { display: block; }
    .coa-category-header { display: flex; align-items: center; padding: 12px 16px; background: linear-gradient(135deg, var(--primary), var(--primary-dark, #1d4ed8)); color: #fff; font-weight: 700; font-size: 15px; border-radius: 8px; margin: 8px 0 4px; cursor: pointer; user-select: none; }
    .coa-category-header .coa-toggle { color: rgba(255,255,255,0.7); }
    .coa-category-header .coa-toggle:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .coa-category-header.asset { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
    .coa-category-header.liability { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .coa-category-header.equity { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .coa-category-header.revenue { background: linear-gradient(135deg, #10b981, #059669); }
    .coa-category-header.expense { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .coa-summary { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; overflow-x: auto; }
    .coa-summary-card { flex: 1; min-width: 100px; background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; padding: 12px 16px; text-align: center; }
    .coa-summary-card .count { font-size: 24px; font-weight: 700; color: var(--gray-800); }
    .coa-summary-card .label { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">ผังบัญชี</h2><p class="page-subtitle">จัดการรายการบัญชีทั้งหมด</p></div>
      <div class="toolbar-actions">
        <button class="btn btn-secondary" onclick="Page.toggleAll()">ขยาย/ย่อทั้งหมด</button>
        <button class="btn btn-primary" onclick="Page.openCreate()">+ เพิ่มบัญชี</button>
      </div>
    </div>

    <div id="summaryCards" class="coa-summary"></div>

    <div class="toolbar">
      <input type="text" class="search-input" placeholder="ค้นหารหัสหรือชื่อบัญชี..." id="searchInput" oninput="Page.filter()">
      <select class="filter-select" id="typeFilter" onchange="Page.filter()">
        <option value="">ทุกประเภท</option>
        <option value="Asset">สินทรัพย์</option>
        <option value="Liability">หนี้สิน</option>
        <option value="Equity">ส่วนของเจ้าของ</option>
        <option value="Revenue">รายได้</option>
        <option value="Expense">ค่าใช้จ่าย</option>
      </select>
    </div>

    <div id="treeContainer" class="card" style="padding:0;overflow:hidden">
      <div style="padding:40px;text-align:center;color:var(--gray-400)" data-i18n="common.loading">กำลังโหลด...</div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="formModal">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title" id="formTitle">เพิ่มบัญชี</h3>
          <button class="modal-close" onclick="Layout.closeModal('formModal')">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editId">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">รหัสบัญชี *</label>
              <input type="text" class="form-input" id="fCode" placeholder="เช่น 111301">
            </div>
            <div class="form-group">
              <label class="form-label">ประเภทบัญชี *</label>
              <select class="form-select" id="fType">
                <option value="Asset">สินทรัพย์</option>
                <option value="Liability">หนี้สิน</option>
                <option value="Equity">ส่วนของเจ้าของ</option>
                <option value="Revenue">รายได้</option>
                <option value="Expense">ค่าใช้จ่าย</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">ชื่อบัญชี (ไทย) *</label>
            <input type="text" class="form-input" id="fName" placeholder="ชื่อบัญชี">
          </div>
          <div class="form-group">
            <label class="form-label">ชื่อบัญชี (อังกฤษ)</label>
            <input type="text" class="form-input" id="fNameEn" placeholder="Account name">
          </div>
          <div class="form-group">
            <label class="form-label">บัญชีแม่</label>
            <select class="form-select" id="fParent"><option value="">-- ไม่มี (บัญชีหลัก) --</option></select>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="common.description">คำอธิบาย</label>
            <textarea class="form-textarea" id="fDesc" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="Layout.closeModal('formModal')" data-i18n="common.cancel">ยกเลิก</button>
          <button class="btn btn-primary" onclick="Page.save()" data-i18n="common.save">บันทึก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      accounts: [],
      allExpanded: false,
      async init() {
        if (!Layout.init('accounts')) return;
        Layout.setTitle('ผังบัญชี');
        await this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getAccounts();
          this.accounts = res.data?.items || res.data || [];
          this.renderSummary();
          this.renderTree(this.accounts);
          this.populateParent();
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      renderSummary() {
        const counts = { Asset: 0, Liability: 0, Equity: 0, Revenue: 0, Expense: 0 };
        this.accounts.forEach(a => { if (a.accountCode.length === 6 && counts[a.accountType] !== undefined) counts[a.accountType]++; });
        const labels = { Asset: 'สินทรัพย์', Liability: 'หนี้สิน', Equity: 'ส่วนของเจ้าของ', Revenue: 'รายได้', Expense: 'ค่าใช้จ่าย' };
        document.getElementById('summaryCards').innerHTML = Object.entries(counts).map(([k, v]) =>
          `<div class="coa-summary-card"><div class="count">${v}</div><div class="label">${labels[k]}</div></div>`
        ).join('') + `<div class="coa-summary-card"><div class="count">${this.accounts.length}</div><div class="label" data-i18n="common.all">ทั้งหมด</div></div>`;
      },
      filter() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const t = document.getElementById('typeFilter').value;
        if (!q && !t) { this.renderTree(this.accounts); return; }
        // When filtering, show flat matching results
        const filtered = this.accounts.filter(a =>
          (!q || a.accountCode.toLowerCase().includes(q) || a.accountName.toLowerCase().includes(q) || (a.accountNameEn || '').toLowerCase().includes(q)) &&
          (!t || a.accountType === t)
        );
        this.renderFlat(filtered);
      },
      renderFlat(items) {
        const container = document.getElementById('treeContainer');
        if (!items.length) { container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gray-400)">ไม่พบรายการ</div>'; return; }
        container.innerHTML = items.map(a => `
          <div class="coa-row level-${Math.min(a.level || 1, 4)}">
            <span class="coa-toggle empty"></span>
            <span class="coa-code">${a.accountCode}</span>
            <span class="coa-name">${a.accountName}${a.accountNameEn ? `<span class="coa-name-en">${a.accountNameEn}</span>` : ''}</span>
            <span class="coa-meta">
              <span class="badge badge-${this._typeBadge(a.accountType)}">${Layout.accountTypeLabel(a.accountType)}</span>
              ${a.isActive ? '' : '<span class="badge badge-gray" data-i18n="common.close">ปิด</span>'}
              ${a.isSystemAccount ? '' : `<button class="btn btn-sm btn-ghost" onclick="Page.openEdit('${a.id}')" data-i18n="common.edit">แก้ไข</button>`}
            </span>
          </div>
        `).join('');
      },
      renderTree(items) {
        const container = document.getElementById('treeContainer');
        if (!items.length) { container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gray-400)">ยังไม่มีผังบัญชี</div>'; return; }

        // Build tree structure: group by account type category (level 1)
        const tree = this._buildTree(items);
        const categoryColors = { Asset: 'asset', Liability: 'liability', Equity: 'equity', Revenue: 'revenue', Expense: 'expense' };
        const categoryLabels = { Asset: 'สินทรัพย์', Liability: 'หนี้สิน', Equity: 'ส่วนของเจ้าของ', Revenue: 'รายได้', Expense: 'ค่าใช้จ่าย' };

        let html = '';
        for (const root of tree) {
          const colorClass = categoryColors[root.accountType] || 'asset';
          const hasChildren = root.children && root.children.length > 0;
          html += `<div class="coa-category-header ${colorClass}" onclick="Page.toggleNode(this)">
            <span class="coa-toggle${hasChildren ? ' open' : ' empty'}">&#9654;</span>
            <span class="coa-code" style="color:rgba(255,255,255,0.8)">${root.accountCode}</span>
            <span class="coa-name">${root.accountName}</span>
          </div>`;
          if (hasChildren) {
            html += `<div class="coa-children open">`;
            html += this._renderChildren(root.children);
            html += `</div>`;
          }
        }
        container.innerHTML = html;
      },
      _renderChildren(children) {
        let html = '';
        for (const node of children) {
          const hasChildren = node.children && node.children.length > 0;
          const level = Math.min(node.level || 2, 4);
          html += `<div class="coa-row level-${level}"${hasChildren ? ' onclick="Page.toggleNode(this)"' : ''} style="${hasChildren ? 'cursor:pointer' : ''}">
            <span class="coa-toggle${hasChildren ? '' : ' empty'}">&#9654;</span>
            <span class="coa-code">${node.accountCode}</span>
            <span class="coa-name">${node.accountName}${node.accountNameEn ? `<span class="coa-name-en">${node.accountNameEn}</span>` : ''}</span>
            <span class="coa-meta">
              ${!node.isActive ? '<span class="badge badge-gray" data-i18n="common.close">ปิด</span>' : ''}
              ${!node.isSystemAccount ? `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();Page.openEdit('${node.id}')" data-i18n="common.edit">แก้ไข</button>` : ''}
            </span>
          </div>`;
          if (hasChildren) {
            html += `<div class="coa-children">`;
            html += this._renderChildren(node.children);
            html += `</div>`;
          }
        }
        return html;
      },
      _buildTree(items) {
        const map = {};
        const roots = [];
        // Sort by code
        const sorted = [...items].sort((a, b) => a.accountCode.localeCompare(b.accountCode));
        sorted.forEach(a => { map[a.id] = { ...a, children: [] }; });
        sorted.forEach(a => {
          const node = map[a.id];
          if (a.parentAccountId && map[a.parentAccountId]) {
            map[a.parentAccountId].children.push(node);
          } else {
            roots.push(node);
          }
        });
        return roots;
      },
      toggleNode(el) {
        const childrenDiv = el.nextElementSibling;
        if (!childrenDiv || !childrenDiv.classList.contains('coa-children')) return;
        const toggle = el.querySelector('.coa-toggle');
        childrenDiv.classList.toggle('open');
        if (toggle) toggle.classList.toggle('open');
      },
      toggleAll() {
        this.allExpanded = !this.allExpanded;
        document.querySelectorAll('.coa-children').forEach(el => {
          el.classList.toggle('open', this.allExpanded);
        });
        document.querySelectorAll('.coa-toggle:not(.empty)').forEach(el => {
          el.classList.toggle('open', this.allExpanded);
        });
      },
      _typeBadge(type) {
        return { Asset: 'info', Liability: 'warning', Equity: 'primary', Revenue: 'success', Expense: 'danger' }[type] || 'gray';
      },
      populateParent() {
        const sel = document.getElementById('fParent');
        sel.innerHTML = '<option value="">-- ไม่มี (บัญชีหลัก) --</option>';
        this.accounts.filter(a => a.accountCode.length <= 3).forEach(a => {
          const indent = '\u00A0\u00A0'.repeat(Math.max(0, (a.level || 1) - 1));
          sel.innerHTML += `<option value="${a.id}">${indent}${a.accountCode} - ${a.accountName}</option>`;
        });
      },
      openCreate() {
        document.getElementById('formTitle').textContent = 'เพิ่มบัญชี';
        document.getElementById('editId').value = '';
        document.getElementById('fCode').value = '';
        document.getElementById('fCode').disabled = false;
        document.getElementById('fName').value = '';
        document.getElementById('fNameEn').value = '';
        document.getElementById('fType').value = 'Asset';
        document.getElementById('fParent').value = '';
        document.getElementById('fDesc').value = '';
        Layout.openModal('formModal');
      },
      openEdit(id) {
        const a = this.accounts.find(x => x.id === id); if (!a) return;
        document.getElementById('formTitle').textContent = 'แก้ไขบัญชี';
        document.getElementById('editId').value = a.id;
        document.getElementById('fCode').value = a.accountCode;
        document.getElementById('fCode').disabled = true;
        document.getElementById('fName').value = a.accountName;
        document.getElementById('fNameEn').value = a.accountNameEn || '';
        document.getElementById('fType').value = a.accountType;
        document.getElementById('fParent').value = a.parentAccountId || '';
        document.getElementById('fDesc').value = a.description || '';
        Layout.openModal('formModal');
      },
      async save() {
        const api = Layout.api(); if (!api) return;
        const id = document.getElementById('editId').value;
        try {
          if (id) {
            await api.updateAccount(id, {
              accountName: document.getElementById('fName').value,
              accountNameEn: document.getElementById('fNameEn').value || null,
              description: document.getElementById('fDesc').value || null,
            });
          } else {
            await api.createAccount({
              accountCode: document.getElementById('fCode').value,
              accountName: document.getElementById('fName').value,
              accountNameEn: document.getElementById('fNameEn').value || null,
              accountType: document.getElementById('fType').value,
              parentAccountId: document.getElementById('fParent').value || null,
              description: document.getElementById('fDesc').value || null,
            });
          }
          Layout.closeModal('formModal');
          Layout.toast(id ? 'แก้ไขบัญชีสำเร็จ' : 'เพิ่มบัญชีสำเร็จ');
          await this.load();
        } catch (e) { Layout.toast(e.message, 'error'); }
      }
    };
    Page.init();
  </script>
</body>
</html>
