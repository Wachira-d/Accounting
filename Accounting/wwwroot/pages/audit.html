<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกกิจกรรม - AcctPlatform</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">บันทึกกิจกรรม</h2><p class="page-subtitle">ประวัติการทำงานทั้งหมดในระบบ</p></div>
    </div>
    <div class="toolbar">
      <input type="text" class="search-input" placeholder="ค้นหา..." id="searchInput">
      <select class="filter-select" id="actionFilter" onchange="Page.load()">
        <option value="">ทุกการกระทำ</option>
        <option value="Create">สร้าง</option>
        <option value="Update">แก้ไข</option>
        <option value="Delete">ลบ</option>
        <option value="Login">เข้าสู่ระบบ</option>
        <option value="Approve">อนุมัติ</option>
        <option value="Export">ส่งออก</option>
      </select>
      <input type="date" class="form-input" id="fromDate" style="width:150px" onchange="Page.load()">
      <span class="text-gray-400">ถึง</span>
      <input type="date" class="form-input" id="toDate" style="width:150px" onchange="Page.load()">
    </div>
    <div class="table-container">
      <table class="table">
        <thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>ประเภท</th><th>รหัส</th><th>IP</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6" class="text-center text-gray-400" style="padding:40px">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
    <div id="pagination"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      page: 1,
      async init() {
        if (!Layout.init('audit')) return;
        Layout.setTitle('บันทึกกิจกรรม');
        await this.load();
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        const action = document.getElementById('actionFilter').value;
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;
        let q = `?page=${this.page}&pageSize=30`;
        if (action) q += `&action=${action}`;
        if (from) q += `&fromDate=${from}`;
        if (to) q += `&toDate=${to}`;
        try {
          const res = await api.getAuditLogs(q);
          const data = res.data; const items = data?.items || data || [];
          const tbody = document.getElementById('tableBody');
          const actionMap = { Create: 'สร้าง', Update: 'แก้ไข', Delete: 'ลบ', Login: 'เข้าสู่ระบบ', Logout: 'ออกจากระบบ', Approve: 'อนุมัติ', Reject: 'ปฏิเสธ', Export: 'ส่งออก', Print: 'พิมพ์', View: 'ดู' };
          if (!items.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-gray-400" style="padding:40px">ไม่มีบันทึก</td></tr>'; return; }
          tbody.innerHTML = items.map(a => `<tr>
            <td class="text-xs">${new Date(a.timestamp).toLocaleString('th-TH')}</td>
            <td>${a.userEmail || '-'}</td>
            <td><span class="badge ${a.action === 'Create' ? 'badge-success' : a.action === 'Delete' ? 'badge-danger' : a.action === 'Update' ? 'badge-warning' : 'badge-info'}">${actionMap[a.action] || a.action}</span></td>
            <td>${a.entityType || '-'}</td>
            <td class="text-xs text-gray-500">${a.entityId ? a.entityId.substring(0,8) + '...' : '-'}</td>
            <td class="text-xs text-gray-400">${a.ipAddress || '-'}</td>
          </tr>`).join('');
          document.getElementById('pagination').innerHTML = Layout.renderPagination(this.page, data.totalPages || 1, 'Page.goPage');
        } catch (e) { Layout.toast(e.message, 'error'); }
      },
      goPage(p) { Page.page = p; Page.load(); }
    };
    Page.init();
  </script>
</body>
</html>
