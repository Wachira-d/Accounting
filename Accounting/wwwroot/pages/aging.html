<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานอายุลูกหนี้/เจ้าหนี้ - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div><h2 class="page-title">รายงานอายุลูกหนี้/เจ้าหนี้</h2><p class="page-subtitle">วิเคราะห์หนี้ตามอายุ</p></div>
    </div>
    <div class="tabs"
         data-tour-step="1"
         data-tour-text="เลือกฝั่ง: ลูกหนี้ (AR — เงินที่ลูกค้าค้างเรา) / เจ้าหนี้ (AP — เงินที่เราต้องจ่ายผู้ขาย)">
      <div class="tab active" onclick="Page.setType('AccountsReceivable',this)">ลูกหนี้ (AR)</div>
      <div class="tab" onclick="Page.setType('AccountsPayable',this)">เจ้าหนี้ (AP)</div>
    </div>
    <div class="toolbar"
         data-tour-step="2"
         data-tour-text="เลือกวันที่อ้างอิง — ระบบจัด bucket: 0-30 / 31-60 / 61-90 / 91-180 / 180+ วัน + ยอดรวมเงินที่ค้าง">
      <label class="text-sm font-medium">ณ วันที่:</label>
      <input type="date" class="form-input" id="asOfDate" style="width:180px">
      <label class="text-sm font-medium">โครงการ:</label>
      <select class="form-input" id="filterProject" style="width:240px"><option value="">— ทุกโครงการ —</option></select>
      <button class="btn btn-primary" onclick="Page.load()">แสดงรายงาน</button>
      <button class="btn btn-secondary" onclick="Page.exportCsv()">Export CSV</button>
    </div>

    <!-- Buckets -->
    <div class="grid grid-4 gap-4" id="buckets" style="margin-bottom:24px"></div>

    <!-- Details -->
    <div class="card" id="reportContent">
      <div class="text-center text-gray-400" style="padding:40px">กดปุ่ม "แสดงรายงาน" เพื่อดูข้อมูล</div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      reportType: 'AccountsReceivable',
      async init() {
        if (!Layout.init('aging')) return;
        Layout.setTitle('รายงานอายุลูกหนี้/เจ้าหนี้');
        document.getElementById('asOfDate').value = Layout.toDateInput(new Date());
        await this.loadProjects();
      },
      async loadProjects() {
        try {
          const cid = Layout.getCompanyId();
          if (!cid) return;
          const r = await API.get(`/api/companies/${cid}/projects?active=true&pageSize=200`);
          const items = r.data?.items || r.data || [];
          const opts = items.map(p =>
            `<option value="${p.id}">${(p.code || p.projectNumber || '') + ' ' + (p.name || '')}</option>`).join('');
          document.getElementById('filterProject').innerHTML =
            '<option value="">— ทุกโครงการ —</option>' + opts;
        } catch (e) { /* ignore */ }
      },
      setType(type, el) {
        this.reportType = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
      },
      async load() {
        const api = Layout.api(); if (!api) return;
        const date = document.getElementById('asOfDate').value;
        const projectId = document.getElementById('filterProject').value;
        const params = [];
        if (date) params.push(`asOfDate=${date}`);
        if (projectId) params.push(`projectId=${projectId}`);
        const q = params.length ? `?${params.join('&')}` : '';
        try {
          const res = this.reportType === 'AccountsReceivable'
            ? await api.getAgingReceivables(q)
            : await api.getAgingPayables(q);
          const d = res.data;
          this._lastData = d;

          // Buckets
          const buckets = d.buckets || [];
          document.getElementById('buckets').innerHTML = buckets.map(b => `
            <div class="kpi-card">
              <div class="kpi-label">${b.label}</div>
              <div class="kpi-value">${Layout.money(b.totalAmount)}</div>
              <div class="text-xs text-gray-400">${b.documentCount} เอกสาร</div>
            </div>
          `).join('');

          // Totals
          const t = d.totals || {};
          const content = document.getElementById('reportContent');

          // Details
          const details = d.details || [];
          content.innerHTML = `
            <div class="card-header"><h3 class="card-title">${this.reportType === 'AccountsReceivable' ? 'ลูกหนี้' : 'เจ้าหนี้'} - รายละเอียด</h3></div>
            <div class="table-container" style="border:none">
              <table class="table">
                <thead><tr><th>ผู้ติดต่อ</th><th class="text-right">ปัจจุบัน</th><th class="text-right">1-30 วัน</th><th class="text-right">31-60 วัน</th><th class="text-right">61-90 วัน</th><th class="text-right">>90 วัน</th><th class="text-right font-bold" data-i18n="common.total">รวม</th></tr></thead>
                <tbody>${details.map((c,i) => `
                <tr onclick="Page.toggleDocs(${i})" style="cursor:pointer">
                  <td class="font-medium"><span id="caret_${i}" style="display:inline-block;width:14px;color:var(--gray-400)">▸</span> ${Layout.esc(c.contactName)}</td>
                  <td class="text-right">${Layout.money(c.current)}</td>
                  <td class="text-right">${Layout.money(c.days1To30)}</td>
                  <td class="text-right">${Layout.money(c.days31To60)}</td>
                  <td class="text-right ${c.days61To90 > 0 ? 'text-warning' : ''}">${Layout.money(c.days61To90)}</td>
                  <td class="text-right ${c.over90Days > 0 ? 'text-danger font-semibold' : ''}">${Layout.money(c.over90Days)}</td>
                  <td class="text-right font-bold">${Layout.money(c.totalBalance)}</td>
                </tr>
                <tr id="docs_${i}" style="display:none;background:var(--gray-50)"><td colspan="7" style="padding:0">
                  <table class="table" style="margin:0;font-size:12.5px">
                    <thead><tr style="color:var(--gray-500)"><th style="padding-left:34px">เลขที่</th><th>ประเภท</th><th>วันที่</th><th>ครบกำหนด</th><th class="text-right">ยอดรวม</th><th class="text-right">คงค้าง</th><th class="text-right">อายุ (วัน)</th><th>กลุ่ม</th></tr></thead>
                    <tbody>${(c.documents||[]).map(d => `<tr>
                      <td style="padding-left:34px"><a href="/pages/documents.html?id=${d.documentId}" style="color:var(--primary)">${Layout.esc(d.documentNumber)}</a></td>
                      <td>${Layout.esc(d.documentType||'')}</td>
                      <td>${new Date(d.documentDate).toLocaleDateString('th-TH')}</td>
                      <td>${d.dueDate ? new Date(d.dueDate).toLocaleDateString('th-TH') : '-'}</td>
                      <td class="text-right">${Layout.money(d.totalAmount)}</td>
                      <td class="text-right ${d.balanceDue < 0 ? 'text-success' : ''}">${Layout.money(d.balanceDue)}</td>
                      <td class="text-right ${d.agingDays > 90 ? 'text-danger' : d.agingDays > 60 ? 'text-warning' : ''}">${d.agingDays}</td>
                      <td><span class="pill pill-${d.balanceDue < 0 ? 'success' : d.agingDays > 90 ? 'danger' : d.agingDays > 30 ? 'warning' : 'info'}">${d.bucket}</span></td>
                    </tr>`).join('')}</tbody>
                  </table>
                </td></tr>
                `).join('')}</tbody>
                <tfoot><tr style="background:var(--gray-100)">
                  <td class="font-bold">รวมทั้งสิ้น</td>
                  <td class="text-right font-bold">${Layout.money(t.current)}</td>
                  <td class="text-right font-bold">${Layout.money(t.days1To30)}</td>
                  <td class="text-right font-bold">${Layout.money(t.days31To60)}</td>
                  <td class="text-right font-bold">${Layout.money(t.days61To90)}</td>
                  <td class="text-right font-bold">${Layout.money(t.over90Days)}</td>
                  <td class="text-right font-bold">${Layout.money(t.grandTotal)}</td>
                </tr></tfoot>
              </table>
            </div>`;
        } catch (e) {
          document.getElementById('reportContent').innerHTML = `<div class="text-center text-danger" style="padding:40px">${Layout.esc(e.message)}</div>`;
        }
      },

      // Drill-down: expand/collapse the per-document breakdown for one contact.
      toggleDocs(i) {
        const row = document.getElementById(`docs_${i}`);
        const caret = document.getElementById(`caret_${i}`);
        if (!row) return;
        const open = row.style.display === '';
        row.style.display = open ? 'none' : '';
        if (caret) { caret.textContent = open ? '▸' : '▾'; caret.style.color = open ? 'var(--gray-400)' : 'var(--primary)'; }
      },

      // Quick CSV export of the rendered aging snapshot. Excel opens .csv
      // with UTF-8 BOM correctly — Thai column names + names stay intact.
      exportCsv() {
        if (!this._lastData) { Layout.toast('โหลดรายงานก่อนแล้วค่อย export', 'error'); return; }
        const d = this._lastData;
        const title = (this.reportType === 'AccountsReceivable' ? 'ลูกหนี้' : 'เจ้าหนี้') + '-aging';
        const esc = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
        const head = ['ผู้ติดต่อ','TaxId','Current','1-30','31-60','61-90','>90','รวม'];
        const lines = [head.join(',')];
        (d.details||[]).forEach(c => lines.push([
          esc(c.contactName), esc(c.taxId || ''),
          c.current, c.days1To30, c.days31To60, c.days61To90, c.over90Days, c.totalBalance
        ].join(',')));
        const t = d.totals || {};
        lines.push(['"รวมทั้งสิ้น"','""', t.current, t.days1To30, t.days31To60, t.days61To90, t.over90Days, t.grandTotal].join(','));
        const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = Object.assign(document.createElement('a'), { href: url, download: `${title}_${new Date().toISOString().slice(0,10)}.csv` });
        a.click(); URL.revokeObjectURL(url);
      },
    };
    Page.init();
    Layout.enableTour('aging');
  </script>
</body>
</html>
