<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คู่มือและวิดีโอสอนใช้งาน - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .cat-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px }
    .cat { padding:6px 14px; border-radius:999px; border:1px solid #e2e8f0; background:#fff;
           font-size:13px; cursor:pointer; white-space:nowrap; color:#334155 }
    .cat.on { background:#4f46e5; border-color:#4f46e5; color:#fff; font-weight:600 }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px }
    .item { background:#fff; border:1px solid #e2e8f0; border-radius:12px; overflow:hidden;
            display:flex; flex-direction:column; cursor:pointer; transition:box-shadow .15s }
    .item:hover { box-shadow:0 6px 20px rgba(0,0,0,.08) }
    .thumb { aspect-ratio:16/9; background:#0f172a; display:flex; align-items:center;
             justify-content:center; font-size:40px; color:#94a3b8; position:relative }
    .thumb img { width:100%; height:100%; object-fit:cover }
    .thumb .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                   background:rgba(0,0,0,.25); font-size:44px; color:#fff }
    .item .body { padding:12px 14px; flex:1; display:flex; flex-direction:column; gap:6px }
    .item .ttl { font-weight:700; font-size:14px; color:#0f172a; line-height:1.5 }
    .item .ds { font-size:12px; color:#64748b; line-height:1.6 }
    .chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px;
            font-weight:600; background:#eef2ff; color:#3730a3 }
    .chip.mod { background:#ecfdf5; color:#065f46 }
    .muted { color:#94a3b8 }
    .player { width:100%; aspect-ratio:16/9; border:0; border-radius:10px; background:#000 }
  </style>
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="container" style="max-width:1200px;margin:0 auto;padding:20px">

      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <h1 style="margin:0;font-size:24px;font-weight:700">🎓 คู่มือและวิดีโอสอนใช้งาน</h1>
          <p style="margin:4px 0 0;color:#64748b;font-size:14px">
            เลือกหมวดที่ต้องการ หรือค้นหาสิ่งที่กำลังติดอยู่
          </p>
        </div>
        <input type="text" class="form-input" id="q" placeholder="ค้นหา… เช่น ใบกำกับภาษี, ตั้งค่าที่พัก"
               style="max-width:300px" oninput="Page.debouncedLoad()">
      </div>

      <div class="cat-bar" id="catBar"></div>
      <div class="cat-bar" id="modBar" style="margin-top:-8px"></div>

      <div class="grid" id="grid"><div class="muted">กำลังโหลด…</div></div>
    </div>
  </div>

  <div class="modal" id="playerModal">
    <div class="modal-content" style="max-width:900px">
      <div class="modal-header">
        <h3 id="pTitle">วิดีโอ</h3>
        <button class="modal-close" onclick="Page.closePlayer()">&times;</button>
      </div>
      <div class="modal-body" id="pBody"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      items: [], cats: [], mods: [], cat: '', mod: '', _t: null,

      async init() {
        if (!Layout.init('help')) return;
        Layout.setTitle('คู่มือและวิดีโอสอนใช้งาน');
        await this.load();
      },

      debouncedLoad() {
        clearTimeout(this._t);
        this._t = setTimeout(() => this.load(), 300);
      },

      async load() {
        const q = document.getElementById('q').value.trim();
        const qs = new URLSearchParams();
        if (this.cat) qs.set('category', this.cat);
        if (this.mod) qs.set('moduleCode', this.mod);
        if (q) qs.set('q', q);
        try {
          const res = await API.get('/api/help' + (qs.toString() ? '?' + qs : ''));
          const d = res?.data || {};
          this.items = d.items || [];
          // แท็บหมวดสร้างจากข้อมูลจริงที่เซิร์ฟเวอร์ส่งมา — ไม่พิมพ์รายชื่อหมวดซ้ำ
          // ในหน้าเว็บ (เพิ่มหมวดใหม่แล้วแท็บตามทันที drift เป็นศูนย์)
          // ⚠️ อัปเดตเฉพาะตอนไม่ได้กรอง มิฉะนั้นแท็บจะหายไปทีละอันเมื่อผู้ใช้กรอง
          if (!this.cat && !this.mod && !q) { this.cats = d.categories || []; this.mods = d.modules || []; }
        } catch (e) {
          document.getElementById('grid').innerHTML =
            `<div style="color:#dc2626">โหลดไม่สำเร็จ: ${Layout.esc(e.message || '')}</div>`;
          return;
        }
        this.render();
      },

      render() {
        document.getElementById('catBar').innerHTML =
          `<div class="cat ${this.cat ? '' : 'on'}" onclick="Page.pick('cat','')">ทั้งหมด</div>`
          + this.cats.map(c =>
            `<div class="cat ${this.cat === c.value ? 'on' : ''}" onclick="Page.pick('cat','${Layout.jsArg(c.value)}')">${Layout.esc(c.label)} (${c.count})</div>`).join('');

        document.getElementById('modBar').innerHTML = this.mods.length
          ? `<div class="cat ${this.mod ? '' : 'on'}" onclick="Page.pick('mod','')">ทุกธุรกิจ</div>`
            + this.mods.map(m =>
              `<div class="cat ${this.mod === m.value ? 'on' : ''}" onclick="Page.pick('mod','${Layout.jsArg(m.value)}')">${Layout.esc(m.value)} (${m.count})</div>`).join('')
          : '';

        const grid = document.getElementById('grid');
        if (!this.items.length) {
          grid.innerHTML = '<div class="muted">ยังไม่มีเนื้อหาในหมวดนี้</div>';
          return;
        }
        grid.innerHTML = this.items.map((it, i) => {
          const icon = { Video: '🎬', Document: '📄', Article: '📝', Link: '🔗' }[it.kind] || '📘';
          const thumb = it.thumbnailUrl
            ? `<img src="${Layout.esc(it.thumbnailUrl)}" alt="">` + (it.kind === 'Video' ? '<div class="play">▶</div>' : '')
            : `<span>${icon}</span>`;
          const dur = it.durationSeconds > 0
            ? `${Math.floor(it.durationSeconds / 60)}:${String(it.durationSeconds % 60).padStart(2, '0')}` : '';
          return `<div class="item" onclick="Page.open(${i})">
            <div class="thumb">${thumb}</div>
            <div class="body">
              <div class="ttl">${Layout.esc(it.title)}</div>
              ${it.description ? `<div class="ds">${Layout.esc(it.description).slice(0, 140)}</div>` : ''}
              <div style="margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                <span class="chip">${Layout.esc(it.categoryLabel)}</span>
                ${it.moduleCode ? `<span class="chip mod">${Layout.esc(it.moduleCode)}</span>` : ''}
                ${dur ? `<span class="muted" style="font-size:11px">⏱ ${dur}</span>` : ''}
              </div>
            </div>
          </div>`;
        }).join('');
      },

      pick(kind, v) {
        if (kind === 'cat') this.cat = v; else this.mod = v;
        this.load();
      },

      open(i) {
        const it = this.items[i];
        if (!it) return;
        // นับยอดเปิดดู — best-effort ไม่ให้ขวางการเปิด
        API.post(`/api/help/${it.id}/view`, {}).catch(() => {});

        // ลิงก์ที่ฝังไม่ได้ (embedUrl = null) ต้องเปิดแท็บใหม่ **ห้ามโชว์กรอบว่าง**
        if (it.kind === 'Link' || (!it.embedUrl && it.sourceUrl)) {
          window.open(it.sourceUrl, '_blank', 'noopener');
          return;
        }
        let body = '';
        if (it.kind === 'Document' && it.storagePath) {
          body = `<iframe class="player" style="aspect-ratio:3/4" src="${Layout.esc(it.storagePath)}"></iframe>`;
        } else if (it.provider === 'SelfHosted' && it.storagePath) {
          body = `<video class="player" controls preload="metadata" src="${Layout.esc(it.storagePath)}"></video>`;
        } else if (it.embedUrl) {
          body = `<iframe class="player" src="${Layout.esc(it.embedUrl)}" allowfullscreen
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe>`;
        } else {
          // บทความ — เนื้อหาอยู่ใน description
          body = `<div style="font-size:14px;line-height:1.9;white-space:pre-wrap">${Layout.esc(it.description || 'ไม่มีเนื้อหา')}</div>`;
        }
        if (it.description && it.kind !== 'Article') {
          body += `<div style="margin-top:12px;font-size:13px;color:#475569;line-height:1.8;white-space:pre-wrap">${Layout.esc(it.description)}</div>`;
        }
        document.getElementById('pTitle').textContent = it.title;
        document.getElementById('pBody').innerHTML = body;
        Layout.openModal('playerModal');
      },

      closePlayer() {
        Layout.closeModal('playerModal');
        // ล้างเนื้อหาเพื่อหยุดวิดีโอที่ยังเล่นอยู่ (iframe/video ไม่หยุดเองตอนซ่อน)
        document.getElementById('pBody').innerHTML = '';
      },
    };
    Page.init();
  </script>
</body>
</html>
