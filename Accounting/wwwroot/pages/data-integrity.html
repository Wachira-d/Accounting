<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจข้อมูลจากบั๊กที่แก้แล้ว — Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!--
    คำตัดสินเจ้าของ 2026-10-08: ข้อมูลที่อาจบันทึกผิดจากบั๊กที่แก้แล้ว → "รายงานอ่านอย่างเดียวก่อน" ให้ผู้ทำบัญชีตรวจแล้วซ่อมรายตัว
    หน้านี้แสดงผลอย่างเดียว — ทุกการตัดสินมาจากเซิร์ฟเวอร์ (DataIntegrityReportService) ไม่มีสูตรในฝั่ง JS (F2 ข้อ 5)
  -->
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div>
        <h2 class="page-title">ตรวจข้อมูลจากบั๊กที่แก้แล้ว</h2>
        <p class="page-subtitle">รายการที่อาจบันทึกผิดก่อนแก้บั๊ก (2026-10-08) — รายงานให้ผู้ทำบัญชีตรวจ ระบบไม่แก้ข้อมูลให้เอง (บางหมวดมีปุ่ม “แก้” รายใบที่เงินไม่เปลี่ยน)</p>
      </div>
      <div><button class="btn btn-primary" id="btnRun">🔎 ตรวจ</button></div>
    </div>
    <div id="resultBox"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      sections: [
        ['posOrderTotals', 'บิล POS ที่ยอดบิลไม่เท่าผลรวมรายการ', 'เดิมรายการถูกนับสองครั้งตอนเพิ่มรายการ ⇒ ยอดบิล/VAT อาจเบิ้ล — ตรวจกับเงินที่รับจริงและรายการบัญชีของกะ'],
        ['rollupBillingNoteChildren', 'เอกสารที่แปลงจากใบวางบิลรวมใบแจ้งหนี้', 'ใบเสร็จจากใบวางบิลลงแบบขายสด ⇒ รายได้ซ้ำกับใบแจ้งหนี้ในใบวางบิล และลูกหนี้ใบเดิมไม่ถูกตัด'],
        ['purchaseInvoicesBilledFromPoWithGrn', 'ใบแจ้งหนี้ซื้อที่ผูกใบสั่งซื้อตรงทั้งที่มีใบรับสินค้า', 'อาจรับสต็อกเข้าสองรอบ (21240 ค้าง) — ใบสั่งซื้อที่ผสมบริการ/สินค้าอาจถูกต้อง ตรวจรายตัว'],
        ['payrollRunTotals', 'รอบเงินเดือนที่ยอดรวมไม่เท่าผลรวมแถว', 'เดิมเพิ่มพนักงานเข้ารอบแล้วยอดรวมเบิ้ล — รอบที่ยังไม่จ่ายกด "คำนวณใหม่" · รอบที่จ่ายแล้วให้ผู้ทำบัญชีตรวจรายการบัญชี'],
        // รอบ 203 — คำถามเจ้าของ 2026-10-09: ใบเสร็จค่าห้องพักที่พิมพ์ VAT แต่หัว "ใบเสร็จรับเงิน" · เลขออกแล้วแก้ย้อนหลังไม่ได้ (§86/4) ⇒ รายงานให้ออกใบแทนรายใบ
        ['plainReceiptsWithVat', 'ใบเสร็จของผู้จด VAT ที่พิมพ์ VAT แต่หัวไม่ใช่ใบกำกับภาษี', 'ผู้จด VAT ต้องออกใบกำกับ (เต็มรูป/อย่างย่อ) ทุกครั้งที่รับเงินค่าบริการ (ม.86) — ใบเสร็จเปล่าที่พิมพ์ VAT ไม่มีสถานะทางกฎหมาย · เติมที่อยู่ผู้ซื้อ หรือติ๊ก "ประกอบกิจการขายปลีก §86/6" ในข้อมูลบริษัท แล้ว "ยกเลิกและออกใบแทน" รายใบ · ใบใหม่มีคำเตือนตอนอนุมัติ (รับทราบได้ — ไม่บล็อก) แล้วมาลิสต์ที่นี่'],
        // รอบ 204 — คำตัดสินเจ้าของข้อ 148: แบบ ภ.ง.ด.2 · ข้อมูลก่อนหน้านี้ลง ภ.ง.ด.3 ทั้งหมด · ใบที่ยื่นแล้วห้ามแก้ย้อนหลัง ⇒ รายงานให้ผู้ทำบัญชีตัดสินรายใบ
        ['section40_4RecordedAsPnd3', 'ดอกเบี้ย/เงินปันผลจ่ายบุคคลธรรมดาที่บันทึกเป็น ภ.ง.ด.3', 'ม.50(2) · ม.59: เงินได้ ม.40(4) จ่ายบุคคลธรรมดาต้องยื่น ภ.ง.ด.2 — ระบบเพิ่งรองรับแบบนี้ (รอบ 204) · 50 ทวิ/เอกสารเดิมไม่ถูกย้ายแบบให้อัตโนมัติ (ยื่นไปแล้วแก้ย้อนหลังไม่ได้) · ผู้ทำบัญชีตัดสินรายใบ: ยื่นเพิ่มเติม · ยกเลิกแล้วออกใบแทน · โอนยอดผัง 21916 → 21915 · ใบที่ปนดอกเบี้ยกับค่าบริการให้แยกเป็นสองใบ'],
        ['tipWhtPostedToPnd2Account', 'จ่ายทิปที่ลงภาษีหัก ณ ที่จ่ายไว้ผัง ภ.ง.ด.2 (21915)', 'ทิป = ม.40(2) ยื่น ภ.ง.ด.3 (50 ทวิ ของทิปเป็น ภ.ง.ด.3 อยู่แล้ว) แต่รายการบัญชีเดิมลง 21915 — โอนยอดไป 21916 ก่อนนำส่ง ภ.ง.ด.3 ของงวดนั้น · การจ่ายทิปครั้งใหม่ลง 21916 แล้ว'],
        // ทีม E 2026-10-13 — บรรทัดจากสแกนที่ติดส่วนลด % ซ้อนบนราคาที่ลดแล้ว · ปุ่ม "แก้" รายใบ (เซิร์ฟเวอร์ส่ง fixPath มาเฉพาะแถวที่แก้ได้)
        ['ocrLineDiscountWouldChangeOnResave', 'เอกสารจากสแกนที่เปิดแก้แล้วบันทึก ยอดจะเปลี่ยนเอง', 'บรรทัดที่ไม่มีราคาต่อหน่วยบนกระดาษเคยถูกเก็บเป็น "ราคา = ยอดหลังลด" พร้อมส่วนลด % ของทั้งใบ ⇒ เปิดแก้แล้วบันทึก ระบบหัก % ซ้ำ · ยอด/VAT ที่บันทึกไว้ถูกตามกระดาษแล้ว (คอลัมน์ "ค่าที่เก็บไว้") — คอลัมน์ขวาคือยอดที่จะกลายเป็นถ้าบันทึกซ้ำ · กด "แก้" เพื่อตั้งส่วนลด % = 0 โดยยอด/VAT/ยอดรวมไม่เปลี่ยน (ระบบจำลองก่อน ถ้าเงินจะขยับจะไม่แก้และบอกเหตุผล)'],
        // DECISIONS ข้อ 111 — อ่านอย่างเดียว ระบบไม่ยกเลิก 50 ทวิ ให้ (อาจยื่นไปแล้ว)
        ['voidedPayrollRunsWithIssuedWhtCerts', 'รอบเงินเดือนที่ยกเลิกแล้วแต่ยังมี 50 ทวิ สถานะออกแล้ว', 'รอบที่ยกเลิกก่อนระบบยกเลิก 50 ทวิ ตามรอบ — ระบบไม่ยกเลิกให้เพราะใบอาจยื่น/ส่งผู้รับไปแล้ว · ผู้ทำบัญชีตัดสินรายใบ: ยังไม่ยื่น ⇒ ยกเลิกใบที่หน้า 50 ทวิ · ยื่นแล้ว ⇒ ยื่นแบบเพิ่มเติมลดยอด'],
      ],
      init() {
        if (!Layout.init('reports')) return;
        Layout.setTitle('ตรวจข้อมูลจากบั๊กที่แก้แล้ว');
        document.getElementById('btnRun').addEventListener('click', () => this.run());
        // ปุ่ม "แก้" รายแถว — เส้นทางมาจากเซิร์ฟเวอร์ (fixPath) ไม่มีกติกาในหน้า (F2 ข้อ 5)
        document.getElementById('resultBox').addEventListener('click', (ev) => {
          const btn = ev.target.closest('button[data-fix-path]');
          if (btn) this.fix(btn);
        });
      },
      async fix(btn) {
        const path = btn.dataset.fixPath;
        const number = btn.dataset.fixNumber || '';
        if (!path) return;
        if (!confirm('แก้ส่วนลดบรรทัดของ ' + number + ' — ตั้งส่วนลด % เป็น 0 ให้เปิดแก้แล้วบันทึกได้ยอดเดิม\nยอด/VAT/ยอดรวม/รายการบัญชีไม่เปลี่ยน (บันทึกประวัติการแก้ไว้)\n\nดำเนินการต่อหรือไม่?')) return;
        btn.disabled = true;
        try {
          const res = await API.post('/api/companies/' + encodeURIComponent(Layout.getCompanyId()) + '/' + path);
          Layout.toast((res && res.message) || 'แก้แล้ว', 'success');
          await this.run();
        } catch (e) {
          btn.disabled = false;
          Layout.toast(e.message, 'error');
        }
      },
      async run() {
        const box = document.getElementById('resultBox');
        box.innerHTML = '<div class="card"><div style="padding:18px;color:#64748b">กำลังตรวจ…</div></div>';
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getDataIntegritySuspects();
          this.render(res && res.data ? res.data : null, res && res.message);
        } catch (e) {
          box.innerHTML = '';
          Layout.toast(e.message, 'error');
        }
      },
      render(data, message) {
        const box = document.getElementById('resultBox');
        // ไม่มีข้อมูล = ตรวจไม่สำเร็จ (ไม่ใช่ "ไม่พบปัญหา") — F2 ข้อ 5
        if (data == null) {
          box.innerHTML = '<div class="card"><div style="padding:18px;color:#b91c1c">ไม่ได้รับผลตรวจจากเซิร์ฟเวอร์</div></div>';
          return;
        }
        const esc = (v) => Layout.esc(v == null ? '' : String(v));
        const money = (v) => v == null ? '-' : esc(Layout.money(v));
        box.innerHTML = `<div class="card" style="margin-bottom:12px"><div style="padding:14px 18px">${esc(message || '')}</div></div>` +
          this.sections.map(([key, title, note]) => {
            const rows = Array.isArray(data[key]) ? data[key] : [];
            const body = rows.length === 0
              ? '<div style="padding:12px 18px;color:#15803d">✓ ไม่พบรายการ</div>'
              : `<div style="padding:0 18px 18px;overflow-x:auto"><table class="data-table" style="font-size:13px;min-width:560px">
                  <thead><tr><th>เลขที่</th><th>วันที่</th><th>รายละเอียด</th><th style="text-align:right">ค่าที่เก็บไว้</th><th style="text-align:right">${esc(key === 'ocrLineDiscountWouldChangeOnResave' ? 'ถ้าบันทึกซ้ำจะได้' : 'ค่าที่ควรเป็น')}</th><th></th></tr></thead>
                  <tbody>${rows.map(r => `<tr><td>${esc(r.number)}</td><td>${esc(Layout.date(r.date))}</td>
                    <td style="font-size:12px">${esc(r.detail)}</td><td style="text-align:right">${money(r.stored)}</td>
                    <td style="text-align:right">${money(r.expected)}</td>
                    <td style="white-space:nowrap">${r.linkUrl ? `<a href="${esc(r.linkUrl)}" style="font-size:12px">${esc(r.linkLabel || 'เปิด')}</a>` : ''}
                      ${r.fixPath ? `<button class="btn btn-sm btn-primary" data-fix-path="${esc(r.fixPath)}" data-fix-number="${esc(r.number)}">แก้</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
            return `<div class="card" style="margin-bottom:12px">
              <div class="card-header"><h3 class="card-title">${esc(title)} (${rows.length})</h3></div>
              <div style="padding:0 18px 6px;color:#64748b;font-size:12px">${esc(note)}</div>${body}</div>`;
          }).join('');
      },
    };
    Page.init();
  </script>
</body>
</html>
