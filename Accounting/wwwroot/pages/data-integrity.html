<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจข้อมูลจากบั๊กที่แก้แล้ว — Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!--
    คำตัดสินเจ้าของ 2026-10-08: ข้อมูลที่อาจบันทึกผิดจากบั๊กที่แก้แล้ว → "รายงานอ่านอย่างเดียวก่อน" ให้ผู้ทำบัญชีตรวจแล้วซ่อมรายตัว
    หน้านี้แสดงผลอย่างเดียว — ทุกการตัดสินมาจากเซิร์ฟเวอร์ (DataIntegrityReportService) ไม่มีสูตรในฝั่ง JS (F2 ข้อ 5)
  -->
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div>
        <h2 class="page-title">ตรวจข้อมูลจากบั๊กที่แก้แล้ว</h2>
        <p class="page-subtitle">รายการที่อาจบันทึกผิดก่อนแก้บั๊ก (2026-10-08) — รายงานให้ผู้ทำบัญชีตรวจ ระบบไม่แก้ข้อมูลให้เอง (บางหมวดมีปุ่ม “แก้” รายใบที่เงินไม่เปลี่ยน)</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center"><span id="exportSlot"></span><button class="btn btn-primary" id="btnRun">🔎 ตรวจ</button></div>
    </div>
    <div id="resultBox"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/export.js"></script>
  <script>
    const Page = {
      // ชื่อหมวด + คำอธิบาย มาจากเซิร์ฟเวอร์ (data.sections ← Helpers/DataIntegritySections — ทีม X5 2026-10-15)
      // เดิมอยู่ในอาร์เรย์ของหน้านี้ ⇒ ไฟล์ส่งออกต้องมีสำเนาที่สอง (F2 ข้อ 4/5)
      init() {
        if (!Layout.init('reports')) return;
        Layout.setTitle('ตรวจข้อมูลจากบั๊กที่แก้แล้ว');
        document.getElementById('btnRun').addEventListener('click', () => this.run());
        const slot = document.getElementById('exportSlot');
        if (slot) slot.innerHTML = ExportUtil.renderServerButtons("(f)=>ExportUtil.downloadServer('finance/exports/data-integrity', {}, f, 'ตรวจข้อมูล')");
        // ปุ่ม "แก้" รายแถว — เส้นทางมาจากเซิร์ฟเวอร์ (fixPath) ไม่มีกติกาในหน้า (F2 ข้อ 5)
        document.getElementById('resultBox').addEventListener('click', (ev) => {
          const btn = ev.target.closest('button[data-fix-path]');
          if (btn) this.fix(btn);
        });
      },
      async fix(btn) {
        const path = btn.dataset.fixPath;
        const number = btn.dataset.fixNumber || '';
        if (!path) return;
        // ข้อความยืนยันจากเซิร์ฟเวอร์ (fixConfirm) — ไม่มี = ข้อความเดิมของหมวดส่วนลดสแกน
        const ask = btn.dataset.fixConfirm || ('แก้ส่วนลดบรรทัดของ ' + number + ' — ตั้งส่วนลด % เป็น 0 ให้เปิดแก้แล้วบันทึกได้ยอดเดิม\nยอด/VAT/ยอดรวม/รายการบัญชีไม่เปลี่ยน (บันทึกประวัติการแก้ไว้)\n\nดำเนินการต่อหรือไม่?');
        if (!confirm(ask)) return;
        btn.disabled = true;
        try {
          const res = await API.post('/api/companies/' + encodeURIComponent(Layout.getCompanyId()) + '/' + path);
          Layout.toast((res && res.message) || 'แก้แล้ว', 'success');
          await this.run();
        } catch (e) {
          btn.disabled = false;
          Layout.toast(e.message, 'error');
        }
      },
      async run() {
        const box = document.getElementById('resultBox');
        box.innerHTML = '<div class="card"><div style="padding:18px;color:#64748b">กำลังตรวจ…</div></div>';
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getDataIntegritySuspects();
          this.render(res && res.data ? res.data : null, res && res.message);
        } catch (e) {
          box.innerHTML = '';
          Layout.toast(e.message, 'error');
        }
      },
      render(data, message) {
        const box = document.getElementById('resultBox');
        // ไม่มีข้อมูล = ตรวจไม่สำเร็จ (ไม่ใช่ "ไม่พบปัญหา") — F2 ข้อ 5
        if (data == null) {
          box.innerHTML = '<div class="card"><div style="padding:18px;color:#b91c1c">ไม่ได้รับผลตรวจจากเซิร์ฟเวอร์</div></div>';
          return;
        }
        const esc = (v) => Layout.esc(v == null ? '' : String(v));
        const money = (v) => v == null ? '-' : esc(Layout.money(v));
        box.innerHTML = `<div class="card" style="margin-bottom:12px"><div style="padding:14px 18px">${esc(message || '')}</div></div>` +
          (Array.isArray(data.sections) ? data.sections : []).map(({ key, title, note }) => {
            const rows = Array.isArray(data[key]) ? data[key] : [];
            const body = rows.length === 0
              ? '<div style="padding:12px 18px;color:#15803d">✓ ไม่พบรายการ</div>'
              : `<div style="padding:0 18px 18px;overflow-x:auto"><table class="data-table" style="font-size:13px;min-width:560px">
                  <thead><tr><th>เลขที่</th><th>วันที่</th><th>รายละเอียด</th><th style="text-align:right">ค่าที่เก็บไว้</th><th style="text-align:right">${esc(key === 'ocrLineDiscountWouldChangeOnResave' ? 'ถ้าบันทึกซ้ำจะได้' : 'ค่าที่ควรเป็น')}</th><th></th></tr></thead>
                  <tbody>${rows.map(r => `<tr><td>${esc(r.number)}</td><td>${esc(Layout.date(r.date))}</td>
                    <td style="font-size:12px">${esc(r.detail)}</td><td style="text-align:right">${money(r.stored)}</td>
                    <td style="text-align:right">${money(r.expected)}</td>
                    <td style="white-space:nowrap">${r.linkUrl ? `<a href="${esc(r.linkUrl)}" style="font-size:12px">${esc(r.linkLabel || 'เปิด')}</a>` : ''}
                      ${r.fixPath ? `<button class="btn btn-sm btn-primary" data-fix-path="${esc(r.fixPath)}" data-fix-number="${esc(r.number)}" data-fix-confirm="${esc(r.fixConfirm || '')}">แก้</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
            return `<div class="card" style="margin-bottom:12px">
              <div class="card-header"><h3 class="card-title">${esc(title)} (${rows.length})</h3></div>
              <div style="padding:0 18px 6px;color:#64748b;font-size:12px">${esc(note)}</div>${body}</div>`;
          }).join('');
      },
    };
    Page.init();
  </script>
</body>
</html>
