<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายการรับชำระออนไลน์ - Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:18px; margin-bottom:16px }
    .card h3 { margin:0 0 4px; font-size:15px; font-weight:700; color:#0f172a }
    .card .sub { margin:0 0 14px; font-size:12px; color:#64748b; line-height:1.6 }
    .hint { font-size:11.5px; color:#64748b; line-height:1.6; margin-top:6px }
    table.tbl { width:100%; border-collapse:collapse; font-size:12.5px }
    table.tbl th, table.tbl td { padding:7px 9px; border-bottom:1px solid #eef2f7; text-align:left; vertical-align:top }
    table.tbl th { background:#f8fafc; font-weight:600; color:#475569; font-size:11.5px }
    table.tbl td.num, table.tbl th.num { text-align:right; font-variant-numeric:tabular-nums }
    .scroll-x { overflow-x:auto }
    .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap }
    .st-Succeeded { background:#dcfce7; color:#166534 }
    .st-Pending, .st-Created { background:#fef3c7; color:#92400e }
    .st-Failed, .st-Expired { background:#fee2e2; color:#991b1b }
    .st-Refunded, .st-PartiallyRefunded { background:#ede9fe; color:#5b21b6 }
    .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px }
    .filters label { font-size:12px; color:#475569; font-weight:600; display:block; margin-bottom:3px }
    .stuck { background:#fffbeb }
    .banner { border-radius:10px; padding:11px 14px; font-size:12.5px; line-height:1.7; margin-bottom:12px }
    .banner.warn { background:#fef3c7; border:1px solid #fcd34d; color:#92400e }
    .ev { font-size:11.5px; color:#475569; line-height:1.7 }
    .ev b { color:#0f172a }
    .cn-miss { background:#fee2e2; color:#991b1b }
    .cn-ok { background:#dcfce7; color:#166534 }
  </style>
</head>
<body>
  <div id="pageContent" class="page-content fade-in">
    <div class="container" style="max-width:1120px;margin:0 auto;padding:20px">
      <div style="margin-bottom:16px">
        <h1 style="margin:0;font-size:24px;font-weight:700">💳 รายการรับชำระออนไลน์</h1>
        <p style="margin:4px 0 0;color:#64748b;font-size:14px">
          ทุกครั้งที่ลูกค้ากดจ่ายผ่านระบบ — เว็บขายของ · ใบแจ้งหนี้ใน portal · มัดจำที่พัก ·
          บิล POS · ค่าบริการระบบ · ใช้หน้านี้ตอบคำถาม <b>"ลูกค้าบอกว่าจ่ายแล้วแต่ระบบไม่รู้"</b>
        </p>
      </div>
      <div id="body"><div class="card">กำลังโหลด…</div></div>
    </div>
  </div>

  <div class="modal-overlay" id="evModal">
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <div class="modal-title">ประวัติรายการชำระเงิน</div>
        <button class="modal-close" onclick="Layout.closeModal('evModal')">&times;</button>
      </div>
      <div class="modal-body" id="evBody" style="padding:18px 24px"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    // หน้ารายการ intent (PAYMENT_GATEWAY_DESIGN.md เฟส 5)
    //
    // กติกา:
    //  • **ไม่มีชื่อผู้ให้บริการ hard-code** — โชว์ค่าที่เซิร์ฟเวอร์ส่งมาตรง ๆ
    //  • "ตรวจสถานะสด" = ให้เซิร์ฟเวอร์ไปถามผู้ให้บริการจริง ไม่ใช่ refresh หน้าจอ
    //  • "ยืนยันด้วยมือ" **บังคับกรอกเหตุผล** — เป็นจุดที่ผู้สอบบัญชีถามเสมอ
    //    และเดินผ่าน endpoint เดียวกับ webhook ⇒ ต้นทางถูกดำเนินการต่อครบเหมือนกัน
    const Page = {
      rows: [],
      summary: { refundedAwaitingCreditNote: 0, refundUntracked: 0 },
      filter: { status: '', q: '' },

      async init() {
        await Layout.init();
        if (!Layout.getCompanyId()) {
          document.getElementById('body').innerHTML = '<div class="card">กรุณาเลือกบริษัทก่อน</div>';
          return;
        }
        // รอบ 259-3 (E-M4): deep-link จาก Autopilot/ธนาคาร/พอร์ทัล (?status=Pending = สลิป/รายการรอยืนยัน) — ตัวกรองเดียวกับดรอปดาวน์
        try { const st = new URLSearchParams(location.search).get('status'); if (st) this.filter.status = st; } catch (_) { /* ไม่มี query */ }
        await this.load();
      },

      async load() {
        const api = Layout.api(); if (!api) return;
        try {
          const q = this.filter.status ? `?status=${encodeURIComponent(this.filter.status)}&limit=300` : '?limit=300';
          const d = (await api.listPaymentIntents(q))?.data || {};
          this.rows = d.items || [];
          // ตัวนับมาจากเซิร์ฟเวอร์ (ตัดสินที่เดียว) — หน้าเว็บไม่นับเอง
          this.summary = {
            refundedAwaitingCreditNote: d.refundedAwaitingCreditNote || 0,
            refundUntracked: d.refundUntracked || 0,
            refundOutcomeUnknown: d.refundOutcomeUnknown || 0,
            redispatchPending: d.redispatchPending || 0,
            // รอบ 201 ทีม GW (A-GW2): ค้างนาน + เกณฑ์ + ตัวเลือกสถานะ มาจากเซิร์ฟเวอร์ (PaymentIntentPolicy) — หน้าเว็บไม่มีสำเนาเกณฑ์/ป้าย
            stuck: d.stuck || 0,
            stuckMinutes: d.stuckMinutes,
          };
          this.statusOptions = d.statusOptions || [];
          // รอบ 235 (คำตัดสิน 235-3): เงินโหมดทดสอบที่ลงบัญชีไปแล้วก่อนรอบ 232 — เซิร์ฟเวอร์คัดกรอง/ตัดสินทั้งหมด หน้าเว็บแค่แสดง ·
          // โหลดไม่ได้ = บอกตรง ๆ (ไม่ใช่ซ่อนเหมือนไม่มีรายการ)
          try { this.legacy = (await api.listTestModeLegacyPayments())?.data || { count: 0, items: [] }; this.legacyError = null; }
          catch (e2) { this.legacy = null; this.legacyError = e2.message || 'โหลดไม่สำเร็จ'; }
          this.render();
        } catch (e) {
          document.getElementById('body').innerHTML =
            `<div class="card banner warn">โหลดไม่สำเร็จ: ${Layout.esc(e.message || '')}</div>`;
        }
      },

      visible() {
        const q = (this.filter.q || '').trim().toLowerCase();
        if (!q) return this.rows;
        return this.rows.filter(r =>
          (r.providerRef || '').toLowerCase().includes(q)
          || (r.sourceKind || '').toLowerCase().includes(q)
          || (r.sourceKindLabel || '').toLowerCase().includes(q)
          || String(r.amount).includes(q));
      },

      render() {
        const rows = this.visible();
        const stuckCount = this.summary.stuck || 0;
        document.getElementById('body').innerHTML = `
          ${this.legacyHtml()}
          ${this.summary.refundedAwaitingCreditNote ? `<div class="banner warn">
            🧾 มี <b>${this.summary.refundedAwaitingCreditNote}</b> รายการที่<b>คืนเงินแล้ว แต่ยังไม่พบใบลดหนี้</b> (§86/10) —
            ระบบลงบัญชีคืนเงินแล้ว (ยอดรอใบลดหนี้อยู่ที่ลูกหนี้การค้า) · เปิดเอกสารต้นทางแล้วออกใบลดหนี้เพื่อลดภาษีขาย
          </div>` : ''}
          ${this.summary.refundOutcomeUnknown ? `<div class="banner warn">
            ⛔ มี <b>${this.summary.refundOutcomeUnknown}</b> รายการที่<b>คืนเงินผลไม่แน่ชัด</b> (ผู้ให้บริการไม่ตอบ — เงินอาจออกไปแล้ว)
            · ระบบล็อกการคืนเงินของรายการนั้นไว้ — กดปุ่ม <b>"ตรวจผลการคืนเงิน"</b> ในแถวนั้น (ห้ามคืนซ้ำที่แดชบอร์ดผู้ให้บริการก่อนตรวจ)
          </div>` : ''}
          ${this.summary.redispatchPending ? `<div class="banner warn">
            💳 มี <b>${this.summary.redispatchPending}</b> รายการที่<b>เงินเข้าแล้ว แต่ระบบยังไม่ได้บันทึกให้ต้นทาง</b> (ใบ/การจอง/ออเดอร์ยังไม่ขยับ)
            — กดปุ่ม <b>"ส่งต่อใหม่"</b> ในแถวนั้นหลังแก้สาเหตุ (ดู "ประวัติ") · หรือบันทึกรับเงินด้วยมือที่ต้นทาง
          </div>` : ''}
          ${this.summary.refundUntracked ? `<div class="banner warn">
            ⚠️ มี <b>${this.summary.refundUntracked}</b> รายการที่สถานะ "คืนเงินแล้ว" แต่<b>ไม่มีรายการบัญชีคืนเงิน</b>
            (คืนก่อนระบบบันทึกยอดคืน หรือลงบัญชีไม่สำเร็จ — ดูประวัติของรายการ) · รายการเหล่านี้ไม่ถูกนับในรอบโอน
            จนกว่าเจ้าของกิจการจะกด <b>"บันทึกยอดคืน"</b> ที่แถวนั้น (ยอดคืนจริงตามแดชบอร์ดผู้ให้บริการ + เลือกว่าให้ระบบลงบัญชีหรือลงมือไว้แล้ว)
          </div>` : ''}
          ${stuckCount ? `<div class="banner warn">
            ⚠️ มี <b>${stuckCount}</b> รายการค้างเกิน ${Layout.esc(String(this.summary.stuckMinutes ?? ''))} นาที — สาเหตุที่พบบ่อยที่สุดคือ
            <b>ยังไม่ได้ตั้ง Webhook URL</b> ในแดชบอร์ดของผู้ให้บริการ
            (ดู URL ได้ที่ <a href="/pages/payment-settings.html">หน้าตั้งค่าการรับชำระเงินออนไลน์</a>)
            · ถ้าลูกค้าจ่ายแล้วจริง กด "ตรวจสถานะสด" ที่แถวนั้น
          </div>` : ''}
          <div class="card">
            <div class="filters">
              <div><label>สถานะ</label>
                <select class="form-input" id="fSt" onchange="Page.setStatus(this.value)">
                  <option value="">ทั้งหมด</option>
                  ${(this.statusOptions || []).map(o => `<option value="${Layout.esc(o.value)}" ${this.filter.status === o.value ? 'selected' : ''}>${Layout.esc(o.label)}</option>`).join('')}
                </select></div>
              <div style="flex:1;min-width:200px"><label>ค้นหา (เลขอ้างอิง / ที่มา / ยอด)</label>
                <input class="form-input" id="fQ" value="${Layout.esc(this.filter.q)}"
                  oninput="Page.setQuery(this.value)"></div>
              <button class="btn btn-secondary" onclick="Page.load()">🔄 โหลดใหม่</button>
            </div>
            <div class="scroll-x"><table class="tbl">
              <thead><tr>
                <th>เวลา</th><th>ที่มา</th><th>ช่องทาง</th><th>อ้างอิง</th>
                <th class="num">ยอด</th><th>สถานะ</th><th>ยืนยันโดย</th><th></th>
              </tr></thead>
              <tbody>${rows.map(r => this.row(r)).join('') ||
                '<tr><td colspan="8" style="color:#94a3b8;padding:16px">ไม่มีรายการ</td></tr>'}</tbody>
            </table></div>
            <div class="hint">
              💡 "ตรวจสถานะสด" = ระบบไปถามผู้ให้บริการจริง ณ ตอนนี้ (ไม่ใช่แค่รีเฟรชหน้าจอ) ·
              "ยืนยันด้วยมือ" ใช้เมื่อ<b>เห็นเงินเข้าบัญชีจริงแล้ว</b>แต่ระบบยังไม่รู้ —
              ระบบจะดำเนินการต่อให้ต้นทาง (ออกใบเสร็จ/ตัดหนี้/ยืนยันการจอง) เหมือนที่ควรเกิด
            </div>
          </div>`;
      },

      setStatus(v) { this.filter.status = v; this.load(); },
      setQuery(v) { this.filter.q = v; this.render();
        const el = document.getElementById('fQ'); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } },

      row(r) {
        // ทุกเงื่อนไขของปุ่ม/ป้ายมาจากเซิร์ฟเวอร์ (canCheckLive · canRefund · canEditFee · isStuck) — A-GW2
        const open = r.canCheckLive === true;
        const stuck = r.isStuck === true;
        return `<tr class="${stuck ? 'stuck' : ''}">
          <td>${Layout.date(r.createdAt)}<div style="color:#94a3b8;font-size:11px">${new Date(r.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</div></td>
          <td>${Layout.esc(r.sourceKindLabel || r.sourceKind || '')}</td>
          <td>${Layout.esc(r.providerCode || '')}<div style="color:#94a3b8;font-size:11px">${Layout.esc(r.method || '')}</div></td>
          <td style="font-family:ui-monospace,monospace;font-size:11px;word-break:break-all">${Layout.esc(r.providerRef || '—')}</td>
          <td class="num">${Layout.money(r.amount)}</td>
          <td><span class="pill st-${Layout.esc(r.status)}">${Layout.esc(r.statusLabel || r.status)}</span>
            ${stuck ? '<div style="color:#b45309;font-size:11px;margin-top:2px">ค้างนาน</div>' : ''}
            ${r.failureMessage ? `<div style="color:#b91c1c;font-size:11px;margin-top:2px">${Layout.esc(r.failureMessage)}</div>` : ''}
            ${Number(r.refundedAmount) > 0 ? `<div style="font-size:11px;margin-top:2px">คืนแล้ว ${Layout.money(r.refundedAmount)}</div>` : ''}
            ${r.needsCreditNote ? '<div style="margin-top:2px"><span class="pill cn-miss">ยังไม่ออกใบลดหนี้</span></div>' : ''}
            ${r.creditNoteState === 'CreditNoteCovered' ? '<div style="margin-top:2px"><span class="pill cn-ok">ออกใบลดหนี้แล้ว</span></div>' : ''}
            ${r.refundUntracked ? '<div style="color:#b45309;font-size:11px;margin-top:2px">ไม่มียอดคืนในระบบ — กด "บันทึกยอดคืน" (เจ้าของกิจการ)</div>' : ''}
            ${r.refundOutcomeUnknown ? `<div style="color:#b91c1c;font-size:11px;margin-top:2px">${Layout.esc(r.refundOutcomeUnknownMessage || 'คืนเงินผลไม่แน่ชัด')}</div>` : ''}
            ${r.redispatchPending ? `<div style="margin-top:2px"><span class="pill cn-miss">⚠️ ${Layout.esc(r.redispatchPendingLabel || 'ยังไม่ได้บันทึกให้ต้นทาง')}</span></div>` : ''}
            ${r.dispute ? `<div style="margin-top:2px"><span class="pill ${r.dispute.needsAttention ? 'cn-miss' : 'cn-ok'}">${r.dispute.needsAttention ? '⚠️ ' : ''}${Layout.esc(r.dispute.label)}</span>
              ${r.dispute.amount != null ? `<div style="font-size:11px">ยอดโต้แย้ง ${Layout.money(r.dispute.amount)}${r.dispute.reason ? ' · ' + Layout.esc(r.dispute.reason) : ''}</div>` : ''}
              ${r.dispute.needsAttention && r.dispute.nextStep ? `<div style="color:#b45309;font-size:11px">${Layout.esc(r.dispute.nextStep)}</div>` : ''}</div>` : ''}</td>
          <td style="font-size:11.5px">${Layout.esc(r.confirmedBy || '—')}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-sm btn-secondary" onclick="Page.events('${r.id}')">ประวัติ</button>
            ${open ? `<button class="btn btn-sm btn-secondary" onclick="Page.live('${r.id}')">ตรวจสถานะสด</button>
                      <button class="btn btn-sm btn-primary" onclick="Page.manual('${r.id}', ${r.isDocumentSlip === true})">ยืนยันด้วยมือ</button>` : ''}
            ${r.canRejectSlip ? `<button class="btn btn-sm btn-secondary" onclick="Page.rejectSlip('${r.id}')" title="สลิปปลอม/ซ้ำ/ถูกแทนด้วยเงินก้อนอื่น — ไม่มีการบันทึกเงิน">ปฏิเสธสลิป</button>` : ''}
            ${r.dispute && r.dispute.needsAttention ? `<button class="btn btn-sm btn-secondary" onclick="Page.ackDispute('${r.id}')">รับทราบข้อพิพาท</button>` : ''}
            ${r.redispatchPending ? `<button class="btn btn-sm btn-primary" onclick="Page.redispatch('${r.id}')" title="เงินเข้าแล้วแต่ต้นทางยังไม่ถูกบันทึก — ให้ระบบส่งต่อให้ handler เดิมอีกครั้ง (ไม่บันทึกเงินซ้ำ)">ส่งต่อใหม่</button>` : ''}
            ${r.refundOutcomeUnknown
              ? `<button class="btn btn-sm btn-warning" onclick="Page.verifyRefund('${r.id}')">ตรวจผลการคืนเงิน</button>
                 <button class="btn btn-sm btn-secondary" onclick="Page.resolveRefund('${r.id}')" title="เจ้าของกิจการเท่านั้น — เมื่อผู้ให้บริการไม่ส่งผล/ข้อมูลขัดกัน">บันทึกผลด้วยมือ</button>`
              : (r.canRefund
                ? `<button class="btn btn-sm btn-warning" onclick="Page.refund('${r.id}', ${Number(r.refundableRemaining) || 0})">คืนเงิน</button>` : '')}
            ${r.canEditFee
              ? `<button class="btn btn-sm btn-secondary" onclick="Page.editFee('${r.id}')">ค่าธรรมเนียม</button>` : ''}
            ${r.refundUntracked && !r.refundOutcomeUnknown
              ? `<button class="btn btn-sm btn-secondary" onclick="Page.recordLegacyRefund('${r.id}')" title="เจ้าของกิจการเท่านั้น — ยอดคืนจริงตามแดชบอร์ดผู้ให้บริการ">บันทึกยอดคืน</button>` : ''}
          </td>
        </tr>`;
      },

      async live(id) {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.getPaymentIntentStatus(id, true);
          Layout.toast(`สถานะล่าสุด: ${res?.data?.status || '-'}`);
          await this.load();
        } catch (e) { Layout.toast(e.message || 'ตรวจสถานะไม่สำเร็จ', 'error'); }
      },

      // รอบ 228 ฝ่ายค้าน S5: รับทราบ/จัดการข้อพิพาท (ล้างธงจนกว่าข้อพิพาทจะเปลี่ยน · audit ที่เซิร์ฟเวอร์)
      async ackDispute(id) {
        const api = Layout.api(); if (!api) return;
        const note = await Layout.promptText({ title: 'รับทราบข้อพิพาท', label: 'บันทึกสิ่งที่ทำ', placeholder: 'เช่น ส่งหลักฐานแล้ว/ออกใบลดหนี้แล้ว', multiline: true });
        if (note === null) return;
        try { const res = await api.acknowledgePaymentDispute(id, note); Layout.toast(res?.message || 'บันทึกแล้ว'); await this.load(); }
        catch (e) { Layout.toast(e.message || 'บันทึกไม่สำเร็จ', 'error'); }
      },

      // รอบ 235 (คำตัดสิน 235-3): รายงาน "เงินทดสอบที่ลงบัญชีไปแล้ว" — ป้าย/ทางไปต่อ/สิทธิ์กดมาจากเซิร์ฟเวอร์ (TestModeLegacyEffectPolicy)
      legacyHtml() {
        const esc = Layout.esc;
        if (this.legacyError) return `<div class="banner warn">ตรวจ "เงินโหมดทดสอบที่ลงบัญชีไปแล้ว" ไม่สำเร็จ: ${esc(this.legacyError)}</div>`;
        const L = this.legacy;
        if (!L || !L.count) return '';
        const money = (n) => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const rows = (L.items || []).map(r => {
          const effects = (r.effects || []).map(e => `<li style="margin:4px 0">
              ${esc(e.label)} — ${e.href ? `<a href="${esc(e.href)}" target="_blank" rel="noopener">${esc(e.number || 'เปิด')}</a>` : esc(e.number || '')}
              ${e.canReverseHere && e.paymentId
                ? `<button class="btn btn-sm btn-danger" style="margin-left:6px" data-intent="${esc(r.intentId)}" data-payment="${esc(e.paymentId)}" onclick="Page.reverseLegacy(this.dataset.intent, this.dataset.payment)">↩️ กลับรายการ</button>`
                : ''}
              <div class="text-xs" style="color:#6b7280">${esc(e.hint || '')}</div></li>`).join('');
          return `<tr><td>${esc(r.sourceKindLabel || r.sourceKind)}</td><td class="num">${money(r.amount)}</td>
            <td>${esc(r.statusLabel || r.status)}<div class="text-xs" style="color:${r.proven ? '#6b7280' : '#b45309'}">${esc(r.evidenceLabel || '')}</div></td>
            <td>${r.confirmedAt ? esc(new Date(r.confirmedAt).toLocaleString('th-TH')) : '—'}</td>
            <td><ul style="margin:0;padding-left:16px">${effects}</ul></td></tr>`;
        }).join('');
        // ถูกตัด (เกินเพดานต่อรายงาน) — บอกตรง ๆ ไม่ให้ดูเหมือนครบ (ฝ่ายค้าน S5) · จำนวน/เพดานมาจากเซิร์ฟเวอร์
        const truncated = L.truncated ? `<div style="margin-top:6px">⚠️ แสดงจากรายการล่าสุด ${esc(String(L.maxRows))} รายการ จากทั้งหมด ${esc(String(L.totalCandidates))} — กลับรายการชุดนี้แล้วโหลดใหม่เพื่อดูที่เหลือ</div>` : '';
        // ห้ามยืนยันว่า "เงินไม่ได้เข้าจริง" กับแถวที่พิสูจน์ไม่ได้ (ฝ่ายค้าน B1) — ป้ายต่อแถวมาจากเซิร์ฟเวอร์ (evidenceLabel)
        return `<div class="card banner warn">
            🧪 พบ <b>${esc(String(L.count))}</b> รายการรับชำระออนไลน์ที่<b>ระบบลงบัญชีไปแล้ว</b> ทั้งที่รายการเป็น (หรืออาจเป็น) <b>โหมดทดสอบ</b> (ก่อนระบบกันเงินทดสอบ) —
            ระบบ<b>ไม่กลับรายการให้อัตโนมัติ</b> · ตรวจหลักฐานในแต่ละแถวแล้วกลับรายการเองตามทางที่ระบุ
            ${L.unprovenCount ? `<div style="margin-top:6px">${esc(String(L.unprovenCount))} รายการพิสูจน์ไม่ได้ว่าเป็นเงินทดสอบ — ตรวจกับแดชบอร์ดผู้ให้บริการก่อน</div>` : ''}
            ${truncated}
            <div style="overflow-x:auto;margin-top:8px"><table class="table"><thead><tr><th>ต้นทาง</th><th>ยอด</th><th>สถานะ / หลักฐาน</th><th>ยืนยันเมื่อ</th><th>ผลทางบัญชีที่ค้าง</th></tr></thead>
            <tbody>${rows}</tbody></table></div></div>`;
      },

      async reverseLegacy(intentId, paymentId) {
        const api = Layout.api(); if (!api) return;
        if (!(await Layout.confirmDanger({
          title: 'กลับรายการรับชำระของเงินทดสอบ',
          message: 'ระบบจะ<strong>ยกเลิกการรับชำระ</strong>นี้ด้วยเส้นยกเลิกเดิม (กลับ JE รับเงิน · คืนยอดค้างให้เอกสาร) และบันทึกใน audit log<br>'
            + 'ใช้เฉพาะเมื่อแน่ใจว่าเงินก้อนนี้เป็น<strong>เงินทดสอบ</strong> (ไม่มีเงินจริงเข้า)',
        }))) return;
        try {
          const res = await api.reverseTestModeLegacyPayment(intentId, paymentId);
          Layout.toast(res?.message || 'กลับรายการแล้ว');
        } catch (e) {
          await Layout.notice({ title: 'กลับรายการไม่สำเร็จ', message: e.message || 'กลับรายการไม่สำเร็จ' });
        }
        await this.load();
      },

      // รอบ 205 ทีม W1 (R-01): ส่งต่อใหม่ — ปุ่มโผล่เฉพาะแถวที่เซิร์ฟเวอร์บอกว่าค้าง · ผล/เหตุผลมาจากเซิร์ฟเวอร์ทั้งหมด
      async redispatch(id) {
        const api = Layout.api(); if (!api) return;
        if (!await Layout.confirm({ title: 'ส่งต่อรายการนี้ให้ต้นทางอีกครั้ง?', okText: 'ส่งต่อ',
          message: 'ระบบจะเรียกตัวจัดการเดิม (ออกใบเสร็จ / ตัดหนี้ / ยืนยันการจอง) — ถ้าเคยบันทึกแล้วจะไม่บันทึกซ้ำ' })) return;
        try {
          const res = await api.redispatchPaymentIntent(id);
          await Layout.notice({ title: 'ส่งต่อแล้ว', message: res?.message || 'ส่งต่อแล้ว' });
        } catch (e) {
          // ต้นทางยังบันทึกไม่สำเร็จ — ข้อความจากเซิร์ฟเวอร์บอกเหตุ + ทางไปต่อ ต้องให้ผู้ใช้อ่านครบ
          await Layout.notice({ title: 'ส่งต่อไม่สำเร็จ', message: e.message || 'ส่งต่อไม่สำเร็จ' });
        }
        await this.load();
      },

      async manual(id, isDocumentSlip) {
        const api = Layout.api(); if (!api) return;
        // รอบ 259-3 (ทีม E 3ก-5 · §4.1): หน้าต่างเดียว (ยอด · วันที่เงินเข้าแบบเลือกวัน · เหตุผล) แทนลูกโซ่ prompt() ที่ต้องพิมพ์ ปปปป-ดด-วว เอง
        // ยอด = ยอดของรายการ (สลิป/เงินออนไลน์ — ยืนยันตามที่ลูกค้าแจ้ง แก้ที่นี่ไม่ได้) · บัญชีเงินเข้า = ตามผังรับเงินของช่องทาง (เซิร์ฟเวอร์ตัดสิน)
        // · วันที่: เซิร์ฟเวอร์ตรวจ (DocumentSlipIntents.ReceivedDate) ว่าง = วันที่ลูกค้าแนบสลิป
        const r = this.rows.find(x => x.id === id) || {};
        const fields = [
          { key: 'amount', label: 'ยอด', type: 'readonly', value: Layout.money(r.amount) + ' บาท' },
        ];
        if (isDocumentSlip) fields.push({ key: 'receivedDate', label: 'วันที่เงินเข้าบัญชีจริง', type: 'date',
          hint: 'เว้นว่าง = วันที่ลูกค้าแนบสลิป · ดูวันที่จากรายการเดินบัญชี' });
        fields.push({ key: 'reason', label: 'เหตุผล (ผู้สอบบัญชีจะเห็นข้อความนี้)', type: 'textarea', required: true,
          value: 'ตรวจสอบยอดในบัญชีธนาคารแล้วพบเงินเข้าจริง' });
        const form = await Layout.formDialog({ title: 'ยืนยันการรับเงินด้วยมือ', okText: 'ถัดไป', fields });
        if (!form) return;
        const reason = form.reason;
        const receivedDate = isDocumentSlip ? (form.receivedDate || null) : null;
        if (!(await Layout.confirmDanger({
          title: 'ยืนยันการรับเงินด้วยมือ',
          message: 'ระบบจะถือว่า<strong>เงินเข้าแล้ว</strong>และดำเนินการต่อให้ต้นทางทันที '
            + '(ออกใบเสร็จ / ตัดหนี้ / ยืนยันการจอง / ปิดบิล)<br>'
            + '<strong style="color:#dc2626">ยืนยันทั้งที่เงินยังไม่เข้าจริง = บัญชีคลาดเคลื่อน</strong> '
            + '— ตรวจยอดในบัญชีธนาคารให้เห็นก่อน',
          mode: 'math'
        }))) return;
        try {
          const res = await api.confirmPaymentIntentManually(id, reason, receivedDate);
          Layout.toast(res?.message || 'ยืนยันแล้ว');
          await this.load();
        } catch (e) { Layout.toast(e.message || 'ยืนยันไม่สำเร็จ', 'error'); }
      },

      async rejectSlip(id) {
        const api = Layout.api(); if (!api) return;
        const reason = await Layout.promptText({ title: 'ปฏิเสธสลิป', label: 'เหตุผล (บันทึกลงประวัติ)', value: 'ไม่พบเงินเข้าตามสลิป',
          required: true, okText: 'ปฏิเสธสลิป', danger: true });
        if (!reason) return;
        try {
          const res = await api.rejectPaymentIntentSlip(id, reason);
          Layout.toast(res?.message || 'ปฏิเสธสลิปแล้ว');
          await this.load();
        } catch (e) { Layout.toast(e.message || 'ปฏิเสธไม่สำเร็จ', 'error'); }
      },

      async refund(id, max) {
        const api = Layout.api(); if (!api) return;
        // ยอดสูงสุด (refundableRemaining) มาจากเซิร์ฟเวอร์ · เซิร์ฟเวอร์ตรวจยอดอีกครั้ง
        const form = await Layout.formDialog({ title: 'คืนเงิน', okText: 'คืนเงิน', danger: true, fields: [
          { key: 'amount', label: `ยอดที่ต้องการคืน (สูงสุด ${Layout.money(max)})`, type: 'number', step: '0.01', min: 0.01, max: Number(max.toFixed(2)), value: max.toFixed(2), required: true },
          { key: 'reason', label: 'เหตุผลการคืนเงิน', type: 'text', value: 'ลูกค้ายกเลิกคำสั่งซื้อ', required: true },
        ] });
        if (!form) return;
        const amount = form.amount, reason = form.reason;
        try {
          const res = await api.refundPaymentIntent(id, amount, reason);
          // ขั้นถัดไปที่ระบบทำแทนไม่ได้ — ต้องบอกให้ชัด ไม่ใช่ปล่อยให้ผู้ใช้เดา
          await Layout.notice({ title: 'คืนเงินแล้ว', message: `${res?.message || 'คืนเงินแล้ว'}\n\nขั้นถัดไป: ${res?.data?.nextStep || ''}` });
          await this.load();
        } catch (e) {
          // เงินอาจออกไปแล้วแม้ลงบัญชีไม่สำเร็จ — ข้อความจากเซิร์ฟเวอร์บอกชัด ต้องให้ผู้ใช้อ่านครบ (ไม่ใช่ toast หายไป)
          await Layout.notice({ title: 'คืนเงินไม่สำเร็จ', message: e.message || 'คืนเงินไม่สำเร็จ' });
          await this.load();
        }
      },

      // E-2: ตรวจผลการคืนเงินที่ผลไม่แน่ชัด — เซิร์ฟเวอร์ถามยอดคืนสะสมจากผู้ให้บริการแล้วตัดสิน (หน้าเว็บแสดงผลอย่างเดียว)
      async verifyRefund(id) {
        const api = Layout.api(); if (!api) return;
        try {
          const res = await api.verifyPaymentIntentRefund(id);
          await Layout.notice({ title: 'ผลการตรวจ', message: res?.message || 'ตรวจแล้ว' });
        } catch (e) {
          await Layout.notice({ title: 'ตรวจผลไม่สำเร็จ', message: e.message || 'ตรวจผลไม่สำเร็จ' });
        }
        await this.load();
      },

      // review198-E2 E2-3: บันทึกผลด้วยมือ (เจ้าของกิจการ) — เซิร์ฟเวอร์ตัดสินทุกด่าน (หลักฐาน · ยอด · เวลารอ · สิทธิ์) หน้าเว็บแค่เก็บคำตอบ
      async resolveRefund(id) {
        const api = Layout.api(); if (!api) return;
        const r = this.rows.find(x => x.id === id) || {};
        // กล่องสองทาง: "มี" / "ไม่มี" · × = ไม่ทำต่อ (dismissValue null)
        const wentOut = await Layout.confirm({ title: 'ผลการคืนเงินที่ไม่แน่ชัด', okText: 'มี — เงินออกแล้ว', cancelText: 'ไม่มี', dismissValue: null,
          message: 'ในแดชบอร์ดผู้ให้บริการ มีรายการคืนเงินของครั้งที่ผลไม่แน่ชัดหรือไม่? · มี = เงินออกแล้ว (ระบบจะลงบัญชีคืนเงินให้) · ไม่มี = ยืนยันว่าไม่มีเงินออก (ระบบปลดล็อกให้คืนใหม่ได้)' });
        if (wentOut === null) return;
        const body = { decision: wentOut ? 'MoneyWentOut' : 'NoMoneyOut' };
        const fields = wentOut ? [
          { key: 'amount', label: 'ยอดที่ผู้ให้บริการคืนไปจริง (ตามแดชบอร์ด)', type: 'number', step: '0.01', min: 0.01, required: true,
            value: r.refundOutcomeUnknownAmount == null ? '' : Number(r.refundOutcomeUnknownAmount).toFixed(2) },
          { key: 'ref', label: 'เลขอ้างอิงการคืนเงินจากแดชบอร์ดผู้ให้บริการ', type: 'text', required: true },
        ] : [ { key: 'none', label: 'ยืนยัน', type: 'readonly', value: 'แดชบอร์ดผู้ให้บริการ "ไม่มี" รายการคืนเงินของครั้งนี้' } ];
        fields.push({ key: 'evidence', label: 'หลักฐาน (สิ่งที่เห็นในแดชบอร์ด — ผู้สอบบัญชีจะเห็นข้อความนี้)', type: 'textarea', required: true });
        const form = await Layout.formDialog({ title: wentOut ? 'บันทึกเงินคืนที่ออกแล้ว' : 'ยืนยันว่าไม่มีเงินออก', okText: 'บันทึกผล', fields });
        if (!form) return;
        if (wentOut) { body.amount = form.amount; body.providerRefundRef = form.ref; }
        body.evidence = form.evidence;
        try {
          const res = await api.resolvePaymentIntentRefundManually(id, body);
          await Layout.notice({ title: 'บันทึกผลแล้ว', message: res?.message || 'บันทึกผลแล้ว' });
        } catch (e) {
          await Layout.notice({ title: 'บันทึกผลไม่สำเร็จ', message: e.message || 'บันทึกผลไม่สำเร็จ' });
        }
        await this.load();
      },

      // รอบ 201 ทีม GW (A-GW7): บันทึกยอดคืนจริงย้อนหลัง (แถวที่คืนแล้วแต่ระบบไม่มียอดคืน) — เซิร์ฟเวอร์ตัดสินทุกด่าน หน้าเว็บแค่เก็บคำตอบ
      async recordLegacyRefund(id) {
        const api = Layout.api(); if (!api) return;
        const r = this.rows.find(x => x.id === id) || {};
        // รอบ 259-3: หน้าต่างเดียว (วันที่แบบเลือกวัน) แทน prompt() 4 กล่อง + confirm() — ตัวเลือกลงบัญชีเป็นช่องเลือกที่อ่านออก
        const form = await Layout.formDialog({ title: 'บันทึกยอดคืนเงินย้อนหลัง', okText: 'บันทึก', fields: [
          { key: 'amount', label: 'ยอดที่ผู้ให้บริการคืนไปจริง (ตามแดชบอร์ด)', type: 'number', step: '0.01', min: 0.01, required: true,
            value: r.status === 'Refunded' ? Number(r.amount || 0).toFixed(2) : '' },
          { key: 'refundedAt', label: 'วันที่เงินคืนออกจริง (ตามแดชบอร์ด)', type: 'date', required: true },
          { key: 'ref', label: 'เลขอ้างอิงการคืนเงินจากแดชบอร์ดผู้ให้บริการ', type: 'text', required: true },
          { key: 'evidence', label: 'หลักฐาน (สิ่งที่เห็นในแดชบอร์ด — ผู้สอบบัญชีจะเห็นข้อความนี้)', type: 'textarea', required: true },
          { key: 'journal', label: 'รายการบัญชีคืนเงิน', type: 'select', value: 'BookNow', options: [
            { value: 'BookNow', label: 'ยังไม่เคยลงบัญชี — ให้ระบบลง Dr ลูกหนี้ / Cr บัญชีพัก' },
            { value: 'AlreadyBookedManually', label: 'ลงด้วยมือไว้แล้ว — บันทึกเฉพาะยอดคืน (ห้ามลงซ้ำ)' },
          ] },
        ] });
        if (!form) return;
        try {
          const res = await api.recordPaymentIntentLegacyRefund(id, {
            amount: form.amount, refundedAt: form.refundedAt, providerRefundRef: form.ref, evidence: form.evidence,
            journal: form.journal,
          });
          await Layout.notice({ title: 'บันทึกแล้ว', message: `${res?.message || 'บันทึกแล้ว'}${res?.data?.nextStep ? ' · ขั้นถัดไป: ' + res.data.nextStep : ''}` });
        } catch (e) {
          await Layout.notice({ title: 'บันทึกไม่สำเร็จ', message: e.message || 'บันทึกไม่สำเร็จ' });
        }
        await this.load();
      },

      // แก้ค่าธรรมเนียมจริงรายรายการ (ก่อนบันทึกรอบโอน) — บังคับเหตุผล · เซิร์ฟเวอร์บันทึก audit
      // R-E4: ค่าตั้งต้น = feeActual ดิบ · ป้ายบอกความหมายตามโหมด VAT มาจากเซิร์ฟเวอร์ (feeInputLabel)
      async editFee(id) {
        const api = Layout.api(); if (!api) return;
        const r = this.rows.find(x => x.id === id) || {};
        const form = await Layout.formDialog({ title: 'แก้ค่าธรรมเนียม', okText: 'บันทึก', fields: [
          { key: 'fee', label: `${r.feeInputLabel || 'ค่าธรรมเนียม'} ของรายการนี้ (ตามสเตทเมนต์ผู้ให้บริการ)`, type: 'number', step: '0.01', min: 0, required: true,
            value: r.feeActual == null ? '' : Number(r.feeActual).toFixed(2) },
          { key: 'reason', label: 'เหตุผลที่แก้ (ผู้สอบบัญชีจะเห็นข้อความนี้)', type: 'text', value: 'ตามสเตทเมนต์ผู้ให้บริการ', required: true },
        ] });
        if (!form) return;
        const fee = form.fee, reason = form.reason;
        if (!(fee >= 0)) { Layout.toast('ค่าธรรมเนียมไม่ถูกต้อง', 'error'); return; }
        try {
          const res = await api.updatePaymentIntentFee(id, fee, reason);
          Layout.toast(res?.message || 'แก้ค่าธรรมเนียมแล้ว');
          await this.load();
        } catch (e) { Layout.toast(e.message || 'แก้ค่าธรรมเนียมไม่สำเร็จ', 'error'); }
      },

      // รอบ 200 ทีม G: คีย์ของ GET pay/intents/{id}/events คือ from/to (ไม่ใช่ fromStatus/toStatus) — เดิมอ่านชื่อที่เซิร์ฟเวอร์ไม่เคยส่ง
      //   ⇒ ประวัติทุกแถวแสดง "— →" ว่าง (ตอบคำถาม "ลูกค้าบอกว่าจ่ายแล้วแต่ระบบไม่รู้" ไม่ได้)
      async events(id) {
        const api = Layout.api(); if (!api) return;
        try {
          const rows = (await api.getPaymentIntentEvents(id))?.data || [];
          const html = rows.map(e => `<div class="ev">
            <b>${Layout.date(e.at)} ${new Date(e.at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</b>
            · ${Layout.esc(e.source || '')} · ${Layout.esc(e.from || '—')} → ${Layout.esc(e.to || '')}
            ${e.note ? `<br><span style="color:#64748b">${Layout.esc(e.note)}</span>` : ''}
          </div>`).join('<hr style="border:0;border-top:1px solid #eef2f7;margin:6px 0">');
          document.getElementById('evBody').innerHTML =
            html || '<div class="ev" style="color:#94a3b8">ยังไม่มีประวัติ</div>';
          Layout.openModal('evModal');
        } catch (e) { Layout.toast(e.message || 'โหลดประวัติไม่สำเร็จ', 'error'); }
      },
    };
    Page.init();
  </script>
</body>
</html>
