<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สุขภาพข้อมูลเข้ารหัส — Next Acc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!--
    รอบ 275 แพ็ก A (T4 M-1): หน้าจอของผู้ใช้บริษัทแทนข้อความเดิมที่ชี้ไป "GET payroll/tax-identity-health" / ENCRYPTION_KEY_PREVIOUS
    ส่วนที่ 1 = ความลับของบริษัท (GET encryption-health/secrets · สิทธิ์ตั้งค่าบริษัท) · ส่วนที่ 2 = เลขประจำตัวพนักงาน/ผู้รับ 50 ทวิ (GET payroll/tax-identity-health เดิม · สิทธิ์เงินเดือน)
    หน้านี้แสดงผลอย่างเดียว — ป้าย/เหตุ/ทางไปต่อ/สถานะมาจากเซิร์ฟเวอร์ทั้งหมด (F2 ข้อ 5) · ไม่มีค่าความลับหรือ ciphertext ในคำตอบ
    รอบ 275 แพ็ก E: ส่วนที่ 3 = พนักงานไม่มีเลข 13 หลัก — รับทราบรายคน (คำตัดสิน 4.2 · GET payroll/tax-id-waivers) ·
    ส่วนที่ 4 = ผู้ติดต่อเลขผิดจากเงินเดือน — รายงาน + ซ่อมเฉพาะแถวที่เลือก (T4 H-2 · GET/POST payroll/junk-payee-contacts) · แผนซ่อมเซิร์ฟเวอร์คำนวณเอง
  -->
  <div id="pageContent" class="page-content fade-in">
    <div class="page-header">
      <div>
        <h2 class="page-title">สุขภาพข้อมูลเข้ารหัส</h2>
        <p class="page-subtitle">รหัสผ่าน/คีย์ที่บันทึกไว้ และเลขประจำตัวพนักงานที่ระบบถอดรหัสไม่ได้ — อ่านอย่างเดียว · แก้โดยกรอกค่าใหม่ในหน้าที่เกี่ยวข้อง</p>
      </div>
      <div><button class="btn btn-primary" id="btnRun">🔎 ตรวจอีกครั้ง</button></div>
    </div>
    <div id="keyBox"></div>
    <div id="secretBox"></div>
    <div id="piiBox"></div>
    <div id="waiverBox"></div>
    <div id="junkBox"></div>
    <div id="amendBox"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/translations.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const Page = {
      init() {
        if (!Layout.init('settings')) return;
        Layout.setTitle('สุขภาพข้อมูลเข้ารหัส');
        document.getElementById('btnRun').addEventListener('click', () => this.run());
        this.run();
      },
      esc(v) { return Layout.esc(v == null ? '' : String(v)); },
      card(title, body) {
        return `<div class="card" style="margin-bottom:12px"><div class="card-header"><h3 class="card-title">${this.esc(title)}</h3></div>${body}</div>`;
      },
      note(text, color) { return `<div style="padding:12px 18px;color:${color || '#64748b'};font-size:13px">${this.esc(text)}</div>`; },
      job(j, name) {
        // undefined/null = ยังไม่เคยรัน (ไม่ใช่ "ไม่มีปัญหา")
        if (!j) return this.note(name + ': ยังไม่มีผลรันบนระบบนี้');
        return this.note(`${name} รอบล่าสุด ${Layout.date(j.finishedAt)} — ${j.success ? 'สำเร็จ' : '⛔ ไม่สำเร็จ'} · ${j.message || ''}`, j.success ? '#64748b' : '#b91c1c');
      },
      async run() {
        const cid = encodeURIComponent(Layout.getCompanyId());
        document.getElementById('secretBox').innerHTML = this.card('รหัสผ่านและคีย์ที่บันทึกไว้', this.note('กำลังตรวจ…'));
        document.getElementById('piiBox').innerHTML = this.card('เลขประจำตัวพนักงาน / ผู้รับ 50 ทวิ', this.note('กำลังตรวจ…'));
        document.getElementById('keyBox').innerHTML = '';
        try {
          const res = await API.get(`/api/companies/${cid}/encryption-health/secrets`);
          this.renderSecrets(res && res.data);
        } catch (e) {
          document.getElementById('secretBox').innerHTML = this.card('รหัสผ่านและคีย์ที่บันทึกไว้', this.note('ตรวจไม่ได้: ' + e.message, '#b91c1c'));
        }
        try {
          const res = await API.get(`/api/companies/${cid}/payroll/tax-identity-health`);
          this.renderPii(res && res.data);
        } catch (e) {
          document.getElementById('piiBox').innerHTML = this.card('เลขประจำตัวพนักงาน / ผู้รับ 50 ทวิ', this.note('ตรวจไม่ได้: ' + e.message + ' (ส่วนนี้ต้องมีสิทธิ์งานเงินเดือน)', '#b91c1c'));
        }
        await this.loadWaivers();
        await this.loadJunk();
        await this.loadAmendments();
      },
      // ── ส่วนที่ 5: งวดที่ต้องยื่น ภ.ง.ด.1 เพิ่มเติม (ฝ่ายค้าน MED-3) — ค้างจนกว่าจะบันทึก ──
      async loadAmendments() {
        const cid = encodeURIComponent(Layout.getCompanyId());
        const box = document.getElementById('amendBox');
        const title = 'งวดที่ต้องยื่น ภ.ง.ด.1 เพิ่มเติม';
        try {
          const res = await API.get(`/api/companies/${cid}/payroll/pnd1-amendments`);
          const rows = Array.isArray(res && res.data) ? res.data : null;
          if (rows == null) { box.innerHTML = this.card(title, this.note('ไม่ได้รับผลตรวจจากเซิร์ฟเวอร์', '#b91c1c')); return; }
          if (rows.length === 0) { box.innerHTML = this.card(title, this.note('✓ ไม่มีงวดค้างยื่นเพิ่มเติม', '#15803d')); return; }
          box.innerHTML = this.card(`${title} (ค้าง ${rows.filter(r => r.pending).length})`, `<div style="padding:0 18px 18px;overflow-x:auto"><table class="data-table" style="font-size:13px;min-width:640px">
              <thead><tr><th>งวด</th><th>เหตุ</th><th>ใบเดิม → ใบแทน</th><th>สิ่งที่ต้องทำ</th><th></th></tr></thead>
              <tbody>${rows.map(r => `<tr><td>${this.esc(r.periodText)}</td><td style="font-size:12px">${this.esc(r.reason)}</td>
                <td style="font-size:12px">${this.esc(r.certificateNumbers)}</td>
                <td style="font-size:12px;color:${r.pending ? '#b91c1c' : '#15803d'}">${r.pending ? '⛔ ' + this.esc(r.action) : '✓ ยื่นเพิ่มเติมแล้ว · ' + this.esc(r.resolvedReference)}</td>
                <td>${r.pending ? `<button class="btn btn-sm btn-primary" data-amend="${this.esc(r.id)}">บันทึกว่ายื่นเพิ่มเติมแล้ว</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`);
          box.querySelectorAll('[data-amend]').forEach(b => b.addEventListener('click', () => this.resolveAmendment(b.dataset.amend)));
        } catch (e) {
          box.innerHTML = this.card(title, this.note('ตรวจไม่ได้: ' + e.message + ' (ส่วนนี้ต้องมีสิทธิ์งานเงินเดือน)', '#b91c1c'));
        }
      },
      async resolveAmendment(id) {
        const reference = prompt('เลขอ้างอิงการยื่นเพิ่มเติม (หรือหมายเหตุ)');
        if (reference == null) return;
        const cid = encodeURIComponent(Layout.getCompanyId());
        try {
          const res = await API.post(`/api/companies/${cid}/payroll/pnd1-amendments/${encodeURIComponent(id)}/resolve`, { reference });
          alert(res.message || 'บันทึกแล้ว');
        } catch (e) { alert(e.message); }
        await this.loadAmendments();
      },
      // ── ส่วนที่ 3: พนักงานไม่มีเลข 13 หลัก (คำตัดสิน 4.2) ──
      async loadWaivers() {
        const cid = encodeURIComponent(Layout.getCompanyId());
        const box = document.getElementById('waiverBox');
        const title = 'พนักงานที่ไม่มีเลขประจำตัว 13 หลัก — รับทราบรายคน';
        try {
          const res = await API.get(`/api/companies/${cid}/payroll/tax-id-waivers`);
          const rows = Array.isArray(res && res.data) ? res.data : null;
          if (rows == null) { box.innerHTML = this.card(title, this.note('ไม่ได้รับผลตรวจจากเซิร์ฟเวอร์', '#b91c1c')); return; }
          const body = rows.length === 0 ? this.note('✓ พนักงานทุกคนมีเลขประจำตัว 13 หลัก', '#15803d')
            : `<div style="padding:0 18px 18px;overflow-x:auto"><table class="data-table" style="font-size:13px;min-width:640px">
                <thead><tr><th>รหัส</th><th>ชื่อ</th><th>สัญชาติ</th><th>หนังสือเดินทาง</th><th>สถานะ</th><th></th></tr></thead>
                <tbody>${rows.map(r => `<tr><td>${this.esc(r.code)}</td><td>${this.esc(r.name)}</td><td>${this.esc(r.nationality)}</td>
                  <td>${this.esc(r.passportMasked || '-')}</td>
                  <td style="font-size:12px;color:${r.canRevoke ? '#15803d' : '#b91c1c'}">${this.esc(r.status)}${r.reason ? ' · เหตุ: ' + this.esc(r.reason) : ''}${r.acknowledgedAt ? ' · ' + this.esc(Layout.date(r.acknowledgedAt)) : ''}${r.acknowledgedBy ? ' · โดย ' + this.esc(r.acknowledgedBy) : ''}</td>
                  <td style="white-space:nowrap">${r.canAcknowledge ? `<button class="btn btn-sm btn-primary" data-ack="${this.esc(r.subjectId)}" data-kind="${this.esc(r.subjectType)}">รับทราบไม่มีเลข 13 หลัก</button>` : ''}
                    ${r.canRevoke ? `<button class="btn btn-sm btn-secondary" data-revoke="${this.esc(r.subjectId)}" data-kind="${this.esc(r.subjectType)}">ถอนการรับทราบ</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
          box.innerHTML = this.card(title, body + this.note('ผู้ที่มีเลขแต่เลขผิด/ถอดรหัสไม่ได้ ไม่อยู่ในรายการนี้ — ต้องแก้เลขที่ทะเบียนพนักงาน (รับทราบแทนไม่ได้)'));
          box.querySelectorAll('[data-ack]').forEach(b => b.addEventListener('click', () => this.ack(b.dataset.ack, b.dataset.kind)));
          box.querySelectorAll('[data-revoke]').forEach(b => b.addEventListener('click', () => this.revoke(b.dataset.revoke, b.dataset.kind)));
        } catch (e) {
          box.innerHTML = this.card(title, this.note('ตรวจไม่ได้: ' + e.message + ' (ส่วนนี้ต้องมีสิทธิ์งานเงินเดือน)', '#b91c1c'));
        }
      },
      // ชนิดผู้รับจากเซิร์ฟเวอร์ (Employee/Contact) → เส้นทาง — ไม่มีกติกาในหน้า
      waiverPath(id, kind) {
        const cid = encodeURIComponent(Layout.getCompanyId());
        return `/api/companies/${cid}/payroll/${kind === 'Contact' ? 'contacts' : 'employees'}/${encodeURIComponent(id)}/tax-id-waiver`;
      },
      async ack(id, kind) {
        const reason = prompt('เหตุที่ไม่มีเลขประจำตัว 13 หลัก (เช่น ต่างชาติ รอเลขจากกรมสรรพากร)');
        if (reason == null) return;
        try {
          const res = await API.post(this.waiverPath(id, kind), { reason });
          Layout.toast ? Layout.toast(res.message || 'รับทราบแล้ว', 'success') : alert(res.message || 'รับทราบแล้ว');
        } catch (e) { alert(e.message); }
        await this.loadWaivers();
      },
      async revoke(id, kind) {
        const reason = prompt('เหตุที่ถอนการรับทราบ (บังคับ)');
        if (reason == null) return;
        try {
          const res = await API.post(this.waiverPath(id, kind) + '/revoke', { reason });
          Layout.toast ? Layout.toast(res.message || 'ถอนแล้ว', 'success') : alert(res.message || 'ถอนแล้ว');
        } catch (e) { alert(e.message); }
        await this.loadWaivers();
      },
      // ── ส่วนที่ 4: ผู้ติดต่อเลขผิดจากเงินเดือน (T4 H-2) ──
      async loadJunk() {
        const cid = encodeURIComponent(Layout.getCompanyId());
        const box = document.getElementById('junkBox');
        const title = 'ผู้ติดต่อเลขผิดจากเงินเดือน';
        try {
          const res = await API.get(`/api/companies/${cid}/payroll/junk-payee-contacts`);
          const rows = Array.isArray(res && res.data) ? res.data : null;
          if (rows == null) { box.innerHTML = this.card(title, this.note('ไม่ได้รับผลตรวจจากเซิร์ฟเวอร์', '#b91c1c')); return; }
          if (rows.length === 0) { box.innerHTML = this.card(title, this.note('✓ ไม่พบผู้ติดต่อเลขผิดที่ระบบเงินเดือนสร้างไว้', '#15803d')); return; }
          // งวดที่ยื่นแล้ว (จากเซิร์ฟเวอร์) — ยืนยันทีละงวด
          const periods = [...new Set(rows.flatMap(r => Array.isArray(r.filedPeriods) ? r.filedPeriods : []))].sort();
          box.innerHTML = this.card(`${title} (${rows.length})`, `<div style="padding:0 18px 18px;overflow-x:auto"><table class="data-table" style="font-size:13px;min-width:720px">
              <thead><tr><th></th><th>ผู้ติดต่อ</th><th>เลข (ปิดบัง)</th><th>ปัญหา</th><th>พนักงาน</th><th>ใบ 50 ทวิ</th><th>สิ่งที่ระบบจะทำ</th></tr></thead>
              <tbody>${rows.map(r => `<tr><td>${r.repairable ? `<input type="checkbox" data-junk="${this.esc(r.contactId)}">` : ''}</td>
                <td>${this.esc(r.name)}</td><td>${this.esc(r.masked)}</td><td style="font-size:12px">${this.esc(r.problem)}</td>
                <td>${this.esc(r.employeeCode || '-')} ${this.esc(r.employeeName || '')}</td><td>${this.esc(r.certCount)}</td>
                <td style="font-size:12px;color:${r.repairable ? '#334155' : '#b91c1c'}">${this.esc(r.action)}</td></tr>`).join('')}</tbody></table>
              ${periods.map(p => `<label style="display:block;margin-top:6px;font-size:13px;color:#92400e"><input type="checkbox" data-period="${this.esc(p)}"> ยืนยันว่าจะยื่น ภ.ง.ด.1 เพิ่มเติมของงวด ${this.esc(p)} (ระบบออกใบแทน · ใบเดิมคงอยู่)</label>`).join('')}
              <button class="btn btn-primary" id="btnJunkRepair" style="margin-top:8px">ซ่อมแถวที่เลือก</button></div>`
            + this.note('ระหว่างรอซ่อม ระบบไม่ให้ใช้ผู้ติดต่อเหล่านี้เป็นผู้ถูกหักใน ภ.ง.ด.3/53'));
          document.getElementById('btnJunkRepair').addEventListener('click', () => this.repairJunk());
        } catch (e) {
          box.innerHTML = this.card(title, this.note('ตรวจไม่ได้: ' + e.message + ' (ส่วนนี้ต้องมีสิทธิ์งานเงินเดือน)', '#b91c1c'));
        }
      },
      async repairJunk() {
        const ids = Array.from(document.querySelectorAll('[data-junk]:checked')).map(x => x.dataset.junk);
        if (ids.length === 0) { alert('เลือกแถวที่จะซ่อมก่อน'); return; }
        const confirmedPeriods = Array.from(document.querySelectorAll('[data-period]:checked')).map(x => x.dataset.period);
        const cid = encodeURIComponent(Layout.getCompanyId());
        try {
          const res = await API.post(`/api/companies/${cid}/payroll/junk-payee-contacts/repair`, { contactIds: ids, confirmedPeriods });
          const lines = Array.isArray(res && res.data) ? res.data.map(o => (o.repaired ? '✓ ' : '⛔ ') + o.message) : [];
          alert((res.message || '') + (lines.length ? '\n' + lines.join('\n') : ''));
        } catch (e) { alert(e.message); }
        await this.run();
      },
      renderSecrets(d) {
        const box = document.getElementById('secretBox');
        if (d == null) { box.innerHTML = this.card('รหัสผ่านและคีย์ที่บันทึกไว้', this.note('ไม่ได้รับผลตรวจจากเซิร์ฟเวอร์', '#b91c1c')); return; }
        if (d.keyMessage) document.getElementById('keyBox').innerHTML = `<div class="card" style="margin-bottom:12px;border:1px solid #fcd34d"><div style="padding:12px 18px;color:#92400e">${this.esc(d.keyMessage)}</div></div>`;
        const rows = Array.isArray(d.rows) ? d.rows : [];
        const body = rows.length === 0
          ? this.note(`✓ ตรวจ ${d.scanned} ค่า — ใช้ได้ทั้งหมด`, '#15803d')
          : `<div style="padding:0 18px 18px;overflow-x:auto"><table class="data-table" style="font-size:13px;min-width:640px">
              <thead><tr><th>ช่อง</th><th>สถานะ</th><th>เหตุ</th><th>ทางแก้</th></tr></thead>
              <tbody>${rows.map(r => `<tr><td>${this.esc(r.label)}</td>
                <td style="white-space:nowrap;color:${r.blocking ? '#b91c1c' : '#92400e'}">${r.blocking ? '⛔ ใช้ไม่ได้' : 'ℹ️ ใช้ได้ (ควรตรวจ)'}</td>
                <td style="font-size:12px">${this.esc(r.reason)}</td><td style="font-size:12px">${this.esc(r.action)}</td></tr>`).join('')}</tbody></table></div>`;
        box.innerHTML = this.card(`รหัสผ่านและคีย์ที่บันทึกไว้ (ใช้ไม่ได้ ${d.unusable})`, body + this.job(d.job, 'งานย้ายคีย์ของความลับ'));
      },
      renderPii(d) {
        const box = document.getElementById('piiBox');
        if (d == null) { box.innerHTML = this.card('เลขประจำตัวพนักงาน / ผู้รับ 50 ทวิ', this.note('ไม่ได้รับผลตรวจจากเซิร์ฟเวอร์', '#b91c1c')); return; }
        const rows = Array.isArray(d.rows) ? d.rows : [];
        const body = rows.length === 0
          ? this.note('✓ ไม่พบเลขประจำตัวที่ต้องแก้', '#15803d')
          : `<div style="padding:0 18px 18px;overflow-x:auto"><table class="data-table" style="font-size:13px;min-width:640px">
              <thead><tr><th>ที่มา</th><th>รหัส/เลขที่</th><th>ชื่อ</th><th>ช่อง</th><th>เลข (ปิดบัง)</th><th>ทางแก้</th></tr></thead>
              <tbody>${rows.map(r => `<tr><td>${this.esc(r.source)}</td><td>${this.esc(r.ref)}</td><td>${this.esc(r.name)}</td>
                <td>${this.esc(r.field)}</td><td>${this.esc(r.masked)}</td>
                <td style="font-size:12px;color:${r.blocksFiling ? '#b91c1c' : '#64748b'}">${r.blocksFiling ? '⛔ กันการยื่นแบบ · ' : ''}${this.esc(r.action)}</td></tr>`).join('')}</tbody></table></div>`;
        box.innerHTML = this.card(`เลขประจำตัวพนักงาน / ผู้รับ 50 ทวิ (กันการยื่นแบบ ${d.blocking})`, body
          + (d.rekeyJobStatusText ? this.note('งานย้ายคีย์ของข้อมูลพนักงาน: ' + d.rekeyJobStatusText) : ''));
      },
    };
    Page.init();
  </script>
</body>
</html>
