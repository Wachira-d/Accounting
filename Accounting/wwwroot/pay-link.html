<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>ชำระค่าบริการ NextAcc</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f1f5f9;font-family:'Noto Sans Thai',sans-serif;color:#0f172a}
    .wrap{max-width:560px;margin:0 auto;padding:16px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:14px}
    h1{font-size:18px;margin:0 0 4px} .muted{color:#64748b;font-size:13px}
    .amt{font-size:26px;font-weight:800;margin:8px 0}
    .note{font-size:13px;padding:10px 12px;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;margin:10px 0;white-space:pre-line}
    .bad{background:#fef2f2;border-color:#fecaca;color:#991b1b} .ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
    label{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:8px 0}
    input[type=text],input[type=date],input[type=file]{padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;width:100%}
    .terms li{margin:4px 0 4px 18px;font-size:13px}
    button{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%}
    button:disabled{opacity:.6}
  </style>
</head>
<body>
  <!-- รอบ 219 เฟส 2 ขั้น 4 (คำตัดสินข้อ 180): ลิงก์ชำระใบแจ้งหนี้ค่าบริการ NextAcc — ทุกค่ามาจาก GET /api/platform-pay/links/{token} (เซิร์ฟเวอร์ตัดสิน) ·
       ไม่ขอรหัสผ่าน/ข้อมูลบัตรบนหน้านี้ · เนื้อหาจากเซิร์ฟเวอร์ escape ทุกช่อง -->
  <div class="wrap" id="app"><div class="card">กำลังโหลด...</div></div>
  <script>
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const money = n => Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const date = d => d ? new Date(d).toLocaleDateString('th-TH', { timeZone: 'Asia/Bangkok' }) : '-';
    const token = new URLSearchParams(location.search).get('t') || '';
    const api = `/api/platform-pay/links/${encodeURIComponent(token)}`;
    let view = null;

    async function load() {
      const app = document.getElementById('app');
      try {
        const r = await fetch(api, { cache: 'no-store' });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j?.success) { app.innerHTML = `<div class="card note bad">${esc(j?.message || 'ไม่พบลิงก์ชำระนี้')}</div>`; return; }
        view = j.data; render();
      } catch { app.innerHTML = '<div class="card note bad">โหลดไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่</div>'; }
    }

    function render() {
      const v = view, po = v.payOptions || {};
      document.getElementById('app').innerHTML = `
        <div class="card">
          <h1>ชำระค่าบริการ ${esc(v.sellerName)}</h1>
          <div class="muted">ผู้ชำระ: ${esc(v.buyerName)}</div>
          <div class="muted">ใบแจ้งหนี้ ${esc(v.invoiceNumber)} · ลงวันที่ ${date(v.invoiceDate)} · ครบกำหนด ${date(v.dueDate)}</div>
          ${v.message ? `<div class="note ${v.state === 'Paid' ? 'ok' : (v.canPay ? '' : 'bad')}">${esc(v.message)}</div>` : ''}
          ${v.canPay ? `<div class="amt">฿${money(v.amountDue)}</div>
            ${(v.lines || []).length ? `<div class="muted">${v.lines.map(esc).join('<br>')}</div>` : ''}` : ''}
        </div>
        ${v.canPay ? `
        <div class="card">
          ${po.bankTransferInstructions ? `<div class="note"><b>โอนเงินค่าบริการ</b>\n${esc(po.bankTransferInstructions)}</div>`
            : `<div class="note bad">${esc(po.fallbackNote || '')}</div>`}
          ${!po.online && po.onlineNote ? `<div class="muted">${esc(po.onlineNote)}</div>` : ''}
          <form id="f">
            <label>ไฟล์สลิป (รูปหรือ PDF)<input type="file" name="file" accept="image/*,application/pdf"></label>
            <label>วันที่โอน<input type="date" name="paymentDate"></label>
            <label>อ้างอิงการโอน (ถ้ามี)<input type="text" name="transferReference" maxlength="100"></label>
            <label>หมายเหตุ (เช่น หักภาษี ณ ที่จ่าย)<input type="text" name="customerNotes" maxlength="500"></label>
            <div class="note"><b>เงื่อนไขการชำระค่าบริการ (ฉบับ ${esc(v.terms.version)})</b>
              <ul class="terms">${v.terms.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
              <a href="${esc(v.terms.termsUrl)}" target="_blank" rel="noopener">อ่านข้อกำหนดการใช้งานฉบับเต็ม</a></div>
            <label style="flex-direction:row;align-items:flex-start;gap:8px"><input type="checkbox" name="acceptTerms" value="true">
              <span>ข้าพเจ้าอ่านและยอมรับเงื่อนไขการชำระค่าบริการข้างต้น</span></label>
            <button type="button" id="send" onclick="sendSlip()">ส่งสลิปแจ้งชำระ</button>
          </form>
        </div>` : ''}`;
    }

    async function sendSlip() {
      const f = document.getElementById('f');
      if (!f.file.files.length) { alert('กรุณาเลือกไฟล์สลิป'); return; }
      if (!f.acceptTerms.checked) { alert('กรุณาติ๊กยอมรับเงื่อนไขก่อนชำระ'); return; }
      const fd = new FormData(f);
      fd.set('acceptTerms', 'true'); fd.set('termsVersion', view.terms.version);
      const b = document.getElementById('send'); b.disabled = true;
      try {
        const r = await fetch(`${api}/slip`, { method: 'POST', body: fd });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j?.success) throw new Error(j?.message || 'ส่งไม่สำเร็จ');
        alert(j.message || 'ส่งแล้ว'); await load();
      } catch (e) { alert(e.message); } finally { b.disabled = false; }
    }
    load();
  </script>
</body>
</html>
