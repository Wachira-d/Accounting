          .map(n => `<option value="${n}" ${n === cur ? 'selected' : ''}>${n}</option>`).join('');
        const rows = keys.map((k, i) => {
          const rt = byId[String(k.rtId)] || {}; const g = st.roomGuests[k.key] || { adults: 1, children: 0, extraBeds: 0 };
          const maxXb = rt.allowExtraBed ? Math.max(0, rt.maxExtraBeds | 0) : 0;
          const maxA = Math.max(1, (rt.maxAdults | 0) || 1);   // ผู้ใหญ่บนเตียงปกติ — คนเสริมเป็นช่องแยก (LodgingOccupancy)
          const sel = (field, inner) => `<select class="lg-input" style="width:auto" onchange="Store.lodgingSetGuest('${this.jsArg(k.key)}', '${field}', this.value)">${inner}</select>`;
          return `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 0;border-top:${i ? '1px solid #E5E7EB' : '0'}">

          <div style="padding-top:8px;border-top:1px solid #E5E7EB"><label>ทารก (≤${this.esc(info.infantMaxAge)} ปี · ทั้งการจอง) <select class="lg-input" style="width:auto" onchange="Store.lodgingSetInfants(this.value)">${opts(0, 3, st.infants)}</select></label></div>

      },
      // รอบ 200 (F-06): แบ่งแขกลงห้องให้ผลรวม = จำนวนจริง — เดิมปัดขึ้นต่อห้อง (ผู้ใหญ่ 3 · 2 ห้อง ⇒ คิด 4 คน = คิดค่าแขกเกิน)
      // และยัดเด็กทุกคนลงห้องแรก (ติดเพดานเด็ก/ห้อง ทั้งที่รวมกันรับได้) · ห้องละอย่างน้อยผู้ใหญ่ 1 (minAdults)
      _splitGuests(total, roomCount, minEach) {
        const n = Math.max(0, roomCount | 0); if (!n) return [];
        const t = Math.max(minEach * n, total | 0);
        const per = Math.floor(t / n); let rem = t - per * n;
        return Array.from({ length: n }, () => per + (rem-- > 0 ? 1 : 0));

      _quoteBody() {

        if (this._roomKeys().some(k => !st.roomGuests[k.key])) this._syncRoomGuests();

          return { roomTypeId: k.rtId, adults: g.adults, children: g.children, extraBeds: g.extraBeds };
        });
        const extras = Object.entries(st.extras).filter(([,q]) => q > 0).map(([extraId, quantity]) => ({ extraId, quantity }));
        // ฝ่ายค้าน P1-2: ทารกอยู่ในทั้ง quote และคำขอจอง (LodgingQuoteRequest.Infants) ⇒ ยอดผู้เข้าพักรวมของ quote รวมทารก
        return { checkIn: st.checkIn + 'T00:00:00', checkOut: st.checkOut + 'T00:00:00', rooms, extras, ratePlanId: st.ratePlanId, infants: st.infants };
      },

              ${r.cancellationFee > 0 ? `<div class="row"><span>ค่าปรับยกเลิก</span><span>฿${this._money(r.cancellationFee)}</span></div>` : ''}
              ${r.refundAmount > 0 ? `<div class="row"><span>ยอดคืนเงิน</span><span>฿${this._money(r.refundAmount)}</span></div>` : ''}
              ${r.refundPending > 0 ? `<div class="row" style="color:#92400E"><span>สถานะ</span><span>รอที่พักโอนคืน ฿${this._money(r.refundPending)}</span></div>` : (r.refundAmount > 0 && r.refundState === 'Paid' ? `<div class="row" style="color:#047857"><span>สถานะ</span><span>ที่พักโอนคืนแล้ว</span></div>` : (r.refundState === 'Unknown' ? `<div class="row"><span>สถานะ</span><span>ไม่มีข้อมูลการโอนคืน — สอบถามที่พัก</span></div>` : ''))}
            </div>
            <div class="lg-sum">
              <h3 style="margin:0 0 8px">ผู้เข้าพัก</h3>
              <div>${this.esc(r.guestName)}</div>
              <div style="font-size:13px;color:var(--text-secondary)">${this.esc(r.guestPhone||'')} ${this.esc(r.guestEmail||'')}</div>
              ${r.specialRequests ? `<div style="font-size:13px;margin-top:6px">คำขอพิเศษ: ${this.esc(r.specialRequests)}</div>` : ''}
              ${r.cancellationPolicyName ? `<div style="font-size:12px;margin-top:10px;color:var(--text-secondary)">นโยบายยกเลิก: <b>${this.esc(r.cancellationPolicyName)}</b>${r.nonRefundable ? ' — ไม่คืนเงิน' : ''}<br>${(r.cancellationRules||[]).map(x => `ก่อน ${x.daysBefore} วัน คิด ${x.penaltyPercent}%`).join(' · ')}</div>` : ''}
              ${r.confirmationMessage ? `<div style="font-size:13px;margin-top:10px">${this.esc(r.confirmationMessage)}</div>` : ''}
              <div style="font-size:13px;margin-top:10px">ติดต่อที่พัก: ${this.esc(r.propertyPhone||info?.phone||'')}${r.propertyLineId ? ' · LINE ' + this.esc(r.propertyLineId) : ''}</div>
            </div>
          </div>
          ${canPayOnline ? `<div class="lg-sum" style="margin-top:16px" id="lgPayOnlineBox"></div>` : ''}
          ${!canPayOnline && r.onlinePaymentNote ? `<div class="lg-badge info" style="display:block;padding:12px;margin-top:14px;font-size:14px">${this.esc(r.onlinePaymentNote)}</div>` : ''}
          ${r.slipRejectedReason ? `<div class="lg-badge bad" style="display:block;padding:12px;margin-top:14px;font-size:14px">
            ⚠️ สลิปที่ส่งมาไม่ผ่านการตรวจสอบ — ${this.esc(r.slipRejectedReason)}<br>
            <span style="font-weight:400">${r.slipUploadBlocked
              ? 'ที่พักปิดรับสลิปของการจองนี้แล้ว กรุณาชำระออนไลน์ด้านล่าง หรือติดต่อที่พักโดยตรง'
              : 'กรุณาตรวจสอบแล้วส่งสลิปใหม่อีกครั้ง'}</span></div>` : ''}
          ${canSlip && !r.slipRequired ? this._lgSlipBox(r, token, pay) : ''}
          ${r.status === 'CheckedIn' ? `<div class="lg-sum" style="margin-top:16px"><h3 style="margin:0 0 8px">🛎️ แจ้งความต้องการถึงที่พัก</h3>
            <form onsubmit="Store.lodgingGuestRequest(event, '${this.esc(token)}')" class="lg-req">
              <select name="requestType" class="lg-input"><option value="Housekeeping">ทำความสะอาด/ผ้าเช็ดตัว</option><option value="Maintenance">แจ้งซ่อม</option><option value="RoomService">รูมเซอร์วิส</option><option value="Concierge">คอนเซียร์จ/รถรับส่ง</option><option value="Complaint">ร้องเรียน</option><option value="Other">อื่น ๆ</option></select>
              <input name="details" class="lg-input" required placeholder="รายละเอียด" maxlength="500"><button class="btn btn-primary" type="submit">ส่ง</button></form>
            ${(r.requests||[]).slice(0,5).map(x => `<div style="font-size:13px;padding:4px 0">• ${this.esc(x.details)} <span class="lg-badge ${x.status === 'Completed' || x.status === 'Verified' ? 'ok' : ''}">${this.esc(x.status)}</span>${x.responseNote ? ' — ' + this.esc(x.responseNote) : ''}</div>`).join('')}</div>` : ''}
          <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
            <a href="${this._lurl('/reservations/' + encodeURIComponent(token) + '/voucher.pdf')}"
               class="btn btn-primary" target="_blank" rel="noopener">⬇ บันทึกหลักฐานการจอง (PDF)</a>
            <a href="${this._pageUrl('home')}" class="btn">← กลับหน้าหลัก</a>
            ${canCancel ? `<button class="btn" style="border:1px solid #DC2626;color:#DC2626" onclick="Store.lodgingCancel('${this.jsArg(token)}')">ยกเลิกการจอง</button>` : ''}
          </div>
        </div>`;
        if (canPayOnline) await this._renderPayOnline(token, r);
      },

      // ── แบนเนอร์ผลการกระทำ + ข้อความถึงแขก (คำตัดสินข้อ 128) ─────────────────
      // ข้อความทั้งหมดมาจากเซิร์ฟเวอร์ (message ของ API · guestNote) — หน้านี้เลือกแค่สี: ต้องส่งสลิป = เหลือง (ยังไม่สำเร็จ) · อื่น ๆ = เขียว
      _lgGuestBanner(r, banner) {
        const warn = r.slipRequired === true;
        const box = (text, cls) => `<div class="lg-badge ${cls}" style="display:block;padding:12px;margin-bottom:14px;font-size:14px">${this.esc(text)}</div>`;
        let html = banner ? box(banner, warn ? '' : 'ok') : '';
        if (r.guestNote && !(banner && String(banner).includes(r.guestNote))) html += box(r.guestNote, warn ? '' : 'info');
        return html;
      },
      // บัญชีรับโอน/พร้อมเพย์ของเว็บ — endpoint สาธารณะเดียวกับหน้าคำสั่งซื้อ (ค่าตั้ง "ช่องทางชำระเงิน" ของเว็บ) · จำผลไว้ทั้งหน้า
      async _lgPayOptions() {
        if (this._lgPay !== undefined) return this._lgPay;
        try {
          const r = await fetch(this._url('/commerce/payment-options'));
          this._lgPay = r.ok ? ((await r.json()).data || null) : null;
        } catch (_) { this._lgPay = null; }
        return this._lgPay;
      },
      // กล่องส่งสลิป — เปิดไหม · ต้องส่งก่อนการจองสำเร็จไหม · ยอดที่ต้องโอน · กำหนดเวลา มาจากเซิร์ฟเวอร์ทั้งหมด
      // (canUploadSlip · slipRequired · amountToTransfer · slipDueAt — LodgingGuestConfirmPolicy) · หน้านี้ไม่คิดยอด/สถานะเอง
      _lgSlipBox(r, token, pay) {
        if (r.canUploadSlip !== true) return '';
        const amt = r.slipRequired ? r.amountToTransfer : null;
        const ppId = pay && pay.promptPayId;
        // รอบ 209 P1: QR สร้างที่เซิร์ฟเวอร์ (เดิมส่งเลขพร้อมเพย์+ยอดไป api.qrserver.com)
        const qr = ppId && amt > 0
          ? this._promptPayQrSrc(amt)
          : ((pay && pay.promptPayQrUrl) || null);
        const hasAccount = !!(ppId || (pay && pay.bankAccountNumber) || qr);
        const accounts = hasAccount ? `<div style="display:grid;gap:10px;margin:8px 0 12px">
            ${qr ? `<div style="text-align:center;background:#F9FAFB;padding:14px;border-radius:8px"><img src="${this.esc(qr)}" alt="PromptPay QR" style="width:200px;height:200px">
              ${ppId ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">พร้อมเพย์: <b>${this.esc(ppId)}</b>${amt > 0 ? ` · ยอด ฿${this._money(amt)}` : ''}</div>` : ''}</div>` : ''}
            ${pay && pay.bankAccountNumber ? `<div style="background:#F9FAFB;padding:12px 16px;border-radius:8px;font-size:13px">
              <div>ธนาคาร: <b>${this.esc(pay.bankName || '-')}</b></div>
              <div>เลขบัญชี: <b style="font-family:monospace">${this.esc(pay.bankAccountNumber)}</b></div>
              <div>ชื่อบัญชี: <b>${this.esc(pay.bankAccountName || '-')}</b></div></div>` : ''}</div>`
          : (r.slipRequired ? `<div class="lg-badge" style="display:block;padding:10px;margin:8px 0">ติดต่อที่พักเพื่อขอเลขบัญชีโอนเงิน${r.propertyPhone ? ' โทร ' + this.esc(r.propertyPhone) : ''}${r.propertyLineId ? ' · LINE ' + this.esc(r.propertyLineId) : ''}</div>` : '');
        const head = r.slipRequired
          ? '📎 โอนเงินและส่งสลิปเพื่อยืนยันการจอง'
          : (r.status === 'Pending' ? '📎 อัปโหลดสลิปมัดจำ' : '📎 อัปโหลดสลิปชำระเงิน');
        return `<div class="lg-sum" style="margin-top:16px${r.slipRequired ? ';border:2px solid #F59E0B' : ''}"><h3 style="margin:0 0 8px">${head}</h3>
            ${amt > 0 ? `<div class="row" style="font-size:16px"><span>ยอดที่ต้องโอน</span><b>฿${this._money(amt)}</b></div>` : ''}
            ${r.slipRequired && r.slipDueAt ? `<div style="font-size:13px;color:#92400E;margin-bottom:6px">ส่งสลิปภายใน ${this.esc(new Date(r.slipDueAt).toLocaleString('th-TH'))}</div>` : ''}
            ${accounts}
            ${r.paymentSlipUrl ? `<div class="lg-badge info" style="margin-bottom:8px">ส่งสลิปแล้วเมื่อ ${this.esc(new Date(r.slipUploadedAt).toLocaleString('th-TH'))}${r.slipDeclaredAmount != null ? ` (แจ้งยอดโอน ฿${this._money(r.slipDeclaredAmount)})` : ''} — รอที่พักตรวจสอบ ·
              <a href="${this.esc(r.paymentSlipUrl)}" target="_blank" rel="noopener">ดูสลิปที่ส่งไป</a></div>` : ''}
            <form onsubmit="Store.lodgingUploadSlip(event, '${this.jsArg(token)}')" style="display:grid;gap:8px;grid-template-columns:1fr 1fr auto">
              <input type="file" name="file" accept="image/*,application/pdf" required class="lg-input">
              <input name="reference" class="lg-input" placeholder="อ้างอิง/เวลาโอน (ถ้ามี)" maxlength="100">
              <input name="declaredAmount" type="number" inputmode="decimal" step="0.01" min="0" class="lg-input" placeholder="ยอดที่โอน (บาท · ไม่บังคับ)" style="grid-column:1/-1">
              <button class="btn btn-primary" type="submit">ส่งสลิป</button>
              <div class="sf-slip-status" style="grid-column:1/-1;font-size:13px"></div>
            </form></div>`;
      },

      // ── ชำระออนไลน์ ────────────────────────────────────────────────
      // ต้องถามเซิร์ฟเวอร์ว่า "บริษัทนี้เปิดรับชำระออนไลน์ไหม + วิธีไหนบ้าง"
      // ห้ามเดาเอง: ที่พักที่ยังไม่ตั้งค่า gateway ต้องเห็นเฉพาะเส้นแนบสลิป
      // และรายการวิธีจ่ายมาจาก capabilities ของ adapter ไม่ใช่ลิสต์ที่พิมพ์ไว้ในหน้านี้
      async _payMethods() {
        if (this._payM !== undefined) return this._payM;
        try {
          const r = await fetch(`/api/companies/${this._ctx.companyId}/public-pay/methods`);
          this._payM = r.ok ? ((await r.json()).data || null) : null;
        } catch (_) { this._payM = null; }
        return this._payM;
      },
      _payLabel(m) {
        return { PromptPay: 'พร้อมเพย์ (QR)', Card: 'บัตรเครดิต/เดบิต', MobileBanking: 'โมบายแบงก์กิ้ง',
                 InternetBanking: 'อินเทอร์เน็ตแบงก์กิ้ง', TrueMoney: 'TrueMoney Wallet' }[m] || m;
      },
      async _renderPayOnline(token, r) {
        const box = document.getElementById('lgPayOnlineBox');
        if (!box) return;
        const m = await this._payMethods();
        if (!m || !m.online || !(m.methods || []).length) { box.remove(); return; }
        const due = r.onlinePayableAmount;
        if (due == null || !(due > 0)) { box.remove(); return; }
        box.innerHTML = `<h3 style="margin:0 0 8px">💳 ชำระออนไลน์ทันที</h3>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">
            ยอดชำระ <b>฿${this._money(due)}</b> · ${this.esc(r.onlinePaymentNote || '')}
            ${m.isTestMode ? ' · <span class="lg-badge">โหมดทดสอบ</span>' : ''}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${(m.methods || []).map(x => `<button class="btn btn-primary"
                onclick="Store.lodgingPayOnline('${this.jsArg(token)}', '${this.jsArg(x)}')">${this.esc(this._payLabel(x))}</button>`).join('')}
          </div>`;
      },
      lodgingPayOnline(token, method) {
        const { companyId, siteId } = this._ctx;
        PayWidget.open({
          companyId,
          // ตัวตนอยู่ใน URL (token ที่แขกถือ) — widget จึงไม่ต้องส่ง sourceId/amount
          publicBase: `/api/companies/${companyId}/public-pay/lodging/${siteId}/${encodeURIComponent(token)}`,
          method,
          onPaid: () => { setTimeout(() => this.renderLodgingReservation(token, 'ชำระเงินสำเร็จ — สถานะการจองด้านล่างเป็นข้อมูลล่าสุดจากที่พัก'), 800); },
        });
      },
      async lodgingUploadSlip(ev, token) {
        ev.preventDefault();
        const form = ev.target; const status = form.querySelector('.sf-slip-status');
        status.textContent = 'กำลังอัปโหลด...';
        try {
          const r = await fetch(this._lurl('/reservations/' + encodeURIComponent(token) + '/slip'), { method: 'POST', body: new FormData(form) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'อัปโหลดไม่สำเร็จ');
          await this.renderLodgingReservation(token, j.message);
        } catch (e) { status.textContent = '✗ ' + e.message; status.style.color = '#DC2626'; }
      },
      async lodgingGuestRequest(ev, token) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        try {
          const r = await fetch(this._lurl('/reservations/' + encodeURIComponent(token) + '/requests'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestType: fd.get('requestType'), details: fd.get('details') }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'ส่งไม่สำเร็จ');
          await this.renderLodgingReservation(token, j.message);
        } catch (e) { this._toast('❌ ' + e.message); }
      },
      async lodgingCancel(token) {
        if (!confirm('ยืนยันยกเลิกการจอง? ค่าปรับ (ถ้ามี) คิดตามนโยบายยกเลิกที่แสดง')) return;
        const reason = prompt('เหตุผลในการยกเลิก (ไม่บังคับ)') || null;
        try {
          const r = await fetch(this._lurl('/reservations/' + encodeURIComponent(token) + '/cancel'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'ยกเลิกไม่สำเร็จ');
          await this.renderLodgingReservation(token, j.message);
        } catch (e) { this._toast('❌ ' + e.message); }
      },
    });

    // ═══════════════ รอบ 209 P6 — PDPA (ช่องยินยอม · แบนเนอร์คุกกี้) + ตัวเลือกย่อยสินค้า (variant) ═══════════════
    // ข้อความยินยอม/บังคับ/ลิงก์นโยบาย/ราคา/มีของ มาจากเซิร์ฟเวอร์ทั้งหมด (หน้าเว็บแสดงอย่างเดียว · ด่านจริงอยู่ที่ service — Helpers/CmsDataConsent · CmsVariantPricing)
    Object.assign(Store, {
      p6ConsentHtml() {
        const site = (this.data && this.data.site) || {};
        if (!site.dataConsentText) return '';
        const req = site.requireDataConsent;
        const link = site.privacyPolicyUrl
          ? ` <a href="${this.esc(site.privacyPolicyUrl)}" target="_blank" rel="noopener">อ่านนโยบายความเป็นส่วนตัว</a>` : '';
        return `<label class="p6-consent" style="display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;margin:6px 0;text-align:left">`
          + `<input type="checkbox" name="pdpaConsent" value="1" ${req ? 'required' : ''} style="margin-top:3px;width:auto">`
          + `<span>${this.esc(site.dataConsentText)}${link}${req ? ' <b style="color:#DC2626">*</b>' : ''}</span></label>`;
      },
      p6ConsentValue(form) {
        const el = form && form.querySelector('input[name="pdpaConsent"]');
        return !!(el && el.checked);
      },
      // แบนเนอร์คุกกี้ (Site.CookieConsentEnabled) — ยังไม่เลือก ⇒ เลื่อนสคริปต์วิเคราะห์ (GA/GTM/Pixel) จนกว่าจะกดยอมรับ · ปฏิเสธ ⇒ ไม่โหลด ·
      // ปิดแบนเนอร์ที่หลังบ้าน ⇒ โหลดทันทีเหมือนเดิม · ค่าที่เลือกเก็บต่อเครื่อง (localStorage — ห่อ try/catch)
      p6DeferAnalytics(seo) {
        if (!seo || !seo.cookieConsentEnabled) return false;
        const key = 'sf_cookie_' + ((this.data && this.data.site && this.data.site.siteId) || '');
        let choice = null;
        try { choice = localStorage.getItem(key); } catch (_) {}
        if (choice === 'accept') return false;
        if (choice === 'reject') return true;
        this._p6Seo = seo; this._p6CookieKey = key;
        const bar = document.createElement('div');
        bar.id = 'p6CookieBar';
        bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#0f172a;color:#fff;padding:14px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;max-width:900px;margin:0 auto';
        const url = this.data && this.data.site && this.data.site.privacyPolicyUrl;
        bar.innerHTML = `<span style="flex:1;min-width:220px">เว็บไซต์นี้ใช้คุกกี้เพื่อการวิเคราะห์และปรับปรุงบริการ — คุกกี้ที่จำเป็นต่อการทำงานของร้านใช้เสมอ`
          + (url ? ` · <a href="${this.esc(url)}" target="_blank" rel="noopener" style="color:#93C5FD">นโยบายความเป็นส่วนตัว</a>` : '') + `</span>`
          + `<button type="button" class="btn" style="background:#334155;color:#fff;padding:8px 14px" onclick="Store.p6CookieChoice(false)">ปฏิเสธ</button>`
          + `<button type="button" class="btn btn-primary" style="padding:8px 14px" onclick="Store.p6CookieChoice(true)">ยอมรับ</button>`;
        document.body.appendChild(bar);
        return true;
      },
      p6CookieChoice(accept) {
        try { localStorage.setItem(this._p6CookieKey || 'sf_cookie_', accept ? 'accept' : 'reject'); } catch (_) {}
        const bar = document.getElementById('p6CookieBar'); if (bar) bar.remove();
        if (accept && this._p6Seo) this.injectAnalytics(this._p6Seo);
      },
      // ตัวเลือกย่อย (ไซซ์/สี) บนหน้าสินค้า — สินค้าไม่มี variant ⇒ ไม่แสดงอะไร (หน้าเดิม) · ราคา/มีของจากเซิร์ฟเวอร์
      p6VariantPickerHtml(p) {
        const vs = (p && p.variants) || [];
        if (this._pd) { this._pd.variants = vs; this._pd.variantId = null; }
        if (!vs.length) return '';
        const btns = vs.map(v => `<button type="button" class="p6-var" data-vid="${this.esc(v.id)}" ${v.inStock ? '' : 'disabled'}
            onclick="Store.p6PickVariant('${this.jsArg(v.id)}')"
            style="padding:8px 14px;border:1px solid #D1D5DB;border-radius:6px;background:#fff;cursor:pointer;${v.inStock ? '' : 'opacity:.45;cursor:not-allowed;'}">
            ${this.esc(v.name || v.sku)}${v.inStock ? '' : ' (หมด)'}</button>`).join('');
        return `<div style="margin-bottom:16px"><div style="font-size:14px;font-weight:600;margin-bottom:6px">ตัวเลือก <span style="color:#DC2626">*</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div></div>`;
      },
      p6PickVariant(id) {
        const v = ((this._pd && this._pd.variants) || []).find(x => x.id === id);
        if (!v || !v.inStock) return;
        this._pd.variantId = id;
        document.querySelectorAll('.p6-var').forEach(b => {
          const on = b.dataset.vid === id;
          b.style.borderColor = on ? 'var(--primary,#4F46E5)' : '#D1D5DB';
          b.style.background = on ? '#EEF2FF' : '#fff';
        });
        const el = document.getElementById('pdPrice');
        if (el) el.textContent = '฿' + Number(v.price || 0).toLocaleString('th-TH');
      },
    });

    if (window.StoreBookingPay) StoreBookingPay.install(Store);   // รอบ 218: ยอดชำระก่อนกดจอง + กล่องโอน/QR/สลิป (js/storefront-booking-pay.js)
    Store.init();
  </script>
</body>
</html>
