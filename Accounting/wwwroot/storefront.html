                <h2 style="margin:0;font-size:18px">สมัครสมาชิก</h2>
                <input name="fullName" required maxlength="256" placeholder="ชื่อ-นามสกุล" style="${inp}">
                <input name="email" type="email" required maxlength="200" placeholder="อีเมล" style="${inp}">
                <input name="phone" type="tel" maxlength="20" placeholder="เบอร์โทร (ไม่บังคับ)" style="${inp}">
                <input name="password" type="password" required minlength="8" placeholder="รหัสผ่าน (อย่างน้อย 8 ตัว)" style="${inp}">
                <label style="font-size:13px;display:flex;gap:6px;align-items:flex-start"><input type="checkbox" name="consentGiven" required> ยินยอมให้ร้านเก็บและใช้ข้อมูลส่วนบุคคลเพื่อให้บริการบัญชีสมาชิก คำสั่งซื้อ และการจอง</label>
                <label style="font-size:13px;display:flex;gap:6px;align-items:flex-start"><input type="checkbox" name="acceptMarketing"> รับข่าวสาร/โปรโมชันจากร้าน (ไม่บังคับ)</label>
                <button type="submit" class="btn btn-primary">สมัครสมาชิก</button>
                <div class="sf-acc-status" style="font-size:13px"></div>
              </form>
            </div></div>`;
      },
      async _accountLoginWith(email, password) {
        const r = await fetch(this._url('/portal/login'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const j = await r.json().catch(() => null);
        if (!r.ok || !j || !j.data || !j.data.token) throw new Error((j && j.message) || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
        localStorage.setItem(this._custKey(), JSON.stringify({ token: j.data.token, expiresAt: j.data.expiresAt, fullName: j.data.fullName, email: j.data.email }));
        this._custMe = null;
      },
      async accountLogin(ev) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const st = ev.target.querySelector('.sf-acc-status');
        st.textContent = 'กำลังเข้าสู่ระบบ...'; st.style.color = 'var(--text-secondary)';
        try {
          await this._accountLoginWith(fd.get('email'), fd.get('password'));
          await this.renderAccount();
        } catch (e) { st.textContent = '✗ ' + e.message; st.style.color = '#DC2626'; }
      },
      async accountRegister(ev) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const st = ev.target.querySelector('.sf-acc-status');
        st.textContent = 'กำลังสมัคร...'; st.style.color = 'var(--text-secondary)';
        try {
          const r = await fetch(this._url('/portal/register'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              fullName: fd.get('fullName'), email: fd.get('email'), phone: fd.get('phone') || null,
              password: fd.get('password'), consentGiven: !!fd.get('consentGiven'), acceptMarketing: !!fd.get('acceptMarketing')
            })
          });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error((j && j.message) || 'สมัครไม่สำเร็จ');
          await this._accountLoginWith(fd.get('email'), fd.get('password'));
          await this.renderAccount();
        } catch (e) { st.textContent = '✗ ' + e.message; st.style.color = '#DC2626'; }
      },
      async accountLogout() {
        this._custLogout();
        await this.renderAccount();
      },

      // ===== รอบ 211 (คำตัดสินข้อ 170): รับแจ้งเตือนทาง LINE — สมาชิก (portal/me/line) · แขก (storefront/line/{booking|order}/{token}) =====
      // สถานะ · ลิงก์เพิ่มเพื่อน/ส่งรหัส · QR · ข้อความยินยอม มาจากเซิร์ฟเวอร์ทั้งหมด (ICustomerLineLinkService) — หน้าเว็บแสดง + หนีด้วย esc ทุกช่อง
      _lineApiPath(scope) {
        return scope.kind === 'member' ? '/portal/me/line' : '/storefront/line/' + encodeURIComponent(scope.kind) + '/' + encodeURIComponent(scope.token || '');
      },
      async _lineCall(scope, suffix, method) {
        const r = await fetch(this._url(this._lineApiPath(scope) + (suffix || '')), { method: method || 'GET', headers: this._custHeaders() });
        const j = await r.json().catch(() => null);
        if (!r.ok) throw new Error((j && j.message) || 'ทำรายการไม่สำเร็จ');
        return j;
      },
      async renderLineBox(boxId, scope) {
        const box = document.getElementById(boxId);
        if (!box || !scope) return;
        this._lineScopes = this._lineScopes || {};
        this._lineScopes[boxId] = scope;
        let st = null;
        try { st = (await this._lineCall(scope)).data; } catch (_) { box.innerHTML = ''; return; }
        if (!st) { box.innerHTML = ''; return; }
        const wrap = (inner) => `<div style="margin-top:14px;border:1px solid #A7F3D0;background:#F0FDF4;border-radius:12px;padding:12px 16px;text-align:left;font-size:13px">${inner}</div>`;
        const id = this.jsArg(boxId);
        if (st.linked) {
          const viaMember = st.linkedVia === 'member' && scope.kind !== 'member';
          box.innerHTML = wrap(`<div style="font-weight:600;color:#047857">✅ รับแจ้งเตือนทาง LINE แล้ว${st.maskedLineUserId ? ' (' + this.esc(st.maskedLineUserId) + ')' : ''}</div>
            <div style="color:var(--text-secondary);margin-top:4px">${viaMember ? 'เชื่อมต่อผ่านบัญชีสมาชิก — ยกเลิกได้ที่ "บัญชีของฉัน"' : 'ข้อความแจ้งสถานะจะส่งไปที่ LINE นี้ก่อน แล้วจึงอีเมล'}</div>
            ${viaMember ? '' : `<button class="btn btn-secondary" style="margin-top:8px" onclick="Store.lineUnlink('${id}')">ยกเลิกการเชื่อมต่อ LINE</button>`}`);
          return;
        }
        if (st.blocked) {
          box.innerHTML = wrap(`<div style="font-weight:600;color:#92400E">⚠️ บัญชี LINE ที่เชื่อมไว้บล็อก/ลบเพื่อน LINE ของร้านอยู่ — จะไม่ได้รับแจ้งเตือนทาง LINE</div>
            ${st.addFriendUrl ? `<a class="btn btn-primary" style="margin-top:8px" href="${this.esc(st.addFriendUrl)}" target="_blank" rel="noopener">เพิ่มเพื่อนกลับ ${this.esc(st.oaBasicId || '')}</a>` : ''}
            ${st.linkedVia === scope.kind ? `<button class="btn btn-secondary" style="margin-top:8px" onclick="Store.lineUnlink('${id}')">ยกเลิกการเชื่อมต่อ LINE</button>` : ''}`);
          return;
        }
        if (!st.available) { box.innerHTML = ''; return; }
        box.innerHTML = wrap(`<div style="font-weight:600">💬 รับแจ้งเตือนทาง LINE</div>
          ${st.needsRelink ? '<div style="color:#92400E;margin-top:4px">ร้านเปลี่ยนบัญชี LINE ที่ใช้แจ้งเตือนแล้ว — กรุณาเชื่อมต่อใหม่</div>' : ''}
          <div style="color:var(--text-secondary);margin-top:4px">${this.esc(st.consentText || '')}</div>
          <button class="btn btn-primary" style="margin-top:8px;background:#06C755;border-color:#06C755" onclick="Store.lineStart('${id}')">รับแจ้งเตือนทาง LINE</button>
          <div id="${this.esc(boxId)}Steps"></div>`);
      },
      async lineStart(boxId) {
        const scope = (this._lineScopes || {})[boxId];
        const steps = document.getElementById(boxId + 'Steps');
        if (!scope || !steps) return;
        steps.innerHTML = '<div style="margin-top:8px;color:var(--text-secondary)">กำลังขอรหัส...</div>';
        try {
          const d = (await this._lineCall(scope, '/start', 'POST')).data;
          steps.innerHTML = `<ol style="margin:10px 0 0 18px;padding:0;line-height:1.9">
              <li>${d.addFriendUrl ? `<a href="${this.esc(d.addFriendUrl)}" target="_blank" rel="noopener"><b>เพิ่มเพื่อน ${this.esc(d.oaBasicId || '')}</b></a>` : 'เพิ่มเพื่อน LINE ของร้าน'}</li>
              <li>${d.sendCodeUrl ? `<a href="${this.esc(d.sendCodeUrl)}" target="_blank" rel="noopener"><b>กดส่งรหัสใน LINE</b></a>` : 'ส่งข้อความด้านล่างในแชตของร้าน'} — ข้อความ: <code style="user-select:all">${this.esc(d.messageText)}</code></li>
              <li>รอข้อความตอบกลับ "เชื่อมต่อสำเร็จ" แล้วกด <a href="javascript:void(0)" onclick="Store.renderLineBox('${this.jsArg(boxId)}', Store._lineScopes['${this.jsArg(boxId)}'])">ตรวจสอบสถานะ</a></li>
            </ol>
            ${d.sendCodeQrDataUri ? `<div style="margin-top:8px"><div style="color:var(--text-secondary)">ใช้คอมพิวเตอร์อยู่? สแกน QR นี้ด้วยมือถือเพื่อส่งรหัส</div><img alt="QR ส่งรหัส LINE" src="${this.esc(d.sendCodeQrDataUri)}" style="width:160px;height:160px;margin-top:4px"></div>` : ''}
            <div style="color:var(--text-secondary);margin-top:6px">รหัสใช้ได้ครั้งเดียว ถึง ${this.esc(new Date(d.expiresAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }))} น.</div>`;
        } catch (e) {
          steps.innerHTML = `<div style="margin-top:8px;color:#DC2626">${this.esc(e.message)}</div>`;
        }
      },
      async lineUnlink(boxId) {
        const scope = (this._lineScopes || {})[boxId];
        if (!scope || !confirm('ยกเลิกการเชื่อมต่อ LINE? จะไม่ได้รับแจ้งเตือนทาง LINE อีก (ยังได้รับทางอีเมลถ้ามี)')) return;
        try { await this._lineCall(scope, '', 'DELETE'); } catch (e) { alert(e.message); }
        await this.renderLineBox(boxId, scope);
      },

      // ===== รอบ 209 P1 (R-209-A1/B3): ติดตามคำสั่งซื้อด้วยโทเคน =====
      async renderTrackOrder(token) {
        const main = document.getElementById('sfMain');
        document.title = 'ติดตามคำสั่งซื้อ';
        if (!token) {
          main.innerHTML = `<div class="sf-container" style="padding:40px 20px;max-width:640px">
              <h1 style="margin:0 0 8px">ติดตามคำสั่งซื้อ</h1>
              <p style="color:var(--text-secondary)">วางลิงก์ติดตามที่ได้ตอนสั่งซื้อ (หรือรหัสท้ายลิงก์) — หรือเข้าสู่ระบบเพื่อดูคำสั่งซื้อทั้งหมด</p>
              <form onsubmit="Store.submitTrackOrder(event)" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
                <input name="link" required maxlength="500" placeholder="ลิงก์ติดตามคำสั่งซื้อ" style="flex:1;min-width:220px;padding:10px;border:1px solid #D1D5DB;border-radius:6px">
                <button type="submit" class="btn btn-primary">ดูสถานะ</button>
              </form>
              <p style="margin-top:14px"><a href="${this._pageUrl('check')}">ไม่มีลิงก์? ค้นด้วยเลขที่คำสั่งซื้อ + เบอร์โทร/อีเมล</a> · <a href="${this._pageUrl('account')}">เข้าสู่ระบบ / บัญชีของฉัน</a></p></div>`;
          return;
        }
        const o = await this._publicOrder(token);
        if (!o) { main.innerHTML = this._orderNotFoundHtml(); return; }
        const m = v => '฿' + this._money(v);
        main.innerHTML = `<div class="sf-container" style="padding:32px 20px;max-width:780px">
            <h1 style="margin:0">คำสั่งซื้อ ${this.esc(o.orderNumber)}</h1>
            <div style="color:var(--text-secondary);font-size:13px">${this.esc(new Date(o.createdAt).toLocaleString('th-TH'))} · ${this.esc(o.fulfillmentLabel || '')}${o.earliestReadyDate ? ' · พร้อมเร็วสุด ' + this.esc(this._thaiDate(o.earliestReadyDate)) : ''}</div>
            ${this._orderStatusHtml(o)}
            <div id="sfOrderLineBox"></div>
            <table style="width:100%;margin-top:18px;border-collapse:collapse;font-size:14px">
              ${(o.lines || []).map(l => `<tr style="border-bottom:1px solid #F3F4F6"><td style="padding:8px 0">${this.esc(l.productName)}${l.modifierSummary ? `<div style="font-size:12px;color:var(--text-secondary)">${this.esc(l.modifierSummary)}</div>` : ''}</td>
                <td style="text-align:right;white-space:nowrap">${this.esc(String(l.quantity))} ${this.esc(l.unit || '')}</td><td style="text-align:right;white-space:nowrap;padding-left:12px">${m(l.totalAmount)}</td></tr>`).join('')}
              ${Number(o.shippingAmount) > 0 ? `<tr><td style="padding:6px 0">ค่าจัดส่ง</td><td></td><td style="text-align:right">${m(o.shippingAmount)}</td></tr>` : ''}
              ${Number(o.discountAmount) > 0 ? `<tr><td style="padding:6px 0">ส่วนลด</td><td></td><td style="text-align:right">−${m(o.discountAmount)}</td></tr>` : ''}
              <tr><td style="padding:8px 0;font-weight:700">ยอดรวม</td><td></td><td style="text-align:right;font-weight:700">${m(o.totalAmount)}</td></tr>
              <tr><td style="padding:4px 0;color:var(--text-secondary)">ชำระแล้ว</td><td></td><td style="text-align:right;color:var(--text-secondary)">${m(o.paidAmount)}</td></tr>
            </table>
            ${o.depositInvoicingNote ? `<p style="font-size:13px;color:#6B7280">🧾 ${this.esc(o.depositInvoicingNote)}</p>` : ''}
            ${(o.depositDocumentNumbers || []).length ? `<p style="font-size:13px;color:#6B7280">ใบรับเงินมัดจำ: ${(o.depositDocumentNumbers || []).map(n => this.esc(n)).join(', ')}</p>` : ''}
            ${o.onlinePaymentBlockedNote ? `<div style="margin-top:12px;border:1px solid #FCD34D;background:#FFFBEB;border-radius:10px;padding:12px 16px;color:#78350F;font-size:13px">⏳ ${this.esc(o.onlinePaymentBlockedNote)}</div>` : ''}
            ${Number(o.nextPayableAmount) > 0 && !o.onlinePaymentBlockedNote ? `<div style="margin-top:16px"><a class="btn btn-primary" href="${this._pageUrl('order-success/' + encodeURIComponent(token))}">ชำระเงิน ${m(o.nextPayableAmount)}</a></div>` : ''}
          </div>`;
        this.renderLineBox('sfOrderLineBox', { kind: 'order', token });
      },
      // ===== รอบ 210 (คำตัดสินข้อ 169): ตรวจสอบการจอง / คำสั่งซื้อ ด้วยเลขที่ + เบอร์โทรหรืออีเมล =====
      // เซิร์ฟเวอร์เทียบแบบตรงตัว + จำกัดความถี่ (storefront/lookup/*) · สำเร็จได้แค่โทเคน ⇒ ไปหน้า my-booking / track-order เดิม · ไม่ตรง = ข้อความกลางจากเซิร์ฟเวอร์
      async renderLookup() {
        const main = document.getElementById('sfMain');
        document.title = 'ตรวจสอบการจอง / คำสั่งซื้อ';
        const inp = 'width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px';
        main.innerHTML = `<div class="sf-container" style="padding:40px 20px;max-width:560px">
            <h1 style="margin:0 0 8px">ตรวจสอบการจอง / คำสั่งซื้อ</h1>
            <p style="color:var(--text-secondary)">กรอกเลขที่การจองหรือเลขที่คำสั่งซื้อ (อยู่ในอีเมล/ข้อความยืนยัน) พร้อมเบอร์โทรหรืออีเมลที่ใช้ตอนจอง/สั่งซื้อ</p>
            <form onsubmit="Store.submitLookup(event)" style="display:grid;gap:12px;margin-top:14px;background:#fff;padding:20px;border:1px solid #E5E7EB;border-radius:var(--radius,8px)">
              <div style="display:flex;gap:16px;flex-wrap:wrap">
                <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="radio" name="kind" value="booking" checked> การจอง</label>
                <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="radio" name="kind" value="order"> คำสั่งซื้อ</label>
              </div>
              <div><label>เลขที่ *</label><input name="number" required maxlength="64" autocomplete="off" style="${inp}"></div>
              <div><label>เบอร์โทร หรือ อีเมล *</label><input name="contact" required maxlength="254" autocomplete="off" style="${inp}"></div>
              <button type="submit" class="btn btn-primary">ตรวจสอบ</button>
              <div class="sf-lookup-status" style="font-size:13px"></div>
            </form>
            <p style="margin-top:14px;font-size:13px">เป็นสมาชิก? <a href="${this._pageUrl('account')}">เข้าสู่ระบบ</a> เพื่อดูการจอง/คำสั่งซื้อทั้งหมด</p></div>`;
      },
      async submitLookup(ev) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const st = ev.target.querySelector('.sf-lookup-status');
        const kind = fd.get('kind') === 'order' ? 'order' : 'booking';
        const number = String(fd.get('number') || '').trim(), contact = String(fd.get('contact') || '').trim();
        st.textContent = 'กำลังตรวจสอบ...'; st.style.color = 'var(--text-secondary)';
        try {
          const body = kind === 'order' ? { orderNumber: number, contact } : { bookingNumber: number, contact };
          const r = await fetch(this._url('/storefront/lookup/' + kind), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
          });
          const j = await r.json().catch(() => null);
          if (!r.ok || !j || !j.data || !j.data.publicToken) throw new Error((j && j.message) || 'ตรวจสอบไม่สำเร็จ — ลองใหม่อีกครั้ง');
          const prefix = j.data.kind === 'order' ? 'track-order/' : 'my-booking/';
          window.location.href = this._pageUrl(prefix + encodeURIComponent(j.data.publicToken));
        } catch (e) { st.textContent = '✗ ' + e.message; st.style.color = '#DC2626'; }
      },

      submitTrackOrder(ev) {
        ev.preventDefault();
        const raw = String(new FormData(ev.target).get('link') || '').trim();
        // รับทั้งลิงก์เต็ม (…/track-order/{token} · …/order-success/{token} · ?slug=…) และรหัสอย่างเดียว
        const m = raw.match(/(?:track-order|order-success)(?:%2F|\/)([A-Za-z0-9_-]{20,64})/);
        const token = m ? m[1] : (/^[A-Za-z0-9_-]{20,64}$/.test(raw) ? raw : '');
        if (!token) { alert('ลิงก์ไม่ถูกต้อง — คัดลอกลิงก์ติดตามที่ได้ตอนสั่งซื้อมาวางทั้งลิงก์'); return; }
        window.location.href = this._pageUrl('track-order/' + encodeURIComponent(token));
      },

      // ===== รอบ 209 P1 (R-209-C3): จองด้วยบัตรคอร์สจากหน้าเว็บ (ต้องล็อกอิน · เซิร์ฟเวอร์ตัดสินสิทธิ์ด้วย CreditBookingLink.PayWithCreditGate) =====
      async _bookingCreditBox() {
        const box = document.getElementById('sfBookCreditBox');
        if (!box) return;
        const me = await this._custMeLoad();
        if (!me) {
          box.innerHTML = `<div style="font-size:12px;color:var(--text-secondary)">มีบัตรคอร์ส? <a href="${this._pageUrl('account')}">เข้าสู่ระบบ</a> เพื่อจองด้วยบัตร</div>`;
          return;
        }
        let passes = [];
        try { passes = ((await this._custFetch('/portal/me/credits')) || []).filter(p => p.usable); } catch (_) { passes = []; }
        if (!passes.length) { box.innerHTML = ''; return; }
        box.innerHTML = `<label style="display:flex;gap:6px;align-items:center;font-weight:600"><input type="checkbox" id="sfBookUseCredit"> ใช้บัตรคอร์สของฉัน (ไม่ต้องชำระเงิน)</label>
            <select id="sfBookCreditPass" style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px;margin-top:6px">
              <option value="">ให้ระบบเลือกบัตรที่หมดอายุก่อน</option>
              ${passes.map(p => `<option value="${this.esc(p.passId)}">${this.esc(p.packageName)} · ${this.esc(p.passNumber)} · เหลือ ${this.esc(String(p.creditsAvailable))} ${this.esc(p.unitLabel)}</option>`).join('')}
            </select>`;
      },

      // ===== Booking =====
      async openBookingPicker(serviceId, serviceName) {
        // Build modal once.
        let modal = document.getElementById('sfBookingModal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'sfBookingModal';
          modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
          modal.innerHTML = '<div id="sfBookingBox" style="background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px"></div>';
          modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
          document.body.appendChild(modal);
        }
        const box = modal.querySelector('#sfBookingBox');
        const svc = (Store._bkServices || {})[serviceId] || null;
        const maxUnits = Math.max(1, Number(svc && svc.maxUnitsPerBooking) || 1);
        const byGuests = !!svc && svc.capacityUnit === 'Guests';
        // ผู้ให้บริการ: บังคับระบุ = ต้องเลือก · ลูกค้าเลือก = มี "ใครก็ได้" · ระบบจัดให้ = ไม่แสดง (server ตัดสินตอนจอง)
        // รอบ 207: โหมดที่มีผลจริง (เว็บปิดจัดสรรผู้ให้บริการ ⇒ None) — server ส่ง effectiveResourceMode
        const resMode = svc ? (svc.effectiveResourceMode || svc.resourceMode) : 'None';
        // รอบ 207 (ข้อ 7): ช่องบังคับ/ซ่อนจากค่าตั้งของเว็บ (ด่านจริงที่เซิร์ฟเวอร์ — BookingFormFields)
        const ff = (svc && svc.formFields) || { phone: 'Required', email: 'Optional', notes: 'Optional' };
        const fld = (key, label, html) => ff[key] === 'Hidden' ? '' : `<div><label>${label}${ff[key] === 'Required' ? ' <span style="color:#DC2626">*</span>' : ' <span style="color:var(--text-secondary);font-size:12px">(ไม่บังคับ)</span>'}</label>${html(ff[key] === 'Required' ? 'required' : '')}</div>`;
        const resList = (svc && Array.isArray(svc.resources)) ? svc.resources : [];
        const showRes = (resMode === 'Required' || resMode === 'CustomerChoice') && resList.length > 0;
        box.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h2 style="margin:0">เลือกเวลาจอง</h2>
            <button onclick="document.getElementById('sfBookingModal').remove()" style="background:none;border:none;font-size:24px;cursor:pointer">×</button>
          </div>
          <p style="color:var(--text-secondary);margin-bottom:6px">บริการ: <strong>${this.esc(serviceName)}</strong></p>
          ${svc && svc.policySummary ? `<p style="color:var(--text-secondary);font-size:12px;margin-bottom:14px">${this.esc(svc.policySummary)}</p>` : ''}
          ${this._bkMemberGateHtml(svc)}
          ${maxUnits > 1 ? `<label>จำนวนช่วงติดกัน</label>
            <select id="sfBookUnits" onchange="Store._loadSlots('${this.jsArg(serviceId)}')" style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px;margin-bottom:14px">
              ${Array.from({ length: maxUnits }, (_, i) => `<option value="${i + 1}">${i + 1} ช่วง (${(i + 1) * (svc.durationMinutes || 0)} นาที)</option>`).join('')}
            </select>` : ''}
          ${showRes ? `<label>ผู้ให้บริการ</label>
            <select id="sfBookResource" data-required="${resMode === 'Required' ? '1' : '0'}" onchange="Store._loadSlots('${this.jsArg(serviceId)}')" style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px;margin-bottom:14px">
              ${resMode === 'Required' ? '<option value="">— เลือกผู้ให้บริการ —</option>' : '<option value="">ใครก็ได้ (ระบบจัดให้)</option>'}
              ${resList.map(r => `<option value="${this.esc(r.id)}">${this.esc(r.name)}</option>`).join('')}
            </select>` : ''}
          ${byGuests ? `<label>จำนวนคน</label>
            <input type="number" id="sfBookGuests" min="1" max="${Number(svc.maxCapacity) || 1}" value="1" onchange="Store._loadSlots('${this.jsArg(serviceId)}')"
                   style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px;margin-bottom:14px">` : ''}
          <label>เลือกวันที่</label>
          <input type="date" id="sfBookDate" min="${new Date().toISOString().slice(0,10)}" value="${new Date().toISOString().slice(0,10)}"
                 style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px;margin-bottom:14px"
                 onchange="Store._loadSlots('${this.esc(serviceId)}')">
          <div id="sfSlots" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:18px">
            <div style="color:var(--text-secondary)">กำลังโหลดเวลา...</div>
          </div>
          <form id="sfBookForm" style="display:none;display:grid;gap:10px">
            <input type="hidden" name="serviceId" value="${this.esc(serviceId)}">
            <input type="hidden" name="slotStart" id="sfSlotStart">
            <div><label>ชื่อ-นามสกุล <span style="color:#DC2626">*</span></label><input name="customerName" required maxlength="200" style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px"></div>
            ${fld('phone', 'เบอร์โทร', r => `<input name="customerPhone" type="tel" ${r} maxlength="30" style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px">`)}
            ${fld('email', 'อีเมล', r => `<input type="email" name="customerEmail" ${r} maxlength="200" style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px">`)}
            ${fld('notes', 'หมายเหตุ', r => `<textarea name="notes" rows="2" ${r} style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px"></textarea>`)}
            <div id="sfBookCreditBox"></div>
            ${this.p6ConsentHtml()}
            <button type="button" id="sfBookSubmit" onclick="Store._submitBooking()" class="btn btn-primary" style="padding:12px">ยืนยันการจอง</button>
          </form>
          <p style="margin-top:12px;font-size:12px;color:var(--text-secondary);text-align:center">จองไว้แล้ว? <a href="${this._pageUrl('check')}">ตรวจสอบ/จัดการการจองเดิม</a></p>`;
        // รอบ 210: บริการที่ต้องเป็นสมาชิก (เซิร์ฟเวอร์ตัดสิน memberOnly) + ยังไม่ล็อกอิน ⇒ ปิดปุ่มจอง (ด่านจริงที่เซิร์ฟเวอร์ — 401)
        if (svc && svc.memberOnly && !this._custSession()) { const sb = document.getElementById('sfBookSubmit'); if (sb) sb.disabled = true; }
        await this._loadSlots(serviceId);
        await this._bookingCreditBox();
      },

      async _loadSlots(serviceId) {
        const date = document.getElementById('sfBookDate').value;
        const box = document.getElementById('sfSlots');
        const resSel = document.getElementById('sfBookResource');
        if (resSel && resSel.dataset.required === '1' && !resSel.value) {
          box.innerHTML = '<div style="color:var(--text-secondary);grid-column:1/-1">กรุณาเลือกผู้ให้บริการก่อน</div>';
          return;
        }
        box.innerHTML = '<div style="color:var(--text-secondary);grid-column:1/-1">กำลังค้นหาเวลาว่าง...</div>';
        try {
          // DTO field names: BookingServiceId + Date (DateTime). System.Text.Json
          // accepts camelCase via JsonNamingPolicy. Date is sent as ISO so the
          // server parses it as local midnight regardless of tz.
          const r = await fetch(this._url('/storefront/booking-services/available-slots'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bookingServiceId: serviceId, date: date + 'T00:00:00', units: this._bkUnits(), guestCount: this._bkGuests(), resourceId: this._bkResource() })
          });
          const slots = (await r.json()).data || [];
          if (!slots.length) {
            box.innerHTML = '<div style="color:var(--text-secondary);grid-column:1/-1">ไม่มีเวลาว่างในวันนี้ — ลองเลือกวันอื่น</div>';
            return;
          }
          // Server returns StartTime as a string "HH:mm" — render directly.
          // ป้าย (ช่วงเช้า/บ่าย/ทั้งวัน) · ช่วงเวลา · ยอด — server คำนวณทั้งหมด
          box.innerHTML = slots.map(s => {
            const t = String(s.startTime || '').slice(0, 5);
            const e = String(s.endTime || '').slice(0, 5);
            const tail = s.isFull ? 'เต็ม · ลงคิวสำรอง' : ('฿' + Number(s.price||0).toLocaleString('th-TH') + (s.resourceName ? ' · ' + s.resourceName : ''));
            return `<button onclick="Store._pickSlot('${this.jsArg(s.startTime)}', this)" style="padding:10px;background:${s.isFull ? '#FEF3C7' : '#F3F4F6'};border:1px solid #E5E7EB;border-radius:6px;cursor:pointer;font-weight:600;line-height:1.3">${s.label ? this.esc(s.label) + '<br>' : ''}${this.esc(t)}–${this.esc(e)}<br><span style="font-weight:400;font-size:11px">${this.esc(tail)}</span></button>`;
          }).join('');
        } catch(_) {
          box.innerHTML = '<div style="color:#DC2626;grid-column:1/-1">โหลดเวลาไม่สำเร็จ</div>';
        }
      },

      // รอบ 210 (คำตัดสินข้อ 169): ต้องเข้าสู่ระบบสมาชิกก่อนจอง — ค่าจากเซิร์ฟเวอร์ (svc.memberOnly · BookingAccessRule) · หน้าเว็บไม่ตัดสินเอง
      _bkMemberGateHtml(svc) {
        if (!svc || !svc.memberOnly) return '';
        if (this._custSession()) return `<div style="font-size:12px;color:#065F46;background:#ECFDF5;border:1px solid #6EE7B7;border-radius:8px;padding:8px 12px;margin-bottom:12px">✓ จองในนามสมาชิกที่เข้าสู่ระบบอยู่</div>`;
        return `<div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:10px;padding:12px 14px;margin-bottom:14px;color:#78350F;font-size:13px">
            🔒 ต้องเข้าสู่ระบบสมาชิกก่อนจอง
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
              <a class="btn btn-primary" href="${this._pageUrl('account')}">เข้าสู่ระบบ</a>
              <a class="btn btn-secondary" href="${this._pageUrl('account')}">สมัครสมาชิก</a>
            </div></div>`;
      },

      _bkUnits() { const el = document.getElementById('sfBookUnits'); return el ? Math.max(1, parseInt(el.value, 10) || 1) : 1; },
      _bkResource() { const el = document.getElementById('sfBookResource'); return el && el.value ? el.value : null; },
      _bkGuests() { const el = document.getElementById('sfBookGuests'); return el ? Math.max(1, parseInt(el.value, 10) || 1) : 1; },

      _pickSlot(startTime, btn) {
        document.getElementById('sfSlotStart').value = startTime;
        document.getElementById('sfBookForm').style.display = 'grid';
        document.querySelectorAll('#sfSlots button').forEach(b => {
          b.style.background = '#F3F4F6'; b.style.color = '';
        });
        if (btn) { btn.style.background = 'var(--primary,#4F46E5)'; btn.style.color = '#fff'; }
      },

      async _submitBooking() {
        const form = document.getElementById('sfBookForm');
        const fd = new FormData(form);
        if (!fd.get('slotStart')) { alert('กรุณาเลือกเวลา'); return; }
        // ช่องบังคับ (ตามค่าตั้งของเว็บ) — เตือนก่อนส่ง · เซิร์ฟเวอร์ตรวจซ้ำเป็นด่านจริง
        if (!form.reportValidity()) return;
        const bookingDate = document.getElementById('sfBookDate').value; // yyyy-mm-dd
        // DTO contract (CreateBookingRequest): BookingServiceId, BookingDate
        // (DateTime), StartTime (string "HH:mm"), guest fields.
        const body = {
          bookingServiceId: fd.get('serviceId'),
          bookingDate: bookingDate + 'T00:00:00',
          startTime: fd.get('slotStart'),
          guestName: fd.get('customerName'),
          guestPhone: fd.get('customerPhone') || null,
          guestEmail: fd.get('customerEmail') || null,
          customerNotes: fd.get('notes') || null,
          guestCount: this._bkGuests(),
          units: this._bkUnits(),
          resourceId: this._bkResource(),
          consentGiven: this.p6ConsentValue(form)   // รอบ 209 P6 (PDPA)
        };
        if (typeof this._bkPayExtras === 'function') Object.assign(body, this._bkPayExtras());   // รอบ 218: มัดจำไม่บังคับ — ลูกค้าเลือกจ่ายไหม
        // รอบ 209 P1 (C3): จองด้วยบัตร — ส่ง id ลูกค้าของตัวเอง + โทเคนหน้าร้าน (เซิร์ฟเวอร์เทียบ id ในโทเคนกับ customerId)
        const useCredit = document.getElementById('sfBookUseCredit');
        const meForCredit = useCredit && useCredit.checked ? await this._custMeLoad() : null;
        if (useCredit && useCredit.checked && !meForCredit) { alert('เซสชันสมาชิกหมดอายุ — เข้าสู่ระบบใหม่ก่อนจองด้วยบัตร'); return; }
        if (meForCredit) {
          body.customerId = meForCredit.customerId;
          body.payWithCredit = true;
          const passSel = document.getElementById('sfBookCreditPass');
          body.creditPassId = passSel && passSel.value ? passSel.value : null;
        }
        try {
          const r = await fetch(this._url('/booking/bookings'), {
            method: 'POST', headers: this._custHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(body)
          });
          // server ตัดสินรอบอีกครั้งตอนจอง (เต็ม/ปิด/ล่วงหน้าไม่พอ) — แสดงเหตุผลของ server แล้วโหลดเวลาว่างใหม่
          if (!r.ok) {
            let msg = 'จองไม่สำเร็จ — ลองอีกครั้ง';
            try { const j = await r.json(); if (j && j.message) msg = j.message; } catch (_) {}
            // รอบ 210: 401 = ต้องเป็นสมาชิก/เซสชันหมดอายุ ⇒ ล้างเซสชันเก่า + พาไปหน้าเข้าสู่ระบบ (ข้อความจากเซิร์ฟเวอร์)
            if (r.status === 401) {
              this._custLogout();
              if (confirm(msg + '\n\nไปหน้าเข้าสู่ระบบ/สมัครสมาชิกตอนนี้?')) window.location.href = this._pageUrl('account');
              return;   // ข้อความแสดงแล้วใน confirm — ไม่ alert ซ้ำ
            }
            await this._loadSlots(fd.get('serviceId'));
            document.getElementById('sfBookForm').style.display = 'none';
            document.getElementById('sfSlotStart').value = '';
            throw new Error(msg);
          }
          const booking = (await r.json()).data;
          // รอบ 207 (ข้อ 6): หน้าจองสำเร็จแสดงรายละเอียดครบ + ดาวน์โหลด/พิมพ์ใบยืนยันการจองเก็บไว้
          this._lastBooking = booking;
          document.getElementById('sfBookingModal').innerHTML = `
            <div style="background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:28px">
              <div style="text-align:center">
                <div style="font-size:56px">✅</div>
                <h2 style="margin:4px 0">${booking.status === 'Waitlisted' ? 'ลงคิวสำรองแล้ว' : 'จองสำเร็จ'}</h2>
                ${booking.status === 'Waitlisted' ? `<p style="color:var(--text-secondary)">คิวสำรองลำดับที่ ${this.esc(String(booking.waitlistPosition || '-'))} — มีที่ว่างเมื่อไรร้านจะแจ้งกลับ</p>` : ''}
              </div>
              ${this._bookingDetailHtml(booking)}
              <div id="sfBookingPayBox"></div>
              <div id="sfBookingLineBox"></div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px">
                <button class="btn btn-primary" onclick="Store.downloadBookingConfirmation()">⬇️ ดาวน์โหลดใบยืนยันการจอง</button>
                <button class="btn" onclick="Store.printBookingConfirmation()">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
              </div>
              ${booking.publicToken ? `<p style="margin-top:12px;font-size:13px;text-align:center"><a href="${this._pageUrl('my-booking/' + encodeURIComponent(booking.publicToken))}">ดู/จัดการการจองของฉัน</a> — เก็บลิงก์นี้ไว้เพื่อจ่ายมัดจำ เลื่อน หรือยกเลิก</p>` : ''}
              <div style="text-align:center"><button onclick="document.getElementById('sfBookingModal').remove()" class="btn" style="margin-top:10px;padding:10px 28px">ปิด</button></div>
            </div>`;
          // รอบ 205 W2 (R-08): มัดจำออนไลน์ — ยอด/สิทธิ์จากเซิร์ฟเวอร์ (onlineDepositDue · onlinePaymentNote) หน้าเว็บแสดงอย่างเดียว
          await this._renderBookingPayOnline(booking);
          if (booking.publicToken) this.renderLineBox('sfBookingLineBox', { kind: 'booking', token: booking.publicToken });
        } catch (e) { alert(e.message); }
      },

      // ── รอบ 207 (ข้อ 6): รายละเอียดการจอง + ใบยืนยันที่ลูกค้าเก็บไว้ได้ (ค่าทุกตัวจากคำตอบของเซิร์ฟเวอร์ · หนีด้วย esc ทุกช่อง) ──
      _bookingRows(b) {
        const providers = (b.assignments || []).map(a => a.resourceName).filter(Boolean).join(', ') || b.resourceName || '';
        const site = this.data?.site || this.site || {};
        return [
          ['ร้าน / ผู้ให้บริการ', site.name || ''],
          ['เลขที่การจอง', b.bookingNumber || b.id],
          ['สถานะ', b.customerStatusLabel || b.status],   // ป้ายจากเซิร์ฟเวอร์ (BookingStatusLabels)
          ['บริการ', b.serviceName || ''],
          ['วันที่', String(b.bookingDate || '').slice(0, 10)],
          ['เวลา', `${b.startTime || ''}${b.endTime ? ' – ' + b.endTime : ''}${b.durationMinutes ? ` (${b.durationMinutes} นาที)` : ''}`],
          ['ผู้ให้บริการ', providers],
          ['จำนวน', `${b.guestCount || 1} คน${(b.units || 1) > 1 ? ` · ${b.units} ช่วง` : ''}`],
          ['ชื่อผู้จอง', b.guestName || b.customerName || ''],
          ['เบอร์โทร', b.guestPhone || ''],
          ['อีเมล', b.guestEmail || b.customerEmail || ''],
          ['ค่าบริการ', '฿' + this._money(b.totalAmount)],
          ['มัดจำ', Number(b.depositAmount) > 0 ? `฿${this._money(b.depositAmount)} (ชำระแล้ว ฿${this._money(b.paidAmount)})` : ''],
          ['หมายเหตุ', b.customerNotes || ''],
          ['นโยบายยกเลิก', b.cancelPolicyNote || ''],
        ].filter(([, v]) => v !== '' && v != null);
      },
      _bookingDetailHtml(b) {
        return `<table style="width:100%;border-collapse:collapse;margin-top:14px;font-size:14px">${this._bookingRows(b).map(([k, v]) =>
          `<tr><td style="padding:6px 8px;color:var(--text-secondary);border-bottom:1px solid #F3F4F6;white-space:nowrap;vertical-align:top">${this.esc(k)}</td><td style="padding:6px 8px;border-bottom:1px solid #F3F4F6;font-weight:500">${this.esc(String(v))}</td></tr>`).join('')}</table>`;
      },
      _bookingConfirmationDoc(b) {
        const site = this.data?.site || this.site || {};
        const link = b.publicToken ? location.origin + this._pageUrl('my-booking/' + encodeURIComponent(b.publicToken)) : '';
        const rows = this._bookingRows(b).map(([k, v]) => `<tr><th>${this.esc(k)}</th><td>${this.esc(String(v))}</td></tr>`).join('');
        return `<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ใบยืนยันการจอง ${this.esc(b.bookingNumber || '')}</title>
<style>body{font-family:'Noto Sans Thai',Tahoma,sans-serif;color:#111827;max-width:640px;margin:24px auto;padding:0 16px}h1{font-size:22px;margin:0}h2{font-size:15px;color:#6B7280;font-weight:500;margin:4px 0 16px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:#6B7280;font-weight:500;padding:8px;border-bottom:1px solid #E5E7EB;width:34%;vertical-align:top}td{padding:8px;border-bottom:1px solid #E5E7EB}
.no{font-size:28px;font-weight:700;letter-spacing:1px;margin:10px 0}.foot{margin-top:18px;font-size:12px;color:#6B7280}</style></head><body>
<h1>ใบยืนยันการจอง</h1><h2>${this.esc(site.name || '')}</h2>
<div class="no">${this.esc(b.bookingNumber || '')}</div>
<table>${rows}</table>
${link ? `<p class="foot">ดู/จัดการการจอง: ${this.esc(link)}</p>` : ''}
<p class="foot">แสดงใบนี้ต่อร้านเพื่อยืนยันการจอง · ออกเมื่อ ${this.esc(new Date().toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' }))} · เอกสารนี้ไม่ใช่ใบกำกับภาษี/ใบเสร็จรับเงิน</p>
</body></html>`;
      },
      downloadBookingConfirmation(b) {
        b = b || this._lastBooking; if (!b) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([this._bookingConfirmationDoc(b)], { type: 'text/html;charset=utf-8' }));
        a.download = `booking-${String(b.bookingNumber || 'confirmation').replace(/[^A-Za-z0-9_-]/g, '_')}.html`;
        document.body.appendChild(a); a.click(); a.remove();
      },
      printBookingConfirmation(b) {
        b = b || this._lastBooking; if (!b) return;
        const w = window.open('', '_blank');
        if (!w) { this.downloadBookingConfirmation(b); return; }
        w.document.open(); w.document.write(this._bookingConfirmationDoc(b)); w.document.close();
        w.focus(); setTimeout(() => w.print(), 300);
      },

      // ── รอบ 205 W2 (R-08/R-10): มัดจำออนไลน์ + ลิงก์จัดการการจองของลูกค้า (my-booking/{token}) — ค่าทุกตัวจากเซิร์ฟเวอร์ ──
      async _renderBookingPayOnline(booking, boxId = 'sfBookingPayBox') {
        const box = document.getElementById(boxId);
        if (!box) return;
        const due = Number(booking?.onlineDepositDue || 0);
        if (booking?.onlinePaymentNote) {
          box.innerHTML = `<div style="margin-top:12px;background:#FFFBEB;border:1px solid #FCD34D;border-radius:10px;padding:12px 14px;color:#78350F;font-size:13px;text-align:left">${this.esc(booking.onlinePaymentNote)}</div>`;
          return;
        }
        if (!(due > 0) || !booking.publicToken) { box.innerHTML = ''; return; }
        const m = await this._payMethods();
        if (!m || !m.online || !(m.methods || []).length) {
          box.innerHTML = `<div style="margin-top:12px;font-size:13px;color:var(--text-secondary)">มัดจำ ฿${this._money(due)} — โอนแล้วแจ้งร้านเพื่อยืนยันการจอง</div>`;
          return;
        }
        box.innerHTML = `<div style="margin-top:14px;border:2px solid #16a34a;border-radius:12px;padding:14px 18px;text-align:left">
            <div style="font-weight:600">💳 ชำระมัดจำ ฿${this._money(due)} เพื่อยืนยันการจอง${m.isTestMode ? ' <span style="color:#92400e">(โหมดทดสอบ)</span>' : ''}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
              ${(m.methods || []).map(x => `<button class="btn btn-primary" onclick="Store.bookingPayOnline('${this.jsArg(booking.publicToken)}', '${this.jsArg(x)}')">${this.esc(this._payLabel(x))}</button>`).join('')}
            </div></div>`;
      },
      bookingPayOnline(token, method) {
        const { companyId, siteId } = this._ctx;
        PayWidget.open({
          companyId,
          // ตัวตนอยู่ใน URL (โทเคนที่ลูกค้าถือ) — widget ไม่ส่ง sourceId/amount (ยอดจาก PublicPaymentResolver)
          publicBase: `/api/companies/${companyId}/public-pay/bookings/${siteId}/${encodeURIComponent(token)}`,
          method,
          onPaid: () => { setTimeout(() => this.renderBookingByToken(token, 'ชำระมัดจำสำเร็จ — ระบบยืนยันการจองแล้ว'), 800); },
        });
      },
      async renderBookingByToken(token, flash) {
        const main = document.getElementById('sfMain');
        document.title = 'การจองของฉัน';
        const modal = document.getElementById('sfBookingModal'); if (modal) modal.remove();
        let b = null, msg = null;
        try {
          const r = await fetch(this._url('/booking/bookings/by-token/' + encodeURIComponent(token)));
          const j = await r.json().catch(() => null);
          if (r.ok) b = j.data; else msg = j?.message || 'ไม่พบการจอง';
        } catch (_) { msg = 'โหลดไม่สำเร็จ'; }
        if (!b) {
          main.innerHTML = `<div class="sf-container" style="padding:40px 20px;text-align:center"><h2>ไม่พบการจอง</h2><p style="color:var(--text-secondary)">${this.esc(msg || '')}</p></div>`;
          return;
        }
        this._lastBooking = b;
        main.innerHTML = `
          <div class="sf-container" style="padding:32px 20px;max-width:640px">
            ${flash ? `<div style="background:#ECFDF5;border:1px solid #6EE7B7;border-radius:10px;padding:12px 16px;color:#065F46;margin-bottom:16px">${this.esc(flash)}</div>` : ''}
            <h1 style="margin:0 0 6px">การจอง ${this.esc(b.bookingNumber || '')}</h1>
            ${this._bookingDetailHtml(b)}
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
              <button class="btn btn-primary" onclick="Store.downloadBookingConfirmation()">⬇️ ดาวน์โหลดใบยืนยันการจอง</button>
              <button class="btn" onclick="Store.printBookingConfirmation()">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
            </div>
            <div id="sfBookingPayBox"></div>
            <div id="sfBookingLineBox"></div>
            ${b.canRescheduleOnline ? `<div style="margin-top:20px;border-top:1px solid #E5E7EB;padding-top:16px">
              <div style="font-weight:600;margin-bottom:6px">เลื่อนนัด</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                <input type="date" id="sfRsDate" class="form-input" style="width:auto" value="${this.esc(String(b.bookingDate || '').slice(0, 10))}" onchange="Store._loadRescheduleSlots('${this.jsArg(token)}', '${this.jsArg(b.bookingServiceId)}', ${Number(b.guestCount || 1)}, ${Number(b.units || 1)})">
                <button class="btn" onclick="Store._loadRescheduleSlots('${this.jsArg(token)}', '${this.jsArg(b.bookingServiceId)}', ${Number(b.guestCount || 1)}, ${Number(b.units || 1)})">ดูเวลาว่าง</button>
              </div>
              <div id="sfRsSlots" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px"></div>
            </div>` : ''}
            ${b.canCancelOnline ? `<div style="margin-top:20px;border-top:1px solid #E5E7EB;padding-top:16px">
              <div style="font-size:13px;color:var(--text-secondary)">${this.esc(b.cancelPolicyNote || '')}</div>
              <button class="btn" style="margin-top:10px;border:1px solid #DC2626;color:#DC2626" onclick="Store.cancelBookingByToken('${this.jsArg(token)}')">ยกเลิกการจอง</button>
            </div>` : ''}
          </div>`;
        await this._renderBookingPayOnline(b);
        this.renderLineBox('sfBookingLineBox', { kind: 'booking', token });
      },
      // รอบ 206: เลื่อนนัดเอง — เวลาว่างจากเซิร์ฟเวอร์ (available-slots เดิม) · ส่งแล้วเซิร์ฟเวอร์ตัดสินรอบใหม่ (ไม่นับการจองตัวเอง)
      async _loadRescheduleSlots(token, serviceId, guests, units) {
        const date = document.getElementById('sfRsDate')?.value;
        const box = document.getElementById('sfRsSlots');
        if (!date || !box) return;
        box.innerHTML = '<div style="color:var(--text-secondary);grid-column:1/-1">กำลังค้นหาเวลาว่าง...</div>';
        try {
          const r = await fetch(this._url('/storefront/booking-services/available-slots'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bookingServiceId: serviceId, date: date + 'T00:00:00', units, guestCount: guests })
          });
          const slots = ((await r.json()).data || []).filter(s => !s.isFull);
          if (!slots.length) { box.innerHTML = '<div style="color:var(--text-secondary);grid-column:1/-1">ไม่มีเวลาว่างในวันนี้ — ลองวันอื่น</div>'; return; }
          box.innerHTML = slots.map(s => `<button class="btn" style="padding:8px" onclick="Store.rescheduleBookingByToken('${this.jsArg(token)}', '${this.jsArg(date)}', '${this.jsArg(s.startTime)}')">${this.esc(String(s.startTime || '').slice(0, 5))}–${this.esc(String(s.endTime || '').slice(0, 5))}</button>`).join('');
        } catch (_) { box.innerHTML = '<div style="color:#DC2626;grid-column:1/-1">โหลดเวลาไม่สำเร็จ</div>'; }
      },
      async rescheduleBookingByToken(token, date, startTime) {
        if (!confirm(`เลื่อนนัดไปวันที่ ${date} เวลา ${String(startTime).slice(0, 5)}?`)) return;
        try {
          const r = await fetch(this._url('/booking/bookings/by-token/' + encodeURIComponent(token) + '/reschedule'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bookingDate: date + 'T00:00:00', startTime: String(startTime).slice(0, 5) }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'เลื่อนนัดไม่สำเร็จ');
          await this.renderBookingByToken(token, 'เลื่อนนัดแล้ว');
        } catch (e) { alert(e.message); }
      },
      async cancelBookingByToken(token) {
        const reason = prompt('เหตุผลที่ยกเลิก (ถ้ามี)');
        if (reason === null) return;
        if (!confirm('ยืนยันยกเลิกการจองนี้? ค่าธรรมเนียม/การคืนมัดจำตามเงื่อนไขที่แสดง')) return;
        try {
          const r = await fetch(this._url('/booking/bookings/by-token/' + encodeURIComponent(token) + '/cancel'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: reason || null }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'ยกเลิกไม่สำเร็จ');
          await this.renderBookingByToken(token, 'ยกเลิกการจองแล้ว' + (j?.data?.cancelPolicyNote ? ' — ' + j.data.cancelPolicyNote : ''));
        } catch (e) { alert(e.message); }
      },

      _toast(msg, action) {
        const t = document.createElement('div');
        t.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:14px 22px;border-radius:8px;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;cursor:pointer;max-width:90vw';
        t.textContent = msg;
        if (action) t.onclick = () => { action(); t.remove(); };
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }
    });

    // ═══════════════ ที่พัก (Lodging) — ค้นหาห้องว่าง → เลือกแผนราคา/บริการเสริม → จอง → ดู/อัปโหลดสลิป/ยกเลิกด้วย token ═══════════════
    // ราคาทุกตัวเลขมาจากเซิร์ฟเวอร์ (search/quote) — หน้าเว็บแสดงอย่างเดียว ห้ามคำนวณเอง (กติกา "resolver กลาง")
    Object.assign(Store, {
      _lodging: undefined,
      // roomGuests: ผู้เข้าพักรายห้องที่เลือก (คีย์ "{roomTypeId}:{ลำดับ}") · guestTouched: ห้องที่แขกตั้งเองแล้ว (ค่าผู้ใช้ชนะค่าแบ่งอัตโนมัติ)
      // infants: ระดับการจอง (Infants ของทั้ง quote และคำขอจอง) — รอบ 202 ทีม LW (ข้อ 123/124)
      _lgState: { checkIn: '', checkOut: '', adults: 2, children: 0, infants: 0, rooms: 1, sel: {}, roomGuests: {}, guestTouched: {}, extras: {}, ratePlanId: null, results: [], quote: null },
      _lurl(path) { return this._url('/lodging' + path); },
      // ข้อมูลที่พักของเว็บนี้ — คืน null **เฉพาะ 404** (เว็บไม่ได้ผูกที่พัก/ที่พักปิดอยู่ = ผลจริง จำไว้) ·
      // สถานะอื่น/เน็ตหลุด ⇒ โยน Error (ไม่จำ ให้ลองใหม่ได้) — รอบ 202 ทีม LW (W-04): เดิมทุกความล้มเหลวกลายเป็น null
      // ⇒ ระบบจองห้องล่มแล้วหน้าเว็บตกไปการ์ดนัดหมาย ฿0 เงียบ ๆ แขกไม่รู้ว่าระบบขัดข้อง
      async lodgingInfo() {
        if (this._lodging !== undefined) return this._lodging;
        let r;
        try { r = await fetch(this._lurl('/info')); }
        catch (_) { throw new Error('เชื่อมต่อระบบจองห้องไม่ได้'); }
        if (r.status === 404) { this._lodging = null; return null; }
        const j = await r.json().catch(() => null);
        if (!r.ok) throw new Error(j?.message || `ระบบจองห้องขัดข้อง (HTTP ${r.status})`);
        this._lodging = j?.data || null;
        return this._lodging;
      },
      _lodgingErrorHtml(e) {
        return `<div class="sf-loader" style="color:#DC2626">โหลดข้อมูลห้องพักไม่สำเร็จ — ${this.esc(e?.message || '')} · กรุณาลองรีเฟรชหน้าอีกครั้ง</div>`;
      },
      // ไม่ผูกที่พัก/ปิดอยู่ — ช่องทางติดต่อจากเซิร์ฟเวอร์ (StorefrontSiteInfo resolve แล้ว: เว็บชนะบริษัท) · ไม่มีราคา seed (ข้อ 117)
      _lodgingClosedHtml() {
        const s = this.data?.site || {};
        const contact = [s.contactPhone ? `โทร ${this.esc(s.contactPhone)}` : '',
                         s.lineId ? `LINE ${this.esc(s.lineId)}` : '',
                         s.contactEmail ? this.esc(s.contactEmail) : ''].filter(Boolean).join(' · ');
        return `<div class="lg-sum" style="text-align:center"><b>ยังไม่เปิดจองออนไลน์</b>
          <div style="margin-top:6px;font-size:14px">กรุณาติดต่อที่พักโดยตรงเพื่อสอบถามห้องว่างและราคา${contact ? ' — ' + contact : ''}</div></div>`;
      },
      // บล็อก LodgingRooms: ประเภทห้องที่เปิดขาย (projection สาธารณะ) · ราคาเริ่มต้น/ความจุ = ป้ายที่เซิร์ฟเวอร์คำนวณผ่าน engine
      // (fromRateLabel · capacityLabel — ฝ่ายค้าน P2-1/P2-2) แสดงอย่างเดียว · ไม่มีป้ายราคา (ปิดขายทั้งช่วง) ⇒ ไม่แต่งตัวเลข
      _lodgingRoomsHtml(info) {
        const rooms = info.roomTypes || [];
        if (!rooms.length) return '<div class="placeholder">ยังไม่มีประเภทห้องเปิดขาย</div>';
        const cta = info.onlineBookingEnabled ? 'จองห้องนี้' : 'สอบถาม / ติดต่อจอง';
        return `<div class="sf-container">${rooms.map(rt => {
          const href = this.esc(this._lgBookUrl(rt));
          const img = (rt.images || []).filter(Boolean)[0];
          const meta = [rt.sizeSqm ? `${this.esc(rt.sizeSqm)} ตรม.` : '', rt.bedType ? this.esc(rt.bedType) : '',
                        rt.capacityLabel ? this.esc(rt.capacityLabel) : ''].filter(Boolean).join(' · ');
          return `<div class="lg-room">${img ? `<img src="${this.esc(img)}" alt="${this.esc(rt.name)}" loading="lazy">` : '<div class="lg-noimg"></div>'}
            <div><h3>${this.esc(rt.name)}</h3><div class="lg-meta">${meta}</div>${rt.description ? `<div style="font-size:14px">${this.esc(rt.description)}</div>` : ''}</div>
            <div class="lg-price">${rt.fromRateLabel ? `<div class="amt" style="font-size:18px">${this.esc(rt.fromRateLabel)}</div>` : '<small>สอบถามราคา</small>'}
              <small>ราคาจริงตามวันที่เลือก</small>
              <a href="${href}" class="btn btn-primary" style="margin-top:10px;display:inline-block">${cta}</a>
              <a href="${this.esc(this._lgRoomUrl(rt))}" style="display:block;margin-top:8px;font-size:13px">ดูรายละเอียดห้อง →</a></div></div>`;
        }).join('')}</div>`;
      },
      // W-07: ค่าค้นหาจากหน้าแรก (?checkIn=&checkOut=&adults=&children=&rooms=) → state ของหน้าจอง · รับเฉพาะรูปที่อ่านได้
      // (วันที่ yyyy-mm-dd · จำนวนอยู่ในช่วงของตัวเลือกบนฟอร์ม) — ความถูกต้องของช่วงวันตัดสินที่เซิร์ฟเวอร์ตอนค้นหา
      _lgStateFromQuery() {
        const p = new URLSearchParams(location.search);
        const st = this._lgState;
        const day = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : '';
        const num = (v, lo, hi) => { const x = parseInt(v, 10); return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : null; };
        const ci = day(p.get('checkIn')), co = day(p.get('checkOut'));
        if (ci && co) { st.checkIn = ci; st.checkOut = co; }
        const a = num(p.get('adults'), 1, 6); if (a != null) st.adults = a;
        const c = num(p.get('children'), 0, 4); if (c != null) st.children = c;
        const inf = num(p.get('infants'), 0, 3); if (inf != null) st.infants = inf;
        const r = num(p.get('rooms'), 1, 5); if (r != null) st.rooms = r;
        // ปุ่ม "จองห้องนี้" จากหน้าห้องพัก (?roomType=<id|slug>) — แปลงเป็น id จริงใน renderLodgingSearch (ไม่เจอ = ไม่เลือกให้)
        const rtKey = p.get('roomType');
        if (rtKey && rtKey.length <= 120) st.preferRoomKey = rtKey;
      },
      _lgFindRoom(info, key) {
        if (!key) return null;
        return ((info && info.roomTypes) || []).find(rt => String(rt.id) === String(key) || (rt.slug && String(rt.slug) === String(key))) || null;
      },
      _lgRoomUrl(rt) {
        const k = String(rt.slug || rt.id);
        return this._pageUrl('rooms/' + (this._ctx.pathBased ? encodeURIComponent(k) : k));
      },
      _lgBookUrl(rt) { return this._pageUrlQuery('booking', { roomType: rt.id }); },
      _pageUrlQuery(slug, q) {
        const base = this._pageUrl(slug);
        const qs = new URLSearchParams(Object.entries(q).filter(([, v]) => v !== '' && v != null).map(([k, v]) => [k, String(v)])).toString();
        return qs ? base + (base.includes('?') ? '&' : '?') + qs : base;
      },
      _money(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
      // วันที่จากเซิร์ฟเวอร์เป็น "วันตามปฏิทิน" (เที่ยงคืน UTC) — อ่านเฉพาะส่วน yyyy-mm-dd ⇒ ไม่เลื่อนวันตามโซนเวลาของเครื่องแขก
      _dateTh(d) {
        try {
          const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || ''));
          const dt = m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : new Date(d);
          return dt.toLocaleDateString('th-TH', m ? { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' } : { day: 'numeric', month: 'short', year: 'numeric' });
        } catch (_) { return d; }
      },
      // วันนี้ตามเครื่องแขก (เดิม toISOString = วันตาม UTC ⇒ ก่อน 7 โมงเช้าเวลาไทยได้ "เมื่อวาน")
      _todayIso(offset = 0) { const d = new Date(); return this._isoAdd(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`, offset); },

      // ── วันเข้าพัก: ตัวช่วยตัวเดียวของทุกฟอร์มวันที่ฝั่งแขก (ฟอร์มค้นหาหน้าจอง · บล็อกปฏิทินจองบนหน้าแรก · ฟอร์มคำขอจองของหน้า CMS) ──
      // ช่องวันที่ติด data-lg-date="in|out" ภายในกล่อง data-lg-dates (หรือ form เดียวกัน) · ป้ายจำนวนคืนคือ [data-lg-nights] ·
      // เลือกเช็คอิน ⇒ เช็คเอาต์ว่างหรือ ≤ เช็คอิน ⇒ ตั้งเป็นวันถัดไป (หลังเช็คอินอยู่แล้ว = ค่าแขกชนะ ไม่แตะ) · min ของเช็คเอาต์ = เช็คอิน+1 ·
      // ความถูกต้องจริงของช่วงวันตัดสินที่เซิร์ฟเวอร์ (LodgingService.ValidateDates: "วันเช็คเอาต์ต้องหลังวันเช็คอิน")
      _isoAdd(iso, n) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
        if (!m) return '';
        return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + (n | 0))).toISOString().slice(0, 10);
      },
      _lgNights(ci, co) {
        const a = Date.parse(String(ci || '').slice(0, 10) + 'T00:00:00Z'), b = Date.parse(String(co || '').slice(0, 10) + 'T00:00:00Z');
        return Number.isFinite(a) && Number.isFinite(b) ? Math.round((b - a) / 86400000) : 0;
      },
      _dateShortTh(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
        return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
      },
      // "2 คืน · 22 ต.ค. → 24 ต.ค." — nights จากเซิร์ฟเวอร์ (quote/การจอง) ชนะค่าที่นับจากวันที่ · ช่วงวันใช้ไม่ได้ = ''
      lgStayLabel(ci, co, nights) {
        const n = nights != null ? Number(nights) : this._lgNights(ci, co);
        if (!(n > 0)) return '';
        return `${n} คืน · ${this._dateShortTh(ci)} → ${this._dateShortTh(co)}`;
      },
      lgDateSync(el) {
        const box = (el && (el.closest('[data-lg-dates]') || el.form)) || document;
        const inEl = box.querySelector('[data-lg-date="in"]'), outEl = box.querySelector('[data-lg-date="out"]');
        if (!inEl || !outEl) return;
        const ci = inEl.value;
        if (/^\d{4}-\d{2}-\d{2}$/.test(ci)) {
          const next = this._isoAdd(ci, 1);
          outEl.min = next;
          if (el === inEl && (!outEl.value || outEl.value <= ci)) outEl.value = next;
        }
        const lbl = box.querySelector('[data-lg-nights]');
        if (!lbl) return;
        const co = outEl.value;
        const txt = ci && co ? this.lgStayLabel(ci, co) : '';
        lbl.textContent = txt ? '🗓 ' + txt : (ci && co ? 'วันเช็คเอาต์ต้องหลังวันเช็คอิน' : '');
        lbl.classList.toggle('bad', !txt && !!(ci && co));
      },

      lodgingSearchForm(info) {
        const st = this._lgState;
        const ci = st.checkIn || this._todayIso(1);
        const co = st.checkOut && st.checkOut > ci ? st.checkOut : this._isoAdd(ci, 1);
        const stay = this.lgStayLabel(ci, co);
        return `<div class="lg-search" data-lg-dates>
          <div><label>เช็คอิน</label><input type="date" class="lg-input" id="lgIn" data-lg-date="in" value="${this.esc(ci)}" min="${this._todayIso(0)}" onchange="Store.lgDateSync(this)"></div>
          <div><label>เช็คเอาต์</label><input type="date" class="lg-input" id="lgOut" data-lg-date="out" value="${this.esc(co)}" min="${this.esc(this._isoAdd(ci, 1))}" onchange="Store.lgDateSync(this)"></div>
          <div><label>ผู้ใหญ่</label><select class="lg-input" id="lgAdults">${[1,2,3,4,5,6].map(n=>`<option ${n===st.adults?'selected':''}>${n}</option>`).join('')}</select></div>
          <div><label>เด็ก (≤${this.esc(info.childMaxAge)} ปี)</label><select class="lg-input" id="lgChildren">${[0,1,2,3,4].map(n=>`<option ${n===st.children?'selected':''}>${n}</option>`).join('')}</select></div>
          <div><label>ทารก (≤${this.esc(info.infantMaxAge)} ปี)</label><select class="lg-input" id="lgInfants">${[0,1,2,3].map(n=>`<option ${n===st.infants?'selected':''}>${n}</option>`).join('')}</select></div>
          <div><label>จำนวนห้อง</label><select class="lg-input" id="lgRooms">${[1,2,3,4,5].map(n=>`<option ${n===st.rooms?'selected':''}>${n}</option>`).join('')}</select></div>
          <div><button class="btn btn-primary" style="width:100%" onclick="Store.lodgingSearch()">🔍 ค้นหาห้องว่าง</button></div>
          <div class="lg-stay" data-lg-nights>${stay ? '🗓 ' + this.esc(stay) : ''}</div>
          <div style="grid-column:1/-1;font-size:12px;color:var(--text-secondary)">เช็คอิน ${this.esc(info.checkInTime)} · เช็คเอาต์ ${this.esc(info.checkOutTime)} · ${info.pricesIncludeVat ? 'ราคารวมภาษีแล้ว' : 'ราคายังไม่รวม VAT'}${info.serviceChargePercent > 0 ? ` · service charge ${info.serviceChargePercent}%` : ''} · ${info.onlineBookingEnabled ? 'จองออนไลน์ได้ทันที' : 'รับจองผ่านเจ้าหน้าที่'}</div>
        </div>`;
      },

      async renderLodgingSearch() {
        // สองคำขอนี้ไม่ขึ้นแก่กัน — ยิงพร้อมกัน ไม่ใช่ต่อคิว (เดิมผู้เยี่ยมชมเห็นหน้าว่าง
        // นาน = เวลาไป-กลับสองรอบ ซึ่งบนมือถือ/3G รู้สึกได้ชัด)
        // หน้า CMS ที่ slug เดียวกัน (rooms/booking ที่เทมเพลต seed ไว้) — วาด Hero ของมันไว้บนสุด
        // ให้เจ้าของแก้หัวเรื่องจาก cms-edit ได้ (เดิมหน้านั้นถูกแทนทั้งหน้า แก้อะไรก็ไม่มีผล = silent no-op)
        const main = document.getElementById('sfMain');
        let info, cmsHero;
        try { [info, cmsHero] = await Promise.all([this.lodgingInfo(), this.lodgingCmsHero()]); }
        catch (e) { main.innerHTML = this._lodgingErrorHtml(e); return; }
        this._lgStateFromQuery();   // W-07: วันที่/จำนวนแขกที่เลือกจากหน้าแรก ⇒ ค้นหาให้ทันที (บรรทัดท้ายเมธอด)
        document.title = `จองห้องพัก — ${info?.name || ''}`;
        if (!info) { main.innerHTML = '<div class="sf-loader">เว็บไซต์นี้ยังไม่มีที่พักเปิดให้จอง</div>'; return; }
        const prefer = this._lgFindRoom(info, this._lgState.preferRoomKey);
        this._lgState.preferRoomType = prefer ? prefer.id : null;
        // ⚠️ payload ของ /lodging/info มี 30 ฟิลด์ (แกลเลอรี · สิ่งอำนวยความสะดวก ·
        // คำอธิบาย · แผนที่ · ติดต่อ) แต่เดิมหน้านี้วาดแค่ ชื่อ+ดาว+ที่อยู่ ⇒ ของที่
        // ที่พักกรอกไว้ไม่เคยถูกแสดงเลย (defect class "เก็บแล้วไม่ echo กลับ")
        const gallery = (info.images || []).filter(Boolean);
        const hero = gallery.length
          ? `<div class="lg-gallery">${gallery.slice(0, 6).map((u, i) => `<img src="${this.esc(u)}" alt="${this.esc(info.name)}"
                 loading="lazy" onclick="Store.lgHeroLightbox(${i})">`).join('')}</div>` : '';
        // เก็บแยกจาก _lgImages (ชุดที่ lightbox กำลังแสดง) — ไม่งั้นเปิดรูปห้องแล้ว
        // กลับมากดรูปที่พักจะได้รูปห้องแทน (ตัวแปรเดียวถือสองความหมาย = บั๊กแน่นอน)
        this._lgHero = gallery;
        const amen = (info.amenities || []).filter(Boolean);
        // ปิดรับจองออนไลน์ = ซ่อนฟอร์มแล้วบอกช่องทางติดต่อ — ห้ามให้กรอกจนจบ
        // แล้วไปตายที่เซิร์ฟเวอร์ (เดิมด่านอยู่ฝั่งเซิร์ฟเวอร์อย่างเดียว)
        const contact = [info.phone ? `โทร ${this.esc(info.phone)}` : '',
                         info.lineId ? `LINE ${this.esc(info.lineId)}` : '',
                         info.email ? this.esc(info.email) : ''].filter(Boolean).join(' · ');
        const searchArea = info.onlineBookingEnabled
          ? `<div id="lgSearchBox">${this.lodgingSearchForm(info)}</div>`
          : `<div class="lg-sum"><b>ที่พักนี้ยังไม่เปิดรับจองออนไลน์</b>
               <div style="margin-top:6px;font-size:14px">กรุณาติดต่อที่พักโดยตรงเพื่อสอบถามห้องว่าง${contact ? ' — ' + contact : ''}</div></div>`;

        main.innerHTML = `${cmsHero}<div class="sf-container" style="padding:32px 20px">
          <h1 style="margin-bottom:6px">${this.esc(info.name)}</h1>
          <div style="color:var(--text-secondary);margin-bottom:14px">${'★'.repeat(info.starRating||0)} ${this.esc(info.address||'')}${contact ? ' · ' + contact : ''}</div>
          ${hero}
          ${info.description ? `<div style="margin:14px 0;line-height:1.75;white-space:pre-wrap">${this.esc(info.description)}</div>` : ''}
          ${amen.length ? `<div class="lg-amen">${amen.map(a => `<span>${this.esc(a)}</span>`).join('')}</div>` : ''}
          ${info.mapUrl ? `<div style="margin:10px 0"><a href="${this.esc(info.mapUrl)}" target="_blank" rel="noopener" class="btn">📍 ดูแผนที่</a></div>` : ''}
          ${prefer ? `<div class="lg-sum" style="margin-bottom:12px;border:1px solid var(--primary,#4F46E5)">ห้องที่เลือก: <b>${this.esc(prefer.name)}</b>${info.onlineBookingEnabled ? ' — เลือกวันเข้าพักแล้วกด “ค้นหาห้องว่าง” ระบบจะเลือกห้องนี้ให้ (ถ้าว่าง)' : ''} · <a href="${this.esc(this._lgRoomUrl(prefer))}">ดูรายละเอียดห้อง</a></div>` : ''}
          ${searchArea}
          <div id="lgResults" style="margin-top:24px">${(info.roomTypes||[]).slice().sort((a, b) => (prefer && b.id === prefer.id) - (prefer && a.id === prefer.id)).map(rt => this._roomCard(rt, null)).join('')}</div>
          <div id="lgBookBox"></div>
          ${info.houseRules ? `<div class="lg-sum" style="margin-top:24px"><h3 style="margin:0 0 6px">กติกาที่พัก</h3>
            <div style="white-space:pre-wrap;font-size:13px;color:var(--text-secondary)">${this.esc(info.houseRules)}</div></div>` : ''}
        </div>`;
        if (info.onlineBookingEnabled && this._lgState.checkIn) await this.lodgingSearch();
      },

      // Hero block ของหน้า CMS ที่ slug ตรงกับหน้าจองที่พัก (rooms/booking) — เฉพาะ Hero:
      // เนื้อหาอื่น (รายการห้อง/ฟอร์ม) ระบบจองห้องวาดจากข้อมูลจริงอยู่แล้ว ไม่ซ้อน
      async lodgingCmsHero() {
        try {
          const { companyId, siteId } = this._ctx || {};
          if (!companyId || !siteId || !this.slug) return '';
          const res = await fetch(`/api/companies/${companyId}/cms/sites/${siteId}/storefront/pages/${encodeURIComponent(this.slug)}?lang=${this.lang}`);
          if (!res.ok) return '';
          const json = await res.json();
          const page = json.data || json;
          const hero = (page?.blocks || []).filter(b => b.isVisible !== false).sort((a, b) => a.sortOrder - b.sortOrder)
            .find(b => b.blockType === 'Hero' || b.blockType === 1);
          return hero ? `<section>${this.renderBlock(hero) || ''}</section>` : '';
        } catch (_) { return ''; }
      },

      // ===== แกลเลอรี / สไลด์โชว์ (บล็อก Gallery) =====
      // HTML + escape อยู่ฝั่งเซิร์ฟเวอร์ (Helpers/CmsGalleryBlock) — ตรงนี้อ่านแค่ data-* แล้วติดพฤติกรรม ไม่ประกอบ HTML จากคอนฟิกเอง
      initGalleries(root) {
        (this._galleryTimers || []).forEach(t => clearInterval(t));
        this._galleryTimers = [];
        const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        root.querySelectorAll('[data-gallery="slider"]').forEach(sec => {
          const track = sec.querySelector('.cms-slider-track');
          const slides = Array.from(sec.querySelectorAll('.cms-slide'));
          const dots = Array.from(sec.querySelectorAll('.cms-slider-dot'));
          if (!track || slides.length === 0) return;
          let idx = 0;
          const mark = (i) => { idx = i; dots.forEach((d, k) => { d.classList.toggle('active', k === i); d.setAttribute('aria-current', k === i ? 'true' : 'false'); }); };
          const go = (i) => {
            const n = ((i % slides.length) + slides.length) % slides.length;
            track.scrollTo({ left: n * track.clientWidth, behavior: reduceMotion ? 'auto' : 'smooth' }); // สไลด์กว้าง 100% ของ track
            mark(n);
          };
          sec.querySelector('.cms-slider-prev')?.addEventListener('click', () => go(idx - 1));
          sec.querySelector('.cms-slider-next')?.addEventListener('click', () => go(idx + 1));
          dots.forEach(d => d.addEventListener('click', () => go(parseInt(d.dataset.slide, 10) || 0)));
          track.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
            if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1); }
          });
          // ปัดด้วยนิ้ว/ลากสกรอลล์ → อัปเดตจุดตามสไลด์ที่อยู่กลางจอ
          let st = null;
          track.addEventListener('scroll', () => {
            clearTimeout(st);
            st = setTimeout(() => mark(Math.round(track.scrollLeft / Math.max(1, track.clientWidth))), 80);
          }, { passive: true });
          mark(0);
          // autoplay: หยุดเมื่อเมาส์ชี้/โฟกัสอยู่ หรือผู้ใช้ตั้ง reduce-motion (WCAG 2.2.2)
          const interval = Math.max(2000, Math.min(30000, parseInt(sec.dataset.interval, 10) || 5000));
          if (sec.dataset.autoplay === '1' && slides.length > 1 && !reduceMotion) {
            let paused = false;
            ['mouseenter', 'focusin', 'touchstart'].forEach(ev => sec.addEventListener(ev, () => { paused = true; }, { passive: true }));
            ['mouseleave', 'focusout'].forEach(ev => sec.addEventListener(ev, () => { paused = false; }));
            this._galleryTimers.push(setInterval(() => { if (!paused && !document.hidden) go(idx + 1); }, interval));
          }
          if (sec.dataset.lightbox === '1') this._wireGalleryLightbox(sec);
        });
        root.querySelectorAll('[data-gallery="grid"][data-lightbox="1"]').forEach(sec => this._wireGalleryLightbox(sec));
      },

      _wireGalleryLightbox(sec) {
        const links = Array.from(sec.querySelectorAll('a.cms-gallery-link'));
        const items = links.map(a => ({ url: a.getAttribute('href'), caption: a.dataset.caption || '', alt: a.querySelector('img')?.getAttribute('alt') || '' }));
        links.forEach((a, i) => a.addEventListener('click', (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey) return;   // เปิดแท็บใหม่ตามปกติ
          e.preventDefault();
          this.galleryLightbox(items, i, a);
        }));
      },

      galleryLightbox(items, i, opener) {
        if (!items.length) return;
        const n = ((i % items.length) + items.length) % items.length;
        let el = document.getElementById('cmsLb');
        if (!el) {
          el = document.createElement('div');
          el.id = 'cmsLb';
          el.className = 'lg-lb';
          el.setAttribute('role', 'dialog');
          el.setAttribute('aria-modal', 'true');
          el.tabIndex = -1;
          const close = () => { el.remove(); document.removeEventListener('keydown', el._onKey); if (el._opener) el._opener.focus(); };
          el._close = close;
          el._onKey = (e) => {
            if (e.key === 'Escape') close();
            if (e.key === 'ArrowLeft') this.galleryLightbox(el._items, el._idx - 1);
            if (e.key === 'ArrowRight') this.galleryLightbox(el._items, el._idx + 1);
          };
          document.addEventListener('keydown', el._onKey);
          el.addEventListener('click', (ev) => { if (ev.target === el) close(); });
          document.body.appendChild(el);
        }
        el._items = items; el._idx = n;
        if (opener) el._opener = opener;
        const it = items[n];
        el.setAttribute('aria-label', it.caption || it.alt || 'รูปภาพ');
        el.innerHTML = `<img src="${this.esc(it.url)}" alt="${this.esc(it.alt)}">
          ${items.length > 1 ? `<div class="cms-lb-n">${n + 1} / ${items.length}</div>` : ''}
          ${it.caption ? `<div class="cms-lb-cap">${this.esc(it.caption)}</div>` : ''}
          <button type="button" class="lg-lb-x" aria-label="ปิด">✕</button>
          ${items.length > 1 ? `<button type="button" class="lg-lb-p" aria-label="รูปก่อนหน้า">‹</button>
          <button type="button" class="lg-lb-n" aria-label="รูปถัดไป">›</button>` : ''}`;
        el.querySelector('.lg-lb-x').addEventListener('click', () => el._close());
        el.querySelector('.lg-lb-p')?.addEventListener('click', () => this.galleryLightbox(items, n - 1));
        el.querySelector('.lg-lb-n')?.addEventListener('click', () => this.galleryLightbox(items, n + 1));
        el.focus();
      },

      lgLightbox(i) {
        const imgs = this._lgImages || [];
        if (!imgs.length) return;
        this._lgIdx = ((i % imgs.length) + imgs.length) % imgs.length;
        let el = document.getElementById('lgLb');
        if (!el) {
          el = document.createElement('div');
          el.id = 'lgLb';
          el.className = 'lg-lb';
          el.addEventListener('click', (ev) => { if (ev.target.id === 'lgLb') el.remove(); });
          document.body.appendChild(el);
        }
        el.innerHTML = `<img src="${this.esc(imgs[this._lgIdx])}" alt="">
          <button class="lg-lb-x" onclick="document.getElementById('lgLb').remove()">✕</button>
          ${imgs.length > 1 ? `<button class="lg-lb-p" onclick="Store.lgLightbox(${this._lgIdx - 1})">‹</button>
          <button class="lg-lb-n" onclick="Store.lgLightbox(${this._lgIdx + 1})">›</button>` : ''}`;
      },

          ${(rt.amenities||[]).length ? `<div class="lg-meta" style="margin-top:6px">${rt.amenities.map(a => '· ' + this.esc(a)).join(' ')}</div>` : ''}</div>${right}</div>`;

      lgHeroLightbox(i) { this._lgImages = this._lgHero || []; this.lgLightbox(i); },

      // ทุกป้าย (ราคาเริ่มต้น · ความจุ · เด็ก · กติกาห้อง · นโยบายยกเลิก) มาจากเซิร์ฟเวอร์ (LodgingPublicRoomLabels) — หน้านี้แสดงอย่างเดียว
      async renderLodgingRoomsPage(key) {

          ${info.houseRules ? `<div class="lg-sum" style="margin-top:8px"><h3 style="margin:0 0 6px">กติกาที่พัก</h3>

             ${imgs.length > 5 ? `<div style="font-size:13px;margin:-4px 0 8px"><a href="javascript:void(0)" onclick="Store.lgRoomLightbox('${this.jsArg(rt.id)}', 5)">ดูรูปทั้งหมด ${imgs.length} รูป</a></div>` : ''}`

        return `<article class="lg-rd" id="room-${this.esc(rt.slug || rt.id)}">
          <h2>${single ? '' : `<a href="${this.esc(this._lgRoomUrl(rt))}" style="color:inherit;text-decoration:none">`}${this.esc(rt.name)}${single ? '' : '</a>'}</h2>
          ${rt.nameEn && rt.nameEn !== rt.name ? `<div class="lg-meta">${this.esc(rt.nameEn)}</div>` : ''}
          ${gal}
          ${rt.description ? `<div style="line-height:1.75;white-space:pre-wrap;margin:8px 0">${this.esc(rt.description)}</div>` : ''}

            <div>🕑 เช็คอินหลัง ${this.esc(info.checkInTime)} · เช็คเอาต์ก่อน ${this.esc(info.checkOutTime)}</div>
            <div>↩️ นโยบายยกเลิก: ${cancel}</div>
          </div>
          <div class="lg-rd-foot">
            <div>${rt.fromRateLabel ? `<div class="lg-price" style="text-align:left;min-width:0"><div class="amt" style="font-size:20px">${this.esc(rt.fromRateLabel)}</div></div>` : '<b>สอบถามราคา</b>'}
              <small style="color:var(--text-secondary)">ราคาจริงตามวันที่เลือก</small></div>
            ${action}
          </div>
        </article>`;
      },

      async lodgingSearch() {
        const st = this._lgState;
        st.checkIn = document.getElementById('lgIn')?.value || st.checkIn;
        st.checkOut = document.getElementById('lgOut')?.value || st.checkOut;
        st.adults = +(document.getElementById('lgAdults')?.value || st.adults);
        st.children = +(document.getElementById('lgChildren')?.value || st.children);
        st.infants = +(document.getElementById('lgInfants')?.value || st.infants);
        st.rooms = +(document.getElementById('lgRooms')?.value || st.rooms);
        if (!st.checkIn || !st.checkOut) { this._toast('กรุณาเลือกวันเข้าพัก'); return; }
        // เตือนทันทีบนจอ (เซิร์ฟเวอร์ปฏิเสธเองอยู่แล้ว — ValidateDates) · ไม่ส่งคำขอที่รู้ว่าตก
        if (st.checkOut <= st.checkIn) { this._toast('วันเช็คเอาต์ต้องหลังวันเช็คอิน'); return; }
        // ฟอร์มค้นหาบนหน้าอื่น (บล็อกปฏิทินจองบนหน้าแรก) ⇒ ไปหน้าจองพร้อมค่าที่เลือก (W-07 — เดิมค่าหายต้องเลือกใหม่)
        if (!document.getElementById('lgResults')) {
          location.href = this._pageUrlQuery('booking', { checkIn: st.checkIn, checkOut: st.checkOut, adults: st.adults, children: st.children, infants: st.infants, rooms: st.rooms, roomType: st.preferRoomType || '' });
          return;
        }
        const box = document.getElementById('lgResults');
        box.innerHTML = '<div class="sf-loader">กำลังค้นหาห้องว่าง...</div>';
        try {
          const r = await fetch(this._lurl('/search'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ checkIn: st.checkIn + 'T00:00:00', checkOut: st.checkOut + 'T00:00:00', adults: st.adults, children: st.children, infants: st.infants, rooms: st.rooms, ratePlanId: st.ratePlanId }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'ค้นหาไม่สำเร็จ');
          st.results = j.data || [];
          st.sel = {}; st.roomGuests = {}; st.guestTouched = {}; st.quote = null;
          const info = await this.lodgingInfo();
          const byId = Object.fromEntries((info.roomTypes||[]).map(rt => [rt.id, rt]));
          box.innerHTML = st.results.length ? st.results.map(res => this._roomCard(byId[res.roomTypeId] || res, res)).join('') : '<div class="sf-loader">ไม่มีห้องเปิดขาย</div>';
          document.getElementById('lgBookBox').innerHTML = '';
          await this._lgApplyPreferredRoom();
        } catch (e) { box.innerHTML = `<div class="sf-loader" style="color:#DC2626">${this.esc(e.message)}</div>`; }
      },
      // ห้องที่แขกกด "จองห้องนี้" มา ⇒ เลือกให้ 1 ห้องหลังค้นหาครั้งแรกที่ห้องนั้นว่าง (ครั้งเดียว — หลังจากนั้นค่าที่แขกเลือกเองชนะ ·
      // ห้ามเลือกทับทุกครั้งที่ค้นหาใหม่) · ไม่ว่าง ⇒ บอกตรง ๆ ให้เปลี่ยนวัน/ห้อง (ไม่เลือกห้องอื่นแทนเงียบ ๆ)
      async _lgApplyPreferredRoom() {
        const st = this._lgState; const id = st.preferRoomType;
        if (!id || st.preferApplied) return;
        const card = document.getElementById('lgRoom-' + id);
        const res = (st.results || []).find(x => String(x.roomTypeId) === String(id));
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (!res || res.unavailableReason || !(res.availableRooms > 0)) {
          this._toast('ห้องที่เลือกไม่ว่างในวันที่นี้ — ลองเปลี่ยนวันเข้าพัก หรือเลือกห้องอื่น');
          return;
        }
        st.preferApplied = true;
        await this.lodgingSelectRoom(id, 1);
        const sel = document.querySelector(`#lgRoom-${CSS.escape(String(id))} select`);
        if (sel) sel.value = '1';
      },
      lodgingPickPlan(id) { this._lgState.ratePlanId = this._lgState.ratePlanId === id ? null : id; this.lodgingSearch(); },
      async lodgingSelectRoom(roomTypeId, n) {
        this._lgState.sel[roomTypeId] = +n;
        this._syncRoomGuests();
        await this.lodgingQuote();
      },
      // ห้องที่เลือกทั้งหมด → ผู้เข้าพักตั้งต้นต่อห้อง (แบ่งจากจำนวนที่ค้นหา) · ห้องที่แขกตั้งเองแล้วคงค่าแขก (ไม่ใช่ "ใครมาก่อนชนะ")
      _roomKeys() {
        const keys = [];
        for (const [rtId, n] of Object.entries(this._lgState.sel)) for (let i = 0; i < n; i++) keys.push({ key: `${rtId}:${i}`, rtId, idx: i });
        return keys;
      },
      // แบบจำลองเดียวกับเซิร์ฟเวอร์ (Helpers/LodgingOccupancy · ข้อ 123/124): adults = ผู้ใหญ่บนเตียงปกติ (≤ maxAdults) · extraBeds = คนเสริม
      // (คนละคน ไม่ซ้อนนับ) ⇒ ค่าแบ่งอัตโนมัติ: ผู้ใหญ่ที่เกิน maxAdults ย้ายเป็นคนเสริม (ไม่เกิน maxExtraBeds · เฉพาะห้องที่เปิดเตียงเสริม) ·
      // ที่ยังเกินคงไว้ในผู้ใหญ่ ⇒ เซิร์ฟเวอร์ตอบข้อความใน quote (ไม่ตัดทิ้งเงียบ)
      _syncRoomGuests() {
        const st = this._lgState; const keys = this._roomKeys();
        const byId = Object.fromEntries(((this._lodging && this._lodging.roomTypes) || []).map(rt => [String(rt.id), rt]));
        const adults = this._splitGuests(st.adults, keys.length, 1), kids = this._splitGuests(st.children, keys.length, 0);
        const next = {};
        keys.forEach((k, i) => {
          if (st.guestTouched[k.key] && st.roomGuests[k.key]) { next[k.key] = st.roomGuests[k.key]; return; }
          const rt = byId[String(k.rtId)];
          let a = adults[i], xb = 0;
          if (rt) {
            const maxA = Math.max(1, (rt.maxAdults | 0) || 1);
            const maxXb = rt.allowExtraBed ? Math.max(0, rt.maxExtraBeds | 0) : 0;
            if (a > maxA) { xb = Math.min(a - maxA, maxXb); a -= xb; }
          }
          next[k.key] = { adults: a, children: kids[i], extraBeds: xb };
        });
        st.roomGuests = next;
      },
      async lodgingSetGuest(key, field, v) {
        const st = this._lgState; const g = st.roomGuests[key];

      async lodgingSetInfants(v) { this._lgState.infants = Math.max(0, parseInt(v, 10) || 0); await this.lodgingQuote(false); },
      // ตัวเลือกผู้เข้าพักรายห้อง (ข้อ 123/124): ผู้ใหญ่ 1..maxAdults · คนเสริมช่องแยก 0..maxExtraBeds (เฉพาะห้องที่เปิดเตียงเสริม · ป้ายราคา
      // extraBedSummary จากเซิร์ฟเวอร์) · เด็กไม่นับความจุ — ตัวเลือกเป็นแค่ช่วงบนฟอร์ม **เซิร์ฟเวอร์เป็นผู้ตัดสินความจุและราคา** (ผล quote)
      _roomGuestPanel(info) {
        const st = this._lgState; const keys = this._roomKeys();
        if (!keys.length) return '';
        const byId = Object.fromEntries((info.roomTypes || []).map(rt => [String(rt.id), rt]));
