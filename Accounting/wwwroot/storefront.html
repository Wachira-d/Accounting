      async _loadSlots(serviceId) {
        const date = document.getElementById('sfBookDate').value;
        const box = document.getElementById('sfSlots');
        box.innerHTML = '<div style="color:var(--text-secondary);grid-column:1/-1">กำลังค้นหาเวลาว่าง...</div>';
        try {
          // DTO field names: BookingServiceId + Date (DateTime). System.Text.Json
          // accepts camelCase via JsonNamingPolicy. Date is sent as ISO so the
          // server parses it as local midnight regardless of tz.
          const r = await fetch(this._url('/storefront/booking-services/available-slots'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bookingServiceId: serviceId, date: date + 'T00:00:00' })
          });
          const slots = (await r.json()).data || [];
          if (!slots.length) {
            box.innerHTML = '<div style="color:var(--text-secondary);grid-column:1/-1">ไม่มีเวลาว่างในวันนี้ — ลองเลือกวันอื่น</div>';
            return;
          }
          // Server returns StartTime as a string "HH:mm" — render directly.
          box.innerHTML = slots.map(s => {
            const t = String(s.startTime || '').slice(0, 5);
            return `<button onclick="Store._pickSlot('${this.jsArg(s.startTime)}', this)" style="padding:10px;background:#F3F4F6;border:1px solid #E5E7EB;border-radius:6px;cursor:pointer;font-weight:600">${this.esc(t)}</button>`;
          }).join('');
        } catch(_) {
          box.innerHTML = '<div style="color:#DC2626;grid-column:1/-1">โหลดเวลาไม่สำเร็จ</div>';
        }
      },

      _pickSlot(startTime, btn) {
        document.getElementById('sfSlotStart').value = startTime;
        document.getElementById('sfBookForm').style.display = 'grid';
        document.querySelectorAll('#sfSlots button').forEach(b => {
          b.style.background = '#F3F4F6'; b.style.color = '';
        });
        if (btn) { btn.style.background = 'var(--primary,#4F46E5)'; btn.style.color = '#fff'; }
      },

      async _submitBooking() {
        const form = document.getElementById('sfBookForm');
        const fd = new FormData(form);
        if (!fd.get('slotStart')) { alert('กรุณาเลือกเวลา'); return; }
        const bookingDate = document.getElementById('sfBookDate').value; // yyyy-mm-dd
        // DTO contract (CreateBookingRequest): BookingServiceId, BookingDate
        // (DateTime), StartTime (string "HH:mm"), guest fields.
        const body = {
          bookingServiceId: fd.get('serviceId'),
          bookingDate: bookingDate + 'T00:00:00',
          startTime: fd.get('slotStart'),
          guestName: fd.get('customerName'),
          guestPhone: fd.get('customerPhone'),
          guestEmail: fd.get('customerEmail') || null,
          customerNotes: fd.get('notes') || null,
          guestCount: 1
        };
        try {
          const r = await fetch(this._url('/booking/bookings'), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (!r.ok) throw new Error('จองไม่สำเร็จ — ลองอีกครั้ง');
          const booking = (await r.json()).data;
          document.getElementById('sfBookingModal').innerHTML = `
            <div style="background:#fff;border-radius:12px;max-width:480px;padding:32px;text-align:center">
              <div style="font-size:64px">✅</div>
              <h2>จองสำเร็จ</h2>
              <p style="color:var(--text-secondary);margin:14px 0">เลขที่การจอง: <strong>${this.esc(booking.bookingNumber || booking.id)}</strong></p>
              <p style="color:var(--text-secondary)">เราจะส่งข้อความยืนยันให้ภายในไม่นาน</p>
              <button onclick="document.getElementById('sfBookingModal').remove()" class="btn btn-primary" style="margin-top:14px;padding:12px 28px">ปิด</button>
            </div>`;
        } catch (e) { alert(e.message); }
      },

      _toast(msg, action) {
        const t = document.createElement('div');
        t.style.cssText = 'position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:14px 22px;border-radius:8px;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;cursor:pointer;max-width:90vw';
        t.textContent = msg;
        if (action) t.onclick = () => { action(); t.remove(); };
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }
    });

    // ═══════════════ ที่พัก (Lodging) — ค้นหาห้องว่าง → เลือกแผนราคา/บริการเสริม → จอง → ดู/อัปโหลดสลิป/ยกเลิกด้วย token ═══════════════
    // ราคาทุกตัวเลขมาจากเซิร์ฟเวอร์ (search/quote) — หน้าเว็บแสดงอย่างเดียว ห้ามคำนวณเอง (กติกา "resolver กลาง")
    Object.assign(Store, {
      _lodging: undefined,
      _lgState: { checkIn: '', checkOut: '', adults: 2, children: 0, rooms: 1, sel: {}, extras: {}, ratePlanId: null, results: [], quote: null },
      _lurl(path) { return this._url('/lodging' + path); },
      async lodgingInfo() {
        if (this._lodging !== undefined) return this._lodging;
        try {
          const r = await fetch(this._lurl('/info'));
          this._lodging = r.ok ? ((await r.json()).data || null) : null;
        } catch (_) { this._lodging = null; }
        return this._lodging;
      },
      _money(n) { return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
      _dateTh(d) { try { return new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (_) { return d; } },
      _todayIso(offset = 0) { const d = new Date(); d.setDate(d.getDate() + offset); return d.toISOString().slice(0, 10); },

      lodgingSearchForm(info) {
        const st = this._lgState;
        const ci = st.checkIn || this._todayIso(1), co = st.checkOut || this._todayIso(2);
        return `<div class="lg-search">
          <div><label>เช็คอิน</label><input type="date" class="lg-input" id="lgIn" value="${ci}" min="${this._todayIso(0)}"></div>
          <div><label>เช็คเอาต์</label><input type="date" class="lg-input" id="lgOut" value="${co}" min="${this._todayIso(1)}"></div>
          <div><label>ผู้ใหญ่</label><select class="lg-input" id="lgAdults">${[1,2,3,4,5,6].map(n=>`<option ${n===st.adults?'selected':''}>${n}</option>`).join('')}</select></div>
          <div><label>เด็ก (≤${info.childMaxAge} ปี)</label><select class="lg-input" id="lgChildren">${[0,1,2,3,4].map(n=>`<option ${n===st.children?'selected':''}>${n}</option>`).join('')}</select></div>
          <div><label>จำนวนห้อง</label><select class="lg-input" id="lgRooms">${[1,2,3,4,5].map(n=>`<option ${n===st.rooms?'selected':''}>${n}</option>`).join('')}</select></div>
          <div><button class="btn btn-primary" style="width:100%" onclick="Store.lodgingSearch()">🔍 ค้นหาห้องว่าง</button></div>
          <div style="grid-column:1/-1;font-size:12px;color:var(--text-secondary)">เช็คอิน ${this.esc(info.checkInTime)} · เช็คเอาต์ ${this.esc(info.checkOutTime)} · ${info.pricesIncludeVat ? 'ราคารวมภาษีแล้ว' : 'ราคายังไม่รวม VAT'}${info.serviceChargePercent > 0 ? ` · service charge ${info.serviceChargePercent}%` : ''} · ${info.onlineBookingEnabled ? 'จองออนไลน์ได้ทันที' : 'รับจองผ่านเจ้าหน้าที่'}</div>
        </div>`;
      },

      async renderLodgingSearch() {
        const info = await this.lodgingInfo();
        const main = document.getElementById('sfMain');
        document.title = `จองห้องพัก — ${info?.name || ''}`;
        if (!info) { main.innerHTML = '<div class="sf-loader">เว็บไซต์นี้ยังไม่มีที่พักเปิดให้จอง</div>'; return; }
        // หน้า CMS ที่ slug เดียวกัน (rooms/booking ที่เทมเพลต seed ไว้) — วาด Hero ของมันไว้บนสุด
        // ให้เจ้าของแก้หัวเรื่องจาก cms-edit ได้ (เดิมหน้านั้นถูกแทนทั้งหน้า แก้อะไรก็ไม่มีผล = silent no-op)
        const cmsHero = await this.lodgingCmsHero();
        // ⚠️ payload ของ /lodging/info มี 30 ฟิลด์ (แกลเลอรี · สิ่งอำนวยความสะดวก ·
        // คำอธิบาย · แผนที่ · ติดต่อ) แต่เดิมหน้านี้วาดแค่ ชื่อ+ดาว+ที่อยู่ ⇒ ของที่
        // ที่พักกรอกไว้ไม่เคยถูกแสดงเลย (defect class "เก็บแล้วไม่ echo กลับ")
        const gallery = (info.images || []).filter(Boolean);
        const hero = gallery.length
          ? `<div class="lg-gallery">${gallery.slice(0, 6).map((u, i) => `<img src="${this.esc(u)}" alt="${this.esc(info.name)}"
                 loading="lazy" onclick="Store.lgHeroLightbox(${i})">`).join('')}</div>` : '';
        // เก็บแยกจาก _lgImages (ชุดที่ lightbox กำลังแสดง) — ไม่งั้นเปิดรูปห้องแล้ว
        // กลับมากดรูปที่พักจะได้รูปห้องแทน (ตัวแปรเดียวถือสองความหมาย = บั๊กแน่นอน)
        this._lgHero = gallery;
        const amen = (info.amenities || []).filter(Boolean);
        // ปิดรับจองออนไลน์ = ซ่อนฟอร์มแล้วบอกช่องทางติดต่อ — ห้ามให้กรอกจนจบ
        // แล้วไปตายที่เซิร์ฟเวอร์ (เดิมด่านอยู่ฝั่งเซิร์ฟเวอร์อย่างเดียว)
        const contact = [info.phone ? `โทร ${this.esc(info.phone)}` : '',
                         info.lineId ? `LINE ${this.esc(info.lineId)}` : '',
                         info.email ? this.esc(info.email) : ''].filter(Boolean).join(' · ');
        const searchArea = info.onlineBookingEnabled
          ? `<div id="lgSearchBox">${this.lodgingSearchForm(info)}</div>`
          : `<div class="lg-sum"><b>ที่พักนี้ยังไม่เปิดรับจองออนไลน์</b>
               <div style="margin-top:6px;font-size:14px">กรุณาติดต่อที่พักโดยตรงเพื่อสอบถามห้องว่าง${contact ? ' — ' + contact : ''}</div></div>`;

        main.innerHTML = `${cmsHero}<div class="sf-container" style="padding:32px 20px">
          <h1 style="margin-bottom:6px">${this.esc(info.name)}</h1>
          <div style="color:var(--text-secondary);margin-bottom:14px">${'★'.repeat(info.starRating||0)} ${this.esc(info.address||'')}${contact ? ' · ' + contact : ''}</div>
          ${hero}
          ${info.description ? `<div style="margin:14px 0;line-height:1.75;white-space:pre-wrap">${this.esc(info.description)}</div>` : ''}
          ${amen.length ? `<div class="lg-amen">${amen.map(a => `<span>${this.esc(a)}</span>`).join('')}</div>` : ''}
          ${info.mapUrl ? `<div style="margin:10px 0"><a href="${this.esc(info.mapUrl)}" target="_blank" rel="noopener" class="btn">📍 ดูแผนที่</a></div>` : ''}
          ${searchArea}
          <div id="lgResults" style="margin-top:24px">${(info.roomTypes||[]).map(rt => this._roomCard(rt, null)).join('')}</div>
          <div id="lgBookBox"></div>
          ${info.houseRules ? `<div class="lg-sum" style="margin-top:24px"><h3 style="margin:0 0 6px">กติกาที่พัก</h3>
            <div style="white-space:pre-wrap;font-size:13px;color:var(--text-secondary)">${this.esc(info.houseRules)}</div></div>` : ''}
        </div>`;
        if (info.onlineBookingEnabled && this._lgState.checkIn) await this.lodgingSearch();
      },

      // Hero block ของหน้า CMS ที่ slug ตรงกับหน้าจองที่พัก (rooms/booking) — เฉพาะ Hero:
      // เนื้อหาอื่น (รายการห้อง/ฟอร์ม) ระบบจองห้องวาดจากข้อมูลจริงอยู่แล้ว ไม่ซ้อน
      async lodgingCmsHero() {
        try {
          const { companyId, siteId } = this._ctx || {};
          if (!companyId || !siteId || !this.slug) return '';
          const res = await fetch(`/api/companies/${companyId}/cms/sites/${siteId}/storefront/pages/${encodeURIComponent(this.slug)}?lang=${this.lang}`);
          if (!res.ok) return '';
          const json = await res.json();
          const page = json.data || json;
          const hero = (page?.blocks || []).filter(b => b.isVisible !== false).sort((a, b) => a.sortOrder - b.sortOrder)
            .find(b => b.blockType === 'Hero' || b.blockType === 1);
          return hero ? `<section>${this.renderBlock(hero) || ''}</section>` : '';
        } catch (_) { return ''; }
      },

      lgLightbox(i) {
        const imgs = this._lgImages || [];
        if (!imgs.length) return;
        this._lgIdx = ((i % imgs.length) + imgs.length) % imgs.length;
        let el = document.getElementById('lgLb');
        if (!el) {
          el = document.createElement('div');
          el.id = 'lgLb';
          el.className = 'lg-lb';
          el.addEventListener('click', (ev) => { if (ev.target.id === 'lgLb') el.remove(); });
          document.body.appendChild(el);
        }
        el.innerHTML = `<img src="${this.esc(imgs[this._lgIdx])}" alt="">
          <button class="lg-lb-x" onclick="document.getElementById('lgLb').remove()">✕</button>
          ${imgs.length > 1 ? `<button class="lg-lb-p" onclick="Store.lgLightbox(${this._lgIdx - 1})">‹</button>
          <button class="lg-lb-n" onclick="Store.lgLightbox(${this._lgIdx + 1})">›</button>` : ''}`;
      },

      _roomCard(rt, res) {
        // รูปหลายใบต่อประเภทห้อง — เดิมวาดแค่ images[0] ทั้งที่เก็บได้ไม่จำกัด
        const rimgs = (rt.images || []).filter(Boolean);
        const img = rimgs.length
          ? `<img src="${this.esc(rimgs[0])}" alt="${this.esc(rt.name)}" loading="lazy"
               onclick="Store.lgRoomLightbox('${this.jsArg(rt.id)}')" style="cursor:zoom-in">
             ${rimgs.length > 1 ? `<span class="lg-imgn">+${rimgs.length - 1}</span>` : ''}`
          : '<div class="lg-noimg"></div>';
        const st = this._lgState;
        const meta = `${rt.sizeSqm ? rt.sizeSqm + ' ตรม. · ' : ''}${rt.bedType ? this.esc(rt.bedType) + ' · ' : ''}พักได้ ${rt.maxOccupancy} คน${rt.viewType ? ' · ' + this.esc(rt.viewType) : ''}${(res ? res.includesBreakfast : rt.includesBreakfast) ? ' · 🍳 รวมอาหารเช้า' : ''}`;
        let right;
        if (!res) right = `<div class="lg-price"><div class="amt">฿${this._money(rt.baseRate)}</div><small>ต่อคืน (ราคาเริ่มต้น)</small></div>`;
        else {
          const nights = res.nights?.length || 0;
          const sel = st.sel[rt.id] || 0;
          const plans = (res.ratePlans || []).map(p => `<div class="lg-plan ${st.ratePlanId === p.ratePlanId ? 'sel' : ''}" onclick="Store.lodgingPickPlan('${p.ratePlanId}')">
              <span>${this.esc(p.name)}${p.includesBreakfast ? ' 🍳' : ''}${!p.isRefundable ? ' <span class="lg-badge bad">ไม่คืนเงิน</span>' : ''}</span><b>฿${this._money(p.pricePerRoom)}</b></div>`).join('');
          right = `<div class="lg-price"><div class="amt">฿${this._money(res.pricePerRoom)}</div><small>ต่อห้อง · ${nights} คืน (เฉลี่ย ฿${this._money(res.averageNightlyRate)}/คืน)</small>
            <div style="margin:4px 0">${(res.nights||[]).slice(0,7).map(n => `<span class="lg-night" title="${this.esc(n.seasonName||'')}">${new Date(n.date).getDate()}: ${Number(n.rate).toLocaleString('th-TH')}</span>`).join('')}${nights > 7 ? '<span class="lg-night">…</span>' : ''}</div>
            ${plans}
            ${res.unavailableReason ? `<div style="margin-top:8px"><span class="lg-badge bad">${this.esc(res.unavailableReason)}</span></div>` :
              `<div style="margin-top:8px"><span class="lg-badge ok">ว่าง ${res.availableRooms} ห้อง</span>
               <select class="lg-input" style="width:auto;display:inline-block;margin-left:6px" onchange="Store.lodgingSelectRoom('${rt.id}', this.value)">${Array.from({length: Math.min(res.availableRooms, 5) + 1}, (_, i) => `<option value="${i}" ${i===sel?'selected':''}>${i === 0 ? 'เลือกจำนวนห้อง' : i + ' ห้อง'}</option>`).join('')}</select></div>`}
          </div>`;
        }
        return `<div class="lg-room" id="lgRoom-${rt.id}">${img}<div><h3>${this.esc(rt.name)}</h3><div class="lg-meta">${meta}</div><div style="font-size:14px">${this.esc(rt.description||'')}</div>
          ${(rt.amenities||[]).length ? `<div class="lg-meta" style="margin-top:6px">${rt.amenities.map(a => '· ' + this.esc(a)).join(' ')}</div>` : ''}</div>${right}</div>`;
      },

      lgHeroLightbox(i) { this._lgImages = this._lgHero || []; this.lgLightbox(i); },
      lgRoomLightbox(roomTypeId) {
        const info = this._lodging;
        const rt = (info?.roomTypes || []).find(x => String(x.id) === String(roomTypeId));
        if (!rt || !(rt.images || []).length) return;
        this._lgImages = rt.images.filter(Boolean);
        this.lgLightbox(0);
      },

      async lodgingSearch() {
        const st = this._lgState;
        st.checkIn = document.getElementById('lgIn')?.value || st.checkIn;
        st.checkOut = document.getElementById('lgOut')?.value || st.checkOut;
        st.adults = +(document.getElementById('lgAdults')?.value || st.adults);
        st.children = +(document.getElementById('lgChildren')?.value || st.children);
        st.rooms = +(document.getElementById('lgRooms')?.value || st.rooms);
        if (!st.checkIn || !st.checkOut) { this._toast('กรุณาเลือกวันเข้าพัก'); return; }
        if (!document.getElementById('lgResults')) { location.href = this._pageUrl('booking'); return; }
        const box = document.getElementById('lgResults');
        box.innerHTML = '<div class="sf-loader">กำลังค้นหาห้องว่าง...</div>';
        try {
          const r = await fetch(this._lurl('/search'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ checkIn: st.checkIn + 'T00:00:00', checkOut: st.checkOut + 'T00:00:00', adults: st.adults, children: st.children, rooms: st.rooms, ratePlanId: st.ratePlanId }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'ค้นหาไม่สำเร็จ');
          st.results = j.data || [];
          st.sel = {}; st.quote = null;
          const info = await this.lodgingInfo();
          const byId = Object.fromEntries((info.roomTypes||[]).map(rt => [rt.id, rt]));
          box.innerHTML = st.results.length ? st.results.map(res => this._roomCard(byId[res.roomTypeId] || res, res)).join('') : '<div class="sf-loader">ไม่มีห้องเปิดขาย</div>';
          document.getElementById('lgBookBox').innerHTML = '';
        } catch (e) { box.innerHTML = `<div class="sf-loader" style="color:#DC2626">${this.esc(e.message)}</div>`; }
      },
      lodgingPickPlan(id) { this._lgState.ratePlanId = this._lgState.ratePlanId === id ? null : id; this.lodgingSearch(); },
      async lodgingSelectRoom(roomTypeId, n) {
        this._lgState.sel[roomTypeId] = +n;
        await this.lodgingQuote();
      },
      _quoteBody() {
        const st = this._lgState;
        const rooms = [];
        for (const [rtId, n] of Object.entries(st.sel)) for (let i = 0; i < n; i++) rooms.push({ roomTypeId: rtId, adults: Math.max(1, Math.ceil(st.adults / Math.max(1, Object.values(st.sel).reduce((a,b)=>a+b,0)))), children: i === 0 ? st.children : 0, extraBeds: 0 });
        const extras = Object.entries(st.extras).filter(([,q]) => q > 0).map(([extraId, quantity]) => ({ extraId, quantity }));
        return { checkIn: st.checkIn + 'T00:00:00', checkOut: st.checkOut + 'T00:00:00', rooms, extras, ratePlanId: st.ratePlanId };
      },
      async lodgingQuote() {
        const st = this._lgState; const info = await this.lodgingInfo();
        const box = document.getElementById('lgBookBox');
        const body = this._quoteBody();
        if (!body.rooms.length) { box.innerHTML = ''; return; }
        try {
          const r = await fetch(this._lurl('/quote'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'คำนวณราคาไม่สำเร็จ');
          st.quote = j.data;
          box.innerHTML = this._bookForm(info, st.quote);
          box.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) { box.innerHTML = `<div class="sf-loader" style="color:#DC2626">${this.esc(e.message)}</div>`; }
      },
      _bookForm(info, q) {
        const st = this._lgState;
        const extras = (info.extras||[]).map(x => `<label style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px">
            <span>${this.esc(x.name)} <small style="color:var(--text-secondary)">฿${this._money(x.price)} ${({1:'/การเข้าพัก',2:'/คืน',3:'/คน',4:'/คน/คืน'})[x.priceMode]||''}</small></span>
            <select class="lg-input" style="width:80px" onchange="Store.lodgingSetExtra('${x.id}', this.value)">${Array.from({length: (x.maxQuantity||5)+1}, (_, i) => `<option value="${i}" ${(st.extras[x.id]||0)===i?'selected':''}>${i}</option>`).join('')}</select></label>`).join('');
        const errs = (q.errors||[]).map(e => `<div class="lg-badge bad" style="margin:2px 0">${this.esc(e)}</div>`).join('');
        return `<div style="display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:24px" class="lg-book">
          <form id="lgBookForm" onsubmit="Store.lodgingSubmit(event)" style="display:grid;gap:10px;background:#fff;border:1px solid #E5E7EB;border-radius:var(--radius,8px);padding:18px">
            <h3 style="margin:0">ข้อมูลผู้เข้าพัก</h3>
            <div><label>ชื่อ-นามสกุล *</label><input name="guestName" class="lg-input" required maxlength="200"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div><label>เบอร์โทร *</label><input name="guestPhone" class="lg-input" required maxlength="30"></div>
              <div><label>อีเมล</label><input type="email" name="guestEmail" class="lg-input" maxlength="200"></div>
            </div>
            ${info.requireGuestIdNumber ? '<div><label>เลขบัตรประชาชน/พาสปอร์ต *</label><input name="guestIdNumber" class="lg-input" required maxlength="30"></div>' : ''}
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <div><label>เวลาที่คาดว่าจะถึง</label><input name="arrivalTime" class="lg-input" placeholder="เช่น 18:30" maxlength="20"></div>
              <div><label>สัญชาติ</label><input name="guestNationality" class="lg-input" maxlength="60"></div>
            </div>
            <div><label>คำขอพิเศษ</label><textarea name="specialRequests" class="lg-input" rows="2" maxlength="1000"></textarea></div>
            <details><summary style="cursor:pointer;font-size:14px">ขอใบกำกับภาษีในนามบริษัท</summary>
              <div style="display:grid;gap:8px;margin-top:8px"><input name="guestCompanyName" class="lg-input" placeholder="ชื่อบริษัท"><input name="guestTaxId" class="lg-input" placeholder="เลขประจำตัวผู้เสียภาษี 13 หลัก" maxlength="13"><input name="guestAddress" class="lg-input" placeholder="ที่อยู่"></div></details>
            ${extras ? `<h3 style="margin:8px 0 0">บริการเสริม</h3>${extras}` : ''}
            ${info.houseRules ? `<label style="font-size:13px;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="acceptHouseRules" required style="margin-top:3px"><span>ยอมรับกติกาที่พัก:<br><span style="white-space:pre-wrap;color:var(--text-secondary)">${this.esc(info.houseRules)}</span></span></label>` : ''}
            <button type="submit" class="btn btn-primary" style="padding:14px" ${errs ? 'disabled' : ''}>ยืนยันการจอง${q.depositRequired > 0 ? ` · มัดจำ ฿${this._money(q.depositRequired)}` : ''}</button>
          </form>
          <div class="lg-sum">
            <h3 style="margin:0 0 8px">สรุปการจอง</h3>
            <div style="font-size:13px;color:var(--text-secondary)">${this._dateTh(q.checkIn)} → ${this._dateTh(q.checkOut)} · ${q.nights} คืน${q.ratePlanName ? ' · ' + this.esc(q.ratePlanName) : ''}</div>
            ${(q.rooms||[]).map(r => `<div class="row"><span>${this.esc(r.roomTypeName)} (${r.adults} ผู้ใหญ่${r.children ? ' ' + r.children + ' เด็ก' : ''})</span><span>฿${this._money(r.subtotal)}</span></div>`).join('')}
            ${(q.extras||[]).map(e => `<div class="row"><span>${this.esc(e.name)} ×${e.quantity}</span><span>฿${this._money(e.total)}</span></div>`).join('')}
            ${q.serviceChargeAmount > 0 ? `<div class="row"><span>Service charge</span><span>฿${this._money(q.serviceChargeAmount)}</span></div>` : ''}
            ${q.vatAmount > 0 ? `<div class="row" style="color:var(--text-secondary)"><span>${q.pricesIncludeVat ? 'รวม VAT' : 'VAT'} ${q.vatRate}%</span><span>฿${this._money(q.vatAmount)}</span></div>` : ''}
            <div class="row total"><span>ยอดรวม</span><span>฿${this._money(q.totalAmount)}</span></div>
            ${q.depositRequired > 0 ? `<div class="row"><span>มัดจำที่ต้องชำระ</span><b>฿${this._money(q.depositRequired)}</b></div>` : '<div class="row"><span>ไม่ต้องชำระมัดจำ</span><span>ยืนยันทันที</span></div>'}
            ${q.cancellationPolicyName ? `<div style="font-size:12px;margin-top:8px;color:var(--text-secondary)">นโยบายยกเลิก: <b>${this.esc(q.cancellationPolicyName)}</b>${q.nonRefundable ? ' — ไม่คืนเงินทุกกรณี' : ''}<br>${(q.cancellationRules||[]).map(r => `ก่อน ${r.daysBefore} วัน คิด ${r.penaltyPercent}%`).join(' · ')}</div>` : ''}
            ${errs}
          </div></div>`;
      },
      async lodgingSetExtra(id, q) { this._lgState.extras[id] = +q; await this.lodgingQuote(); },
      async lodgingSubmit(ev) {
        ev.preventDefault();
        const form = ev.target; const btn = form.querySelector('button[type=submit]');
        const fd = new FormData(form);
        const body = Object.assign(this._quoteBody(), {
          guestName: fd.get('guestName'), guestPhone: fd.get('guestPhone'), guestEmail: fd.get('guestEmail') || null,
          guestIdNumber: fd.get('guestIdNumber') || null, arrivalTime: fd.get('arrivalTime') || null, guestNationality: fd.get('guestNationality') || null,
          specialRequests: fd.get('specialRequests') || null, guestCompanyName: fd.get('guestCompanyName') || null,
          guestTaxId: fd.get('guestTaxId') || null, guestAddress: fd.get('guestAddress') || null, acceptHouseRules: fd.get('acceptHouseRules') === 'on',
        });
        btn.disabled = true; btn.textContent = 'กำลังจอง...';
        try {
          const r = await fetch(this._lurl('/reservations'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'จองไม่สำเร็จ');
          const res = j.data;
          this._lgState.sel = {}; this._lgState.extras = {};
          const url = this._pageUrl('reservation/' + res.publicToken);
          history.pushState({}, '', url);
          await this.renderLodgingReservation(res.publicToken, j.message);
        } catch (e) { this._toast('❌ ' + e.message); btn.disabled = false; btn.textContent = 'ยืนยันการจอง'; }
      },

      async renderLodgingReservation(token, banner) {
        const main = document.getElementById('sfMain');
        main.innerHTML = '<div class="sf-loader">กำลังโหลดการจอง...</div>';
        let r;
        try {
          const resp = await fetch(this._lurl('/reservations/' + encodeURIComponent(token)));
          const j = await resp.json().catch(() => null);
          if (!resp.ok) throw new Error(j?.message || 'ไม่พบการจอง');
          r = j.data;
        } catch (e) { main.innerHTML = `<div class="sf-loader" style="color:#DC2626">${this.esc(e.message)}</div>`; return; }
        document.title = `การจอง ${r.reservationNumber}`;
        const STATUS = { Pending: ['รอชำระมัดจำ', ''], Confirmed: ['ยืนยันแล้ว', 'ok'], CheckedIn: ['เช็คอินแล้ว', 'info'], CheckedOut: ['เช็คเอาต์แล้ว', 'info'], Cancelled: ['ยกเลิก', 'bad'], NoShow: ['ไม่มาเข้าพัก', 'bad'] };
        const st = STATUS[r.status] || [r.status, ''];
        const info = await this.lodgingInfo();
        const canCancel = r.status === 'Pending' || r.status === 'Confirmed';
        // ปิดรับสลิปแล้ว = ยังจ่ายออนไลน์/ติดต่อที่พักได้ แต่ฟอร์มแนบสลิปต้องหายไป
        // (ห้ามให้กดส่งแล้วไปเจอ error ที่เซิร์ฟเวอร์ — ญาติของ silent no-op)
        const canSlip = (r.status === 'Pending' || (r.status === 'Confirmed' && r.balanceDue > 0))
          && !r.slipUploadBlocked;
        const canPayOnline = r.status === 'Pending' || (r.status === 'Confirmed' && r.balanceDue > 0);
        main.innerHTML = `<div class="sf-container" style="padding:32px 20px;max-width:860px">
          ${banner ? `<div class="lg-badge ok" style="display:block;padding:12px;margin-bottom:14px;font-size:14px">${this.esc(banner)}</div>` : ''}
          <h1 style="margin-bottom:4px">การจอง ${this.esc(r.reservationNumber)} <span class="lg-badge ${st[1]}">${st[0]}</span></h1>
          <div style="color:var(--text-secondary);margin-bottom:18px">${this.esc(r.propertyName)} · เช็คอิน ${this._dateTh(r.checkInDate)} หลัง ${this.esc(r.checkInTime)} · เช็คเอาต์ ${this._dateTh(r.checkOutDate)} ก่อน ${this.esc(r.checkOutTime)} · ${r.nights} คืน</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="lg-book">
            <div class="lg-sum">
              <h3 style="margin:0 0 8px">ห้องพัก</h3>
              ${(r.rooms||[]).map(x => `<div class="row"><span>${this.esc(x.roomTypeName)}${x.unitNumber ? ' ห้อง ' + this.esc(x.unitNumber) : ''} · ${x.adults} ผู้ใหญ่${x.children ? ' ' + x.children + ' เด็ก' : ''}</span><span>฿${this._money(x.subtotal)}</span></div>`).join('')}
              ${(r.extras||[]).map(e => `<div class="row"><span>${this.esc(e.name)} ×${e.quantity}</span><span>฿${this._money(e.total)}</span></div>`).join('')}
              ${r.serviceChargeAmount > 0 ? `<div class="row"><span>Service charge</span><span>฿${this._money(r.serviceChargeAmount)}</span></div>` : ''}
              ${(r.charges||[]).filter(c => c.status !== 'Cancelled').map(c => `<div class="row"><span>${this.esc(c.description)}</span><span>฿${this._money(c.total)}</span></div>`).join('')}
              <div class="row total"><span>ยอดรวม</span><span>฿${this._money(r.grandTotal)}</span></div>
              <div class="row"><span>ชำระแล้ว</span><span>฿${this._money(r.paidAmount)}</span></div>
              <div class="row"><span>คงเหลือ</span><b>฿${this._money(r.balanceDue)}</b></div>
              ${r.status === 'Pending' && r.depositRequired > 0 ? `<div class="row" style="color:#92400E"><span>มัดจำที่ต้องชำระ</span><b>฿${this._money(r.depositRequired)}</b></div>${r.holdExpiresAt ? `<div style="font-size:12px;color:#92400E">กรุณาชำระและอัปโหลดสลิปภายใน ${new Date(r.holdExpiresAt).toLocaleString('th-TH')} มิฉะนั้นระบบจะปล่อยห้อง</div>` : ''}` : ''}
              ${r.cancellationFee > 0 ? `<div class="row"><span>ค่าปรับยกเลิก</span><span>฿${this._money(r.cancellationFee)}</span></div>` : ''}
              ${r.refundAmount > 0 ? `<div class="row"><span>คืนเงิน</span><span>฿${this._money(r.refundAmount)}</span></div>` : ''}
            </div>
            <div class="lg-sum">
              <h3 style="margin:0 0 8px">ผู้เข้าพัก</h3>
              <div>${this.esc(r.guestName)}</div>
              <div style="font-size:13px;color:var(--text-secondary)">${this.esc(r.guestPhone||'')} ${this.esc(r.guestEmail||'')}</div>
              ${r.specialRequests ? `<div style="font-size:13px;margin-top:6px">คำขอพิเศษ: ${this.esc(r.specialRequests)}</div>` : ''}
              ${r.cancellationPolicyName ? `<div style="font-size:12px;margin-top:10px;color:var(--text-secondary)">นโยบายยกเลิก: <b>${this.esc(r.cancellationPolicyName)}</b>${r.nonRefundable ? ' — ไม่คืนเงิน' : ''}<br>${(r.cancellationRules||[]).map(x => `ก่อน ${x.daysBefore} วัน คิด ${x.penaltyPercent}%`).join(' · ')}</div>` : ''}
              ${r.confirmationMessage ? `<div style="font-size:13px;margin-top:10px">${this.esc(r.confirmationMessage)}</div>` : ''}
              <div style="font-size:13px;margin-top:10px">ติดต่อที่พัก: ${this.esc(r.propertyPhone||info?.phone||'')}${r.propertyLineId ? ' · LINE ' + this.esc(r.propertyLineId) : ''}</div>
            </div>
          </div>
          ${canPayOnline ? `<div class="lg-sum" style="margin-top:16px" id="lgPayOnlineBox"></div>` : ''}
          ${r.slipRejectedReason ? `<div class="lg-badge bad" style="display:block;padding:12px;margin-top:14px;font-size:14px">
            ⚠️ สลิปที่ส่งมาไม่ผ่านการตรวจสอบ — ${this.esc(r.slipRejectedReason)}<br>
            <span style="font-weight:400">${r.slipUploadBlocked
              ? 'ที่พักปิดรับสลิปของการจองนี้แล้ว กรุณาชำระออนไลน์ด้านล่าง หรือติดต่อที่พักโดยตรง'
              : 'กรุณาตรวจสอบแล้วส่งสลิปใหม่อีกครั้ง'}</span></div>` : ''}
          ${canSlip ? `<div class="lg-sum" style="margin-top:16px"><h3 style="margin:0 0 8px">📎 ${r.status === 'Pending' ? 'อัปโหลดสลิปมัดจำ' : 'อัปโหลดสลิปชำระเงิน'}</h3>
            ${r.paymentSlipUrl ? `<div class="lg-badge info" style="margin-bottom:8px">ส่งสลิปแล้วเมื่อ ${new Date(r.slipUploadedAt).toLocaleString('th-TH')} — รอที่พักตรวจสอบ ·
              <a href="${this.esc(r.paymentSlipUrl)}" target="_blank" rel="noopener">ดูสลิปที่ส่งไป</a></div>` : ''}
            <form onsubmit="Store.lodgingUploadSlip(event, '${this.esc(token)}')" style="display:grid;gap:8px;grid-template-columns:1fr 1fr auto">
              <input type="file" name="file" accept="image/*,application/pdf" required class="lg-input">
              <input name="reference" class="lg-input" placeholder="อ้างอิง/เวลาโอน (ถ้ามี)" maxlength="100">
              <button class="btn btn-primary" type="submit">ส่งสลิป</button>
              <div class="sf-slip-status" style="grid-column:1/-1;font-size:13px"></div>
            </form></div>` : ''}
          ${r.status === 'CheckedIn' ? `<div class="lg-sum" style="margin-top:16px"><h3 style="margin:0 0 8px">🛎️ แจ้งความต้องการถึงที่พัก</h3>
            <form onsubmit="Store.lodgingGuestRequest(event, '${this.esc(token)}')" style="display:grid;gap:8px;grid-template-columns:160px 1fr auto">
              <select name="requestType" class="lg-input"><option value="Housekeeping">ทำความสะอาด/ผ้าเช็ดตัว</option><option value="Maintenance">แจ้งซ่อม</option><option value="RoomService">รูมเซอร์วิส</option><option value="Concierge">คอนเซียร์จ/รถรับส่ง</option><option value="Complaint">ร้องเรียน</option><option value="Other">อื่น ๆ</option></select>
              <input name="details" class="lg-input" required placeholder="รายละเอียด" maxlength="500"><button class="btn btn-primary" type="submit">ส่ง</button></form>
            ${(r.requests||[]).slice(0,5).map(x => `<div style="font-size:13px;padding:4px 0">• ${this.esc(x.details)} <span class="lg-badge ${x.status === 'Completed' || x.status === 'Verified' ? 'ok' : ''}">${this.esc(x.status)}</span>${x.responseNote ? ' — ' + this.esc(x.responseNote) : ''}</div>`).join('')}</div>` : ''}
          <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
            <a href="${this._lurl('/reservations/' + encodeURIComponent(token) + '/voucher.pdf')}"
               class="btn btn-primary" target="_blank" rel="noopener">⬇ บันทึกหลักฐานการจอง (PDF)</a>
            <a href="${this._pageUrl('home')}" class="btn">← กลับหน้าหลัก</a>
            ${canCancel ? `<button class="btn" style="border:1px solid #DC2626;color:#DC2626" onclick="Store.lodgingCancel('${this.jsArg(token)}')">ยกเลิกการจอง</button>` : ''}
          </div>
        </div>`;
        if (canPayOnline) await this._renderPayOnline(token, r);
      },

      // ── ชำระออนไลน์ ────────────────────────────────────────────────
      // ต้องถามเซิร์ฟเวอร์ว่า "บริษัทนี้เปิดรับชำระออนไลน์ไหม + วิธีไหนบ้าง"
      // ห้ามเดาเอง: ที่พักที่ยังไม่ตั้งค่า gateway ต้องเห็นเฉพาะเส้นแนบสลิป
      // และรายการวิธีจ่ายมาจาก capabilities ของ adapter ไม่ใช่ลิสต์ที่พิมพ์ไว้ในหน้านี้
      async _payMethods() {
        if (this._payM !== undefined) return this._payM;
        try {
          const r = await fetch(`/api/companies/${this._ctx.companyId}/public-pay/methods`);
          this._payM = r.ok ? ((await r.json()).data || null) : null;
        } catch (_) { this._payM = null; }
        return this._payM;
      },
      _payLabel(m) {
        return { PromptPay: 'พร้อมเพย์ (QR)', Card: 'บัตรเครดิต/เดบิต', MobileBanking: 'โมบายแบงก์กิ้ง',
                 InternetBanking: 'อินเทอร์เน็ตแบงก์กิ้ง', TrueMoney: 'TrueMoney Wallet' }[m] || m;
      },
      async _renderPayOnline(token, r) {
        const box = document.getElementById('lgPayOnlineBox');
        if (!box) return;
        const m = await this._payMethods();
        if (!m || !m.online || !(m.methods || []).length) { box.remove(); return; }
        const due = r.status === 'Pending' && r.depositRequired > 0
          ? Math.min(r.depositRequired, r.balanceDue) : r.balanceDue;
        box.innerHTML = `<h3 style="margin:0 0 8px">💳 ชำระออนไลน์ทันที</h3>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">
            จ่าย ฿${this._money(due)} แล้ว<b>ยืนยันการจองอัตโนมัติ</b> ไม่ต้องรอที่พักตรวจสลิป
            ${m.isTestMode ? ' · <span class="lg-badge">โหมดทดสอบ</span>' : ''}
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${(m.methods || []).map(x => `<button class="btn btn-primary"
                onclick="Store.lodgingPayOnline('${this.jsArg(token)}', '${this.jsArg(x)}')">${this.esc(this._payLabel(x))}</button>`).join('')}
          </div>`;
      },
      lodgingPayOnline(token, method) {
        const { companyId, siteId } = this._ctx;
        PayWidget.open({
          companyId,
          // ตัวตนอยู่ใน URL (token ที่แขกถือ) — widget จึงไม่ต้องส่ง sourceId/amount
          publicBase: `/api/companies/${companyId}/public-pay/lodging/${siteId}/${encodeURIComponent(token)}`,
          method,
          onPaid: () => { setTimeout(() => this.renderLodgingReservation(token, 'ชำระเงินสำเร็จ — ยืนยันการจองแล้ว'), 800); },
        });
      },
      async lodgingUploadSlip(ev, token) {
        ev.preventDefault();
        const form = ev.target; const status = form.querySelector('.sf-slip-status');
        status.textContent = 'กำลังอัปโหลด...';
        try {
          const r = await fetch(this._lurl('/reservations/' + encodeURIComponent(token) + '/slip'), { method: 'POST', body: new FormData(form) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'อัปโหลดไม่สำเร็จ');
          await this.renderLodgingReservation(token, j.message);
        } catch (e) { status.textContent = '✗ ' + e.message; status.style.color = '#DC2626'; }
      },
      async lodgingGuestRequest(ev, token) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        try {
          const r = await fetch(this._lurl('/reservations/' + encodeURIComponent(token) + '/requests'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestType: fd.get('requestType'), details: fd.get('details') }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'ส่งไม่สำเร็จ');
          await this.renderLodgingReservation(token, j.message);
        } catch (e) { this._toast('❌ ' + e.message); }
      },
      async lodgingCancel(token) {
        if (!confirm('ยืนยันยกเลิกการจอง? ค่าปรับ (ถ้ามี) คิดตามนโยบายยกเลิกที่แสดง')) return;
        const reason = prompt('เหตุผลในการยกเลิก (ไม่บังคับ)') || null;
        try {
          const r = await fetch(this._lurl('/reservations/' + encodeURIComponent(token) + '/cancel'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'ยกเลิกไม่สำเร็จ');
          await this.renderLodgingReservation(token, j.message);
        } catch (e) { this._toast('❌ ' + e.message); }
      },
    });

    Store.init();
  </script>
</body>
</html>
