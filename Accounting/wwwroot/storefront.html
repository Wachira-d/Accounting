      // ===== รอบ 209 P2: ฟอร์มสั่งซื้อจากค่าที่เซิร์ฟเวอร์ส่ง (ช่องบังคับ/ซ่อน · วันรับ · ช่องเพิ่มเอง · วิธีชำระ · คูปอง · ใบกำกับ) =====
      _applyCheckoutForm(cartId, q) {
        const ff = q.formFields || {};
        const feat = q.features || {};
        // รอบ 210: ร้านให้สั่งเฉพาะสมาชิก (features.guestCheckout=false จากเซิร์ฟเวอร์ · CmsFeatureFlags) + ยังไม่ล็อกอิน ⇒ บอกก่อนกรอก + ปุ่มเข้าสู่ระบบ/สมัคร
        // (ด่านจริง = CmsFeatureFlags.AccountProblem ตอนสร้างออเดอร์)
        const gate = document.getElementById('sfMemberGate');
        if (gate) gate.innerHTML = feat.guestCheckout === false && !this._custSession()
          ? `<div style="background:#FFFBEB;border:1px solid #FCD34D;border-radius:10px;padding:12px 16px;margin-bottom:14px;color:#78350F;font-size:14px">
              🔒 ร้านนี้ให้สั่งซื้อเฉพาะสมาชิก — เข้าสู่ระบบหรือสมัครสมาชิกก่อน แล้วกลับมาที่ตะกร้า
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                <a class="btn btn-primary" href="${this._pageUrl('account')}">เข้าสู่ระบบ</a>
                <a class="btn btn-secondary" href="${this._pageUrl('account')}">สมัครสมาชิก</a>
              </div></div>` : '';
        const setField = (wrapId, inputId, req) => {
          const w = document.getElementById(wrapId), i = document.getElementById(inputId);
          if (!w || !i) return;
          w.style.display = req === 'Hidden' ? 'none' : '';
          i.required = req === 'Required';
          const star = w.querySelector('.sf-req'); if (star) star.style.display = req === 'Required' ? '' : 'none';
          if (req === 'Hidden') i.value = '';
        };
        setField('sfPhoneWrap', 'sfPhone', ff.phone || 'Required');
        setField('sfEmailWrap', 'sfEmail', ff.email || 'Required');
        setField('sfNotesWrap', 'sfNotes', ff.notes || 'Optional');
        const tw = document.getElementById('sfTaxInvWrap');
        if (tw) {
          const off = feat.taxInvoiceRequest === false;
          tw.style.display = off ? 'none' : 'grid';
          if (off) {
            const tick = document.getElementById('reqTaxInv'); if (tick) tick.checked = false;
            const bb = document.getElementById('billingBlock'); if (bb) bb.style.display = 'none';
          }
        }
        // วันที่ต้องการรับ — วาดครั้งเดียว (คงค่าที่ลูกค้าเลือก) · วันขั้นต่ำมาจากเซิร์ฟเวอร์ · วันปิดร้านเซิร์ฟเวอร์ตอบใน quote.problem
        const rb = document.getElementById('sfReqDateBox');
        if (rb) {
          if (!q.minRequestedDate) rb.innerHTML = '';
          else if (!rb.querySelector('input')) {
            const reqd = ff.requestedDate === 'Required';
            rb.innerHTML = `<label>วันที่ต้องการรับสินค้า${reqd ? ' *' : ''}</label>
              <input type="date" id="sfReqDate" min="${this.esc(q.minRequestedDate)}" ${reqd ? 'required' : ''}
                onchange="Store.setRequestedDate('${this.jsArg(cartId)}', this.value)" style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px">`;
          } else rb.querySelector('input').min = q.minRequestedDate;
        }
        // ช่องที่ร้านเพิ่มเอง — เซิร์ฟเวอร์กรองตามวิธีรับแล้ว · วาดใหม่เฉพาะเมื่อชุดช่องเปลี่ยน (ไม่ล้างค่าที่กรอก)
        const cf = q.customFields || [];
        const keys = cf.map(f => f.key).join('|');
        const cfb = document.getElementById('sfCustomFieldsBox');
        if (cfb && keys !== this._cfKeys) {
          this._cfKeys = keys;
          cfb.innerHTML = cf.map(f => this._renderCustomField(f)).join('');
        }
        // วิธีชำระ — แสดงเมื่อมีให้เลือกมากกว่า 1 (เปิดเก็บเงินปลายทาง)
        const pb = document.getElementById('sfPayChoiceBox');
        if (pb) {
          const choices = q.paymentChoices || [];
          pb.innerHTML = choices.length > 1 ? `<label>วิธีชำระเงิน *</label><div style="display:flex;gap:16px;flex-wrap:wrap">${choices.map(c => `
              <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="radio" name="sfPayChoice" value="${this.esc(c.value)}" ${c.value === q.paymentMethodChoice ? 'checked' : ''}
                onchange="Store.setPayChoice('${this.jsArg(cartId)}', '${this.jsArg(c.value)}')"> ${this.esc(c.label)}</label>`).join('')}</div>` : '';
        }
        // คูปอง (ร้านเปิดคูปอง)
        const kb = document.getElementById('sfCouponBox');
        if (kb) {
          if (feat.coupons === false) kb.innerHTML = '';
          else kb.innerHTML = q.couponCode
            ? `<div style="display:flex;gap:8px;align-items:center;font-size:14px">🏷️ คูปอง <strong>${this.esc(q.couponCode)}</strong>${q.freeShippingByCoupon ? ' · ส่งฟรี' : ''}
                 <button type="button" class="btn btn-secondary" style="padding:4px 10px" onclick="Store.removeCoupon('${this.jsArg(cartId)}')">เอาออก</button></div>`
            : `<div style="display:flex;gap:8px"><input id="sfCouponCode" placeholder="โค้ดส่วนลด (ถ้ามี)" style="flex:1;padding:10px;border:1px solid #D1D5DB;border-radius:6px">
                 <button type="button" class="btn btn-secondary" onclick="Store.applyCoupon('${this.jsArg(cartId)}')">ใช้โค้ด</button></div>`;
        }
      },
      _renderCustomField(f) {
        const req = f.requirement === 'Required';
        const lbl = `<label>${this.esc(f.label)}${req ? ' *' : ''}</label>`;
        const st = 'width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px';
        const name = 'cf_' + this.esc(f.key);
        const ml = Number(f.maxLength || 500);
        const r = req ? 'required' : '';
        if (f.type === 'textarea') return `<div>${lbl}<textarea name="${name}" rows="2" maxlength="${ml}" ${r} style="${st}"></textarea></div>`;
        if (f.type === 'date') return `<div>${lbl}<input type="date" name="${name}" ${r} style="${st}"></div>`;
        if (f.type === 'select') return `<div>${lbl}<select name="${name}" ${r} style="${st}"><option value="">— เลือก —</option>${(f.options || []).map(o => `<option value="${this.esc(o)}">${this.esc(o)}</option>`).join('')}</select></div>`;
        if (f.type === 'checkbox') return `<label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" name="${name}" value="true" ${r}> ${this.esc(f.label)}${req ? ' *' : ''}</label>`;
        return `<div>${lbl}<input type="text" name="${name}" maxlength="${ml}" ${r} style="${st}"></div>`;
      },
      async setRequestedDate(cartId, v) {
        this._checkout = Object.assign(this._checkout || {}, { reqDate: v || null });
        await this.refreshQuote(cartId);
      },
      async setPayChoice(cartId, v) {
        this._checkout = Object.assign(this._checkout || {}, { payChoice: v || null });
        await this.refreshQuote(cartId);
      },
      async applyCoupon(cartId) {
        const code = (document.getElementById('sfCouponCode')?.value || '').trim();
        if (!code) return;
        try {
          const r = await fetch(this._url(`/commerce/cart/${cartId}/apply-coupon`), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error((j && j.message) || 'ใช้โค้ดไม่สำเร็จ');
        } catch (e) { alert(e.message); return; }
        await this.refreshQuote(cartId);
      },
      async removeCoupon(cartId) {
        try {
          const r = await fetch(this._url(`/commerce/cart/${cartId}/coupon`), { method: 'DELETE' });
          if (!r.ok) { const j = await r.json().catch(() => null); throw new Error((j && j.message) || 'เอาคูปองออกไม่สำเร็จ'); }
        } catch (e) { alert(e.message); return; }
        await this.refreshQuote(cartId);
      },

      // ===== ทีม K: ยอดก่อนยืนยันสั่งซื้อ — เซิร์ฟเวอร์คิดทั้งหมด (ค่าส่ง · วันรับ · ยอดที่ต้องจ่ายตอนนี้) หน้าเว็บแสดงอย่างเดียว =====
      async refreshQuote(cartId) {
        const c = this._checkout || (this._checkout = { fulfillment: null, rateId: null });
        const box = document.getElementById('sfQuoteBox'); if (!box) return;
        const body = {
          fulfillmentMethod: c.fulfillment, shippingRateId: c.rateId, countryCode: 'TH',
          paymentMethodChoice: c.payChoice || null, requestedReadyDate: c.reqDate || null,
          province: (document.getElementById('sfShipProvince')?.value || '').trim() || null,
          postalCode: (document.getElementById('sfShipPostal')?.value || '').trim() || null,
        };
        let q;
        try {
          const r = await fetch(this._url(`/commerce/cart/${cartId}/checkout-quote`), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error((j && j.message) || 'คำนวณยอดไม่สำเร็จ');
          q = j.data;
        } catch (e) { box.innerHTML = `<div style="color:#DC2626">${this.esc(e.message)}</div>`; return; }
        this._quote = q;
        c.rateId = q.selectedShippingRateId || null;
        c.fulfillment = q.fulfillmentMethod || c.fulfillment;
        c.payChoice = q.paymentMethodChoice || c.payChoice;
        this._applyCheckoutForm(cartId, q);
        const m = v => '฿' + Number(v || 0).toLocaleString('th-TH', { minimumFractionDigits: 2 });
        const fb = document.getElementById('sfFulfillBox');
        if (fb) fb.innerHTML = (q.pickupEnabled && q.deliveryEnabled !== false) ? `<div style="display:flex;gap:16px;flex-wrap:wrap">
            <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="radio" name="sfFulfill" value="delivery" ${q.fulfillmentMethod==='delivery'?'checked':''} onchange="Store.setFulfillment('${cartId}','delivery')"> 🚚 จัดส่ง</label>
            <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="radio" name="sfFulfill" value="pickup" ${q.fulfillmentMethod==='pickup'?'checked':''} onchange="Store.setFulfillment('${cartId}','pickup')"> 🏪 มารับเองที่ร้าน (ไม่มีค่าส่ง)</label>
          </div>` : '';
        const isPickup = q.fulfillmentMethod === 'pickup';
        const ab = document.getElementById('sfAddressBlock');
        if (ab) ab.style.display = isPickup ? 'none' : 'grid';
        const addr = document.getElementById('sfShipAddress');
        if (addr) addr.required = !isPickup;
        const so = document.getElementById('sfShipOptions');
        if (so) so.innerHTML = (!isPickup && (q.shippingOptions || []).length) ? `<label>วิธีจัดส่ง *</label>` + q.shippingOptions.map(o => `
            <label style="display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid #E5E7EB;border-radius:6px;margin-top:6px;cursor:pointer">
              <input type="radio" name="sfRate" ${o.rateId===q.selectedShippingRateId?'checked':''} onchange="Store.setShippingRate('${cartId}','${this.jsArg(o.rateId)}')">
              <span style="flex:1">${this.esc(o.name)}${o.estimatedDeliveryDaysMax ? ` <span style="color:#6B7280;font-size:12px">(${o.estimatedDeliveryDaysMin||1}–${o.estimatedDeliveryDaysMax} วัน)</span>` : ''}</span>
              <strong>${o.isFree ? 'ส่งฟรี' : m(o.fee)}</strong>
            </label>`).join('') : '';
        const dueRow = (q.paymentTermMode !== 'full')
          ? `<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed #D1D5DB"><span>${this.esc(q.paymentTermLabel)} · ชำระตอนนี้</span><strong style="color:#16A34A">${m(q.amountDueNow)}</strong></div>
             <div style="display:flex;justify-content:space-between;color:#6B7280"><span>ส่วนที่เหลือ (ชำระตอนรับสินค้า)</span><span>${m(q.balanceAfterDueNow)}</span></div>
             ${q.depositInvoicingNote ? `<div style="font-size:12px;color:#6B7280;margin-top:4px">🧾 ${this.esc(q.depositInvoicingNote)}</div>` : ''}` : '';
        box.innerHTML = `
          <div style="display:flex;justify-content:space-between"><span>สินค้า</span><span>${m(q.goodsTotal)}</span></div>
          ${q.discountAmount > 0 ? `<div style="display:flex;justify-content:space-between;color:#DC2626"><span>ส่วนลด</span><span>−${m(q.discountAmount)}</span></div>` : ''}
          <div style="display:flex;justify-content:space-between"><span>${isPickup ? 'มารับเองที่ร้าน' : 'ค่าจัดส่ง'}</span><span>${q.shippingFee > 0 ? m(q.shippingFee) : (isPickup ? '-' : 'ฟรี')}</span></div>
          <div style="display:flex;justify-content:space-between;font-size:17px;font-weight:700;margin-top:6px"><span>ยอดสุทธิ</span><span>${m(q.orderTotal)}</span></div>
          ${dueRow}
          ${q.earliestReadyDate ? `<div style="margin-top:8px;color:#3730A3">🕒 ${isPickup ? 'รับสินค้าได้' : 'พร้อมจัดส่ง'}เร็วสุด <strong>${this.esc(this._thaiDate(q.earliestReadyDate))}</strong></div>` : ''}
          ${isPickup && q.deliveryEnabled === false ? `<div style="margin-top:6px;color:#6B7280">🏪 ร้านนี้รับสินค้าที่ร้านเท่านั้น</div>` : ''}
          ${q.estimatedDeliveryDate ? `<div style="margin-top:6px;color:#3730A3">🚚 ส่งถึงประมาณ <strong>${this.esc(this._thaiDate(q.estimatedDeliveryDate))}</strong></div>` : ''}
          ${q.paymentMethodChoice === 'cod' ? `<div style="margin-top:6px;color:#92400E">💵 ${this.esc(q.paymentMethodLabel)}</div>` : ''}
          ${q.problem ? `<div style="margin-top:8px;color:#B45309">⚠️ ${this.esc(q.problem)}</div>` : ''}`;
      },
      async setFulfillment(cartId, method) {
        this._checkout = Object.assign(this._checkout || {}, { fulfillment: method, rateId: null });
        await this.refreshQuote(cartId);
      },
      async setShippingRate(cartId, rateId) {
        this._checkout = Object.assign(this._checkout || {}, { rateId });
        await this.refreshQuote(cartId);
      },
      _thaiDate(ymd) {
        try { return new Date(ymd + 'T00:00:00').toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); }
        catch (_) { return ymd; }
      },

      // ===== ทีม K: ช่องตัวเลือกบนหน้าสินค้า (ราคา/จำนวนเลือกมาจากเซิร์ฟเวอร์ — ด่านจริงอยู่ตอนใส่ตะกร้า) =====
      _renderOptionGroup(g) {
        const m = v => (Number(v) > 0 ? '+' : '') + '฿' + Number(v || 0).toLocaleString('th-TH');
        const extra = o => [Number(o.priceAdjustment) ? m(o.priceAdjustment) : '', o.extraLeadDays ? `+${o.extraLeadDays} วัน` : ''].filter(Boolean).join(' · ');
        const req = g.isRequired ? ' <span style="color:#DC2626">*</span>' : '';
        const gid = this.esc(g.id);
        let input = '';
        if (g.inputType === 'dropdown') {
          input = `<select data-group="${gid}" style="width:100%;padding:8px 10px;border:1px solid #D1D5DB;border-radius:6px">
            <option value="">— เลือก —</option>${(g.options || []).map(o => `<option value="${this.esc(o.id)}" ${o.isDefault ? 'selected' : ''}>${this.esc(o.name)}${extra(o) ? ' (' + this.esc(extra(o)) + ')' : ''}</option>`).join('')}</select>`;
        } else if (g.inputType === 'radio' || g.inputType === 'checkbox') {
          const type = g.inputType === 'radio' ? 'radio' : 'checkbox';
          input = `<div style="display:flex;flex-wrap:wrap;gap:8px">${(g.options || []).map(o => `
            <label style="display:flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid #E5E7EB;border-radius:6px;cursor:pointer;font-size:14px">
              <input type="${type}" name="opt_${gid}" data-group="${gid}" value="${this.esc(o.id)}" ${o.isDefault ? 'checked' : ''}>
              ${this.esc(o.name)}${extra(o) ? ` <span style="color:#6B7280;font-size:12px">${this.esc(extra(o))}</span>` : ''}</label>`).join('')}</div>
            ${type === 'checkbox' && (g.minSelect || g.maxSelect) ? `<div style="font-size:12px;color:#6B7280;margin-top:4px">เลือก ${g.minSelect}–${g.maxSelect} อย่าง</div>` : ''}`;
        } else if (g.inputType === 'text') {
          input = `<input type="text" data-group="${gid}" data-kind="text" maxlength="${Number(g.maxTextLength || 200)}" style="width:100%;padding:8px 10px;border:1px solid #D1D5DB;border-radius:6px">`;
        } else if (g.inputType === 'image') {
          input = `<input type="file" accept="image/jpeg,image/png,image/webp" data-group="${gid}" data-kind="image" onchange="Store.uploadOptionImage(this, '${this.jsArg(g.id)}')">
            <div id="optImgStatus_${gid}" style="font-size:12px;color:#6B7280;margin-top:4px">JPG / PNG / WEBP ไม่เกิน 5 MB</div>`;
        }
        const inputExtra = (g.inputType === 'text' || g.inputType === 'image') && (Number(g.inputPriceAdjustment) || g.inputExtraLeadDays)
          ? ` <span style="color:#6B7280;font-size:12px">(${this.esc(extra({ priceAdjustment: g.inputPriceAdjustment, extraLeadDays: g.inputExtraLeadDays }))})</span>` : '';
        return `<div style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:6px">${this.esc(g.name)}${req}${inputExtra}</div>${input}</div>`;
      },

      _collectModifiers() {
        const pd = this._pd; if (!pd) return [];
        const root = document.getElementById('pdOptions'); if (!root) return [];
        return (pd.groups || []).map(g => {
          if (g.inputType === 'text') {
            const el = root.querySelector(`[data-group="${CSS.escape(g.id)}"][data-kind="text"]`);
            return { groupId: g.id, text: el ? el.value : null };
          }
          if (g.inputType === 'image') return { groupId: g.id, attachmentId: pd.attachments[g.id] || null };
          if (g.inputType === 'dropdown') {
            const el = root.querySelector(`select[data-group="${CSS.escape(g.id)}"]`);
            return { groupId: g.id, optionIds: el && el.value ? [el.value] : [] };
          }
          const ids = [...root.querySelectorAll(`input[data-group="${CSS.escape(g.id)}"]:checked`)].map(x => x.value);
          return { groupId: g.id, optionIds: ids };
        });
      },

      async uploadOptionImage(input, groupId) {
        const file = input.files && input.files[0];
        const st = document.getElementById('optImgStatus_' + groupId);
        if (!file) return;
        try {
          if (st) st.textContent = 'กำลังอัปโหลด...';
          const cartRes = await fetch(this._url(`/commerce/cart?sessionToken=${this._sessionToken()}`));
          const cart = (await cartRes.json()).data;
          if (!cart?.id) throw new Error('ไม่สามารถสร้างตะกร้าได้');
          const fd = new FormData(); fd.append('file', file);
          const r = await fetch(this._url(`/commerce/cart/${cart.id}/option-image`), { method: 'POST', body: fd });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error((j && j.message) || 'อัปโหลดไม่สำเร็จ');
          this._pd.attachments[groupId] = j.data.attachmentId;
          if (st) st.textContent = '✅ แนบรูปแล้ว';
        } catch (e) {
          if (this._pd) delete this._pd.attachments[groupId];
          if (st) st.textContent = '❌ ' + e.message;
        }
      },

      async submitOrder(ev, cartId) {
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const body = {
          cartId,
          shippingName: fd.get('shippingName'),
          shippingPhone: fd.get('shippingPhone'),
          shippingEmail: fd.get('shippingEmail'),
          shippingAddress: fd.get('shippingAddress'),
          customerNotes: fd.get('customerNotes') || null,
          requestTaxInvoice: !!fd.get('requestTaxInvoice'),
          billingName: fd.get('billingName') || null,
          billingTaxId: fd.get('billingTaxId') || null,
          billingBranchCode: fd.get('billingBranchCode') || null,
          billingAddress: fd.get('billingAddress') || null,
          // ทีม K — วิธีรับ + อัตราค่าส่งที่เลือก (เซิร์ฟเวอร์คิดค่าส่งเองจากอัตรา ไม่รับยอดจากหน้าเว็บ)
          fulfillmentMethod: (this._checkout && this._checkout.fulfillment) || null,
          shippingRateId: (this._checkout && this._checkout.rateId) || null,
          shippingCountryCode: 'TH',
          shippingProvince: fd.get('shippingProvince') || null,
          shippingPostalCode: fd.get('shippingPostalCode') || null,
          // รอบ 209 P2 — วิธีชำระ · วันรับ · ช่องที่ร้านเพิ่มเอง (เซิร์ฟเวอร์ตรวจทั้งหมด)
          paymentMethodChoice: (this._checkout && this._checkout.payChoice) || null,
          requestedReadyDate: (this._checkout && this._checkout.reqDate) || null,
          customFields: Object.fromEntries(((this._quote && this._quote.customFields) || []).map(f => [f.key,
            f.type === 'checkbox' ? (fd.get('cf_' + f.key) ? 'true' : null) : (fd.get('cf_' + f.key) || null)])),
          consentGiven: this.p6ConsentValue(ev.target),   // รอบ 209 P6 (PDPA)
        };
        // เหตุที่ยังสั่งไม่ได้มาจากเซิร์ฟเวอร์ (ต้องกรอกจังหวัด/เลือกวิธีส่ง) — บอกก่อนกดส่ง ด่านจริงยังอยู่ที่ CreateOrder
        if (this._quote && this._quote.problem) { alert(this._quote.problem); return; }
        const btn = ev.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
        // รอบ 209 P1 (R-209-A9): คีย์กันกดซ้ำ — สุ่มครั้งเดียวต่อตะกร้า (กดซ้ำ/เน็ตหลุดแล้วกดใหม่ = คีย์เดิม ⇒ เซิร์ฟเวอร์คืนออเดอร์เดิม)
        const idemStore = 'sf_order_idem_' + this._ctx.siteId + '_' + cartId;
        let idemKey = null;
        try { idemKey = sessionStorage.getItem(idemStore); } catch (_) {}
        if (!idemKey) {
          // ฝ่ายค้านรอบ 209: คีย์ต้องเดาไม่ได้ — สุ่มด้วย crypto เท่านั้น (ไม่มี Date.now/Math.random สำรอง)
          idemKey = (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, '0')).join('')).replace(/[^A-Za-z0-9_-]/g, '');
          try { sessionStorage.setItem(idemStore, idemKey); } catch (_) {}
        }
        body.idempotencyKey = idemKey;
        try {
          const r = await fetch(this._url('/commerce/orders'), {
            method: 'POST', headers: this._custHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(body)
          });
          if (!r.ok) {
            const j = await r.json().catch(() => null);
            throw new Error((j && j.message) || 'สั่งซื้อไม่สำเร็จ — กรุณาลองอีกครั้ง');
          }
          const order = (await r.json()).data;
          // Clear local cart reference — backend marks cart closed too.
          localStorage.removeItem('sf_session_' + this._ctx.siteId);
          try { sessionStorage.removeItem(idemStore); } catch (_) {}
          // รอบ 209 P1: หน้าสำเร็จเปิดด้วยโทเคนสาธารณะของออเดอร์ (endpoint สาธารณะแบบจำกัดฟิลด์ — ไม่ใช่ GET ของพนักงาน)
          window.location.href = this._pageUrl('order-success/' + encodeURIComponent(order.publicToken || ''));
        } catch (e) {
          alert(e.message);
        } finally {
          btn.disabled = false; btn.textContent = 'ยืนยันสั่งซื้อ';
        }
      },

      // รอบ 209 P1 (R-209-A1): อ่านออเดอร์ด้วยโทเคนสาธารณะ (DTO จำกัดฟิลด์) · ไม่พบ ⇒ null (ผู้เรียกแสดงข้อความ — ห้ามแสดง QR ฿0)
      async _publicOrder(token) {
        if (!token) return null;
        try {
          const r = await fetch(this._url('/commerce/orders/public/' + encodeURIComponent(token)));
          if (!r.ok) return null;
          return (await r.json()).data || null;
        } catch (_) { return null; }
      },
      _orderNotFoundHtml() {

        const ppId = pay?.promptPayId;

                <div style="margin-top:14px;display:grid;gap:14px">

                ⚠️ ร้านยังไม่ได้ตั้งค่าบัญชีโอนเงิน — โปรดเลือก "ชำระภายหลัง" หรือติดต่อร้านโดยตรง

              <details class="sf-pay-card" style="border:1px solid var(--gray-300,#D1D5DB);background:#fff;border-radius:12px;padding:18px 22px">
                <summary style="cursor:pointer;font-weight:600;font-size:16px;list-style:none">📋 ชำระภายหลัง — ร้านจะติดต่อกลับ</summary>
                <div style="margin-top:12px;font-size:13px;color:var(--text-secondary);line-height:1.6">

                <summary style="cursor:pointer;font-weight:600;font-size:16px;list-style:none">📄 ขอใบเสนอราคา (ออกใบให้ทันที)</summary>
                <div style="margin-top:12px;font-size:13px;color:var(--text-secondary);line-height:1.6">
                  ระบบจะ <strong>ออกใบเสนอราคาตามรายการในตะกร้าทันที</strong> ไม่ตัดสต็อก ไม่ชำระเงินตอนนี้

                <textarea id="quoteNotes_${orderId}" rows="3" maxlength="1000"
                  placeholder="เช่น สอบถามรายละเอียดเพิ่ม · ขอคำแนะนำ · ขอแก้รายการก่อนออกใบเสนอราคา ฯลฯ — ข้อความนี้จะถึงร้านโดยตรง"
                  style="width:100%;margin-top:6px;padding:10px;border:1px solid #D1D5DB;border-radius:6px;font-family:inherit;font-size:13px;resize:vertical"></textarea>

        if (!isCancelled) await this._renderOrderPayOnline(orderId, order, pay);
        if (token) this.renderLineBox('sfOrderLineBox', { kind: 'order', token });
        await this.refreshCartBadge();

      // รอบ 209 P1: ตัวสร้าง payload พร้อมเพย์ฝั่งเว็บ (makePromptPayPayload) ถูกลบ — สำเนากติกา EMVCo ที่สอง · รูป QR มาจาก
      // GET commerce/promptpay-qr (Services/Implementations/PromptPayService ตัวเดียวของระบบ)

      async _renderOrderPayOnline(orderId, order, pay) {
        const box = document.getElementById('sfPayOnlineBox');
        if (!box) return;
        // รอบ 209 P2: ร้านปิดชำระออนไลน์ ⇒ ไม่มีกล่อง (เซิร์ฟเวอร์ปฏิเสธที่ public-pay ด้วย)
        if (pay && pay.onlinePaymentEnabled === false) { box.remove(); return; }
        const m = await this._payMethods();
        // ยอดรอบนี้จากเซิร์ฟเวอร์ (ตัวคิดเดียวกับช่องจ่าย public-pay) — ออเดอร์เดิมได้ค่าเท่า TotalAmount − PaidAmount
        const due = Math.max(0, Number(order?.nextPayableAmount ?? (Number(order?.totalAmount || 0) - Number(order?.paidAmount || 0))));
        // รอบ 205 W2 (R-06): สลิปรอตรวจ ⇒ เซิร์ฟเวอร์ปิดช่องจ่ายออนไลน์ชั่วคราว — แสดงเหตุผลแทนปุ่ม (ไม่ซ่อนเงียบ)
        if (order?.onlinePaymentBlockedNote) {
          box.innerHTML = `<div class="sf-pay-card" style="border:1px solid #FCD34D;background:#FFFBEB;border-radius:12px;padding:14px 18px;color:#78350F;font-size:13px">⏳ ${this.esc(order.onlinePaymentBlockedNote)}</div>`;
          return;
        }
        if (!m || !m.online || !(m.methods || []).length || due <= 0) { box.remove(); return; }
        box.innerHTML = `<details open class="sf-pay-card" style="border:2px solid #16a34a;background:#fff;border-radius:12px;padding:18px 22px">
            <summary style="cursor:pointer;font-weight:600;font-size:16px;list-style:none">⚡ ชำระออนไลน์ทันที — ยืนยันอัตโนมัติ</summary>
            <div style="margin-top:12px;font-size:13px;color:var(--text-secondary);line-height:1.6">
              จ่าย ฿${this._money(due)} แล้วระบบยืนยันคำสั่งซื้อให้เอง <b>ไม่ต้องแนบสลิปและไม่ต้องรอร้านตรวจ</b>
              ${m.isTestMode ? ' · <b style="color:#92400e">โหมดทดสอบ — เงินไม่เข้าจริง</b>' : ''}
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
              ${(m.methods || []).map(x => `<button class="btn btn-primary"
                  onclick="Store.orderPayOnline('${this.jsArg(orderId)}', '${this.jsArg(x)}')">${this.esc(this._payLabel(x))}</button>`).join('')}
            </div>
          </details>`;
      },
      orderPayOnline(orderId, method) {
        const { companyId, siteId } = this._ctx;
        PayWidget.open({
          companyId,
          publicBase: `/api/companies/${companyId}/public-pay/orders/${siteId}/${orderId}`,
          method,
          onPaid: () => { setTimeout(() => this.renderOrderSuccess(this._lastOrderToken || ''), 800); },
        });
      },

      async uploadSlip(ev, orderId) {
        ev.preventDefault();
        const form = ev.target;
        const status = form.querySelector('.sf-slip-status');
        const fd = new FormData(form);
        status.textContent = 'กำลังอัปโหลด...';
        status.style.color = 'var(--text-secondary)';
        try {
          const r = await fetch(this._url(`/commerce/orders/${orderId}/upload-slip`), { method: 'POST', body: fd });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'อัปโหลดไม่สำเร็จ');
          status.textContent = '✓ ส่งสลิปแล้ว — ร้านจะตรวจสอบและแจ้งยืนยัน';
          status.style.color = 'var(--success-color,#10B981)';
          form.querySelector('input[type=file]').value = '';
        } catch (e) {
          status.textContent = '✗ ' + (e.message || 'อัปโหลดไม่สำเร็จ');
          status.style.color = '#DC2626';
        }
      },

      async convertOrderToQuotation(orderId) {
        const notesEl = document.getElementById('quoteNotes_' + orderId);
        const notes = (notesEl?.value || '').trim();
        if (!confirm('ออกใบเสนอราคาตามรายการในตะกร้าใช่หรือไม่?\nคำสั่งซื้อจะถูกยกเลิก ไม่ตัดสต็อก ไม่ชำระเงิน — ร้านจะได้รับเอกสารใหม่ทันที')) return;
        try {
          const r = await fetch(this._url(`/commerce/orders/${orderId}/convert-to-quotation`), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ customerNotes: notes || null })
          });
          const j = await r.json().catch(() => null);
          if (!r.ok) throw new Error(j?.message || 'เปลี่ยนไม่สำเร็จ');
          alert(j?.message || 'ออกใบเสนอราคาเรียบร้อย');
          location.reload();
        } catch (e) {
          alert(e.message || 'เปลี่ยนไม่สำเร็จ');
        }
      },


      // ===== รอบ 209 P1 (R-209-E1/C3): บัญชีลูกค้าหน้าร้าน =====
      // โทเคนลูกค้า (portal/login · audience หน้าร้าน) เก็บต่อเว็บใน localStorage · ส่งใน header X-Storefront-Token
      // (เซิร์ฟเวอร์ตรวจด้วย Helpers/StorefrontCustomerAuth) · หน้าเว็บไม่ตัดสินสิทธิ์เอง — 401 = ล้างเซสชันแล้วให้เข้าใหม่
      _custKey() { return 'sf_cust_' + this._ctx.siteId; },
      _custSession() {
        try {
          const raw = localStorage.getItem(this._custKey());
          if (!raw) return null;
          const v = JSON.parse(raw);
          if (!v || !v.token || (v.expiresAt && new Date(v.expiresAt) <= new Date())) { localStorage.removeItem(this._custKey()); return null; }
          return v;
        } catch (_) { return null; }
      },
      _custHeaders(h) {
        const out = Object.assign({}, h || {});
        const sess = this._custSession();
        if (sess) out['X-Storefront-Token'] = sess.token;
        return out;
      },
      _custLogout() {
        try { localStorage.removeItem(this._custKey()); } catch (_) {}
        this._custMe = null;
      },
      async _custFetch(path) {
        const r = await fetch(this._url(path), { headers: this._custHeaders() });
        const j = await r.json().catch(() => null);
        if (r.status === 401) { this._custLogout(); throw Object.assign(new Error((j && j.message) || 'กรุณาเข้าสู่ระบบใหม่'), { auth: true }); }
        if (!r.ok) throw new Error((j && j.message) || 'โหลดข้อมูลไม่สำเร็จ');
        return j ? j.data : null;
      },
      // ข้อมูลบัญชี (id ลูกค้า — ใช้ส่ง customerId ตอนจองด้วยบัตร) · ไม่ล็อกอิน/หมดอายุ ⇒ null
      async _custMeLoad() {
        if (!this._custSession()) return null;
        if (this._custMe) return this._custMe;
        try { this._custMe = await this._custFetch('/portal/me'); } catch (_) { this._custMe = null; }
        return this._custMe;
      },
      openAccount() { window.location.href = this._pageUrl('account'); },

      async renderAccount(tab) {
        const main = document.getElementById('sfMain');
        document.title = 'บัญชีของฉัน';
        const me = await this._custMeLoad();
        if (!me) { main.innerHTML = this._accountLoginHtml(); await this.refreshCartBadge(); return; }
        const t = tab || 'orders';
        const tabBtn = (k, label) => `<button class="btn ${t === k ? 'btn-primary' : 'btn-secondary'}" onclick="Store.renderAccount('${k}')">${label}</button>`;
        main.innerHTML = `<div class="sf-container" style="padding:32px 20px;max-width:860px">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">

              ${tabBtn('orders', '🧾 คำสั่งซื้อ')}${tabBtn('bookings', '📅 การจองของฉัน')}${tabBtn('credits', '🎟️ บัตรคอร์สของฉัน')}

        try {

          else if (t === 'credits') body.innerHTML = this._myCreditsHtml(await this._custFetch('/portal/me/credits'), me);

            <div style="border:1px solid #E5E7EB;border-radius:10px;padding:14px 16px;background:#fff">
              <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <b>${this.esc(o.orderNumber)}</b>

                ${o.trackingNumber ? ` · 📦 ${this.esc(o.shippingCarrier || '')} ${this.esc(o.trackingNumber)}${o.trackingUrl ? ` (<a href="${this.esc(o.trackingUrl)}" target="_blank" rel="noopener">ติดตามพัสดุ</a>)` : ''}` : ''}</div>
              ${o.publicToken ? `<a style="font-size:13px" href="${this._pageUrl('track-order/' + encodeURIComponent(o.publicToken))}">ดูรายละเอียด/สถานะ</a>` : ''}

      _myBookingsHtml(rows) {

        return `<div style="display:grid;gap:10px">${rows.map(b => `
            <div style="border:1px solid #E5E7EB;border-radius:10px;padding:14px 16px;background:#fff">
              <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <b>${this.esc(b.serviceName)}</b><span style="color:#3730A3;font-weight:600">${this.esc(b.statusLabel)}</span>

            </div>`).join('')}</div>`;
      },
      _myCreditsHtml(rows, me) {
        if (!me.hasErpContact) return '<div style="color:var(--text-secondary)">บัญชีนี้ยังไม่ผูกกับข้อมูลลูกค้าของร้าน — ติดต่อร้านเพื่อดูบัตรคอร์ส</div>';
        if (!rows || !rows.length) return '<div style="color:var(--text-secondary)">ยังไม่มีบัตรคอร์สในบัญชีนี้</div>';
        return `<div style="display:grid;gap:10px">${rows.map(p => `
            <div style="border:1px solid ${p.usable ? '#A7F3D0' : '#E5E7EB'};border-radius:10px;padding:14px 16px;background:#fff">
              <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <b>${this.esc(p.packageName)}</b><span style="font-weight:600;color:${p.usable ? '#047857' : '#6B7280'}">${this.esc(p.statusLabel)}${p.isExpired && p.status === 'Active' ? ' (หมดอายุแล้ว)' : ''}</span>
              </div>
              <div style="font-size:13px;color:var(--text-secondary);margin-top:4px">${this.esc(p.passNumber)} · คงเหลือ <b>${this.esc(String(p.creditsAvailable))}</b> / ${this.esc(String(p.creditsTotal))} ${this.esc(p.unitLabel)}
                ${Number(p.creditsReserved) > 0 ? ` (จองไว้ ${this.esc(String(p.creditsReserved))})` : ''} · ${p.expiresOn ? 'ใช้ได้ถึง ' + this.esc(this._thaiDate(p.expiresOn)) : 'ไม่หมดอายุ'}</div>
            </div>`).join('')}</div>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:10px">จองคลาสด้วยบัตร: เลือกบริการแล้วติ๊ก "ใช้บัตรคอร์ส" ในหน้าจอง (ต้องเข้าสู่ระบบ)</p>`;
      },
      _accountLoginHtml(msg) {
        const inp = 'width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:6px';
        return `<div class="sf-container" style="padding:32px 20px;max-width:880px">
            <h1 style="margin:0 0 6px">บัญชีของฉัน</h1>
            <p style="color:var(--text-secondary);margin-bottom:18px">เข้าสู่ระบบเพื่อดูประวัติคำสั่งซื้อ การจอง และบัตรคอร์ส — สั่งซื้อแบบไม่สมัครสมาชิกยังทำได้ตามปกติ</p>
            ${msg ? `<div style="background:#FEF3C7;border:1px solid #FCD34D;color:#78350F;border-radius:8px;padding:10px 14px;margin-bottom:14px">${this.esc(msg)}</div>` : ''}
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px">
              <form onsubmit="Store.accountLogin(event)" style="display:grid;gap:10px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:20px">
                <h2 style="margin:0;font-size:18px">เข้าสู่ระบบ</h2>
                <input name="email" type="email" required maxlength="200" placeholder="อีเมล" style="${inp}">
                <input name="password" type="password" required placeholder="รหัสผ่าน" style="${inp}">
                <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
                <div class="sf-acc-status" style="font-size:13px"></div>
              </form>
