<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การจองของคุณ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Noto Sans Thai',sans-serif; background:#f8fafc; margin:0; color:#0f172a; padding:20px 16px; }
    .mn { max-width:480px; margin:0 auto; background:#fff; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.06); overflow:hidden; }
    .mn-head { background:linear-gradient(135deg,#0ea5e9,#7c3aed); color:#fff; padding:22px; text-align:center; }
    .mn-head h1 { margin:0; font-size:20px; }
    .mn-body { padding:22px; }
    .mn-row { display:flex; padding:8px 0; border-bottom:1px solid #f1f5f9; font-size:14px; }
    .mn-row span:first-child { color:#64748b; flex:1; }
    .mn-row span:last-child { font-weight:600; color:#0f172a; text-align:right; }
    .mn-status { padding:4px 12px; border-radius:12px; font-size:12px; font-weight:700; }
    .mn-status.Pending   { background:#e0e7ff; color:#3730a3; }
    .mn-status.Confirmed { background:#dcfce7; color:#166534; }
    .mn-status.Seated    { background:#dbeafe; color:#1e40af; }
    .mn-status.Cancelled { background:#fee2e2; color:#991b1b; }
    .mn-status.Completed { background:#f1f5f9; color:#475569; }
    .mn-status.NoShow    { background:#fed7aa; color:#9a3412; }
    .mn-policy { background:#fef3c7; border:1px solid #fbbf24; border-radius:8px; padding:12px; font-size:12px; line-height:1.6; color:#78350f; margin-top:14px; }
    .mn-policy.past { background:#fee2e2; border-color:#fca5a5; color:#991b1b; }
    .mn-btn { width:100%; padding:13px; margin-top:14px; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; }
    .mn-btn-cancel { background:#dc2626; color:#fff; }
    .mn-btn-cancel:hover { background:#b91c1c; }
    .mn-loading { text-align:center; padding:60px 20px; color:#94a3b8; }
    .mn-success { text-align:center; padding:40px 20px; }
    .mn-success .check { font-size:54px; line-height:1; margin-bottom:10px; }
  </style>
</head>
<body>
  <div class="mn">
    <div id="mnContent"><div class="mn-loading">กำลังโหลด...</div></div>
  </div>
  <script>
    const Page = {
      r: null,
      async init() {
        const t = new URLSearchParams(location.search).get('t');
        if (!t) { document.getElementById('mnContent').innerHTML = '<div class="mn-loading">ลิงก์ไม่ถูกต้อง</div>'; return; }
        this._t = t;
        await this.load();
      },
      async load() {
        try {
          const r = await fetch('/api/public/reservations/' + this._t);
          const j = await r.json();
          if (!j.success) throw new Error(j.message || 'โหลดไม่สำเร็จ');
          this.r = j.data;
          this.render();
        } catch(e) {
          document.getElementById('mnContent').innerHTML = '<div class="mn-loading">⚠️ ' + e.message + '</div>';
        }
      },
      _esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); },
      _fmt(d) { return new Date(d).toLocaleString('th-TH', {dateStyle:'full', timeStyle:'short'}); },
      _fmtTime(d) { return new Date(d).toLocaleString('th-TH', {dateStyle:'short', timeStyle:'short'}); },
      render() {
        const r = this.r;
        const statusLabel = { Pending:'รอยืนยัน', Confirmed:'ยืนยันแล้ว', Seated:'นั่งโต๊ะแล้ว', Cancelled:'ยกเลิก', Completed:'เสร็จสิ้น', NoShow:'ไม่มาตามนัด' }[r.status] || r.status;
        const pastDeadline = new Date(r.freeCancelDeadline).getTime() < Date.now();
        const isTerminal = r.status === 'Cancelled' || r.status === 'Completed' || r.status === 'NoShow';

        const policyHtml = r.depositAmount > 0
          ? `<div class="mn-policy ${pastDeadline?'past':''}">
              💳 <strong>มัดจำ:</strong> ${r.depositAmount.toFixed(2)} บาท ${r.depositPaid?'(ชำระแล้ว)':'(ยังไม่ชำระ)'}<br>
              📅 <strong>ยกเลิกฟรี:</strong> ก่อน ${this._fmtTime(r.freeCancelDeadline)} (${r.freeCancelHoursBefore} ชม.ก่อนเวลานัด)<br>
              ${pastDeadline
                ? `⚠️ เลย deadline แล้ว — หากยกเลิกตอนนี้ มัดจำคืน <strong>${r.cancelRefund.toFixed(2)} บาท</strong> (${r.lateCancelRefundPercent}%)`
                : `✓ ตอนนี้ยกเลิกได้คืนเงินเต็มจำนวน`}
            </div>`
          : `<div class="mn-policy ${pastDeadline?'past':''}">
              📅 <strong>นโยบายยกเลิก:</strong> ${pastDeadline?'เลยเวลายกเลิกฟรีแล้ว':'ก่อน '+this._fmtTime(r.freeCancelDeadline)}
            </div>`;

        document.getElementById('mnContent').innerHTML = `
          <div class="mn-head">
            <h1>📅 การจองของคุณ</h1>
          </div>
          <div class="mn-body">
            <div class="mn-row"><span>ชื่อ</span><span>${this._esc(r.customerName)}</span></div>
            <div class="mn-row"><span>วันเวลา</span><span>${this._fmt(r.reservedAt)}</span></div>
            <div class="mn-row"><span>ระยะเวลา</span><span>${r.durationMinutes} นาที</span></div>
            <div class="mn-row"><span>จำนวนคน</span><span>${r.partySize} คน</span></div>
            ${r.tableNumber ? `<div class="mn-row"><span>โต๊ะ</span><span>${this._esc(r.tableNumber)}</span></div>` : ''}
            <div class="mn-row"><span>สถานะ</span><span class="mn-status ${r.status}">${statusLabel}</span></div>
            ${policyHtml}
            ${isTerminal ? '' : '<button class="mn-btn mn-btn-cancel" onclick="Page.cancel()">🗑️ ยกเลิกการจอง</button>'}
          </div>`;
      },
      async cancel() {
        if (!confirm('ยืนยันยกเลิกการจอง?')) return;
        try {
          const r = await fetch('/api/public/reservations/' + this._t + '/cancel', { method:'POST' });
          const j = await r.json();
          if (!j.success) throw new Error(j.message);
          document.getElementById('mnContent').innerHTML = `
            <div class="mn-success">
              <div class="check">✓</div>
              <h2>${this._esc(j.data.message || 'ยกเลิกแล้ว')}</h2>
            </div>`;
        } catch(e) { alert('⚠️ ' + e.message); }
      }
    };
    window.Page = Page;
    document.addEventListener('DOMContentLoaded', () => Page.init());
  </script>
</body>
</html>
