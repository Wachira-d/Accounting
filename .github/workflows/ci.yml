name: CI

# Build + test ทุก push / PR — จับ compile error และ money-math regression
# (JE balancing, VAT/WHT, §65 ตรี add-back ฯลฯ) ก่อน merge. เดิมไม่มี CI เลย.
on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Accounting.sln

      - name: Build
        run: dotnet build Accounting.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Accounting.sln --configuration Release --no-build --verbosity normal
