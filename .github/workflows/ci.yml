name: CI

# เปิดบน branch งาน (claude/**) อีกครั้งตามคำตัดสินเจ้าของรอบ 169 — แต่แก้ที่ "เสียง" ไม่ใช่ปิด "ด่าน":
#   • paths-ignore **.md / erp-review / scripts → คอมมิตเอกสารล้วน (~39% ของทั้งหมด) ไม่รัน
#   • concurrency cancel-in-progress          → คอมมิตถี่ ยกเลิกรอบเก่าอัตโนมัติ ไม่กองกัน
#   • job แยก: static-checks (tools/check_all.sh) + build ทุก push · test เฉพาะ PR เข้า main / push main / dispatch
#   • agent อ่านผลเองผ่าน MCP (actions_list / get_job_logs) หลัง push แล้วแก้ก่อนรายงานผู้ใช้
#   • อีเมลแจ้ง fail: เจ้าของปิดที่ GitHub → Settings → Notifications → Actions → "Send notifications for failed workflows only" / uncheck
# ที่มา: REGRESSION_ROOT_CAUSE_2026-09-18.md §7 RC-1 — CI ไฟล์เดิมครบทุกขั้นแต่ trigger ไม่ครอบ branch งาน
# ⇒ ไม่เคยรันกับคอมมิตไหนใน 145 ตัว และ build error ถึงเครื่องผู้ใช้ 8 ครั้งใน 15 วัน
on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths-ignore: [ '**.md', 'erp-review/**', 'scripts/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  static-checks:
    name: Static checks (tools/check_all.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doc_commit_sha_check ต้องเห็นประวัติทั้ง branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # checker ทุกตัว + node --check ทุก <script> + awk brace + U+FFFD + TEST_PLAN §0 ↔ เทสต์จริง
      # (ไม่ build ที่นี่ — job build ทำ; ไม่งั้นบิลด์ซ้ำสองรอบ)
      - name: check_all --all --no-dotnet
        run: bash tools/check_all.sh --all --no-dotnet

  build:
    name: dotnet build (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore Accounting.sln
      # error ตัวแรกคือของจริง — บรรทัดถัดไปมักเป็นผลพวง (CS0006 ของ Accounting.Tests ตาม Accounting.dll ที่ไม่ถูกสร้าง)
      - name: Build
        run: dotnet build Accounting.sln --configuration Release --no-restore 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: สรุป CSxxxx ที่ไม่ซ้ำ (อ่านง่ายกว่า log เต็ม)
        if: failure()
        run: grep -E 'error CS[0-9]{4}' build.log | sed -E 's/\[.*$//' | sort -u | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 7

  test:
    name: dotnet test
    needs: build
    # เทสต์เต็มเฉพาะ PR เข้า main · push main/master · สั่งเอง — push บน claude/** ได้แค่ build (เร็ว)
    # เทสต์ทั้งหมดเป็น pure-function (0 ไฟล์แตะ DbContext) ถ้าอยากรันทุก push ให้ลบ if นี้ได้โดยไม่ต้องมี PostgreSQL
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore Accounting.sln
      - run: dotnet build Accounting.sln --configuration Release --no-restore
      - run: dotnet test Accounting.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 7
